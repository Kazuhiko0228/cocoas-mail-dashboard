function kikiVars(){return kikiStore().vars||{};}
function kikiEdits(){return kikiStore().edits||{};}
function kikiVal(k){var v=kikiVars()[k];if(v!=null&&v!=='')return v;var d=KIKI_VARDEF_MAP[k];return (d&&d.d)?d.d:'';}
function kikiBody(sec){var e=kikiEdits()[sec.id];return e!=null?e:sec.body;}
function kikiSubstPlain(body){return body.replace(/\{\{([^}]+)\}\}/g,function(m,k){k=k.trim();var v=kikiVal(k);return v||('（'+k+'）');});}
/* 画像の src には、この端末で作った data:image/ 以外を入れない */
function escImgSrc(u){u=String(u||'').replace(/[\s\u0000-\u001f]/g,'');
  return /^data:image\//i.test(u)?u.replace(/&/g,'&amp;').replace(/"/g,'&quot;'):'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function kikiPrevHtml(sec){
  return esc(kikiBody(sec)).replace(/\{\{([^}]+)\}\}/g,function(m,k){k=k.trim();var v=kikiVal(k);
    return v?'<span style="background:#E3F1F9;color:#0a5a44;">'+esc(v)+'</span>':'<span style="background:#FBE4E4;color:#B00;">〔'+esc(k)+'：未入力〕</span>';});
}
var KIKI_TYPELABEL={prose:'本文',chart:'対応フロー',checklist:'チェック表',table:'一覧・役割',roster:'連絡先(別管理)'};

/* メイン描画 */
function dgKiki(){
  if(!kikiSel&&KIKI_SECTIONS.length)kikiSel=KIKI_SECTIONS[0].id;
  var h='<div class="card" style="margin-bottom:14px;">'
    +'<div style="display:flex;align-items:center;gap:10px;cursor:pointer;" id="kkVarHead">'+ic('gear').replace('<svg','<svg style="width:18px;height:18px;flex-shrink:0;color:var(--teal);"')+'<h3 style="margin:0;flex:1;">施設固有情報（ここを埋めると全セクションに自動反映）</h3><span class="muted" id="kkVarToggle">'+(kikiVarsOpen?'▲ 閉じる':'▼ 開く')+'</span></div>'
    +'<div id="kkVarBody" style="display:'+(kikiVarsOpen?'block':'none')+';margin-top:12px;"></div></div>'
    +'<div class="muted" style="display:flex;gap:8px;align-items:flex-start;margin:-6px 0 12px;font-size:12.5px;line-height:1.6;">'+ic('spark').replace('<svg','<svg style="width:16px;height:16px;flex-shrink:0;color:var(--teal);margin-top:2px;"')+'<span>実物マニュアルを一般化した雛形です。園ごとに変わる箇所は上の施設固有情報で差し替わり、標準本文は各セクションで自由に編集できます。将来AI連携で園ごとの自動再生成に対応予定。</span></div>'
    +'<div class="grid" style="grid-template-columns:290px 1fr;align-items:start;gap:16px;">'
    +'<div class="card" style="padding:12px;"><button class="btn btn-sm" id="kkPrintAll" style="width:100%;margin-bottom:10px;">'+ic('printer')+'全編を出力（表紙・目次つき）</button><div id="kkNav"></div></div>'
    +'<div class="card" id="kkEditor"></div></div>';
  $('#dgBody').innerHTML=h;
  $('#kkVarHead').onclick=function(){kikiVarsOpen=!kikiVarsOpen;dgKiki();};
  if(kikiVarsOpen)renderKikiVars();
  renderKikiNav();renderKikiEditor();
  $('#kkPrintAll').onclick=printKikiAll;
}
function renderKikiVars(){
  var v=kikiVars(),groups={},order=[];
  KIKI_VARDEF.forEach(function(d){if(!groups[d.g]){groups[d.g]=[];order.push(d.g);}groups[d.g].push(d);});
  var h=order.map(function(g){
    return '<div style="margin-bottom:12px;"><div style="font-weight:700;font-size:12.5px;color:var(--tx);margin-bottom:6px;">'+g+'</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;">'
      +groups[g].map(function(d){return '<div class="field" style="margin:0;"><label style="font-size:11.5px;">'+d.label+'</label><input data-kv="'+esc(d.k)+'" value="'+(v[d.k]||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" placeholder="'+esc(d.d||d.ph||'')+'"></div>';}).join('')
      +'</div></div>';
  }).join('');
  h+='<div class="muted" style="font-size:11.5px;line-height:1.6;">※ 氏名・住所・個人の連絡先などはこの端末のブラウザ内にのみ保存され、公開ソースには含まれません。スタッフの緊急連絡先は「連絡先」機能で別管理します。</div>';
  $('#kkVarBody').innerHTML=h;
  $('#kkVarBody').querySelectorAll('[data-kv]').forEach(function(inp){inp.oninput=function(){var vv=kikiVars();vv[inp.getAttribute('data-kv')]=inp.value;kikiSaveVars(vv);renderKikiEditor();};});
}
function renderKikiNav(){
  var ed=kikiEdits();
  var h=KIKI_CHAPTERS.map(function(ch){
    var secs=KIKI_SECTIONS.filter(function(s){return s.chapter===ch.id;});
    if(!secs.length)return '';
    return '<div style="margin-bottom:12px;"><div style="font-weight:700;font-size:11.5px;color:var(--tx2);margin-bottom:5px;line-height:1.4;">'+esc(ch.title)+'</div>'
      +secs.map(function(s){var on=s.id===kikiSel;return '<div data-ks="'+esc(s.id)+'" style="padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;margin-bottom:2px;'+(on?'background:var(--teal);color:#fff;':'')+'">'+esc(s.title)+(ed[s.id]!=null?' <span style="opacity:.7;">✎</span>':'')+'</div>';}).join('')
      +'</div>';
  }).join('');
  $('#kkNav').innerHTML=h;
  $('#kkNav').querySelectorAll('[data-ks]').forEach(function(d){d.onclick=function(){kikiSel=d.getAttribute('data-ks');renderKikiNav();renderKikiEditor();};});
}
function renderKikiEditor(){
  var sec=KIKI_SECTIONS.filter(function(s){return s.id===kikiSel;})[0];
  if(!sec){$('#kkEditor').innerHTML='<div class="muted">セクションを選択してください。</div>';return;}
  var edited=kikiEdits()[sec.id]!=null;
  var badge='<span style="background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:11.5px;color:var(--tx2);">'+(KIKI_TYPELABEL[sec.type]||sec.type)+'</span><span id="kkEditedBadge" class="muted" style="font-size:11.5px;'+(edited?'':'display:none;')+'"> ✎ 編集済</span>';
  var h=recHead(esc(sec.title),badge)
    +'<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;align-items:start;">'
    +'<div><label class="muted" style="font-size:11.5px;">本文（<code>{{　}}</code>は施設固有情報が自動で入ります）</label>'
    +'<textarea id="kkBody" rows="22" style="font-size:12px;line-height:1.7;width:100%;">'+esc(kikiBody(sec))+'</textarea>'
    +'<div style="display:flex;gap:8px;margin-top:8px;"><button class="btn btn-sm" id="kkSecPrint">'+ic('printer')+'このセクションを出力</button><button class="btn btn-sm btn-ghost" id="kkReset" style="'+(edited?'':'display:none;')+'">'+ic('edit')+'既定に戻す</button></div></div>'
    +'<div><label class="muted" style="font-size:11.5px;">プレビュー</label><div class="preview" id="kkPrev" style="max-height:520px;"></div></div>'
    +'</div>';
  $('#kkEditor').innerHTML=h;
  $('#kkPrev').innerHTML=kikiPrevHtml(sec);
  $('#kkBody').oninput=function(){kikiSaveEdit(sec.id,$('#kkBody').value);$('#kkPrev').innerHTML=kikiPrevHtml(sec);var ed=kikiEdits()[sec.id]!=null;$('#kkReset').style.display=ed?'':'none';$('#kkEditedBadge').style.display=ed?'':'none';renderKikiNav();};
  $('#kkReset').onclick=function(){kikiSaveEdit(sec.id,null);renderKikiEditor();renderKikiNav();};
  $('#kkSecPrint').onclick=function(){printDoc('危機管理マニュアル｜'+sec.title,kikiSecPrintHtml(sec));};
}
function kikiSecPrintHtml(sec){
  return '<div style="font-size:12px;line-height:1.75;">'+esc(kikiSubstPlain(kikiBody(sec))).replace(/\n/g,'<br>')+'</div>';
}
function printKikiAll(){
  var head='<div style="font-size:12px;margin-bottom:10px;">'+esc(kikiVal('運営会社')||'（運営会社）')+'　'+esc(kikiVal('園名')||'（園名）')+'</div>';
  var toc='<h2>目次</h2><div style="font-size:12px;line-height:1.9;">'+KIKI_CHAPTERS.map(function(ch){
    var secs=KIKI_SECTIONS.filter(function(s){return s.chapter===ch.id;});if(!secs.length)return '';
    return '<div style="font-weight:700;margin-top:6px;">'+esc(ch.title)+'</div>'+secs.map(function(s){return '<div style="padding-left:14px;">・'+esc(s.title)+'</div>';}).join('');
  }).join('')+'</div>';
  var body=KIKI_CHAPTERS.map(function(ch){
    var secs=KIKI_SECTIONS.filter(function(s){return s.chapter===ch.id;});if(!secs.length)return '';
    return '<div style="page-break-before:always;"><h2>'+esc(ch.title)+'</h2>'+secs.map(function(s){
      return '<h3 style="font-size:13px;margin:14px 0 5px;border-bottom:1px solid #ccc;padding-bottom:2px;">'+esc(s.title)+'</h3><div style="font-size:12px;line-height:1.75;">'+esc(kikiSubstPlain(kikiBody(s))).replace(/\n/g,'<br>')+'</div>';
    }).join('')+'</div>';
  }).join('');
  printDoc('危機管理マニュアル',head+toc+body);
}

      '<div class="field"><label>開所時間</label><input data-un="hours" value="'+esc(d.hours)+'"></div>'+
      '<div class="field"><label>前年度からの変更点（設備・体制など）</label><textarea data-un="changes" rows="3">'+esc(d.changes)+'</textarea></div>'+

    '<div class="card">'+recHead('生成プレビュー','<button class="btn btn-sm" id="unPrint">'+ic('printer')+'報告書を出力</button>')+'<div class="preview" id="unPrev" style="max-height:460px;"></div></div></div>';

/* 保育安全計画の本文（園固有情報は危機管理マニュアルの施設固有情報を共用） */
var ANZEN_SECTIONS=[{"title": "第1章　総則（目的・位置づけ・対象範囲）", "body": "1-1　目的\n本計画は、{{園名}}（運営：{{運営会社}}）に在籍するすべての子どもが、安全な環境のもとで安心して生活し活動できるようにするため、施設・設備の安全点検、園外活動の安全管理、子どもへの安全指導、職員研修・訓練、保護者への周知、事故発生時の対応と再発防止に関する事項をあらかじめ定めるものです。\n\n1-2　位置づけ\n令和5年（2023年）4月から、保育所等に対して安全計画の策定と、それに基づく取組の実施が求められるようになりました。本計画は、その趣旨をふまえて{{園名}}が策定する年間の安全計画です。認可外保育施設・小規模保育事業・企業主導型保育事業など施設種別によって適用される基準や自治体の指導内容が異なる場合があるため、様式・提出の要否・記載事項の細部については、あらかじめ{{市区町村}}の保育担当課（{{保育施設支援課TEL}}）に確認したうえで運用します。\n\n1-3　関連文書との関係\n本計画は、危機管理マニュアル、消防計画、避難確保計画、保健衛生・感染症対応マニュアル、food（食物アレルギー）対応マニュアルと一体で運用します。具体的な手順は各マニュアルに、年間の実施計画と点検・研修の枠組みは本計画に定めます。両者に食い違いが生じた場合は、より安全側の手順を採用したうえで、速やかに記載を統一します。\n\n1-4　対象範囲\n・対象となる子ども：{{園名}}に在籍する全児童（{{クラス構成}}）\n・対象となる場所：園舎内、園庭・テラス等の屋外スペース、園外活動先および移動経路\n・対象となる者：常勤・非常勤を問わず保育に従事するすべての職員、および実習生・ボランティア・委託業者を含む出入りする関係者\n・対象となる時間帯：{{開園時間}}および行事・延長保育等の保育提供時間全般\n\n1-5　計画期間\n本計画の期間は当該年度の1年間とし、期間中であっても事故・災害の発生、施設の改修、法令・自治体通知の改正等があった場合は随時見直します（第11章）。"}, {"title": "第2章　安全管理の体制と役割分担", "body": "2-1　安全管理の責任者\n本計画に基づく取組全体の統括責任者は{{責任者}}とし、日常の運用管理は{{マネージャー}}が担います。最終的な経営判断（休園、行政への報告、施設の使用中止等）は{{代表取締役}}が行います。防火・防災に関する事項は{{防火管理責任者}}が所管します。\n\n2-2　役割分担（緊急時）\n・通報・連絡：{{通報連絡担当}}（119番・110番、保護者、{{市区町村}}保育担当課への連絡）\n・初期消火：{{初期消火担当}}\n・避難誘導：{{避難誘導担当}}（人数確認と最終退出確認を含む）\n・救護・応急手当：{{救護担当}}（救急セットおよびAEDの管理を含む）\n・非常持ち出し：出席簿・児童名簿・緊急連絡先一覧・{{備蓄品}}\n担当者が不在の場合は、その場にいる最上位の職員が代行します。役割は掲示物として職員室に掲出し、年度当初および職員の入退職時に更新します。\n\n2-3　情報共有の仕組み\n・毎日の申し送り：登降園状況、体調不良児、当日の園外活動予定、設備の不具合を共有します。\n・週単位の職員ミーティング：ヒヤリハット・軽微な事故の共有と対策の検討を行います。\n・記録の一元化：安全点検記録、午睡チェック、健康チェック、ヒヤリハット・事故記録、避難訓練記録、業務日誌は所定の様式に記入し、園内で一元的に保管します。\n\n2-4　外部との連携先\n・{{市区町村}}保育担当課：{{保育施設支援課TEL}}\n・消防署：{{中央消防署TEL}}（緊急時は119）\n・警察：110（不審者・行方不明時）\n・嘱託医／かかりつけ医：{{かかりつけ医}}\n・園の連絡先：{{電話}}／緊急携帯 {{緊急携帯}}\n連絡先一覧は職員室および事務所に掲示し、変更が生じた都度、直ちに更新します。"}, {"title": "第3章　施設・設備の安全点検", "body": "3-1　基本方針\n事故は「気づいた不具合が放置されること」から生じます。{{園名}}では、点検を担当者の気づきに委ねず、点検項目・実施頻度・記録・是正までを一連の手順として定め、記録を残すことで確実に実施します。\n\n3-2　点検の区分と頻度\n・日常点検（毎日、保育開始前および午睡前後）：保育室の床・危険物の有無、家具や棚の固定、コンセント・電気コード、玩具の破損や欠損、窓・ベランダ・柵の施錠、玄関の施錠と来園者確認、トイレ・手洗い場の状態、園庭・遊具の異常、冷暖房と室温・換気の状況。\n・月次点検（毎月、重点箇所を定めて実施）：年間の重点点検箇所（3-4）に沿って実施します。\n・定期・法定点検（{{法定点検月}}）：消防用設備等の点検、その他法令や賃貸借契約に基づく建物設備の点検。実施は有資格者・専門業者に依頼し、点検結果報告書を保管します。実施時期・回数の要件は消防機関および{{市区町村}}へ確認します。\n・随時点検：地震・台風等の災害後、遊具や設備の入れ替え時、不具合の申し出があった時。\n\n3-3　点検項目の例（区域別）\n・保育室・遊戯室：転倒・転落の危険（棚・柵・段差）、指はさみ、誤飲につながる小さな部品、家具の転倒防止、避難経路上の障害物。\n・午睡スペース：寝具の硬さと配置、うつぶせ寝の防止、掛け物・ひも・ぬいぐるみ等の窒息リスク、児童ごとの観察のしやすさ。午睡中は園が定めた間隔（{{午睡確認間隔}}）で呼吸・顔色・体位を確認し記録します。\n・調乳・給食・食事スペース：食物アレルギー児の座席と配膳経路、加熱・保管温度、食器・調理器具の衛生、誤嚥につながる形状・大きさの確認。\n・水遊び・プール：使用前の水質・水深・破損確認、監視専任者の配置。\n・玄関・門扉・外周：施錠状況、インターホン・カメラの作動、外部から侵入可能な箇所、{{火災報知器設置場所}}および{{消火器設置場所}}の設備状態と使用の妨げの有無。\n・避難経路：{{一次避難場所}}までの経路上の障害物、扉の開閉、非常灯・誘導灯。\n\n3-4　年間の重点点検箇所\n月ごとに重点点検箇所を定め、季節要因（暑さ・寒さ、プール、暖房、感染症流行期）に応じた点検を行います。重点箇所は年度当初に一覧化し、本計画の別表として管理します。\n\n3-5　記録と是正\n・点検者は所定の様式に、点検日、点検区分、項目ごとの結果（良／要改善）、気づいた事項、点検者名を記入します。\n・「要改善」となった項目は、その場で是正できるものは直ちに対応し、修繕・業者対応が必要なものは{{マネージャー}}へ報告のうえ、対応予定と完了日を記録します。\n・是正が完了するまでの間は、当該箇所の使用中止・立入制限など暫定措置を講じ、全職員に周知します。\n・点検記録は本計画で定める期間保管し、行政の指導監査時に提示できるようにします。"}, {"title": "第4章　園外活動・散歩の安全管理", "body": "4-1　基本方針\n園外活動は子どもの育ちにとって重要な活動である一方、交通・水辺・人混みなど園内にはないリスクを伴います。{{園名}}では、事前の計画と経路確認、出発・移動中・目的地・帰園の各時点での人数確認を徹底し、置き去りを絶対に発生させない体制で実施します。\n\n4-2　事前の準備\n・散歩コースの登録：使用するコースをあらかじめ一覧化し（{{散歩コース一覧}}）、経路図に、横断箇所、信号の有無、歩道の幅、見通しの悪い交差点、車の出入口、危険箇所、緊急時に立ち寄れる施設、トイレの位置を記載します。\n・コースの安全確認：新規コースは使用前に職員が実地で下見を行い、既存コースも定期的（年間の重点点検に位置づけ）に再確認します。工事や道路状況の変化があった場合は直ちに見直します。\n・目的地の確認：公園等の遊具の破損、危険物、水辺の有無、園外者の状況を到着時に確認し、危険があれば使用を中止します。\n・当日の判断：気象状況（暑さ指数・降雨・強風）、感染症の流行状況、当日の職員配置と園児の体調をふまえ、{{マネージャー}}が実施可否を判断します。\n\n4-3　出発前の確認事項\n・参加児童名簿の作成と人数の確認（クラスごとに実施し、複数名で照合）\n・引率職員の人数と役割（先頭・中間・最後尾・横断時の誘導）の確認\n・携行品：児童名簿、緊急連絡先一覧、携帯電話（{{緊急携帯}}）、救急セット、飲料水、帽子、笛、必要に応じて連結ロープやカート\n・行き先・経路・出発時刻・帰園予定時刻を園内の所定の場所に掲示し、留守番職員が把握できるようにする\n\n4-4　移動中の安全確保\n・道路の内側（建物側）を歩行し、車道側に職員を配置します。\n・横断は横断歩道と信号を利用し、職員が先に車道側に立って安全を確認してから子どもを渡らせ、最後尾の職員が渡り切りを確認します。\n・信号のない横断箇所、車の出入口、見通しの悪い角では一旦停止し、職員が左右を確認します。\n・移動中は節目ごと（横断後、曲がり角、集団が伸びたとき）に人数を確認します。\n\n4-5　人数確認のルール\n・確認のタイミング：出発前、園を出た直後、横断・移動の節目、目的地到着時、目的地での活動中（定期的に）、目的地出発前、帰園時。\n・確認の方法：「数える」だけでなく、児童名簿による氏名の読み上げ確認を、必ず2名以上の職員が独立して行い、双方の結果が一致することを確認します。\n・数が合わない場合は、直ちに活動を中止して全員をその場に集め、捜索と{{マネージャー}}への連絡を同時に行います。必要に応じて110番通報します。\n・目的地を離れる前に、トイレ、遊具の内部・裏側、茂み等を職員が目視で確認します。\n\n4-6　園外での事故・急病時\n・けが・急病が発生した場合は、引率者のうち1名が応急手当と当該児童への対応、他の職員が残る子どもの安全確保を担当し、役割を分けて対応します。\n・重篤な場合は119番通報を優先し、その後に園および保護者へ連絡します。\n・園外活動の実施内容（行き先・時間・参加人数・気づいた事項）は、帰園後に業務日誌等へ記録します。ヒヤリハットがあった場合は第9章の手順で記録・共有します。"}, {"title": "第5章　子どもへの安全指導", "body": "5-1　基本方針\n安全指導は、子どもを怖がらせたり禁止事項を覚えさせたりすることが目的ではなく、発達段階に応じて「自分の身を守る行動」を体験を通して身につけられるようにすることを目的とします。日々の保育のなかで繰り返し、遊びや絵本・紙芝居・ごっこ遊びを取り入れて行います。\n\n5-2　交通安全に関する指導\n・道路では手をつなぐ、飛び出さない、止まる・見る・待つという基本行動を、散歩の機会を活用して繰り返し伝えます。\n・信号の意味、横断歩道の渡り方、車の近くでは運転手から見えないことがあることを、年齢に応じた表現で伝えます。\n・駐車場や車の出入口では必ず立ち止まることを習慣づけます。\n・可能な場合は、警察や自治体の交通安全教室等の外部プログラムの活用を検討します。\n\n5-3　避難・災害に関する指導\n・「おかしも（押さない・かけない・しゃべらない・もどらない）」等の合言葉を、避難訓練とあわせて年齢に応じて伝えます。\n・地震のときは頭を守って低い姿勢をとる、机の下や職員のそばに集まる、火災のときは煙を吸わないよう姿勢を低くするなど、行動を体で覚えられるようにします。\n・避難訓練では、実際に{{一次避難場所}}まで移動する回を設け、経路と集合場所を子ども自身が知っている状態をつくります。\n・訓練は、地震・火災・風水害・不審者など想定を変え、時間帯（午睡中・給食中・園外活動中）も変えて実施します。\n\n5-4　不審者・防犯に関する指導\n・知らない人についていかない、大人に助けを求める、大声を出すという行動を、無理のない範囲でごっこ遊びを通じて伝えます。\n・防犯訓練では、職員の合図で保育室に集まる・静かにする・職員から離れないという行動を確認します。合図の言葉は子どもを不安にさせない表現とし、全職員で統一します。\n\n5-5　生活のなかの安全（けが・誤飲・水・食事）\n・遊具の正しい使い方、順番を待つこと、走ってよい場所とそうでない場所を日常的に伝えます。\n・口に入れてはいけないもの、小さなものを飲み込む危険について、年齢に応じて伝えます。\n・食事は座って食べる、よく噛む、口に入れたまま歩かない・話さないことを習慣づけます。\n・水遊び・プールでは、職員の合図で入る・出る、押さない・沈めないというルールを事前に確認します。\n\n5-6　実施の記録\n安全指導は、実施日・対象クラス・内容・子どもの様子を業務日誌または指導計画の記録欄に残し、年間を通じてどの内容をどの時期に実施したかを振り返られるようにします。"}, {"title": "第6章　職員への研修と訓練", "body": "6-1　基本方針\n安全確保は個々の職員の経験や判断力に依存させず、全職員が同じ手順を共有していることによって成り立ちます。{{園名}}では、年間の研修・訓練計画を定め、常勤・非常勤の別なく参加できるよう日程と実施方法を工夫します。\n\n6-2　年間研修・訓練計画（項目）\n年度当初に、実施時期・内容・対象・担当者を定めた年間計画を作成します。少なくとも次の内容を計画に含めます。\n・避難訓練（地震・火災・風水害）および消火訓練\n・不審者対応・防犯訓練\n・救命救急（心肺蘇生・AEDの使用）、窒息・誤嚥時の対応\n・睡眠中の事故防止（うつぶせ寝の防止、午睡中の観察と記録の方法）\n・食物アレルギー対応、アナフィラキシー発生時の対応\n・水遊び・プール活動時の監視体制\n・感染症対策、嘔吐物処理の実技\n・園外活動・散歩の安全管理（人数確認・置き去り防止の手順確認）\n・ヒヤリハットの共有と事故事例の検討（重大事故事例を含む）\n・保護者への引き渡し訓練（保護者参加）\n・年間の振り返りと次年度計画の策定\n\n6-3　訓練の実施方法\n・避難訓練は、想定（災害種別）、発生時間帯、避難先（{{一次避難場所}}／{{二次避難場所}}／{{広域避難場所}}）を変えて計画し、年間を通じて偏りが生じないようにします。実施回数・実施頻度に関する要件は、施設種別に応じて{{市区町村}}および消防機関に確認します。\n・訓練では、子どもの避難だけでなく、通報、初期消火、人数確認、非常持ち出し、保護者への一斉連絡までを一連の流れとして実施します。\n・実施後は必ず振り返りを行い、時間がかかった箇所、迷った判断、手順書との食い違いを洗い出し、改善点をマニュアルに反映します。\n\n6-4　新任職員・非常勤職員への対応\n・採用時に、危機管理マニュアル、本計画、緊急連絡体制、アレルギー児の情報、午睡チェックの手順を説明し、確認したことを記録します。\n・訓練に参加できなかった職員には、資料の配付と個別説明を行い、参加扱いとしての記録を残します。\n\n6-5　実施記録\n研修・訓練ごとに、実施日時、想定・内容、参加職員名（参加者名簿）、所要時間、振り返りで出た課題と改善事項を記録し保管します。記録は行政の指導監査で確認される基本資料であるため、実施した事実だけでなく、そこから何を改善したかがわかる記載とします。"}, {"title": "第7章　保護者への周知と連携", "body": "7-1　基本方針\n安全確保は園だけで完結するものではなく、家庭との情報共有によって実効性が高まります。{{園名}}では、本計画の内容と園の安全に関する取組を保護者に継続的に周知し、緊急時に確実に連絡・引き渡しができる関係をつくります。\n\n7-2　入園時の説明\n入園時および進級時に、次の事項を書面で説明し、保護者の確認を得ます。\n・本計画の概要（安全点検、園外活動、安全指導、研修・訓練の実施方針）\n・緊急時の連絡方法と連絡の優先順位、園の連絡先（{{電話}}／{{緊急携帯}}）\n・避難場所（{{一次避難場所}}、{{二次避難場所}}、{{広域避難場所}}）と引き渡しの方法\n・災害・気象警報時の休園・保育中止の基準（{{天災休園基準}}）\n・発熱等による連絡・お迎えの目安（{{体温基準}}）\n・食物アレルギー、既往症、かかりつけ医など健康情報の提出と更新のお願い\n・緊急連絡先および引き渡しを行う代理人の登録（登録者以外には引き渡さないこと）\n\n7-3　日常的な周知\n・園だより・保健だより・連絡アプリ等を通じて、安全点検や訓練の実施状況、季節ごとの注意（熱中症、感染症、水の事故、雪や凍結）を定期的に発信します。\n・避難訓練や安全指導を実施した際は、内容と子どもの様子を保護者へ報告します。\n・園内で発生したヒヤリハットのうち、家庭でも留意いただきたい内容は、個人が特定されない形で共有します。\n\n7-4　引き渡し訓練\n・保護者参加の引き渡し訓練を年間計画に位置づけて実施します。\n・訓練では、一斉連絡の受信確認、避難場所への来園、登録された引き渡し者の本人確認、引き渡し記録の記入までを実際に行います。\n・保護者が来園できない場合の対応（園での待機、待機場所、待機中の連絡方法）についてもあわせて確認します。\n・訓練後は、連絡が届かなかった家庭の有無、所要時間、混雑箇所を確認し、連絡手段や動線を改善します。\n\n7-5　連絡先情報の維持\n緊急連絡先、勤務先、代理お迎え者、かかりつけ医の情報は、年度当初に全世帯へ確認・更新を依頼し、変更があった場合は随時届け出ていただきます。園は最新の情報を非常持ち出し可能な形（紙媒体を含む）で保管します。"}, {"title": "第8章　事故・ヒヤリハット発生時の対応", "body": "8-1　初動の原則\n事故が発生した場合は、子どもの生命と安全の確保を最優先とし、次の順で対応します。\n（1）子どもの安全確保と応急手当\n（2）救急要請の判断（意識・呼吸・出血・けいれん・アナフィラキシー・溺水・窒息・頭部の強い打撲などは、迷わず119番）\n（3）他の子どもの安全確保（別の職員が担当し、対応者を分ける）\n（4）{{責任者}}および{{マネージャー}}への報告\n（5）保護者への連絡\n（6）必要に応じて{{市区町村}}保育担当課（{{保育施設支援課TEL}}）等への報告\n\n8-2　救急要請と受診\n・救急要請の判断に迷う場合は、要請する側を選択します。\n・救急隊には、発生時刻、状況、既往症・アレルギー、実施した応急手当を伝えられるよう、児童の健康記録を手元に用意します。\n・受診時は職員が同行し、保護者が到着するまで付き添います。受診先は{{かかりつけ医}}または救急隊の指示による医療機関とします。\n\n8-3　保護者への連絡\n・重篤な場合は、詳細が判明する前であっても、判明している事実を速やかに伝えます。連絡が遅れることによる不信を避けます。\n・伝える内容は、発生時刻、状況、子どもの現在の状態、園がとった対応、これからの対応（受診先・付き添い者）とします。\n・原因や責任について推測で述べることは避け、確認できた事実のみを伝えます。\n・軽微なけがであっても、降園時に必ず口頭で説明し、記録に残します。\n\n8-4　行政等への報告\n・死亡事故や治療に相当の期間を要する事故など重大な事故が発生した場合は、自治体への報告が求められます。報告の対象範囲、様式、提出先、期限は施設種別および自治体によって異なるため、あらかじめ{{市区町村}}保育担当課に確認し、連絡経路を本計画の別表として整理しておきます。企業主導型保育事業においては、実施機関への報告の要否もあわせて確認します。\n・報告を要する事案が発生した場合は、記憶が新しいうちに時系列を記録し、報告内容と提出日を控えます。\n\n8-5　園内および他の保護者への対応\n・事故発生後は、全職員に事実関係と当面の対応方針を共有し、対外的な説明の窓口を{{マネージャー}}に一本化します。\n・他の保護者への説明が必要な場合は、当該児童および家庭のプライバシーに十分配慮し、個人が特定されない形で行います。\n・報道機関等からの問い合わせがあった場合は、担当者以外は応対せず、{{代表取締役}}および{{運営会社}}の指示に従います。"}, {"title": "第9章　記録・検証と再発防止", "body": "9-1　記録の対象\n次のものはすべて記録の対象とします。\n・けが、体調の急変、誤飲・誤嚥、アレルギー症状の発現などの事故\n・実際には事故に至らなかったが、危険を感じた事象（ヒヤリハット）\n・設備の不具合、危険箇所の発見\nヒヤリハットは、重大事故の予兆として最も重要な情報です。報告した職員が責められることのないよう、「個人の責任追及ではなく仕組みの改善のために集める」ことを全職員で共有します。\n\n9-2　記録の内容\n所定の様式に、次の事項を記載します。\n・発生日時、発生場所、天候・活動内容\n・対象児童（クラス・年齢）、けがの部位と程度（人体図に部位を記入）\n・発生時の状況（何をしていたか、直前に何が起きたか）を時系列で\n・その場でとった処置・対応、受診の有無と受診先\n・保護者への連絡時刻と伝えた内容\n・記録者、確認者\n記載は、推測と事実を分け、事実を先に、判断や意見は分けて書きます。\n\n9-3　検証\n・{{マネージャー}}を中心に、記録をもとに要因を分析します。分析は「誰の不注意か」ではなく、「どのような環境・手順・人員配置であればその事象が起きにくかったか」という観点で行います。\n・検討する視点：環境（設備・配置・動線）、人（配置人数・役割・経験）、手順（マニュアルの有無・わかりやすさ）、子どもの発達段階、時間帯（引き継ぎ・午睡・食事など職員の注意が分散しやすい時間）。\n・重大な事故や、同種の事象が繰り返されている場合は、職員会議の議題として全職員で検討します。\n\n9-4　再発防止策の決定と実行\n・検証の結果、具体的な対策（環境の改善、手順の変更、配置の見直し、指導内容の追加）を決め、担当者と実施期限を定めます。\n・対策は本計画または関連マニュアルに反映し、口頭の申し合わせで終わらせません。\n・実施後、一定期間を経て効果を確認し、効果が不十分な場合は対策を再検討します。\n\n9-5　共有\n・決定した対策は、職員会議、申し送り、園内掲示によって全職員（非常勤職員・新任職員を含む）に共有します。\n・年度末には、1年間のヒヤリハット・事故の傾向（発生場所、時間帯、活動内容、けがの種類）を集計し、次年度の重点点検箇所と研修内容に反映します。\n・他施設で発生した重大事故の事例や、国・自治体から示された注意喚起についても、園内研修の題材として取り上げます。"}, {"title": "第10章　年間スケジュールと記録の管理", "body": "10-1　年間スケジュールの作成\n年度当初に、次の項目を1枚の年間予定表にまとめ、職員室に掲示します。\n・月別の重点安全点検箇所\n・避難訓練・消火訓練の実施予定（想定・時間帯・避難先）\n・防犯訓練、引き渡し訓練の実施予定\n・職員研修の実施予定（内容・対象・担当）\n・子どもへの安全指導の実施予定（交通安全・避難・防犯・生活の安全）\n・保護者への周知予定（入園時説明、園だより、訓練報告）\n・設備の法定点検・専門業者による点検の予定（{{法定点検月}}）\n・健康診断、身体測定など健康管理に関する予定\n\n10-2　実施状況の管理\n・{{マネージャー}}は、月ごとに実施状況を確認し、未実施の項目があれば速やかに日程を再設定します。\n・年度途中で計画を変更した場合は、変更した日と理由を記録します。\n\n10-3　記録の様式と保管\n・本計画に基づく記録（安全点検記録、午睡チェック、健康チェック、身体測定、ヒヤリハット・事故記録、避難訓練記録・参加者名簿、研修記録、業務日誌、園外活動の記録）は、園で定めた様式に統一します。\n・記録には必ず記入者名を記載し、上長が確認したことがわかるようにします。\n・保管場所と保管期間を定め、行政の指導監査時に速やかに提示できるよう整理します。保管期間の要件は{{市区町村}}へ確認します。\n・個人情報を含む記録は施錠可能な場所に保管し、電子的に保存する場合はアクセス権限を限定します。持ち出しは原則禁止とし、園外活動時に持ち出す名簿等は帰園後直ちに返却します。\n\n10-4　記録が果たす役割\n記録は、監査のために作るものではなく、日々の運営の中で危険に気づき、改善につなげるための道具です。記録が形骸化していないか（同じ記載の繰り返しになっていないか、「要改善」が一度も出ていないか）を、定期的に点検します。"}, {"title": "第11章　計画およびマニュアルの見直し", "body": "11-1　定期的な見直し\n・本計画は、年度末に1年間の実施状況を振り返り、次年度に向けて見直します。見直しには、{{責任者}}、{{マネージャー}}および各クラスの担当職員が参加します。\n・振り返りでは、次の点を確認します。\n　（1）計画した点検・訓練・研修・安全指導が予定どおり実施されたか\n　（2）実施できなかった項目がある場合、その理由と次年度の改善策\n　（3）1年間のヒヤリハット・事故の傾向と、そこから導かれる重点課題\n　（4）訓練の振り返りで挙がった手順上の課題が解消されているか\n　（5）保護者から寄せられた意見・要望への対応状況\n\n11-2　随時の見直し\n次の場合は、年度途中であっても速やかに本計画および関連マニュアルを見直します。\n・重大な事故、または重大な事故につながりかねない事象が発生したとき\n・施設の改修、レイアウトや動線の変更、遊具・設備の入れ替えがあったとき\n・散歩コース周辺の道路状況が変化したとき、新たな園外活動先を追加したとき\n・職員体制、緊急時の役割分担、緊急連絡先に変更があったとき\n・法令、国の通知、自治体の指導内容に変更があったとき\n\n11-3　改定の手続きと周知\n・改定案は{{マネージャー}}が作成し、{{責任者}}の確認を経て確定します。\n・改定した箇所は改定履歴（改定日・改定箇所・理由）として記録に残し、旧版と区別できるようにします。\n・改定後は、全職員（非常勤職員を含む）へ内容を説明し、説明した記録を残します。保護者に関係する内容（避難場所、連絡方法、引き渡し手順、休園基準など）を変更した場合は、書面等で速やかに周知します。\n・危機管理マニュアル、消防計画、避難確保計画など関連文書との整合を確認し、必要な箇所を同時に修正します。\n\n11-4　自治体等への確認\n安全計画に関する記載事項、様式、提出の要否、点検・訓練の実施頻度の要件は、施設種別（認可外保育施設、小規模保育事業、企業主導型保育事業等）および自治体によって取扱いが異なる場合があります。本計画では要件を推測で記載せず、必要な事項は{{市区町村}}保育担当課（{{保育施設支援課TEL}}）および消防機関（{{中央消防署TEL}}）に確認したうえで、確認日とともに記録します。\n\n（本計画　制定・改定履歴）\n・制定日：　　年　　月　　日\n・改定日：　　年　　月　　日（改定箇所：　　　　）\n・作成者：{{マネージャー}}　／　承認者：{{責任者}}"}];
function anzenEditsAll(){var st=dgStore();return (st.anzen&&st.anzen.edits)||{};}
function anzenEditSet(id,body){var st=dgStore();st.anzen=st.anzen||{};st.anzen.edits=st.anzen.edits||{};if(body==null)delete st.anzen.edits[id];else st.anzen.edits[id]=body;stSet('docgen',st);}
function anzenBody(i){var e=anzenEditsAll()[i];return e!=null?e:(ANZEN_SECTIONS[i]||{}).body||'';}
function anzenSubst(t){return (typeof kikiSubstPlain==='function')?kikiSubstPlain(t):t;}
function dgAnzen(){
  var d=dgStore().anzen||{};
  if(!d.rows)d={rows:[
    {m:'4月',c:'避難訓練（地震）・防犯訓練',t:'全職員'},
    {m:'6月',c:'救命救急・心肺蘇生（AED）研修',t:'全職員'},
    {m:'9月',c:'不審者対応訓練',t:'全職員'},
    {m:'11月',c:'感染症対策・嘔吐処理研修',t:'全職員'},
    {m:'1月',c:'引き渡し訓練',t:'全職員・保護者'},
    {m:'3月',c:'年間安全の振り返り・次年度計画策定',t:'全職員'}
  ],parent:'・4月：保育安全計画を配布・説明\n・毎月：デイリーメールで安全・保健情報を配信\n・訓練実施後：実施報告を配信'};
  if(!d.check)d.check=[
    {m:'4月',c:'遊具の安全点検'},{m:'5月',c:'お散歩コースの安全確認・緊急連絡先の確認'},{m:'6月',c:'保育室の安全点検'},
    {m:'7月',c:'プール用具の安全確認・冷房設備の点検'},{m:'8月',c:'プール用具の安全確認・保育室の安全点検'},{m:'9月',c:'保育室・遊具の安全点検'},
    {m:'10月',c:'お散歩コースの安全確認'},{m:'11月',c:'扉や窓・柵の安全点検'},{m:'12月',c:'室内点検・暖房施設の点検'},
    {m:'1月',c:'暖房の設定温度・室内換気'},{m:'2月',c:'玩具の安全点検'},{m:'3月',c:'遊具の安全点検・室内点検'}
  ];
  function save(){dgSave('anzen',d);}
  function plan(){
    return ANZEN_SECTIONS.map(function(s,i){return '<h2>'+esc(s.title)+'</h2><p style="white-space:pre-wrap;">'+esc(anzenSubst(anzenBody(i)))+'</p>';}).join('')+
    '<h2>安全点検（月別 重点点検箇所）</h2><table><thead><tr><th style="width:70px;">月</th><th>重点点検箇所</th></tr></thead><tbody>'+d.check.map(function(r){return '<tr><td>'+r.m+'</td><td>'+r.c+'</td></tr>';}).join('')+'</tbody></table>'+
    '<h2>年間研修・訓練計画</h2><table><thead><tr><th>時期</th><th>内容</th><th>対象</th></tr></thead><tbody>'+d.rows.map(function(r){return '<tr><td>'+r.m+'</td><td>'+r.c+'</td><td>'+r.t+'</td></tr>';}).join('')+'</tbody></table>'+
    '<h2>保護者への周知計画</h2><p>'+(d.parent||'').replace(/\n/g,'<br>')+'</p>';
  }
  $('#dgBody').innerHTML='<div class="grid" style="grid-template-columns:1.1fr 1fr;align-items:start;">'+
    '<div class="card"><h3>'+ic('shield')+'安全点検（月別 重点点検箇所）</h3>'+
      '<table><thead><tr><th style="width:56px;">月</th><th>重点点検箇所</th></tr></thead><tbody>'+
      d.check.map(function(r,i){return '<tr><td class="row-name">'+r.m+'</td><td><input data-cm="'+esc(i)+'" value="'+r.c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"></td></tr>';}).join('')+'</tbody></table>'+

/* ========== サーバー同期（バックエンド接続時のみ有効） ==========
   接続先が未設定のときは、これまで通り端末内（ブラウザ）だけで動く。
   接続すると：本物のログイン／全端末でデータ共有／サーバ側に保存とログ。
   仕組み：画面はこれまで通り端末内の保存を読み書きし、その内容をサーバと同期する（オフラインでも入力できる）。 */
var API={
  base:function(){return (stGetRaw('apiBase')||'').replace(/\/$/,'');},
  setBase:function(v){localStorage.setItem('cocoas_apiBase',JSON.stringify(String(v||'').replace(/\/$/,'')));},
  /* ログイン用のトークンは sessionStorage（このタブの中だけ）に置きます。
     localStorage だと、端末に残り続けるうえ、バックアップの書き出しにも混ざってしまうためです。
     タブを閉じると消えます（共用のタブレットでは、この方が安全です）。
     ※ 新しいタブを開いたときは、もう一度ログインが必要になります。 */
  token:function(){
    var t='';
    try{t=sessionStorage.getItem('cocoas_apiToken')||'';}catch(e){}
    if(!t){
      /* これまで localStorage に入っていた分は、いまのタブへ移してから消します
         （この入れ替えで、ログインし直しが必要になることはありません）。 */
      var old=null;
      try{old=localStorage.getItem('cocoas_apiToken');}catch(e){}
      if(old){
        try{old=JSON.parse(old);}catch(e){old=null;}
        if(old&&typeof old==='string'){t=old;try{sessionStorage.setItem('cocoas_apiToken',t);}catch(e){}}
        try{localStorage.removeItem('cocoas_apiToken');}catch(e){}
      }
    }
    return t;
  },
  setToken:function(t){
    try{if(t)sessionStorage.setItem('cocoas_apiToken',String(t));else sessionStorage.removeItem('cocoas_apiToken');}catch(e){}
    try{localStorage.removeItem('cocoas_apiToken');}catch(e){}
  },
  tenant:function(){return stGetRaw('apiTenant')||null;},
  setTenant:function(t){if(t)localStorage.setItem('cocoas_apiTenant',JSON.stringify(t));else localStorage.removeItem('cocoas_apiTenant');},
  enabled:function(){return !!API.base();},
  online:function(){return API.enabled()&&!!API.token();},
  call:function(method,path,body){
    var h={'Content-Type':'application/json'};
    if(API.token())h.Authorization='Bearer '+API.token();
    return fetch(API.base()+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401){API.setToken('');throw new Error('ログインの有効期限が切れました。もう一度ログインしてください。');}
        if(!r.ok)throw new Error(j.error||('通信に失敗しました（'+r.status+'）'));
        return j;});});
  }
};
/* 同期キュー：保存のたびに変更キーを控え、まとめてサーバへ送る */
var SYNC={queue:{},timer:null,busy:false,lastPull:null,status:'',
  mark:function(key){
    if(!API.online())return;
    if(/^cocoas_(apiToken|apiBase|apiTenant|psession|staffSession|eventLog|snapshots|lastSnap|staffAccounts|parentAccounts)$/.test(key))return;
    SYNC.queue[key.replace(/^cocoas_/,'')]=true;
    clearTimeout(SYNC.timer);
    SYNC.timer=setTimeout(SYNC.push,1200);
  },
  push:function(){
    if(!API.online()||SYNC.busy)return Promise.resolve();
    var keys=Object.keys(SYNC.queue);if(!keys.length)return Promise.resolve();
    SYNC.busy=true;SYNC.queue={};SYNC.setStatus('保存中…');
    var data={};keys.forEach(function(k){try{data[k]=JSON.parse(localStorage.getItem('cocoas_'+k));}catch(e){data[k]=null;}});
    return API.call('PUT','/state',{data:data})
      .then(function(){SYNC.setStatus('保存しました',true);})
      .catch(function(e){keys.forEach(function(k){SYNC.queue[k]=true;});SYNC.setStatus('未保存：'+e.message);})
      .then(function(){SYNC.busy=false;});
  },
  pull:function(){
    if(!API.online())return Promise.resolve();
    SYNC.setStatus('読み込み中…');
    return API.call('GET','/state').then(function(j){
      Object.keys(j.data||{}).forEach(function(k){
        /* サーバ応答で接続先や職員アカウントを書き換えられないようにする（テナント乗っ取りの防止） */
        if(/^(apiToken|apiBase|apiTenant|psession|staffSession|staffAccounts|parentAccounts)$/.test(k))return;
        if(j.data[k]===null||j.data[k]===undefined)return;
        (window.__rawSet||localStorage.setItem.bind(localStorage))('cocoas_'+k,JSON.stringify(j.data[k]));
      });
      SYNC.lastPull=j.serverTime;SYNC.setStatus('最新の状態です',true);
      return j;
    }).catch(function(e){SYNC.setStatus('読み込み失敗：'+e.message);throw e;});
  },
  setStatus:function(t,fade){
    SYNC.status=t;
    var el2=document.getElementById('syncStatus');
    if(el2){el2.textContent=t;el2.style.opacity='1';if(fade)setTimeout(function(){if(el2)el2.style.opacity='.45';},1600);}
  }
};
/* localStorage への書き込みを検知して同期キューに積む（既存の保存処理は変更しない） */
(function(){
  var raw=(window.__rawSet||localStorage.setItem.bind(localStorage));
  var prev=localStorage.setItem.bind(localStorage);
  localStorage.setItem=function(k,v){prev(k,v);try{SYNC.mark(k);}catch(e){}};
  window.__rawSetOrig=raw;
})();

/* ========== パスワードの保管（平文をやめる） ==========
   ブラウザに標準で入っている暗号の機能（Web Crypto）を使い、パスワードを
   PBKDF2（15万回・SHA-256）のハッシュに変えてから保存します。
   端末に残るのは「ハッシュ」と「ソルト」だけで、パスワードそのものは残りません。
   照合には少し時間がかかるため、結果はコールバックでお返しします。
   ※ 古い環境などで暗号の機能が使えないときは、これまでどおりの動きに戻します
     （安全性は下がりますが、ログインできなくなるより良いと判断しました）。 */
var CRED={
  IT:150000,
  can:function(){try{return !!(window.crypto&&window.crypto.subtle&&window.crypto.subtle.importKey&&window.TextEncoder&&window.btoa&&window.atob);}catch(e){return false;}},
  _b64:function(buf){var b=new Uint8Array(buf),s='',i;for(i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);},
  _bin:function(s){var r=atob(String(s)),a=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;},
  _salt:function(){var a=new Uint8Array(16),i;try{window.crypto.getRandomValues(a);}catch(e){for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);}return a;},
  _bits:function(pw,salt,it){
    var raw=new TextEncoder().encode(String(pw));
    return window.crypto.subtle.importKey('raw',raw,{name:'PBKDF2'},false,['deriveBits'])
      .then(function(k){return window.crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},k,256);});
  },
  /* パスワードからハッシュを作ります。使えない環境では null をお返しします。 */
  hash:function(pw,done){
    done=done||function(){};
    if(!CRED.can()||!pw){done(null);return;}
    var salt=CRED._salt();
    try{
      CRED._bits(pw,salt,CRED.IT).then(function(bits){
        done({v:1,alg:'PBKDF2-SHA256',it:CRED.IT,salt:CRED._b64(salt),h:CRED._b64(bits)});
      },function(){done(null);});
    }catch(e){done(null);}
  },
  /* 入力されたパスワードが、保存されているハッシュと合っているかを調べます。 */
  verify:function(pw,rec,done){
    done=done||function(){};
    if(!rec||!rec.h||!rec.salt||!CRED.can()||!pw){done(false);return;}
    try{
      CRED._bits(pw,CRED._bin(rec.salt),rec.it||CRED.IT).then(function(bits){
        done(CRED._same(CRED._b64(bits),rec.h));
      },function(){done(false);});
    }catch(e){done(false);}
  },
  /* どこで違っていても同じ時間で答えるように、最後まで比べます。 */
  _same:function(a,b){
    if(typeof a!=='string'||typeof b!=='string'||a.length!==b.length)return false;
    var d=0,i;for(i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);
    return d===0;
  }
};

/* ========== 自動ロック（共用タブレット向け） ==========
   しばらく操作がないと、画面に鍵をかけます。
   ★ここが大事：ロックは「画面をおおうだけ」です。
     入力の途中の内容も、まだ送っていない記録も、消しません。
     鍵を開ければ、さっきまでの画面がそのまま出てきます。ログアウトとは別のものです。 */
var IDLE={
  MS:20*60*1000,      /* 20分さわらなければ、鍵をかけます */
  MAXMS:60*60*1000,   /* 入力の途中でも、1時間で必ず鍵をかけます（内容は消えません） */
  last:Date.now(), locked:false, started:false, timer:null,
  bump:function(){IDLE.last=Date.now();},
  start:function(){
    if(IDLE.started)return;IDLE.started=true;IDLE.bump();
    var evs=['mousedown','keydown','touchstart','wheel','focusin'],i;
    for(i=0;i<evs.length;i++){try{document.addEventListener(evs[i],IDLE.bump,true);}catch(e){}}
    IDLE.timer=setInterval(IDLE.tick,15000);
  },
  /* いま入力の途中かどうか。途中なら、しばらく待ちます。 */
  typing:function(){
    var a=document.activeElement;
    if(!a)return false;
    if(a.isContentEditable)return true;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||''))return String(a.value||'')!=='';
    return false;
  },
  tick:function(){
    if(IDLE.locked)return;
    var idle=Date.now()-IDLE.last;
    if(idle<IDLE.MS)return;
    if(idle<IDLE.MAXMS&&IDLE.typing())return;
    IDLE.lock();
  },
  lock:function(){
    if(IDLE.locked)return;
    try{if(typeof currentStaff==='function'&&!currentStaff())return;}catch(e){return;}
    IDLE.locked=true;
    /* まだ送っていない分をサーバへ送っておきます。送れなくても、内容はこの端末に残ります。 */
    try{if(typeof SYNC!=='undefined'&&SYNC.push)SYNC.push();}catch(e){}
    IDLE.show();
  },
  show:function(){
    var ov=document.getElementById('idleLock');
    if(!ov){ov=document.createElement('div');ov.id='idleLock';document.body.appendChild(ov);}
    ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:linear-gradient(135deg,#0B5F8F,#063E5F);display:flex;align-items:center;justify-content:center;padding:20px;';
    var s=null;try{s=(typeof currentStaff==='function')?currentStaff():null;}catch(e){}
    s=s||{};
    ov.innerHTML='<div style="background:#fff;border-radius:20px;max-width:400px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:inherit;">'
      +'<div style="font-size:19px;font-weight:700;margin-bottom:6px;">画面をロックしました</div>'
      +'<div style="font-size:12.5px;color:#5F5E5A;line-height:1.75;margin-bottom:14px;">しばらく操作がなかったため、画面に鍵をかけました。<br>入力の途中の内容は消えていません。パスワードを入れると、続きからお使いいただけます。</div>'
      +'<div style="font-size:13px;font-weight:600;margin-bottom:8px;">'+esc(s.name||'')+'（'+esc(s.role||'')+'）</div>'
      +'<div id="idleErr" style="color:#B00;font-size:12px;margin-bottom:8px;display:none;line-height:1.6;"></div>'
      +'<input id="idlePw" type="password" placeholder="パスワード" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" style="width:100%;border:1px solid #E5E2D9;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">'
      +'<button id="idleGo" style="width:100%;background:#0B5F8F;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">ロックを解除する</button>'
      +'<div style="text-align:center;margin-top:12px;"><button id="idleOut" style="background:none;border:none;color:#5F5E5A;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">別の職員としてログインし直す</button></div>'
      +'</div>';
    var go=document.getElementById('idleGo'),pw=document.getElementById('idlePw'),er=document.getElementById('idleErr');
    function stop(msg){er.textContent=msg;er.style.display='block';go.disabled=false;go.textContent='ロックを解除する';}
    go.onclick=function(){
      var v=pw.value;
      if(!v){stop('パスワードを入力してください');return;}
      er.style.display='none';go.disabled=true;go.textContent='確認中…';
      IDLE.check(v,function(ok,why){
        if(ok){IDLE.unlock();return;}
        /* サーバから理由が返ってきたときは、そのまま出す
           （「何度も間違えたので少し待ってください」などを、パスワード違いと取り違えないため） */
        stop(why||'パスワードが違います');
      });
    };
    pw.addEventListener('keydown',function(e){if(e.key==='Enter')go.click();});
    document.getElementById('idleOut').onclick=function(){
      /* ここではデータを一切消しません。ログアウトの処理はこれまでどおりです。 */
      if(confirm('ログアウトして、別の職員としてログインし直しますか？\n（入力済みの内容は、この端末に残ります）'))staffLogout();
    };
    try{pw.focus();}catch(e){}
  },
  /* 鍵を開けてよいかの確認。サーバに接続しているときは、サーバに聞きます。 */
  check:function(pw,done){
    try{
      if(typeof API!=='undefined'&&API.online()){
        var t=(API.tenant()||{}).code||'';
        var u=(typeof serverUser==='function'&&serverUser())||{};
        if(!t||!u.loginId){done(false);return;}
        /* ここでは API.call を使いません。合わないときに、いまのログインまで切れてしまうためです。 */
        fetch(API.base()+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({tenant:t,loginId:u.loginId,password:pw})})
          .then(function(r){
            return r.json().then(function(j){return {ok:r.ok,j:j};},function(){return {ok:r.ok,j:{}};});
          })
          .then(function(x){
            if(x.ok&&x.j&&x.j.token){API.setToken(x.j.token);done(true);return;}
            done(false,(x.j&&x.j.error)?x.j.error:'');
          },function(){done(false,'通信ができませんでした。電波の状態をご確認のうえ、もう一度お試しください。');});
        return;
      }
    }catch(e){}
    var s=null;try{s=(typeof currentStaff==='function')?currentStaff():null;}catch(e){}
    if(!s){done(false);return;}
    staffLoginBy(s.loginId,pw,function(ok){done(ok);});
  },
  unlock:function(){
    var ov=document.getElementById('idleLock');
    if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
    IDLE.locked=false;IDLE.bump();
  }
};

/* テスト用アカウントの初期パスワードは、ハッシュの形で用意しています。
   （admin / shiraga / staff の各アカウントは、パスワードがログインIDと同じ文字列です）
   平文はどこにも保存しません。実際の園児情報を入れる前に、必ず変更してください。 */
var SEED_PWH={
  admin:{v:1,alg:'PBKDF2-SHA256',it:150000,salt:'VmZNqFbrMSclCv2G1qzQSA==',h:'ZqxJte/D6Yo3wdw1PymdUNeLMIhwngFez/kf6sHK2oc='},

  staff:{v:1,alg:'PBKDF2-SHA256',it:150000,salt:'ZW4JsRezp+q/LGSYXJ+Bcw==',h:'bQp990OW9h7hvbQeybDhXM64xVYLnc4SUZ6++WQ5in0='}
};
function staffAccountsSeed(){return [
  {id:1,loginId:'admin',name:'本部 管理者',role:'管理者',pwh:SEED_PWH.admin,seed:true,staffId:null},
  {id:2,loginId:'shiraga',name:'白神 美咲',role:'マネージャー',pwh:SEED_PWH.shiraga,seed:true,staffId:101},
  {id:3,loginId:'staff',name:'一般 スタッフ',role:'一般',pwh:SEED_PWH.staff,seed:true,staffId:null}

var ACCOUNTS_VERSION=2;
function staffAccounts(){
  var a=stGet('staffAccounts',null);

  /* デモ既定のまま（未編集）なら最新の初期アカウントへ更新。園が作成・編集したアカウントには触れない */

    if(untouched){a=staffAccountsSeed();stSet('staffAccounts',a);}

function rolePerms(){var p=stGet('rolePerms',null);if(!p||stGet('permsVersion',0)!==PERMS_VERSION){p=DEFAULT_PERMS;stSet('rolePerms',p);stSet('permsVersion',PERMS_VERSION);}return p;}

/* ログインの確認。ハッシュの照合に少し時間がかかるため、結果はコールバックでお返しします。
   まだ平文のまま残っているアカウントは、照合が通った瞬間にハッシュへ置き換えます。
   （置き換えによって、ログインできなくなることはありません） */
function staffLoginBy(loginId,pw,cb){
  cb=cb||function(){};
  loginId=(loginId||'').trim().toLowerCase();pw=(pw||'').trim();
  var arr=staffAccounts();
  var a=arr.filter(function(x){return String(x.loginId).toLowerCase()===loginId;})[0];
  /* パスワードが空のままログインできてしまわないようにします。 */
  if(!a||!pw){cb(false);return;}
  function grant(){sessionStorage.setItem('cocoas_staffSession',a.id);cb(true);}
  if(a.pwh){CRED.verify(pw,a.pwh,function(ok){if(ok)grant();else cb(false);});return;}
  var old=(a.pw==null)?'':String(a.pw).trim();
  if(old&&pw===old){
    CRED.hash(pw,function(rec){
      if(rec){a.pwh=rec;delete a.pw;stSet('staffAccounts',arr);}
      grant();
    });
    return;
  }
  cb(false);
}
/* パスワードを設定します。保存されるのはハッシュだけです。 */
function staffSetPassword(acc,pw,done){
  done=done||function(){};
  CRED.hash(pw,function(rec){
    if(rec){acc.pwh=rec;delete acc.pw;}
    else{acc.pw=String(pw);delete acc.pwh;}  /* 暗号の機能が使えない環境では、これまでどおりの保存に戻します */
    delete acc.seed;
    done();
  });
}
/* 起動したときに、平文のまま残っているパスワードをハッシュへ置き換えます。
   置き換えたあとも、同じパスワードでこれまでどおりログインできます。 */
function staffCredSweep(){
  if(!CRED.can())return;
  var todo=staffAccounts().filter(function(a){return a.pw!=null&&String(a.pw)!==''&&!a.pwh;});
  if(!todo.length)return;
  var made={},n=0;
  todo.forEach(function(a){
    CRED.hash(String(a.pw),function(rec){
      if(rec)made[a.id]=rec;
      if(++n<todo.length)return;
      /* 途中で編集されていても困らないように、保存し直す直前にもう一度読み直します。 */
      var cur=staffAccounts(),ch=false;
      cur.forEach(function(x){if(made[x.id]&&!x.pwh){x.pwh=made[x.id];delete x.pw;ch=true;}});
      if(ch)stSet('staffAccounts',cur);
    });
  });
}

function recDeepLink(){
  var m=location.search.match(/[?&]rec=([^&]+)/);if(!m)return null;
  var t=decodeURIComponent(m[1]);
  var d=(location.search.match(/[?&]date=([^&]+)/)||[])[1];
  return {type:t,date:d?decodeURIComponent(d):'',scan:/[?&]scan=1/.test(location.search)};
}
function dmDeepLink(){var m=location.search.match(/[?&]dm=(\d+)/);return m?+m[1]:null;}
function staffBoot(){
  try{autoSnapshot();}catch(e){}
  /* 平文のまま残っているパスワードを、ハッシュへ置き換えます（ログインには影響しません）。 */
  try{staffCredSweep();}catch(e){}
  if(API.enabled()){
    if(!API.online()){showStaffLogin();return;}
    var su=serverUser();
    if(su){
      /* サーバのアカウントを、画面の権限判定に使う */
      var accs=staffAccounts(),hit=accs.filter(function(a){return String(a.loginId).toLowerCase()===String(su.loginId).toLowerCase();})[0];
      /* 本人確認はサーバ側で済んでいるので、こちらにはパスワードを持たせません
         （持たせないことで、この控えを使った端末内ログインができなくなります）。 */
      if(!hit){hit={id:Date.now(),loginId:su.loginId,name:su.name,role:su.role,server:true};accs.push(hit);stSet('staffAccounts',accs);}
      else{hit.name=su.name;hit.role=su.role;stSet('staffAccounts',accs);}
      sessionStorage.setItem('cocoas_staffSession',hit.id);
    }
    SYNC.pull().catch(function(){});
  }
  if(!currentStaff()){showStaffLogin();return;}
  applyPerms();try{initSyncBar();}catch(e){}
  try{IDLE.start();}catch(e){}
  var dl=dmDeepLink(),rl=recDeepLink();
  if(rl&&canView(recPageOf(rl.type))){
    recType=rl.type;
    if(rl.date){
      if(/^\d{4}-\d{2}$/.test(rl.date)){
        /* 月そのものを見るのは身体測定だけ。ほかの記録で recMonth を動かすと、
           開いてもいない身体測定の月が静かに変わってしまう */
        if(rl.type==='身体測定')recMonth=rl.date;
        /* 安全点検の取り込み先の月は画面の日付で決まるので、その月の1日を選んでおく */
        else if(rl.type==='安全点検')recDate=rl.date+'-01';
      }
      else if(/^\d{4}-\d{2}-\d{2}$/.test(rl.date))recDate=rl.date;
    }
    go(recPageOf(rl.type));
    setTimeout(function(){
      if(!rl.scan)return;
      var f=document.getElementById('scanFile');
      if(f){f.click();return;}
      /* 以前に印刷した用紙のQRなど、取り込みに対応していない記録のときに無反応にならないようにする */
      if(typeof toastAI==='function')toastAI('この記録は紙の取り込みに対応していません。画面から入力してください。');
    },300);
  }
  else if(dl&&canView('dm')){dmSel=dl;go('dm');}else go(canView('home')?'home':'dashboard');
  if(typeof initAI==='function')initAI();
}

  }

/* ========== 保護者DM（園 ⇄ 保護者の個別メッセージ） ==========
   家庭（園児）ごとに1スレッド。送信すると相手に「通知メール」が飛び、
   本文に返信用URLが入る想定で設計（実送信はバックエンド接続後）。
   データ: dmThreads = { childId: {messages:[{id,from:'staff'|'parent',by,text,at,readByStaff,readByParent}]} } */
var dmSel=null;
function dmStore(){return stGet('dmThreads',{});}
function dmSaveAll(t){stSet('dmThreads',t);}
function dmThread(id){var t=dmStore();return t[id]||{messages:[]};}
function dmBaseUrl(){var u=location.href.split('?')[0];return u.replace(/[^\/]*$/,'');}
function dmNow(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function dmUnreadStaff(id){return dmThread(id).messages.filter(function(m){return m.from==='parent'&&!m.readByStaff;}).length;}
function dmUnreadTotal(){var n=0;enrolled().forEach(function(c){n+=dmUnreadStaff(c.id);});return n;}
function dmMarkReadStaff(id){var t=dmStore();if(!t[id])return;t[id].messages.forEach(function(m){if(m.from==='parent')m.readByStaff=true;});dmSaveAll(t);}
function dmPost(childId,from,by,text){
  var t=dmStore();if(!t[childId])t[childId]={messages:[]};
  t[childId].messages.push({id:Date.now()+Math.floor(Math.random()*1000),from:from,by:by,text:text,at:dmNow(),readByStaff:from==='staff',readByParent:from==='parent'});
  dmSaveAll(t);
  return t[childId].messages[t[childId].messages.length-1];
}
/* 通知メール（返信URL付き）— 実送信はバックエンド接続後。いまは送信履歴に記録して可視化 */
function dmNotify(childId,msg){
  var c=DB.contacts.filter(function(x){return x.id===childId;})[0];if(!c)return;
  var h=DB.history;
  if(msg.from==='staff'){
    h.push({date:todayISO(),time:msg.at.slice(5),tpl:'DM通知（保護者へ）',to:c.name+' 様',email:c.email,from:SET.sender,
      subject:'【'+SET.school+'】'+(msg.by||'担当')+'よりメッセージが届いています',
      body:c.name+' 様\n\n'+SET.school+' の '+(msg.by||'担当')+' より、'+childName(c)+'さんについてメッセージが届いています。\n\n----------\n'+msg.text+'\n----------\n\n下記より内容の確認・ご返信をお願いいたします。\n'+dmBaseUrl()+'parent.html?dm='+childId+'\n\n'+SET.school});
  }else{
    h.push({date:todayISO(),time:msg.at.slice(5),tpl:'DM通知（園へ）',to:SET.school,email:SET.sender,from:c.email,
      subject:'【DM】'+c.name+' 様（'+childName(c)+'）よりメッセージが届いています',
      body:c.name+' 様よりメッセージが届いています。\n\n----------\n'+msg.text+'\n----------\n\n下記より内容の確認・ご返信をお願いいたします。\n'+dmBaseUrl()+'index.html?dm='+childId});
  }
  DB.history=h;
}

      +kids.map(function(c){var t=dmThread(c.id);var last=t.messages[t.messages.length-1];var un=dmUnreadStaff(c.id);var on=c.id===dmSel;

          +'<div style="display:flex;align-items:center;gap:6px;"><span style="font-weight:600;font-size:13px;flex:1;">'+esc(childName(c))+'</span>'+(un?'<span style="background:#E24B4A;color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:700;">'+un+'</span>':'')+'</div>'
          +'<div style="font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(last?esc(last.text.slice(0,22)):'メッセージはまだありません')+'</div></div>';}).join('')
    +'</div>'
    +'<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;"><h3 style="margin:0;flex:1;">'+ic('mail')+esc(childName(cur))+'（'+esc(cur.name)+' 様）</h3><span class="muted" style="font-size:11.5px;">'+esc(cur.email)+'</span></div>'
      +'<div class="muted" style="margin-bottom:10px;font-size:12px;">送信すると保護者へ<b>通知メール（返信URL付き）</b>が届き、保護者ページのメッセージに表示されます。</div>'
      +'<div id="dmLog" style="max-height:380px;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;">'
        +(th.messages.length?th.messages.map(function(m){var mine=m.from==='staff';

            +'<div style="padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.6;white-space:pre-wrap;'+(mine?'background:var(--teal);color:#fff;border-bottom-right-radius:4px;':'background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;')+'">'+esc(m.text)+'</div></div>';}).join('')
          :'<div class="empty">まだメッセージはありません</div>')
      +'</div>'
      +'<div style="display:flex;gap:8px;align-items:flex-end;margin-top:12px;flex-wrap:wrap;">'
        +'<div class="field" style="margin:0;width:150px;"><label style="font-size:11.5px;">担当</label><select id="dmBy">'+staffNames.map(function(n){return '<option'+(n===defBy?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select></div>'
        +'<div class="field" style="margin:0;flex:1;min-width:220px;"><label style="font-size:11.5px;">メッセージ（自由入力）</label><textarea id="dmText" rows="3" placeholder="例：本日は園庭で元気に遊んでいました。お迎えの際に少しお話しさせてください。"></textarea></div>'
        +'<button class="btn btn-primary" id="dmSend">'+ic('send')+'送信</button></div>'
      +'<div id="dmMsg" class="muted" style="margin-top:8px;font-size:12px;"></div></div>'
    +'</div>';
  s.querySelectorAll('[data-dmk]').forEach(function(b){b.onclick=function(){dmSel=+b.getAttribute('data-dmk');dmMarkReadStaff(dmSel);renderDM();};});
  dmMarkReadStaff(dmSel);
  var log=$('#dmLog');if(log)log.scrollTop=log.scrollHeight;
  $('#dmSend').onclick=function(){
    var tx=$('#dmText').value.trim();if(!tx){alert('メッセージを入力してください');return;}
    var m=dmPost(dmSel,'staff',$('#dmBy').value,tx);dmNotify(dmSel,m);
    $('#dmText').value='';renderDM();
    $('#dmMsg').innerHTML='<span style="color:#0B5F8F;font-weight:600;">送信しました。保護者へ通知メール（返信URL付き）を送信しました。</span>';
  };
  var nav=$('#navDM');if(nav){var un=dmUnreadTotal();nav.textContent=un||'';nav.style.display=un?'':'none';}
}

/* ========== 体験結果報告 ==========
   体験を担当した先生（一般アカウントでも可）が報告を入力すると、
   ・連絡先（リード）の進捗・懸念・次回アクションへ自動反映
   ・生徒台帳（一般は閲覧不可）にも お子様情報・ヒアリング内容を自動で引き継ぎ
   ・LINE共有用のテキストも自動生成
   データ: trialReports = { leadId: {...} } */
var TR_RESULT=['入園希望（申込予定）','検討中','長期検討','再体験・見学希望','見送り（NG）'];
var TR_TEMP=['5（とても高い）','4（高い）','3（普通）','2（低い）','1（かなり低い）'];
var TR_FOCUS=['どちらも','英語重視','保育重視','不明'];
var TR_JOIN=['父','母','子','祖父母','その他'];
function trReports(){return stGet('trialReports',{});}
function trGet(id){return trReports()[id]||null;}
function trSave(id,r){var a=trReports();a[id]=r;stSet('trialReports',a);}
function trStatusFrom(r){
  var t=parseInt(String(r.temp||'3'),10);
  if(r.result==='入園希望（申込予定）')return '🔥入園見込み';
  if(r.result==='見送り（NG）')return 'NG';
  if(r.result==='長期検討')return '長期見込み';
  if(r.result==='検討中')return t>=4?'🔥入園見込み':'体験後 検討中';
  return '体験後 検討中';
}
/* 報告内容を連絡先・生徒台帳へ反映（一般が入力しても、見えない場所まで届く） */
function trApply(id,r){
  var arr=DB.contacts,hit=false;
  arr=arr.map(function(c){
    if(c.id!==id)return c;
    hit=true;
    c.child=r.child||c.child;
    c.dob=r.dob||c.dob;
    c.date=r.trialDate||c.date;
    c.trialBy=r.by||c.trialBy;
    if(r.course)c.wishKlass=(/kinder/i.test(r.course)?'Kinder':(/pre/i.test(r.course)?'Pre':c.wishKlass));
    if(c.kind==='lead'){
      c.status=trStatusFrom(r);
      var cons=[];if(r.price&&r.price!=='特になし')cons.push('料金：'+r.price);if(r.other)cons.push('他社検討：'+r.other);
      if(cons.length)c.concerns=cons.join(' ／ ');
      if(r.nextDate)c.nextAction=r.nextDate;
      else if(r.replyBy)c.nextAction=/^\d{4}-\d{2}-\d{2}$/.test(r.replyBy)?r.replyBy:c.nextAction;
      var act=r.nextAct||r.hqAction||'';
      if(act||r.chaseBy){c.chase=c.chase||{};if(!r.chaseBy||r.chaseBy==='本部')c.chase.honbu=true;
        c.chaseNote=[r.chaseBy?'後追い：'+r.chaseBy:'',act].filter(Boolean).join(' / ');}
      if(r.wishTime)c.note=[c.note,'入園希望時期：'+r.wishTime].filter(Boolean).join(' / ');
    }
    return c;
  });
  if(hit)DB.contacts=arr;
  /* 生徒台帳（管理者のみ閲覧）にも引き継ぎ。入園後そのまま園児情報として使える */
  if(typeof spSet==='function'&&typeof spStore==='function'){
    var p=spStore()[id]||{};
    if(r.kana){var kn=r.kana.split(/[\s　]+/);p.lastKana=p.lastKana||kn[0]||'';p.firstKana=p.firstKana||kn[1]||'';}
    if(r.dob)p.dob=r.dob;
    if(r.child)p.firstName=p.firstName||String(r.child).replace(/ちゃん|くん/g,'');
    var memo=['【体験結果】'+(r.result||''),r.wishTime?'入園希望時期：'+r.wishTime:'',r.question?'ご質問：'+r.question:'',r.childState?'本人の様子：'+r.childState:'',r.extra?'追加情報：'+r.extra:''].filter(Boolean).join('\n');
    p.parentNote=[p.parentNote,memo].filter(Boolean).join('\n');
    spSet(id,p);
  }
}
function trText(c,r){
  var d=(r.trialDate||'').slice(5).replace('-','/');
  return d+'　'+(SET.school||'')+'　'+(r.course||'')+'\n'
    +'体験日：'+(r.trialDate?fmt(r.trialDate):'')+'\n体験担当：'+(r.by||'')+'\n'
    +'お子様名前：'+(r.child||'')+(r.kana?'（'+r.kana+'）':'')+'\n生年月日：'+(r.dob||'')+'\n'
    +'対象校舎：'+(r.campus||SET.school||'')+'\n体験コース：'+(r.course||'')+'\n参加者：'+((r.join||[]).join('・')||'')+'\n\n'
    +'・体験結果\n'+(r.result||'')+'\n\n・体験中の様子\n入園希望時期：'+(r.wishTime||'')+'\n入園温度感：'+(String(r.temp||'').charAt(0))+'\n\n'
    +'料金への反応：'+(r.price||'')+'\n\n英語重視 or 保育重視：'+(r.focus||'')+'\n\n他社検討：'+(r.other||'')+'\n\n'
    +'質問内容：\n'+(r.question||'')+'\n\n本人の様子：\n'+(r.childState||'')+'\n\n追加情報：\n'+(r.extra||'')+'\n\n'
    +'いつまでに回答がもらえるのか：\n'+(r.replyBy||'特になし')+'\n\n'
    +'後追い担当：'+(r.chaseBy||'未定')+'\n次回アクション：'+(r.nextAct||r.hqAction||'')+(r.nextDate?'（'+fmt(r.nextDate)+'）':'')+'\n\n'
    +'・'+(SET.crmName||'キントーン')+'入力\n'+(r.kintone||'未');
}
/* 一覧に出す「次回アクション」：時期・後追い担当・内容 */
function trNext(c,r){
  r=r||{};
  var when=r.nextDate||'';
  if(!when&&/^\d{4}-\d{2}-\d{2}$/.test(r.replyBy||''))when=r.replyBy;
  if(!when&&c&&c.nextAction)when=c.nextAction;
  if(/^\d{4}-\d{2}-\d{2}$/.test(when))when=fmt(when);
  else if(!when&&r.replyBy&&r.replyBy!=='特になし')when=r.replyBy;
  return {when:when||'',who:r.chaseBy||'',what:r.nextAct||r.hqAction||''};
}

      :'<tr><td colspan="7" class="empty">体験の予定がありません</td></tr>')

  $('#trNew').onclick=function(){trialModal(null);};

/* ══ 生徒情報（先生用・閲覧のみ）════════════════
   Remiさんの依頼（修正依頼シート F7）。

   「生徒台帳は、先生にいじって欲しい部分じゃないんだよね」
   というご指摘を受けて、先生が見るだけの画面を分けた。
   ここには編集できるところを一切置かない。

   出すもの
   ・生徒情報から … 園児名／生年月日／クラス／通園曜日／コースプラン／ランチ／ロングステイ
   ・生徒台帳から … 緊急連絡先／健康情報 */
var kidsKlass='すべて', kidsQ='';

function kidsHealthText(p){
  if(!p)return '';
  var a=[];
  if(p.allergy&&p.allergy!=='なし')a.push('アレルギー：'+p.allergy);
  if(p.history==='有')a.push('既往症あり');
  if(p.febrile==='有')a.push('熱性けいれんの既往');
  if(p.respiratory==='有')a.push('呼吸器の既往');
  if(p.otherDx)a.push(p.otherDx);
  if(p.normalTemp)a.push('平熱 '+p.normalTemp+'℃');
  if(p.doctor&&p.doctor!=='なし')a.push('かかりつけ：'+p.doctor);
  return a.join(' ／ ');
}
function kidsEmgList(p){
  if(!p)return [];
  var a=[];
  if(p.emg1)a.push({rel:p.emg1rel||'第1',tel:p.emg1});
  if(p.emg2)a.push({rel:p.emg2rel||'第2',tel:p.emg2});
  if(p.telHome)a.push({rel:'自宅',tel:p.telHome});
  return a;
}
function kidsRows(){
  var sp=spStore();
  return enrolled().filter(function(c){
    if(kidsKlass!=='すべて'&&c.klass!==kidsKlass)return false;
    if(kidsQ){
      var q=kidsQ.toLowerCase();
      var hay=(childFullName(c)+' '+(c.klass||'')+' '+kidsHealthText(sp[c.id])).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  }).sort(function(a,b){
    return String(a.klass||'').localeCompare(String(b.klass||''),'ja')
      || String(a.dob||'').localeCompare(String(b.dob||''));
  });
}

/* ========== 生徒情報（契約・オプション） ==========
   園児ごとのコースプラン／ランチ／ロングステイ（延長）／教育関連費などを管理し、請求書に自動反映する。
   データ: enrollOptions = { childId:{plan,lunchN,extN,material,admission,note} } */
/* 対象月に、その曜日が何回あるかを数える（連絡先の曜日設定から回数を自動計算） */
function monthWeekdayCount(mk,label){
  var y=+mk.split('-')[0],m=+mk.split('-')[1],dim=new Date(y,m,0).getDate(),idx=WEEK5.indexOf(label)+1,n=0;
  for(var d=1;d<=dim;d++){if(new Date(y,m-1,d).getDay()===idx)n++;}
  return n;
}
function dayOptCount(c,key,mk){
  var dop=dayOptsOf(c),n=0;
  WEEK5.forEach(function(d){if(dop[d]&&dop[d].go&&dop[d][key])n+=monthWeekdayCount(mk,d);});
  return n;
}
function enrOpts(){return stGet('enrollOptions',{});}
function enrSaveAll(o){stSet('enrollOptions',o);}
function enrOf(c,mk){
  mk=mk||todayISO().slice(0,7);
  var saved=enrOpts()[c.id]||{},P=SET.pricing||{plans:{}};
  var dop=dayOptsOf(c),days=dayCount(dop);
  var plan=saved.plan||Object.keys(P.plans||{}).filter(function(k){return k==='週'+days;})[0]||'週3';
  /* ランチ・ロングは「あり／なし」。回数は連絡先の曜日設定から自動計算 */
  var lunchOn=(saved.lunchOn!=null)?!!saved.lunchOn:dayCount(dop,'lunch')>0;
  var extOn=(saved.extOn!=null)?!!saved.extOn:dayCount(dop,'long')>0;
  return {plan:plan,lunchOn:lunchOn,extOn:extOn,
    lunchN:lunchOn?dayOptCount(c,'lunch',mk):0,
    extN:extOn?dayOptCount(c,'long',mk):0,
    material:!!saved.material,admission:!!saved.admission,note:saved.note||''};
}
function enrSet(id,obj){var o=enrOpts();o[id]=obj;enrSaveAll(o);}
function enrMonthly(o){
  var P=SET.pricing||{plans:{},lunch:0,extended:0,material:0,admission:0};
  var t=(P.plans||{})[o.plan]||0;
  t+=(+o.lunchN||0)*(P.lunch||0);
  t+=(+o.extN||0)*(P.extended||0);
  if(o.material)t+=(P.material||0);
  return t;
}

    +'<div class="scrollx"><table><thead><tr><th>園児</th><th>クラス</th><th>通園曜日</th><th>コースプラン</th><th>ランチ</th><th>ロングステイ</th><th>教育関連費</th><th style="text-align:right;">月額（自動）</th><th></th></tr></thead><tbody>'
    +kids.map(function(c){var o=enrOf(c,mk),dop=dayOptsOf(c);
      function optCell(key,onKey,cnt){
        var days=WEEK5.filter(function(d){return dop[d]&&dop[d].go&&dop[d][key];});
        return '<td><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;"><input type="checkbox" data-en="'+esc(c.id+'|'+onKey)+'"'+(o[onKey]?' checked':'')+' style="width:auto;">あり</label>'
          +'<div class="row-sub" style="font-size:11px;">'+(o[onKey]?(days.length?days.join('・')+'　'+cnt+'回/月':'<span style="color:#A32D2D;">曜日が未設定</span>'):'なし')+'</div></td>';

        +optCell('lunch','lunchOn',o.lunchN)
        +optCell('long','extOn',o.extN)
        +'<td style="text-align:center;"><input type="checkbox" data-en="'+c.id+'|material"'+(o.material?' checked':'')+' style="width:auto;"></td>'
        +'<td style="text-align:right;font-weight:600;" id="enTot'+c.id+'">'+yen(enrMonthly(o))+'</td>'
        +'<td><button class="btn btn-sm" data-eninv="'+esc(c.id)+'">'+ic('yen')+'請求書</button></td></tr>';}).join('')
    +'</tbody></table></div>'
    +'<div class="muted" style="margin-top:10px;font-size:12px;">※「請求書」を押すと、その園児の内容で請求書作成が開きます（金額は自動計算されます）。</div></div>';
  s.querySelectorAll('[data-en]').forEach(function(el){
    el.onchange=function(){
      var p=el.getAttribute('data-en').split('|'),id=+p[0],key=p[1];
      var c=kids.filter(function(x){return x.id===id;})[0];var o=enrOf(c);
      o[key]=(el.type==='checkbox')?el.checked:(el.type==='number'?(+el.value||0):el.value);
      enrSet(id,{plan:o.plan,lunchOn:o.lunchOn,extOn:o.extOn,material:o.material,admission:o.admission,note:o.note});

  s.querySelectorAll('[data-eninv]').forEach(function(b){b.onclick=function(){
    var id=+b.getAttribute('data-eninv');

  };});

/* ========== 請求管理（作成 → 発行 → 送付 → 入金確認を一本の流れで） ==========
   金額は「生徒情報（契約・オプション）」＋「設定→料金設定」から自動計算。月ごとに個別調整も可能。
   データ: invoices = { 'YYYY-MM': { childId:{plan,lunchN,extN,material,admission,discount,discountNote,due,status,issuedAt,sentAt,paidAt,total} } } */
var invMonth=null,INV_STATUS=['未発行','発行済','送付済','入金済'];
function invStatusColor(s){return {'未発行':{bg:'#F1EFE8',fg:'#5F5E5A'},'発行済':{bg:'#E6F1FB',fg:'#123E6B'},'送付済':{bg:'#FAEEDA',fg:'#854F0B'},'入金済':{bg:'#EAF3DE',fg:'#27500A'}}[s]||{bg:'#F1EFE8',fg:'#5F5E5A'};}
function invAll(){return stGet('invoices',{});}
function invSaveAll(o){stSet('invoices',o);}
function invMonthCur(){if(!invMonth){var d=addDays(0),m=d.getMonth()+2,y=d.getFullYear();if(m>12){m=1;y++;}invMonth=y+'-'+pad(m);}return invMonth;}
function invRow(mk,c){
  var all=invAll(),r=((all[mk]||{})[c.id]);
  if(r)return r;
  var o=(typeof enrOf==='function')?enrOf(c,mk):{plan:'週3',lunchN:0,extN:0,material:false};
  var always=(((SET.pricing||{}).options)||[]).filter(function(x){return x.always;}).map(function(x){return {name:x.name,qty:1,price:+x.price||0};});
  return {plan:o.plan,lunchN:+o.lunchN||0,extN:+o.extN||0,material:!!o.material,admission:!!o.admission,extras:always,discount:0,discountNote:'',due:'',status:'未発行',issuedAt:'',sentAt:'',paidAt:''};
}
function invSaveRow(mk,id,r){var all=invAll();all[mk]=all[mk]||{};all[mk][id]=r;invSaveAll(all);}
function invLines(r){
  var P=SET.pricing||{plans:{},lunch:0,extended:0,material:0,admission:0};
  var L=[];
  if(r.admission)L.push(['入園金',P.admission||0,1,P.admission||0]);
  L.push([(r.plan||'')+' 保育料',(P.plans||{})[r.plan]||0,1,(P.plans||{})[r.plan]||0]);
  if(r.material)L.push(['教育関連費',P.material||0,1,P.material||0]);
  if(+r.lunchN>0)L.push(['ランチ（'+r.lunchN+'回）',P.lunch||0,+r.lunchN,(P.lunch||0)*(+r.lunchN)]);
  if(+r.extN>0)L.push(['ロングステイ（'+r.extN+'回）',P.extended||0,+r.extN,(P.extended||0)*(+r.extN)]);
  (r.extras||[]).forEach(function(x){var q=(+x.qty||1),p=(+x.price||0);if(x.name&&p)L.push([x.name,p,q,p*q]);});
  if(+r.discount>0)L.push([(r.discountNote||'割引'),-(+r.discount),1,-(+r.discount)]);
  return L;
}
function invTotal(r){return invLines(r).reduce(function(a,x){return a+x[3];},0);}
function invHTML(mk,c,r){
  var L=invLines(r),tot=invTotal(r),ym=mk.split('-');
  var co=[SET.invCoName||SET.school||'',SET.invCoAddr||'',[SET.invCoTel?'TEL '+SET.invCoTel:'',SET.invCoMail||''].filter(Boolean).join('　'),SET.invCoRep?'代表者　'+SET.invCoRep:''].filter(Boolean);
  var head='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:10px;">'
    +'<div><div style="font-size:19px;font-weight:700;letter-spacing:.08em;">請求書</div>'
      +'<div style="font-size:12px;color:#555;margin-top:2px;">'+(+ym[1])+'月分 保育料　／　発行日 '+fmt(r.issuedAt||todayISO())+'</div></div>'
    +'<div style="text-align:right;font-size:11.5px;line-height:1.6;">'
      +(SET.invLogo?'<img src="'+SET.invLogo+'" alt="" style="max-width:150px;max-height:52px;object-fit:contain;display:block;margin:0 0 4px auto;">':'')
      +co.map(function(x){return esc(x);}).join('<br>')
      +(SET.invRegNo?'<br>登録番号　'+esc(SET.invRegNo):'')
    +'</div></div>';
  var to='<div style="border-bottom:1.5px solid #333;padding-bottom:4px;margin-bottom:10px;font-size:14px;font-weight:600;">'+esc(c.name)+' 様　<span style="font-size:12px;font-weight:400;color:#555;">（'+esc(childName(c))+'・'+esc(c.klass||'')+'）</span></div>';
  var greet=SET.invGreeting?'<div style="font-size:12px;line-height:1.8;margin-bottom:10px;white-space:pre-wrap;">'+esc(SET.invGreeting)+'</div>':'';
  var totalBox='<div style="margin:10px 0 12px;font-size:15px;font-weight:700;">ご請求金額　'+yen(tot)+'　<span style="font-size:11.5px;font-weight:400;color:#555;">（お支払期日：'+(r.due?fmt(r.due):'別途ご案内')+'）</span></div>';
  var table='<table><thead><tr><th>項目</th><th style="text-align:right;">単価</th><th style="text-align:right;">数量</th><th style="text-align:right;">金額</th></tr></thead><tbody>'
    +L.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td style="text-align:right;">'+yen(x[1])+'</td><td style="text-align:right;">'+x[2]+'</td><td style="text-align:right;">'+yen(x[3])+'</td></tr>';}).join('')
    +'<tr><td colspan="3" style="text-align:right;font-weight:600;">合計</td><td style="text-align:right;font-weight:600;">'+yen(tot)+'</td></tr></tbody></table>';
  var pay='<div style="margin-top:12px;font-size:12px;line-height:1.75;">'
    +(SET.invUseAgency
      ?'<b>【お支払先（収納代行）】</b><br>'+[SET.invAgencyName,SET.invAgencyAddr,SET.invAgencyTel?'TEL '+SET.invAgencyTel:'',SET.invAgencyBank].filter(Boolean).map(function(x){return esc(x);}).join('<br>')
      :'<b>【お振込先】</b><br>'+esc(SET.bankName||'')+' '+esc(SET.bankBranch||'')+' '+esc(SET.bankType||'')+' '+esc(SET.bankNo||'（設定で入力）')+' '+esc(SET.bankHolder||''))
    +'</div>';
  var foot=SET.invFooter?'<div style="margin-top:8px;font-size:11px;color:#555;line-height:1.7;white-space:pre-wrap;">'+esc(SET.invFooter)+'</div>':'';
  return head+to+greet+totalBox+table+pay+foot;
}
function invSend(mk,c,r){
  var tot=invTotal(r),ym=+mk.split('-')[1];
  var subj='【'+SET.school+'】'+ym+'月分 保育料 請求書のご案内';
  var body=c.name+' 様\n\nいつもお世話になっております。\n'+ym+'月分の保育料の請求書をお送りいたします。\n\n'
    +'お子様：'+childName(c)+'\n請求金額：'+yen(tot)+'\nお支払期日：'+(r.due?fmt(r.due):'（別途ご案内）')+'\n\n【内訳】\n'
    +invLines(r).map(function(x){return '・'+x[0]+'　'+yen(x[3]);}).join('\n')
    +'\n\n【お振込先】\n'+(SET.bankName||'')+' '+(SET.bankBranch||'')+' '+(SET.bankType||'')+' '+(SET.bankNo||'')+' '+(SET.bankHolder||'')
    +'\n※振込名義はお子様のお名前でお願いいたします。\n\n'+SET.school;
  var h=DB.history,now=new Date(),stamp=pad(now.getHours())+':'+pad(now.getMinutes());
  h.push({date:todayISO(),time:todayISO().slice(5).replace('-','/')+' '+stamp,tpl:'請求書（'+ym+'月分）',to:c.name+' 様',email:c.email,from:SET.sender,subject:subj,body:body});
  DB.history=h;
  r.status='送付済';r.sentAt=todayISO();invSaveRow(mk,c.id,r);
}
function renderBilling(){
  var mk=invMonthCur(),kids=enrolled(),s=$('section[data-page="billing"]');
  var rows=kids.map(function(c){return {c:c,r:invRow(mk,c)};});
  var sum=rows.reduce(function(a,x){return a+invTotal(x.r);},0);
  var cnt={};INV_STATUS.forEach(function(st){cnt[st]=rows.filter(function(x){return x.r.status===st;}).length;});
  var P=SET.pricing||{};
  s.innerHTML='<div class="card" style="margin-bottom:14px;">'+recHead('請求管理（'+mk.split('-')[0]+'年'+(+mk.split('-')[1])+'月分）',
      '<input type="month" id="ivMonth" value="'+esc(mk)+'" style="width:160px;">'
      +'<button class="btn btn-sm" id="ivIssueAll">'+ic('check')+'一括で発行</button>'
      +'<button class="btn btn-sm btn-primary" id="ivSendAll">'+ic('send')+'発行済をまとめて送付</button>'
      +'<button class="btn btn-sm" id="ivPrintAll">'+ic('printer')+'全員分を印刷</button>')
    +'<div class="muted" style="margin-bottom:10px;">金額は「生徒情報（契約・オプション）」と「設定 → 料金設定」から自動計算されます。行の「明細」で今月だけの調整（回数・教育関連費・割引・支払期日）ができます。<br>流れ：<b>①内容を確認 → ②発行 → ③送付（メール＋保護者ページ） → ④入金確認</b></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'+INV_STATUS.map(function(st){var col=invStatusColor(st);return '<span class="tag" style="background:'+col.bg+';color:'+col.fg+';">'+st+' '+cnt[st]+'</span>';}).join('')
    +'<span style="flex:1;"></span><span style="font-weight:700;font-size:15px;">今月の請求合計 '+yen(sum)+'</span></div></div>'
    +'<div class="card"><div class="scrollx"><table><thead><tr><th>園児</th><th>クラス</th><th>プラン</th><th style="text-align:right;">ランチ</th><th style="text-align:right;">ロング</th><th style="text-align:right;">請求額</th><th>発行日</th><th>支払期日</th><th>入金日</th><th>状態</th><th style="width:230px;"></th></tr></thead><tbody>'
    +(rows.length?rows.map(function(x){var col=invStatusColor(x.r.status);
      return '<tr><td class="row-name">'+esc(childName(x.c))+'<div class="row-sub">'+esc(x.c.name)+'</div></td><td>'+esc(x.c.klass||'')+'</td><td>'+esc(x.r.plan||'')+'</td>'
        +'<td style="text-align:right;">'+(+x.r.lunchN||0)+'回</td><td style="text-align:right;">'+(+x.r.extN||0)+'回</td>'
        +'<td style="text-align:right;font-weight:600;">'+yen(invTotal(x.r))+'</td>'
        +'<td class="row-sub">'+(x.r.issuedAt?fmt(x.r.issuedAt):'—')+'</td>'
        +'<td class="row-sub">'+(x.r.due?fmt(x.r.due):'—')+'</td>'
        +'<td class="row-sub">'+(x.r.paidAt?fmt(x.r.paidAt):'—')+'</td>'
        +'<td><span class="pill" style="background:'+col.bg+';color:'+col.fg+';">'+x.r.status+'</span></td>'
        +'<td style="white-space:nowrap;text-align:right;">'
          +'<button class="btn btn-sm" data-ivedit="'+esc(x.c.id)+'">明細</button> '
          +(x.r.status==='未発行'?'<button class="btn btn-sm" data-ivissue="'+esc(x.c.id)+'">発行</button> ':'')
          +(x.r.status==='発行済'||x.r.status==='送付済'?'<button class="btn btn-sm btn-primary" data-ivsend="'+esc(x.c.id)+'">'+(x.r.status==='送付済'?'再送':'送付')+'</button> ':'')
          +(x.r.status==='送付済'?'<button class="btn btn-sm" data-ivpaid="'+esc(x.c.id)+'">入金済</button> ':'')
          +'<button class="btn btn-sm btn-ghost" data-ivprint="'+esc(x.c.id)+'">'+ic('printer')+'</button>'
        +'</td></tr>';}).join(''):'<tr><td colspan="11" class="empty">在園児が登録されていません</td></tr>')
    +'</tbody></table></div></div>';
  $('#ivMonth').onchange=function(e){invMonth=e.target.value;renderBilling();};
  $('#ivIssueAll').onclick=function(){
    if(!confirm(mk.split('-')[0]+'年'+(+mk.split('-')[1])+'月分の請求書を、未発行の園児について一括で発行します。よろしいですか？'))return;
    var n=0;rows.forEach(function(x){if(x.r.status==='未発行'){x.r.status='発行済';x.r.issuedAt=todayISO();x.r.total=invTotal(x.r);invSaveRow(mk,x.c.id,x.r);n++;}});
    alert(n+'件を発行しました。内容を確認のうえ「送付」してください。');renderBilling();
  };
  $('#ivSendAll').onclick=function(){
    var t=rows.filter(function(x){return x.r.status==='発行済';});
    if(!t.length){alert('送付できる（発行済の）請求書がありません。先に「発行」してください。');return;}
    if(!confirm(t.length+'件の請求書を保護者へ送付します。よろしいですか？'))return;
    t.forEach(function(x){invSend(mk,x.c,x.r);});
    alert(t.length+'件を送付しました。保護者ページの「請求」でも確認できます。');renderBilling();
  };
  $('#ivPrintAll').onclick=function(){
    var body=rows.map(function(x){return invHTML(mk,x.c,x.r);}).join('<div style="page-break-after:always;"></div>');
    printDoc('保育料 請求書（'+mk+'）',body);
  };
  s.querySelectorAll('[data-ivedit]').forEach(function(b){b.onclick=function(){invModal(mk,+b.getAttribute('data-ivedit'));};});
  s.querySelectorAll('[data-ivissue]').forEach(function(b){b.onclick=function(){var id=+b.getAttribute('data-ivissue'),r=invRow(mk,{id:id});var c=kids.filter(function(k){return k.id===id;})[0];r=invRow(mk,c);r.status='発行済';r.issuedAt=todayISO();r.total=invTotal(r);invSaveRow(mk,id,r);renderBilling();};});
  s.querySelectorAll('[data-ivsend]').forEach(function(b){b.onclick=function(){var id=+b.getAttribute('data-ivsend'),c=kids.filter(function(k){return k.id===id;})[0],r=invRow(mk,c);
    if(!confirm(childName(c)+'の保護者へ請求書を送付します。よろしいですか？'))return;invSend(mk,c,r);renderBilling();};});
  s.querySelectorAll('[data-ivpaid]').forEach(function(b){b.onclick=function(){var id=+b.getAttribute('data-ivpaid'),c=kids.filter(function(k){return k.id===id;})[0],r=invRow(mk,c);r.status='入金済';r.paidAt=todayISO();invSaveRow(mk,id,r);renderBilling();};});
  s.querySelectorAll('[data-ivprint]').forEach(function(b){b.onclick=function(){var id=+b.getAttribute('data-ivprint'),c=kids.filter(function(k){return k.id===id;})[0],r=invRow(mk,c);printDoc('保育料 請求書（'+mk+'・'+childName(c)+'）',invHTML(mk,c,r));};});
}
function invModal(mk,id){
  var c=enrolled().filter(function(x){return x.id===id;})[0];if(!c)return;
  var r=JSON.parse(JSON.stringify(invRow(mk,c)));
  var P=SET.pricing||{plans:{}};
  var m=el('div',{class:'modal-bg'});$('#modalRoot').appendChild(m);
  m.addEventListener('click',function(e){if(e.target===m)m.remove();});
  function body(){
    return '<div class="modal" style="width:720px;"><h2>'+esc(childName(c))+'　'+(+mk.split('-')[1])+'月分の請求内容</h2>'
      +'<div class="grid" style="grid-template-columns:1fr 1fr;">'
        +'<div class="field"><label>コースプラン</label><select id="im_plan">'+Object.keys(P.plans||{}).map(function(k){return '<option'+(k===r.plan?' selected':'')+'>'+k+'</option>';}).join('')+'</select></div>'
        +'<div class="field"><label>お支払期日</label><input type="date" id="im_due" value="'+esc((r.due||''))+'"></div></div>'
      +'<div class="grid" style="grid-template-columns:1fr 1fr;">'
        +'<div class="field"><label>ランチ回数</label><input type="number" min="0" id="im_lunch" value="'+esc((+r.lunchN||0))+'"></div>'
        +'<div class="field"><label>ロングステイ回数</label><input type="number" min="0" id="im_ext" value="'+esc((+r.extN||0))+'"></div></div>'
      +'<div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;">'
        +'<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;"><input type="checkbox" id="im_mat" style="width:auto;"'+(r.material?' checked':'')+'>教育関連費</label>'
        +'<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;"><input type="checkbox" id="im_adm" style="width:auto;"'+(r.admission?' checked':'')+'>入園金（初回）</label></div>'
      +'<div class="grid" style="grid-template-columns:1fr 2fr;">'
        +'<div class="field"><label>割引額</label><input type="number" min="0" id="im_disc" value="'+esc((+r.discount||0))+'"></div>'
        +'<div class="field"><label>割引の名目</label><input id="im_discn" value="'+String(r.discountNote||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" placeholder="例：兄弟割引"></div></div>'
      +'<div class="field"><label>その他の項目（プラン外のオプション・実費など）</label><div id="im_extras"></div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;">'
      +'<button type="button" class="btn btn-sm" id="im_addExtra">'+ic('plus')+'自由入力で追加</button>'
      +(((SET.pricing||{}).options||[]).length?'<span class="muted" style="font-size:11.5px;">登録済み：</span>'+(((SET.pricing||{}).options)||[]).map(function(o,i){return '<button type="button" class="btn btn-sm btn-ghost" data-imopt="'+esc(i)+'" style="border:1px solid var(--teal-l);color:var(--teal-d);">'+esc(o.name)+' '+yen(o.price)+'</button>';}).join(''):'<span class="muted" style="font-size:11.5px;">（設定→料金設定でよく使う項目を登録できます）</span>')
      +'</div></div>'
      +'<label>プレビュー</label><div class="preview" id="im_prev" style="max-height:280px;">'+invHTML(mk,c,r)+'</div>'
      +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;">'
        +'<button class="btn" id="im_cancel">閉じる</button>'
        +'<button class="btn" id="im_print">'+ic('printer')+'印刷</button>'
        +'<button class="btn btn-primary" id="im_save">'+ic('check')+'保存</button>'
        +'<button class="btn btn-primary" id="im_send">'+ic('send')+'保存して送付</button></div></div>';
  }
  m.innerHTML=body();
  function readExtras(){
    var out=[];
    m.querySelectorAll('[data-exrow]').forEach(function(row){
      var i=row.getAttribute('data-exrow');
      out.push({name:m.querySelector('[data-ex="'+i+'|name"]').value,qty:+m.querySelector('[data-ex="'+i+'|qty"]').value||1,price:+m.querySelector('[data-ex="'+i+'|price"]').value||0});
    });
    return out;
  }
  function read(){r.plan=$('#im_plan').value;r.due=$('#im_due').value;r.lunchN=+$('#im_lunch').value||0;r.extN=+$('#im_ext').value||0;r.material=$('#im_mat').checked;r.admission=$('#im_adm').checked;r.discount=+$('#im_disc').value||0;r.discountNote=$('#im_discn').value;r.extras=readExtras();}
  function upd(){read();$('#im_prev').innerHTML=invHTML(mk,c,r);}
  function renderExtras(){
    var box=$('#im_extras');
    box.innerHTML=(r.extras||[]).map(function(x,i){
      return '<div data-exrow="'+esc(i)+'" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">'
        +'<input data-ex="'+i+'|name" value="'+String(x.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" placeholder="項目名（例：課外レッスン・遠足費）" style="flex:1;min-width:180px;">'
        +'<input type="number" data-ex="'+i+'|price" value="'+esc((+x.price||0))+'" placeholder="単価" style="width:110px;">'
        +'<span class="muted" style="font-size:12px;">×</span>'
        +'<input type="number" min="1" data-ex="'+i+'|qty" value="'+esc((+x.qty||1))+'" style="width:70px;">'
        +'<button type="button" class="btn btn-sm btn-ghost" data-exdel="'+esc(i)+'">'+ic('trash')+'</button></div>';
    }).join('')||'<div class="muted" style="font-size:12px;margin-bottom:6px;">追加した項目はここに表示されます（マイナス金額で値引きも可能）。</div>';
    box.querySelectorAll('[data-ex]').forEach(function(el2){el2.oninput=upd;el2.onchange=upd;});
    box.querySelectorAll('[data-exdel]').forEach(function(b){b.onclick=function(){read();r.extras.splice(+b.getAttribute('data-exdel'),1);renderExtras();upd();};});
  }
  renderExtras();
  $('#im_addExtra').onclick=function(){read();r.extras=(r.extras||[]).concat([{name:'',qty:1,price:0}]);renderExtras();upd();};
  m.querySelectorAll('[data-imopt]').forEach(function(b){b.onclick=function(){
    var o=((SET.pricing||{}).options||[])[+b.getAttribute('data-imopt')];if(!o)return;
    read();r.extras=(r.extras||[]).concat([{name:o.name,qty:1,price:+o.price||0}]);renderExtras();upd();
  };});
  ['im_plan','im_due','im_lunch','im_ext','im_mat','im_adm','im_disc','im_discn'].forEach(function(id){var el2=$('#'+id);el2.oninput=upd;el2.onchange=upd;});
  $('#im_cancel').onclick=function(){m.remove();};
  $('#im_print').onclick=function(){read();printDoc('保育料 請求書（'+mk+'・'+childName(c)+'）',invHTML(mk,c,r));};
  $('#im_save').onclick=function(){read();if(r.status==='未発行'){r.status='発行済';r.issuedAt=todayISO();}r.total=invTotal(r);invSaveRow(mk,id,r);m.remove();renderBilling();};
  $('#im_send').onclick=function(){read();if(!confirm(childName(c)+'の保護者へ請求書を送付します。よろしいですか？'))return;r.total=invTotal(r);invSaveRow(mk,id,r);invSend(mk,c,r);m.remove();renderBilling();};
}

/* ========== 経費管理（経費精算表・金種表） ==========
   実物様式に合わせて、月ごとの経費明細（科目別）と、実査時の金種表を作成・出力できる。
   データ: expenses = { 'YYYY-MM': {rows:[{date,payee,detail,slip,cat,amount}],by:'',approver:''} }
          cashCount = { 'YYYY-MM': {date,dept,counts:{},bookBalance,reasons:[{label,amount}],by,approver} } */
var EXP_CATS=['旅費交通費','通信費','消耗品費','雑費'];

/* 金種表の計算をひとまとめにする。呼ばれた時点の d と経費精算表から計算し直すので、
   描画時のローカル変数に古い値が閉じ込められない（印刷が古い数字になる退行の対策） */
function expCashCalc(mk,d){
  var base=+d.base||0;                /* 園に支給される経費（ベース） */
  var spend=expTotal(expGet(mk));     /* 当月の経費支出合計（経費精算表より） */
  var should=base-spend;              /* 帳簿上あるべき現金残高 */
  var manual=!!d.bookManual;          /* 帳簿を別につけている園は手入力もできる */
  var baseSet=base>0;                 /* 支給経費が未入力の月は、過不足を出さずに入力をお願いする */
  var calcOK=manual||baseSet;         /* 現金出納帳残高（Ⅱ）が決まるかどうか */
  var total=cashTotal(d),book=manual?(+d.bookBalance||0):should;
  var diff=total-book,rTotal=cashReasonTotal(d),unknown=diff-rTotal;
  return {total:total,base:base,spend:spend,should:should,book:book,diff:diff,
          rTotal:rTotal,unknown:unknown,manual:manual,baseSet:baseSet,calcOK:calcOK};
}
function expCash(mk){
  var d=cashGet(mk);
  function save(){cashSet(mk,d);}
  /* ここで受け取るのは「描画時点」の値だけ。以後は refresh() も印刷もその都度 expCashCalc を呼ぶ */
  var c0=expCashCalc(mk,d);
  var base=c0.base,spend=c0.spend,should=c0.should,manual=c0.manual,baseSet=c0.baseSet,calcOK=c0.calcOK;
  var total=c0.total,book=c0.book,diff=c0.diff,rTotal=c0.rTotal,unknown=c0.unknown;

      s+='現金出納帳残高（Ⅱ）を手で入力しているため、ここでは過不足を出しません。差異は下の「差異（Ⅰ-Ⅱ）現金過不足」の欄をご覧ください。';
      if(sh-bk!==0)s+='<br>あるべき残高 '+num(sh)+' 円　−　現金出納帳残高（Ⅱ）'+num(bk)+' 円　＝　<b>差 '+num(sh-bk)+' 円</b>';
    }else{

      +CASH_DENOMS.map(function(x,i){var n=+((d.counts||{})[x[0]])||0;var showKind=(i===0||i===4);
        return '<tr>'+(showKind?'<td rowspan="'+(i===0?4:6)+'">'+(i===0?'紙幣':'硬貨')+'</td>':'')+'<td style="text-align:right;">'+x[0].toLocaleString()+'</td><td style="text-align:center;">'+n+' 枚</td><td style="text-align:right;">'+(n?Number(x[0]*n).toLocaleString():'')+' 円</td></tr>';}).join('')
      +'<tr style="font-weight:700;"><td colspan="3" style="text-align:center;">合計（Ⅰ）</td><td style="text-align:right;">'+Number(total).toLocaleString()+' 円</td></tr></tbody></table>'
      +'<table style="max-width:480px;margin-top:10px;"><tbody>'
      +'<tr><th>支給経費（ベース）</th><td style="text-align:right;">'+(baseSet?Number(base).toLocaleString()+' 円':'（未入力）')+'</td></tr>'
      +'<tr><th>当月の経費支出合計</th><td style="text-align:right;">'+Number(spend).toLocaleString()+' 円</td></tr>'

/* ---------- 経費書類の保存メッセージと、経理部への送付（下書き作成） ---------- */
function expSavedMsg(sel){
  var m=$(sel);if(!m)return;
  m.textContent='保存しました';
  setTimeout(function(){var m2=$(sel);if(m2)m2.textContent='';},1800);
}
/* 経費精算表と金種表は一緒に提出する運用のため、文面には両方を入れる */
function expMailDraftMake(mk){
  var ex=expGet(mk),d=cashGet(mk);
  var y=mk.split('-')[0],mo=+mk.split('-')[1];
  var base=+d.base||0,spend=expTotal(ex),should=base-spend;
  var book=d.bookManual?(+d.bookBalance||0):should;
  var total=cashTotal(d),diff=total-book,rTotal=cashReasonTotal(d),unknown=diff-rTotal;
  var calcOK=(!!d.bookManual)||base>0;   /* 支給経費が未入力のときは過不足を書かない */
  function n(v){return Number(v||0).toLocaleString()+'円';}
  var t=[];
  t.push('経理部 ご担当者様');
  t.push('');
  t.push('いつもお世話になっております。'+(SET.school||'')+'です。');
  t.push(y+'年'+mo+'月分の経費精算表と金種表をお送りします。ご確認をお願いいたします。');
  t.push('');
  t.push('■ 経費精算表（'+y+'年'+mo+'月）');
  var rows=(ex.rows||[]);
  if(rows.length){rows.forEach(function(r){t.push('　'+(r.date||'')+'　'+(r.payee||'')+'　'+(r.detail||'')+'　'+(r.cat||'')+'　'+n(r.amount));});}
  else{t.push('　（明細の入力がありません）');}
  t.push('　科目別小計：'+EXP_CATS.map(function(c){return c+' '+n(expCatTotal(ex,c));}).join('／'));
  t.push('　合計：'+n(spend));
  t.push('');
  t.push('■ 金種表（実査日 '+(d.date||'未入力')+'／部門 '+(d.dept||'')+'）');
  CASH_DENOMS.forEach(function(x){var c=+((d.counts||{})[x[0]])||0;if(c)t.push('　'+x[0].toLocaleString()+'円 × '+c+'枚 ＝ '+n(x[0]*c));});
  t.push('　合計（Ⅰ）：'+n(total));
  t.push('');
  t.push('■ 現金残高の計算');
  if(base>0)t.push('　支給経費（ベース）'+n(base)+' − 支出合計 '+n(spend)+' ＝ あるべき残高 '+n(should));
  else t.push('　支給経費（ベース）が未入力のため、あるべき残高は計算していません。');
  t.push('　現金出納帳残高（Ⅱ）'+(d.bookManual?'（手入力）':'')+'：'+(calcOK?n(book):'未計算'));
  if(d.bookManual&&base>0&&should-book!==0)t.push('　あるべき残高 '+n(should)+' − 現金出納帳残高（Ⅱ）'+n(book)+' ＝ 差 '+n(should-book)+'（帳簿残高を手で入力しているための差です）');
  if(calcOK){
    t.push('　金種合計（Ⅰ）'+n(total)+' − 現金出納帳残高（Ⅱ）'+n(book)+' ＝ 現金過不足 '+n(diff));
    t.push('　差異原因 合計（Ⅳ）：'+n(rTotal));
    (d.reasons||[]).forEach(function(r){if(r.label||+r.amount)t.push('　　・'+(r.label||'')+'　'+n(r.amount));});
    t.push('　使途不明金：'+n(unknown));
  }else{
    t.push('　金種合計（Ⅰ）：'+n(total));
    t.push('　※ 支給経費（ベース）が未入力のため、現金過不足と使途不明金は計算していません。');
  }
  t.push('');
  t.push('作成者：'+(ex.by||d.by||'')+'　／　承認者：'+(ex.approver||d.approver||''));
  t.push('');
  t.push('※ 領収書は1ヶ月分を日付順にA4用紙へ貼り付けて、別途お送りします。');
  return {mk:mk,to:(SET.acctMail||''),subject:'【経費精算】'+y+'年'+mo+'月　'+(SET.school||''),body:t.join('\n')};
}

    {k:'closedDays',label:'休園日',ph:'例：土日祝・年末年始'},
    {k:'buildingArea',label:'建物・保育室面積',ph:'例：保育室 60㎡'},
    {k:'insurance',label:'加入保険',ph:'例：〇〇損保 賠償責任保険'}

];
var FAC_PARTNER_KINDS=['給食・ランチ','清掃・ごみ収集','設備・消防点検','リース・備品','写真販売','システム・IT','送迎・バス','その他'];
function facGet(){
  var d=stGet('facility',null);
  if(!d){
    d={info:{},doctors:[],partners:[],notes:[]};
    /* 旧「病院等の緊急連絡先一覧」を引き継ぐ */
    try{(stGet('hospitals',[])||[]).forEach(function(x){if(x&&x.name)d.doctors.push({name:x.name,dept:'',doctor:'',tel:x.tel||'',addr:'',kind:x.type||'かかりつけ医'});});}catch(e){}
  }d.info=d.info||{};d.doctors=d.doctors||[];d.partners=d.partners||[];d.notes=d.notes||[];return d;}
function facSet(d){stSet('facility',d);}
function renderFacility(){
  var d=facGet(),s=$('section[data-page="facility"]');
  function save(){facSet(d);}
  function field(f){
    var v=d.info[f.k]==null?'':d.info[f.k];
    var inp;
    if(f.opts)inp='<select data-fac="'+esc(f.k)+'">'+f.opts.map(function(o){return '<option'+(String(v)===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';
    else inp='<input data-fac="'+esc(f.k)+'" type="'+(f.type||'text')+'" value="'+String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
    return '<div class="field" style="margin:0;'+(f.wide?'grid-column:1/-1;':'')+'"><label style="font-size:11.5px;">'+esc(f.label)+'</label>'+inp+'</div>';

    }).join('')

        +'<td style="text-align:right;"><button class="btn btn-sm btn-ghost" data-fddel="'+esc(i)+'">'+ic('trash')+'</button></td></tr>';}).join('')
