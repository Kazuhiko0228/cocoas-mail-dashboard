var TASK_PAGE={'登園（出席）':['records','登園（出席）'],'安全点検':['records','安全点検'],'午睡チェック':['records','午睡チェック'],'健康チェック':['records','健康チェック'],'業務日報・保育日誌':['records','業務日報・保育日誌'],'身体測定':['carerec','身体測定'],'生徒個人発達記録':['carerec','生徒個人発達記録'],'避難訓練':['drill'],'防火管理台帳・消火訓練':['bouka'],'月間カリキュラム':['curriculum'],'シフト表':['shift'],'出勤簿':['shift'],'経費管理':['expense'],'請求管理':['billing'],'職員管理':['staff'],'監査対応':['audit'],'書類作成':['docgen'],'提出書類ナビ':['reqnav']};
function taskDoneAll(){return stGet('taskDone',{});}
function taskKey(mk,name){return mk+'|'+name;}
function taskIsDone(mk,name){return !!taskDoneAll()[taskKey(mk,name)];}
function taskSetDone(mk,name,v){var a=taskDoneAll();if(v)a[taskKey(mk,name)]=true;else delete a[taskKey(mk,name)];stSet('taskDone',a);}
/* システム内の記録から自動判定できるものは自動で「済」にする */
function taskAutoDone(t,mk){
  var p=t.page||'';
  try{
    if(p==='身体測定')return !!stGet('rec_身体測定',{})[mk];
    if(p==='避難訓練'){var D=drillData();return (D.rows||[]).some(function(r){return r.record&&r.record.date&&r.record.date.slice(0,7)===mk;});}
    if(p==='防火管理台帳・消火訓練'){var fy=(+mk.slice(5,7)>=4)?+mk.slice(0,4):+mk.slice(0,4)-1;var bd=boukaGet(fy);return BOUKA_MONTHS.some(function(mo){var r=bd.rows[mo];return r&&r.date&&r.date.slice(0,7)===mk;});}
    if(p==='月間カリキュラム')return (CUR.month===mk);
    if(p==='シフト表'||p==='出勤簿')return !!stGet('shifts',{})[mk];
    if(p==='経費管理'){var ex=stGet('expenses',{})[mk];return !!(ex&&(ex.rows||[]).length);}
    if(p==='請求管理'){var iv=stGet('invoices',{})[mk];return !!(iv&&Object.keys(iv).length);}
    if(p==='生徒個人発達記録'){var dv=stGet('rec_発達',{}),n=0;Object.keys(dv).forEach(function(k){n+=Object.keys(dv[k]).length;});return n>0;}
  }catch(e){}
  return false;
}
function taskStatus(t,mk){return taskIsDone(mk,t.name)||taskAutoDone(t,mk);}
function tasksForMonth(mk){
  var mo=+mk.slice(5,7);
  return ANNUAL_TASKS.filter(function(t){
    var m=String(t.month||'');
    if(m.indexOf('毎月')>-1)return true;
    return m.indexOf(mo+'月')>-1;
  });
}
var taskMonth=null;
function taskMonthCur(){if(!taskMonth)taskMonth=todayISO().slice(0,7);return taskMonth;}
function renderTasks(){
  var mk=taskMonthCur(),s=$('section[data-page="tasks"]');
  var list=tasksForMonth(mk),done=list.filter(function(t){return taskStatus(t,mk);}).length;
  var monthly=list.filter(function(t){return String(t.month).indexOf('毎月')>-1;});
  var special=list.filter(function(t){return String(t.month).indexOf('毎月')<0;});
  function row(t){
    var ok=taskStatus(t,mk),auto=taskAutoDone(t,mk),go=TASK_PAGE[t.page];
    return '<div class="task" style="align-items:flex-start;"><span class="tdot" style="background:'+(ok?'#639922':'#E24B4A')+';margin-top:6px;"></span>'
      +'<div style="flex:1;min-width:0;"><div class="row-name">'+esc(t.name)+(ok?' <span class="pill" style="background:#EAF3DE;color:#27500A;">'+(auto?'記録あり':'完了')+'</span>':'')+'</div>'
      +'<div class="row-sub">'+esc(t.when||'')+(t.page?'　／　'+esc(t.page):'')+'</div>'
      +'<div class="row-sub" style="color:var(--tx3);">'+esc(t.why||'')+'</div></div>'
      +'<div style="display:flex;gap:6px;align-items:center;white-space:nowrap;">'
      +(go?'<button class="btn btn-sm'+(ok?'':' btn-primary')+'" data-taskgo="'+esc(t.page)+'">開く</button>':'')
      +(auto?'':'<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;"><input type="checkbox" data-taskchk="'+esc(t.name)+'"'+(ok?' checked':'')+' style="width:auto;">完了</label>')
      +'</div></div>';
  }
  s.innerHTML='<div class="card" style="margin-bottom:14px;">'+recHead('年間スケジュール・やることリスト',
      '<input type="month" id="tkMonth" value="'+esc(mk)+'" style="width:160px;"><span class="tag" style="background:'+(done===list.length?'#EAF3DE;color:#27500A':'#FAEEDA;color:#854F0B')+';">'+done+' / '+list.length+' 完了</span>')
    +'<div class="muted">その月にやることを自動で表示します。システムに記録があるものは自動で「記録あり」になります。それ以外はチェックで完了にできます。</div></div>'
    +'<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;">'
    +'<div class="card"><h3>'+ic('clock')+'毎月やること（'+monthly.length+'）</h3>'+(monthly.length?monthly.map(row).join(''):'<div class="empty">ありません</div>')+'</div>'
    +'<div class="card"><h3>'+ic('cal')+(+mk.slice(5,7))+'月にやること（'+special.length+'）</h3>'+(special.length?special.map(row).join(''):'<div class="empty">この月の特別なタスクはありません</div>')+'</div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px;"><h3>'+ic('cal')+'年間の一覧</h3><div class="scrollx"><table><thead><tr><th style="width:70px;">時期</th><th>やること</th><th style="width:150px;">目安</th><th style="width:160px;">システム内の機能</th></tr></thead><tbody>'
    +ANNUAL_TASKS.map(function(t){return '<tr><td class="row-sub">'+esc(t.month)+'</td><td class="row-name">'+esc(t.name)+'<div class="row-sub" style="color:var(--tx3);">'+esc(t.why||'')+'</div></td><td class="row-sub">'+esc(t.when||'')+'</td><td class="row-sub">'+esc(t.page||'—')+'</td></tr>';}).join('')
    +'</tbody></table></div></div>';
  $('#tkMonth').onchange=function(e){taskMonth=e.target.value;renderTasks();};
  s.querySelectorAll('[data-taskchk]').forEach(function(cb){cb.onchange=function(){taskSetDone(mk,cb.getAttribute('data-taskchk'),cb.checked);renderTasks();};});
  s.querySelectorAll('[data-taskgo]').forEach(function(b){b.onclick=function(){var g=TASK_PAGE[b.getAttribute('data-taskgo')];if(!g)return;if(g[1])recType=g[1];go(g[0]);};});
}

function reqTarget(sd){
  if(!sd)return null;
  if(/危機管理マニュアル/.test(sd))return {page:'docgen',dg:'危機管理マニュアル'};
  if(/運営(状況)?報告書/.test(sd))return {page:'docgen',dg:'運営状況報告書'};
  if(/保育安全計画/.test(sd))return {page:'docgen',dg:'保育安全計画'};
  if(/避難訓練/.test(sd))return {page:'drill'};
  if(/シフト/.test(sd))return {page:'shift'};
  if(/職員/.test(sd))return {page:'staff'};
  if(/カリキュラム/.test(sd))return {page:'curriculum'};
  if(/安全点検/.test(sd))return {page:'records',rec:'安全点検'};
  if(/午睡|SIDS/.test(sd))return {page:'records',rec:'午睡チェック'};
  if(/健康チェック/.test(sd))return {page:'records',rec:'健康チェック'};
  if(/身体測定/.test(sd))return {page:'records',rec:'身体測定'};
  if(/ヒヤリハット|事故/.test(sd))return {page:'records',rec:'ヒヤリハット・怪我'};
  if(/業務日報|保育日誌/.test(sd))return {page:'records',rec:'業務日報・保育日誌'};
  if(/発達/.test(sd))return {page:'records',rec:'生徒個人発達記録'};
  return null;
}

function logLabel(k){return LOG_LABEL[k]||k.replace(/^cocoas_/,'');}
function logStamp(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
/* すべての保存を横取りしてログ化（保存自体は必ず先に実行し、ログ失敗でアプリを壊さない） */
(function(){
  var raw=localStorage.setItem.bind(localStorage),busy=false;
  window.__rawSet=raw;
  localStorage.setItem=function(k,v){
    try{ raw(k,v); }
    catch(err){
      /* 保存容量がいっぱいのとき、これまでは例外が出るだけで画面に何も出ず、
         入力した内容が保存されていないことに気づけなかった。 */
      try{ storageFullBanner(); }catch(e2){}
      throw err;                       /* 呼び出し元の扱いは変えない */
    }
    if(busy||String(k).indexOf('cocoas_')!==0||LOG_SKIP[k])return;
    busy=true;
    try{
      var l=[];try{l=JSON.parse(localStorage.getItem('cocoas_eventLog'))||[];}catch(e){l=[];}
      var who='';try{who=(typeof currentStaff==='function'&&currentStaff())?currentStaff().name:'';}catch(e){}
      var size=(v==null?0:String(v).length);
      var last=l[l.length-1];
      /* 同じ項目の連続保存は1件にまとめる（入力中の連打でログが膨らむのを防ぐ） */
      if(last&&last.key===k&&last.by===who&&last.at.slice(0,16)===logStamp().slice(0,16)){last.at=logStamp();last.size=size;last.n=(last.n||1)+1;}
      else l.push({at:logStamp(),key:k,label:logLabel(k),by:who,size:size,n:1});
      if(l.length>LOG_MAX)l=l.slice(-LOG_MAX);
      raw('cocoas_eventLog',JSON.stringify(l));
    }catch(e){}
    busy=false;
  };
})();
function eventLog(){try{return JSON.parse(localStorage.getItem('cocoas_eventLog'))||[];}catch(e){return [];}}
/* 全データの収集・スナップショット */
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
    if(String(k).indexOf('cocoas_')!==0)continue;
    if(k==='cocoas_snapshots'||k==='cocoas_eventLog')continue;
    /* ログイン用のトークンは書き出しません（バックアップの受け渡しから乗っ取られないようにするためです）。 */
    if(k==='cocoas_apiToken')continue;
    o[k]=localStorage.getItem(k);}
  return o;
}
function snapshots(){try{return JSON.parse(localStorage.getItem('cocoas_snapshots'))||[];}catch(e){return [];}}
function takeSnapshot(reason){
  try{
    var data=collectAll(),json=JSON.stringify(data);
    if(json.length>2500000)return false; /* 大きすぎる場合は保存しない（容量保護） */
    var arr=snapshots();
    arr.push({at:logStamp(),reason:reason||'自動',data:data});
    while(arr.length>SNAP_MAX)arr.shift();
    (window.__rawSet||localStorage.setItem.bind(localStorage))('cocoas_snapshots',JSON.stringify(arr));
    (window.__rawSet||localStorage.setItem.bind(localStorage))('cocoas_lastSnap',JSON.stringify(todayISO()));
    return true;
  }catch(e){ /* 容量超過時は古いスナップショットを削って再試行 */
    try{var a=snapshots();a.shift();(window.__rawSet)('cocoas_snapshots',JSON.stringify(a));}catch(e2){}
    return false;
  }
}
function autoSnapshot(){
  var last=null;try{last=JSON.parse(localStorage.getItem('cocoas_lastSnap'));}catch(e){}
  if(last!==todayISO())takeSnapshot('日次自動');
}
function restoreSnapshot(idx){
  var arr=snapshots(),sn=arr[idx];if(!sn)return false;
  takeSnapshot('復元前の自動保存');
  Object.keys(sn.data).forEach(function(k){(window.__rawSet||localStorage.setItem.bind(localStorage))(k,sn.data[k]);});
  return true;
}
function backupDownload(){
  var payload={app:'EduGrow 園務管理システム',exportedAt:logStamp(),school:(SET&&SET.school)||'',data:collectAll(),log:eventLog().slice(-200)};
  dlFile('cocoas-backup-'+todayISO()+'.json',JSON.stringify(payload,null,2),'application/json');
}
function backupRestoreFile(file,done){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var p=JSON.parse(rd.result);
      if(!p||!p.data)throw new Error('形式が違います');
      takeSnapshot('ファイル復元前の自動保存');
      /* 控えから戻さないもの。
         接続先とトークンは端末ごとのものなので、他の端末の控えで上書きすると繋がらなくなる。
         変更ログとスナップショットは「いつ誰が何をしたか」の証跡なので、上書きしない。 */
      var NO_RESTORE={'cocoas_apiToken':1,'cocoas_apiBase':1,'cocoas_apiTenant':1,
                      'cocoas_eventLog':1,'cocoas_snapshots':1,'cocoas_lastSnap':1};
      Object.keys(p.data).forEach(function(k){if(NO_RESTORE[k])return;if(String(k).indexOf('cocoas_')===0)(window.__rawSet||localStorage.setItem.bind(localStorage))(k,p.data[k]);});
      done(null,Object.keys(p.data).length);
    }catch(e){done(e);}
  };
  rd.onerror=function(){done(new Error('ファイルを読み込めませんでした'));};
  rd.readAsText(file);
}

/* ── 未来WA アクセス数値管理表への書き出し ────────────────
   数値管理表の「②行動ログ（生データ）」「④問い合わせログ（生データ）」の
   列の並びに合わせて書き出す。貼り付ければ ①③ の集計はシート側で動く。 */
function kpiRows(){
  var a=stGet('wa_track',[])||[];
  return a.map(function(x){
    var at=String(x.at||''), d=at.slice(0,10), t=at.slice(11,19);
    return [d,t,x.sid||'',x.sname||'',x.hid||'',x.act||'',
            x.cid||'',x.cat||'',x.by||'',x.dev||'',x.ses||''];
  });
}
function kpiHelpRows(){
  var a=stGet('wa_help_log',[])||[];
  return a.map(function(x){
    var at=String(x.at||''), d=at.slice(0,10), t=at.slice(11,19);
    return [d,t,x.hid||'',x.kind||'',x.tab||'',
            x.hit?'答えられた':'答えられず',x.q||'',x.dev||'',x.sid||''];
  });
}
function kpiTsv(rows){
  return rows.map(function(r){
    return r.map(function(c){
      return String(c==null?'':c).replace(/[\t\r\n]/g,' ');
    }).join('\t');
  }).join('\n');
}
function kpiDownload(rows,name){
  if(!rows.length){alert('まだ記録がありません。');return;}
  /* Excel・スプレッドシートで文字化けしないよう BOM を付ける */
  var blob=new Blob(['﻿'+kpiTsv(rows)],{type:'text/tab-separated-values;charset=utf-8'});
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name+'_'+todayISO()+'.tsv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},1500);
}
function kpiCopy(rows,btn){
  if(!rows.length){alert('まだ記録がありません。');return;}
  var txt=kpiTsv(rows), done=function(){
    var o=btn.textContent; btn.textContent='コピーしました';
    setTimeout(function(){btn.textContent=o;},1600);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){kpiFallback(txt,done);});
  }else kpiFallback(txt,done);
}
function kpiFallback(txt,done){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.cssText='position:fixed;left:-9999px;top:0;';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');done();}catch(e){alert('コピーできませんでした');}
  ta.remove();
}

}
function kpiWire(s){
  var b;
  if(b=document.getElementById('kpiC1'))b.onclick=function(){kpiCopy(kpiRows(),this);};
  if(b=document.getElementById('kpiD1'))b.onclick=function(){kpiDownload(kpiRows(),'未来WA_行動ログ');};
  if(b=document.getElementById('kpiC2'))b.onclick=function(){kpiCopy(kpiHelpRows(),this);};
  if(b=document.getElementById('kpiD2'))b.onclick=function(){kpiDownload(kpiHelpRows(),'未来WA_問い合わせログ');};
}

var HELP_DATA={"dashboard": {"summary": "ダッシュボードは、園の今の状況をひと目で確認できるホーム画面です。在園児数、本日の記録の入力もれ、本日のタスク、監査準備の進み具合、問い合わせ・体験・入退園の件数、やり取り中の連絡リストを表示し、押すとそれぞれの画面へ移動できます。", "steps": ["上の数字のカードで、在園児数と今月の状況を確認します。", "「本日の記録」の帯を見て、赤い「未」の項目を探します。", "「記録する」を押して、その場で本日分を入力します。", "「本日のタスク」を上から順に片づけていきます。", "「やり取り中の連絡リスト」の行を押して、内容を更新します。"], "tips": ["「未」は赤、「済」は緑です。帰るまでに赤をなくすことを目安にしてください。", "在園児カードのクラス名を押すと、そのクラスの男女の人数と比率が出ます。", "数字のカードを押すと、関係する画面（連絡先管理や記録など）へそのまま移動できます。", "「リード内訳」は「全期間・年度・月」を切り替えて見られます（受付日をもとに集計します）。", "一般スタッフの画面は本日のタスク中心です。問い合わせや入退園の数値は表示されません。"], "faq": [{"q": "数字が実際の人数と合っていない気がします。どこで直せますか。", "a": "ダッシュボードは各画面に入力された内容を集計して表示しています。連絡先管理や登園シートなど、もとの画面の内容をご確認ください。直すと数字も自動で変わります。"}, {"q": "問い合わせや体験の件数が私の画面には出てきません。故障でしょうか。", "a": "故障ではありません。一般スタッフの権限では運営の数値は表示されない設定です。本日のタスクと在園児・本日の出席が中心の画面になります。表示が必要な場合は管理者にご相談ください。"}, {"q": "「やり取り中の連絡リスト」に、あの保護者の名前が出てきません。", "a": "「長期見込み」「連絡不通」「入園 確定」「NG」の方は、このリストには表示されません。連絡先管理の画面からお探しください。"}]}, "compose": {"summary": "この画面では、連絡先から相手を1人選び、テンプレートを使って個別にメールを送れます。あとで送る「送信予約」や、送ったメールの確認もできます。", "steps": ["連絡先の一覧から、メールを送りたい相手を選びます。", "使いたいテンプレートを選んで、本文に読み込みます。", "件名と本文を読み、名前や日付などを書き直します。", "すぐ送るときは送信、あとで送るときは日時を決めて予約します。", "送信済みの一覧を開いて、きちんと送れたかを確かめます。"], "tips": ["テンプレートの名前・日付・時間は、そのままになりがちです。送る前に声に出して読み直すと安心です。", "宛先のお名前は必ずご確認ください。似たお名前の方がいる場合は特にご注意ください。", "急ぎでなければ送信予約が便利です。書いてすぐ送らず、時間を置いて見直せます。", "お返事がほしいときは、いつまでにお返事いただきたいかを本文に書いておくと伝わりやすくなります。"], "faq": [{"q": "送ったあとに間違いに気づきました。取り消せますか？", "a": "送信が終わったメールは取り消せません。おわびと訂正の内容を、あらためてお送りください。送信予約にしておくと、送られる前に内容を見直すことができます。"}, {"q": "送りたい方が一覧に出てきません。", "a": "連絡先に登録されていない可能性があります。お名前の一部で探しても見つからないときは、連絡先の登録内容をご確認ください。"}, {"q": "何人かの保護者に同じ内容を送りたいのですが。", "a": "この画面は1対1で送るためのものです。お一人ずつ選んで送っていただく形になります。同じテンプレートを使えば、毎回書き直さずに済みます。"}]}, "broadcast": {"summary": "この画面では、クラスを選んで保護者へお知らせを一斉に配信できます。デイリーメールは、カリキュラムに入力した内容を本文に取込んで作成できます。", "steps": ["「全体配信（お知らせ）」で配信の種類を選びます。", "送りたいクラスを選びます。複数のクラスも選べます。", "デイリーメールは「カリキュラムから取込」を押して内容を入れます。", "件名と本文を読み、その日の様子などを書き足します。", "宛先と本文を見直してから、送信を押します。"], "tips": ["送信を押す前に、選んだクラスと本文をもう一度お確かめください。", "デイリーメールはカリキュラムから取込むと、入力の手間が減り、書き間違いも防げます。", "取込んだ内容に、その日の子どもたちの様子を一言そえると、保護者に伝わりやすくなります。", "園全体へのお知らせは、クラスの選び漏れがないかご注意ください。"], "faq": [{"q": "クラスを間違えて送ってしまいました。どうすればいいですか？", "a": "おわびと正しい内容を、あらためて対象のクラスへ配信してください。送信済みのお知らせの取り扱いについては、園の管理担当者にご確認ください。"}, {"q": "デイリーメールの「取込み」とは何ですか？", "a": "カリキュラムに入力ずみの内容を、そのまま本文に呼び出せるはたらきです。一から書かずにすみます。"}, {"q": "同じお知らせを複数のクラスに送れますか？", "a": "送れます。配信先で送りたいクラスをまとめて選べば、同じ内容を一度に配信できます。"}]}, "dm": {"summary": "この画面では、ご家庭ごとに個別のメッセージをやりとりできます。送信すると保護者に通知メールが届き、メール内の返信URLからお返事をいただけます。", "steps": ["一覧から、メッセージを送りたいご家庭を選びます。", "これまでのやりとりを読み、用件を確かめます。", "入力欄に、伝えたい内容をわかりやすく書きます。", "宛先のお名前と本文を、もう一度見直します。", "「送信」を押すと、保護者へ通知メールが届きます。"], "tips": ["送信すると、すぐに保護者へメールが届きます。押す前に必ず読み返してください。", "よく似たお名前のご家庭があります。送信前に宛先のお名前をご確認ください。", "けがや発熱など急ぎのご連絡は、お電話が確実です。DMは気づくまで時間がかかります。", "長い文章より、短い文を分けて書くほうが、保護者に伝わりやすくなります。"], "faq": [{"q": "保護者には、どのように届くのですか？", "a": "送信すると、保護者へ通知メールが届きます。メールの中の返信URLを開くと、その場でお返事を書いていただけます。"}, {"q": "保護者からのお返事は、どこで見られますか？", "a": "この画面の、同じご家庭のやりとりの中に表示されます。ご家庭を選んで、内容をご確認ください。"}, {"q": "文章をまちがえて送ってしまいました。どうすればよいですか？", "a": "あわてず、続けて訂正のメッセージをお送りください。「先ほどの連絡を訂正します」と一言添えると、保護者に伝わりやすくなります。"}]}, "trial": {"summary": "体験を担当した先生が、その日の結果を入力する画面です。保存すると、連絡先の進捗と生徒台帳に自動で反映されます。", "steps": ["一覧から、報告したい体験の記録を選びます。", "お子さまのお名前と体験日が合っているか確認します。", "体験の結果を、表示されている選択肢から選びます。", "当日の様子や気づいたことをメモに入力します。", "入力内容を見直し、保存ボタンを押します。"], "tips": ["体験が終わったその日のうちに入力すると、様子を思い出しやすく正確に残せます。", "メモは次に対応する先生が読むものです。「〇〇が好きそうだった」など短く具体的に書くと伝わります。", "保存すると連絡先の進捗と生徒台帳に反映されます。同じ内容を別の画面で入力し直す必要はありません。", "保存を押す前に、お名前と体験日を必ずもう一度ご確認ください。別のお子さまに反映されるのを防げます。"], "faq": [{"q": "保存したあと、連絡先の進捗も自分で直さないといけませんか？", "a": "いいえ、必要ありません。保存すると連絡先の進捗と生徒台帳に自動で反映されますので、そのままで大丈夫です。"}, {"q": "入力を間違えて保存してしまいました。どうすればいいですか？", "a": "他の画面にも反映されていますので、気づいた時点で園の管理担当の先生にお伝えください。早めにご連絡いただくと安心です。"}, {"q": "体験を担当していない先生が代わりに入力してもいいですか？", "a": "基本は担当した先生の入力をおすすめします。代わりに入力する場合は、当日の様子を担当の先生に確認してから入力してください。"}]}, "deliveries": {"summary": "「配信カレンダー」は、デイリーメールや請求書などの定期配信の次回予定と、体験・説明会の予定をまとめて確認できる画面です。園の予定をカレンダー用のファイルに書き出して、ふだんお使いのカレンダーに取り込むこともできます。", "steps": ["左のメニューから「配信カレンダー」を開きます。", "「定期配信スケジュール」で次回の予定を確認します。", "送りたい配信の行にある「作成」を押します。", "下の「体験・説明会の予定」で今後の日程を確認します。", "「カレンダーに取り込む」→「カレンダー用ファイルを書き出す」を押します。"], "tips": ["「次回予定」に「本日」と出ている配信は、その日に送るものです。朝のうちにご確認ください。", "上に出る「予約済み配信」は今のところ予約の記録だけで、時間になっても自動では送られません。行を押すと内容を確認でき、ごみ箱のボタンで取り消せます。", "体験・説明会の予定にある「メール作成」を押すと、その方の状況に合った文面が自動で選ばれた状態でメール画面に進みます。", "書き出したファイルは、Googleカレンダーの「他のカレンダー → インポート」から取り込めます。AppleカレンダーやOutlookでも同じように取り込めます。"], "faq": [{"q": "予約した配信は、時間になったら自動で送られますか？", "a": "いいえ。今は予約を記録しておくだけで、自動送信はまだ行われません。当日はお手数ですが、配信画面から送信をお願いします。"}, {"q": "体験の予定が一覧に出てきません。", "a": "体験日が登録されていない方や、日付が過ぎた方は表示されません。連絡先の情報に体験日が入っているかご確認ください。鉛筆のボタンからその場で直せます。"}, {"q": "書き出したファイルは、どうすればカレンダーに入りますか？", "a": "パソコンにファイルが保存されますので、Googleカレンダーの「他のカレンダー → インポート」でそのファイルを選んでください。予定がそのまま入ります。"}]}, "records": {"summary": "この画面では、登園（出席）・安全点検・午睡チェック・健康チェック・業務日報を、その日ごとにまとめて記録できます。毎日の記録が1か所に残るので、あとから見返したり引き継いだりするときに役立ちます。", "steps": ["画面上部の日付を見て、今日の日付になっているか確認します。", "記録したい項目（登園・安全点検・午睡・健康・日報）を選びます。", "クラスやお子さまごとに、当てはまる内容を選んで入力します。", "気になったことがあれば、メモ欄に短いことばで書きます。", "入力が終わったら保存を押して、記録を確定します。"], "tips": ["午睡チェックは、決められた時間ごとにその場で入力すると、書き忘れを防げます。", "気になる様子は「いつ・どこで・どうしたか」を短く書くと、あとの人にも伝わりやすいです。", "入力の途中でも、こまめに保存しておくと安心です。", "登園は朝のうち、日報は帰る前など、記録する時間を決めておくと習慣になります。"], "faq": [{"q": "入力をまちがえました。直せますか？", "a": "同じ項目をもう一度開いて、正しい内容に入力し直し、保存してください。気づいたときにその日のうちに直しておくと安心です。"}, {"q": "お休みのお子さんは、どう記録すればいいですか？", "a": "登園の記録で、お休み（欠席）として記録してください。理由が分かっていれば、メモ欄に短く書いておくと共有しやすくなります。"}, {"q": "途中まで入力して、あとから続きを入力してもいいですか？", "a": "大丈夫です。入力できたところまで保存しておき、あとで同じ画面を開いて続きを入力してください。"}]}, "carerec": {"summary": "毎月の身体測定、その都度のヒヤリハット・怪我、3ヶ月ごとの生徒個人発達記録を、この画面でまとめて記録できます。記録した内容は印刷したり、控えとして保存したりできます。", "steps": ["画面の上にある3つのタブから、記録したい種類を選びます。", "身体測定は、月とクラスを選び、身長と体重を入力します。", "ヒヤリハット・怪我は「記録を追加」を押し、入力後に保存を押します。", "生徒個人発達記録は、園児と期間を選び、項目ごとに当てはまるものを選びます。", "必要に応じて「出力」で印刷し、「データ保存」で控えを残します。"], "tips": ["身長と体重を入力すると、カウプ指数は自動で計算されます。目安は15〜17です。", "「保護者へ測定結果を送信」を押すと、各ご家庭にはお子様ご本人の記録だけが届きます。ほかのお子様の記録は見えませんので、ご安心ください。", "ヒヤリハット・怪我では、人型のイラストをタップすると、けがの場所を前と後ろで残せます。まちがえたときは「クリア」でやり直せます。", "生徒個人発達記録は監査でも確認される書類です。「記録者」のお名前も入れておくと安心です。"], "faq": [{"q": "先月の身体測定を直したいのですが、どうすればよいですか？", "a": "画面上の月の欄を、直したい月に選び直してください。その月の記録が表示され、そのまま入力し直せます。"}, {"q": "入力したのに、保存ボタンが見当たりません。消えてしまいませんか？", "a": "身体測定と生徒個人発達記録は、入力するとその場で自動的に保存されます。ヒヤリハット・怪我だけ、最後に「保存」を押してください。"}, {"q": "まちがえて記録してしまいました。消せますか？", "a": "ヒヤリハット・怪我は、一覧の右にあるごみ箱のマークから削除できます。身体測定と生徒個人発達記録は、数値や選択を入れ直すと上書きされます。"}]}, "curriculum": {"summary": "クラスごとに、その月のカリキュラムをまとめて作れる画面です。月のねらいなどの項目、日ごとの予定、週ごとの活動内容を、1つの画面で入力・保存できます。", "steps": ["画面の上で、対象のクラスと年月を選びます", "月の項目欄に、ねらいや行事などを入力します", "日別スケジュールに、日ごとの予定を書き入れます", "週ごとの欄に、その週の活動内容を入力します", "入力が終わったら、保存ボタンを押します"], "tips": ["先に月の項目（ねらい）を決めてから、週・日を埋めると書きやすいです", "全部を一度に書かず、途中でこまめに保存すると安心です", "クラスと年月が合っているか、入力前にもう一度ご確認ください", "行事や園庭開放など、動きやすい予定は日別スケジュールにまとめると見やすくなります"], "faq": [{"q": "書きかけのまま、あとで続きを書いてもいいですか？", "a": "はい、大丈夫です。保存しておけば、次に同じクラス・同じ月を開いたときに、続きから入力できます。"}, {"q": "入力した内容をあとから直せますか？", "a": "はい。同じクラス・同じ月を開いて、直したい欄を書き換えて保存し直してください。"}, {"q": "クラスが違う分も作りたいのですが、どうすればいいですか？", "a": "画面の上でクラスを切り替えてから、そのクラスの内容を入力してください。クラスごとに別々に保存されます。"}]}, "drill": {"summary": "年間14回の避難訓練について、いつ・どんな内容で行うかの計画と、実施したあとの記録をまとめて管理できる画面です。参加者名簿や年間記録表を出力して、印刷や書類の確認にも使えます。", "steps": ["画面の上で、記録したい年度を選びます。", "一覧から、今回あつかう訓練の回を選んで開きます。", "日時や想定する災害など、計画の内容を入力します。", "訓練が終わったら、実施した内容と参加者を記録して保存します。", "出力ボタンから、参加者名簿や年間記録表を出します。"], "tips": ["年度のはじめに14回分の計画をまとめて入れておくと、あとがぐっと楽になります。", "実施した内容は当日のうちに記録すると、記憶が新しいまま正確に残せます。", "参加者名簿は訓練の前に出しておくと、当日の点呼の確認に使えます。", "年間記録表は書類の提出や確認をもとめられたときに使えるので、記録の入れ忘れがないか時々見直しましょう。"], "faq": [{"q": "訓練の日にちが変わったのですが、どうすればいいですか？", "a": "その回を開いて、日付を新しいものに直してから保存してください。内容が上書きされます。"}, {"q": "14回すべてを一度に入力しないといけませんか？", "a": "いいえ。年間14回分の枠が用意されているだけですので、計画や実施の記録は、できるところから順に入れていただいて大丈夫です。"}, {"q": "あとから記録を直すことはできますか？", "a": "できます。直したい回を開いて内容を書き直し、保存すれば更新されます。"}]}, "bouka": {"summary": "毎月の防火・安全設備の点検（消火器・救急箱・AED・防火扉・避難グッズ）と消火訓練の記録を、1年度分（4月〜3月）まとめて残せる画面です。入力した内容は、そのまま台帳と訓練記録の形で印刷できます。", "steps": ["画面の上にある選択欄から、記録したい年度を選びます。", "「防火管理台帳」を押し、実施した月の行に日付と内容を入力します。", "①〜⑤の点検項目のうち、確認できたものにチェックを入れます。", "「消火訓練 手順・記録」を押し、実施場所・タイム（所要時間・分）・概要を入力します。", "右上の「台帳を出力」または「記録を出力」を押して、印刷します。"], "tips": ["保存ボタンはありません。入力するとその場で自動的に保存されます。", "①〜⑤が何の点検かは、表のすぐ上に書いてあります（①消火器 ②救急箱 ③AED・自動火災報知設備 ④防火扉 ⑤避難グッズ）。", "画面上部の「実施済 ○/12」で、その年度の記録の抜けがひと目で分かります。", "「内容」の欄には例文があらかじめ入っています。実際に行った内容に合わせて書き直してください。"], "faq": [{"q": "保存ボタンが見当たりません。入力した内容は消えてしまいませんか？", "a": "消えません。日付やチェックを入れた時点で自動的に保存されます。年度を切り替えたり、別の画面に移ったりしても、入力した内容はそのまま残ります。"}, {"q": "先月の分を書き忘れてしまいました。あとから入力できますか？", "a": "できます。4月から3月までのどの月でも、いつでも入力・修正できます。日付を入れると「実施済」の数にも反映されます。"}, {"q": "「防火管理台帳」と「消火訓練」で、日付を2回入れないといけませんか？", "a": "いいえ。日付と内容は両方で共通です。どちらかで入力すれば、もう一方にも同じ内容が表示されます。"}]}, "shift": {"summary": "翌月の勤務表（シフト）を作り、実際の出勤・退勤を出勤簿に記録できる画面です。勤務時間と時間外は自動で計算され、そのまま印刷して提出用の書類にできます。", "steps": ["上部のタブで「勤務表（シフト予定）」を選びます。", "右上の月の欄で、作りたい翌月を選びます。", "早番・日勤・遅番の勤務時間と休憩時間を確認します。", "名前と日付が交わるマスを押し、早・日・遅・休を切り替えます。", "打刻は「出勤簿」タブで職員を選び、出勤と退勤を入れます。"], "tips": ["「基本シフト一括反映」を押すと、平日は各職員の基本シフト、土日は休で一度に埋まります。すでに入れた内容は上書きされるので、細かい調整をする前に押してください（基本シフトは職員管理で設定します）。", "出勤簿の「シフトから一括入力」を使うと、シフトの予定時刻がまとめて入ります。すでに打刻した日はそのまま残るので、違う日だけ直せば大丈夫です。", "勤務時間は「退勤−出勤−休憩」で自動計算されます。時間外（所定の8時間を超えた分）は赤い字で表示されるので、多い日は理由を確認しておくと安心です。", "遅刻・早退・有給などは備考欄に書いておくと、印刷した出勤簿にもそのまま残ります。印刷は「この職員を出力」「全員分を出力」から選べます。"], "faq": [{"q": "保存ボタンが見当たりません。入力が消えてしまいませんか？", "a": "入力するとその場で自動保存されますので、保存ボタンを押す必要はありません。ただし記録はお使いの端末に保存されるため、別の端末では表示されません。同じ端末で入力・確認をお願いします。"}, {"q": "シフトのマスを押し間違えました。空欄に戻せますか？", "a": "同じマスを押すたびに、早 → 日 → 遅 → 休 → 空欄 の順に変わります。何回か続けて押していただくと、元の空欄に戻ります。"}, {"q": "早番の時間が園の実際と違います。変えられますか？", "a": "表の上にある「早・日・遅」の横の時刻の欄を書き換えてください。休憩時間も同じ場所で直せます。変更した時刻は、印刷した勤務表や出勤簿の一括入力にも反映されます。"}]}, "expense": {"summary": "この画面では、月ごとの経費精算表を作成し、印刷や書き出しができます。あわせて、手元の現金を数えて記録する金種表（お札や硬貨の枚数をまとめた表）も作成できます。", "steps": ["画面の上にある年月から、作成したい月を選びます。", "経費精算表に、日付・使いみち・金額を入力します。", "現金を数えて、金種表にお札と硬貨の枚数を入力します。", "精算表の合計と、手元の現金の合計が合うか確かめます。", "出力（印刷）を押して、精算表と金種表を出します。"], "tips": ["領収書を日付順に並べてから入力すると、抜けや二重入力に気づきやすくなります。", "金種表は、現金を数えたその場で入力すると数え直しが減ります。", "精算表の合計と金種表の合計が同じ金額になるか、出力の前に必ず見比べてください。", "月末にまとめて入力するより、こまめに入力しておくと、あとから直す手間が減ります。"], "faq": [{"q": "入力をまちがえました。あとから直せますか？", "a": "はい。その月をもう一度開いて、まちがえた欄を入力し直してください。直したあとに、合計金額をもう一度確かめると安心です。"}, {"q": "現金の金額が少し合いません。どうすればよいですか？", "a": "まず領収書の入れ忘れ、次に金額の打ちまちがい、最後に現金の数えまちがいの順で確かめてください。それでも合わないときは、そのままにせず園長先生や事務担当の方にご相談ください。"}, {"q": "金種表は毎月作らないといけませんか？", "a": "園のきまりによりますが、現金を数えたときに作っておくと、あとで「いくらあったか」をすぐ確認できます。作成した月の分はこの画面から出力できます。"}]}, "docgen": {"summary": "危機管理マニュアル・運営状況報告書・保育安全計画の3つの書類を、園の情報を入力するだけで作れる画面です。右側のプレビューで仕上がりを見ながら直し、そのまま印刷やPDF保存ができます。", "steps": ["画面の上にあるボタンで、作りたい書類を1つ選びます。", "危機管理マニュアルは「施設固有情報」を開き、園名や連絡先を入力します。", "左側の入力欄や本文を、園の内容に合わせて直します。", "右側のプレビューで、書類の仕上がりを確かめます。", "「出力」ボタンを押して、印刷またはPDF保存をします。"], "tips": ["入力した内容は自動で保存されます。保存ボタンを押す必要はありません。", "プレビューの赤い〔未入力〕は、施設固有情報がまだ空の場所です。入力すると消えます。", "本文を直しすぎたときは「既定に戻す」で元の文章にもどせます。直した項目には✎が付きます。", "運営状況報告書の児童数と職員は、システムの名簿から自動で入ります。手で数え直す必要はありません。"], "faq": [{"q": "「出力」を押したら印刷の画面が出ました。PDFで保存できますか？", "a": "はい。印刷画面の「送信先」や「プリンター」の欄で「PDFに保存」を選ぶと、PDFとして残せます。"}, {"q": "危機管理マニュアルを、全部まとめて1冊で印刷できますか？", "a": "できます。左上の「全編を出力（表紙・目次つき）」を押すと、表紙と目次が付いた状態でまとめて出せます。"}, {"q": "入力した園の情報は、ほかの先生のパソコンでも見られますか？", "a": "いいえ。入力した内容はお使いの端末の中に保存されます。別の端末で使うときは、あらためて入力をお願いします。"}]}, "reqnav": {"summary": "園の施設種別を選ぶと、行政に提出・整備する書類の一覧が表示される画面です。書類ごとに「未着手・準備中・完了」で進み具合を記録でき、この中で作れる書類は作成画面へそのまま移動できます。", "steps": ["画面の一番上で、園に当てはまる「施設種別」を選びます。", "必要に応じて「自治体（市区町村）」と「定員」を入力します。", "一覧で、書類名・根拠・提出先・頻度・説明を確認します。", "書類ごとに右側で「未着手」「準備中」「完了」を選びます。", "「このシステムで作る」がある書類は、押すと作成画面に移ります。"], "tips": ["一覧が切り替わるのは「施設種別」を選んだときです。まず種別を正しく選んでください。", "一覧の上に「完了 ○/○」と出ます。今どこまで進んでいるかの目安にしてください。", "橙色の「要確認」が付いた書類は、自治体によって様式や頻度が変わりやすいものです。市区町村の公式情報でご確認ください。", "この一覧は確認日時点の暫定の内容です。制度の変更もあるため、最終的な判断は必ず自治体の案内に合わせてください。", "選んだ種別や進み具合は、お使いのパソコン・タブレットの中に自動で保存されます。別の端末には引き継がれません。"], "faq": [{"q": "施設種別を変えたら、今まで入れた進み具合は消えてしまいますか？", "a": "消えません。進み具合は種別ごとに分けて記録しています。元の種別に戻せば、前に選んだ「準備中」「完了」がそのまま表示されます。"}, {"q": "「要確認」と付いている書類は、出さなくてもよいということですか？", "a": "いいえ、不要という意味ではありません。必要かどうかや、様式・提出の頻度が自治体で違いやすい書類という印です。園のある市区町村の窓口や公式ページでご確認ください。"}, {"q": "「このシステムで作る」のボタンが出ていない書類は、どうすればよいですか？", "a": "その書類は「システム外で用意」と表示されます。園で別に作成したり、自治体の様式をお使いください。用意ができたら、この画面で「完了」に変えておくと分かりやすくなります。"}]}, "docs": {"summary": "契約書や保険証書などの書類をGoogle Driveに保存し、そのURLをこの画面に登録しておける画面です。登録すると状態が「格納済み」に変わり、監査のときにすぐ書類を開いて確認できます。", "steps": ["先にGoogle Driveへ書類を保存し、その共有URLをコピーします。", "一覧から登録したい書類名を探し、URL欄に貼り付けます。", "必要に応じて、メモ欄に有効期限や補足を書き添えます。", "「保存」を押すと、状態が「格納済み」に変わります。", "一覧にない書類は、下の「書類を追加」に名前を入れて「追加」を押します。"], "tips": ["この画面はファイルそのものを預かる場所ではありません。ファイルはDriveに置き、ここにはURLだけを登録してください。", "URLを貼っただけでは記録されません。最後に必ず「保存」を押してください。", "Driveの共有設定もご確認ください。園の関係者が開けないURLだと、監査のときに表示できません。", "書類名の文字をクリックすると、園でお使いの呼び方に書き換えられます。", "病院などの緊急連絡先は、この画面ではなく「施設管理 → 提携医療機関」で管理します。"], "faq": [{"q": "赤い「未格納」の表示が消えません。どうすればよいですか？", "a": "URL欄が空のままだと「未格納」と表示されます。DriveのURLを貼り付けて「保存」を押していただくと、緑色の「格納済み」に変わります。"}, {"q": "一覧にない書類も登録できますか？", "a": "はい、できます。表の下にある「書類を追加」に書類名を入れて「追加」を押すと、新しい行が増えます。URLは後からでも入力できます。"}, {"q": "追加した書類を削除すると、Driveのファイルも消えてしまいますか？", "a": "いいえ、Drive内のファイルはそのまま残ります。消えるのは、この画面に登録したURLとメモだけです。なお削除ボタンは、ご自身で追加した書類にのみ表示されます。"}]}, "facility": {"summary": "園の基本情報や認可・届出の内容、かかりつけ医などの提携医療機関、給食・清掃などの取引先を、この画面ひとつにまとめて登録できます。登録した内容は、緊急連絡先の壁掲示用や施設情報の一覧として印刷することもできます。", "steps": ["左のメニューの「管理」から「施設管理」を選びます。", "「園の基本情報」「認可・届出」の各欄に入力します。", "「提携医療機関」の「追加」を押し、病院名や電話番号を入れます。", "「提携先・取引先」の「追加」を押し、種別と会社名を入れます。", "「壁掲示用に出力」を押すと、緊急連絡先を印刷できます。"], "tips": ["入力した内容は、ほかの欄に移った時点で自動的に保存されます。保存ボタンはありません。", "「目標物（緊急通報用）」に建物の目印を入れておくと、119番のときに場所を伝えやすくなります。", "決まった欄にない情報は、一番下の「その他の情報（自由記載）」で見出しと内容を追加して残せます。", "表の右はしのゴミ箱を押すと、その行はすぐに消えます。確認の画面は出ませんのでご注意ください。"], "faq": [{"q": "保存ボタンが見つかりません。入力したものは消えてしまいませんか？", "a": "入力したあと、ほかの欄をクリックした時点で自動的に保存されます。保存ボタンはありませんので、そのまま画面を移っていただいて大丈夫です。"}, {"q": "病院の連絡先を、事務室の壁に貼っておきたいのですが。", "a": "「提携医療機関」の右上にある「壁掲示用に出力」を押すと印刷の画面が開きます。電話番号が大きく印刷され、消防・救急（119）と警察（110）も一緒に載ります。"}, {"q": "ここに入れた内容は、ほかの先生のパソコンでも見られますか？", "a": "いまはお使いの端末のブラウザの中に保存されるしくみのため、ほかの端末では表示されません。共有したいときは「施設情報を出力」で印刷してお渡しください。控えの保存は「設定」画面のバックアップから行えます。"}]}, "contacts": {"summary": "見学・体験のお問い合わせをいただいたご家庭（リード）と、在園児・退園児の連絡先をまとめて管理する画面です。進捗フェーズや懸念点、次回アクションの日を記録して、対応もれを防げます。", "steps": ["「すべて」「リード」「在園児」「退園児」を押して表示を絞ります", "探したい方は、上の検索欄に保護者名やお子様のお名前を入れます", "新しく登録するときは、右上の「連絡先を追加」を押します", "区分を選び、保護者名とメールアドレスなど必要な項目を入力します", "内容を直すときは行の右の鉛筆マークを押し、最後に「保存」を押します"], "tips": ["保護者名とメールアドレスは必ず必要です。ほかの項目は後から少しずつ足していけます。", "並べ替えを「次回アクションが近い順」にすると、早く連絡すべきご家庭が上に並びます。", "体験でうかがった心配ごとは「懸念点・要望」に書いておくと、一覧に赤色で表示されます。", "監査のときは「監査用に出力」から、児童名簿・緊急連絡票・健康アレルギー一覧・入退園一覧を印刷できます。"], "faq": [{"q": "「リード」って何のことですか？", "a": "見学や体験のお問い合わせをいただいた、まだ入園前のご家庭のことです。進捗フェーズで今どの段階かを管理します。"}, {"q": "入園が決まったら、どうしたらいいですか？", "a": "その方の鉛筆マークを押して編集画面を開き、区分を「在園児」に切り替えてください。クラス・入園日・通園曜日・月額を入れて保存します。"}, {"q": "退園したお子様は削除したほうがいいですか？", "a": "削除せず、区分を「退園児」にして退園日を入れてください。監査で使う入退園一覧に必要です。ゴミ箱で消すと元に戻せませんのでご注意ください。"}]}, "roster": {"summary": "園児一人ひとりの情報（基本情報・ご家族・緊急連絡先・健康情報・お支払い）を1か所にまとめて登録・確認できる画面です。地図上に園児のご自宅と園・避難場所を表示でき、一覧は名簿として印刷もできます。", "steps": ["左のメニューで「生徒台帳」を開き、「一覧」タブを選びます。", "見たい園児の行の「開く」を押し、個別プロフィールを表示します。", "各項目を入力したら、右上の「保存」を押して内容を確定します。", "「自宅マップ」タブで園児を選び、地図のご自宅の位置を押します。", "「一覧」タブの「名簿を出力」を押すと、印刷用の名簿が出ます。"], "tips": ["赤い「必須」マークの項目（住所・緊急連絡先1と2・健康情報など）が空のままだと保存できません。", "アレルギーやかかりつけ医がない園児も、空欄にせず「なし」と入力してください。", "個別プロフィールの「この子を地図で見る」を押すと、その園児のご自宅の位置へすぐ移動します。", "自宅マップはインターネットに接続しているときだけ表示されます。地図が出ないときは接続を確かめ、画面を開き直してください。"], "faq": [{"q": "探している園児の名前が一覧に出てきません。", "a": "一覧に表示されるのは在園中の園児だけです。「連絡先」の画面で、その園児が在園として登録されているかをご確認ください。"}, {"q": "住所を入力すれば、地図にご自宅のピンが自動で付きますか？", "a": "自動では付きません。住所を外部に送らないようにしているためです。「自宅マップ」タブで園児を選び、地図のご自宅の場所を押してピンを置いてください。置き直しや削除もできます。"}, {"q": "入力した内容は、他の先生のパソコンでも見られますか？", "a": "見られません。入力した情報は、今お使いの端末のブラウザの中だけに保存されます。別の端末で見たい場合は、その端末で改めて入力が必要です。"}]}, "enroll": {"summary": "園児ごとのコースプランと、ランチ・ロングステイ・教育関連費の有無をまとめて設定できる画面です。設定した内容から月額が自動で計算され、そのまま請求書づくりに引き継がれます。", "steps": ["左のメニューから「生徒情報（契約・オプション）」を選びます。", "一覧から園児の行を探し、「コースプラン」を選びます。", "ランチ・ロングステイを使う園児は「あり」にチェックを入れます。", "教育関連費がかかる園児は、その列のチェックを入れます。", "右端の「月額（自動）」を確かめ、「請求書」を押します。"], "tips": ["チェックや選びなおしは、その場ですぐ保存されます。保存ボタンはありません。", "ランチ・ロングステイの下に赤い字で「曜日が未設定」と出たときは、回数が0回のままです。「連絡先」で通園曜日とオプションを設定してください。", "「月額（自動）」はその月の曜日の数で計算されるため、月によって金額が変わることがあります。", "ランチなどの単価は「設定」の「料金設定」で変えられます。入園金は請求書の画面でチェックを入れて加えます。"], "faq": [{"q": "ランチの回数は、この画面で直接入力できますか？", "a": "この画面では「あり」「なし」だけを決めます。回数は「連絡先」の曜日ごとの設定と、その月の曜日の数から自動で計算されます。今月だけ回数を変えたいときは、「請求書」ボタンから開く請求書の画面で直せます。"}, {"q": "名前が一覧に出てこない園児がいます。", "a": "この画面には在園児として登録されている園児だけが表示されます。「連絡先」でその園児の区分が「在園児」になっているかご確認ください。"}, {"q": "変えた内容は、いつ請求に反映されますか？", "a": "変更するとすぐ保存され、次に作る請求書に反映されます。すでに作成済みの月の請求書には自動では反映されませんので、「請求管理」でその月の内容をご確認ください。"}]}, "billing": {"summary": "月ごとの保育料の請求書を、内容の確認から発行・保護者への送付・入金の確認まで、この画面だけで進められます。金額は「生徒情報（契約・オプション）」と「設定 → 料金設定」から自動で計算されます。", "steps": ["右上の月を選んで、その月の請求一覧を表示します", "園児ごとに「明細」を押し、回数や割引、支払期日を確かめます", "内容がよければ上の「一括で発行」を押します", "「発行済をまとめて送付」を押し、保護者へお送りします", "入金を確認できたら、その行の「入金済」を押します"], "tips": ["この画面を開くと、はじめは翌月分が表示されます。前の月を見たいときは、右上の月を変えてください。", "金額は自動で計算されます。その月だけ回数を変えたい・割引を付けたいときは、その子の行の「明細」から直します。", "「明細」で「保存」を押すと、状態が「未発行」から「発行済」に変わります。まだ発行したくないときは「閉じる」を押してください。", "紙でお渡しするときは「全員分を印刷」、1人分だけなら行の右にあるプリンターのマークを押します。"], "faq": [{"q": "金額がちがうのですが、どこで直せますか？", "a": "その子の行の「明細」を押すと、コースプラン・ランチやロングステイの回数・教育関連費・割引・支払期日を直せます。全員に共通する単価そのものを変えたいときは「設定 → 料金設定」で変更してください。"}, {"q": "まちがえて送ってしまいました。取り消せますか？", "a": "送ったものを取り消すことはできません。「明細」で正しい内容に直してから「再送」を押し、保護者の方にはひとことお詫びとご連絡を添えてください。"}, {"q": "入金がまだのご家庭は、どこを見れば分かりますか？", "a": "状態が「送付済」のままの行が、まだ入金を確認できていないご家庭です。画面上部のタグで「送付済」「入金済」の件数が分かり、支払期日は一覧の「支払期日」の列で確認できます。"}]}, "templates": {"summary": "「メールテンプレート」は、配信でよく使う定型の文面を一覧で見られる画面です。保護者への個別メールと、クラス全体へのお知らせ配信の見本を確認して、そのまま送信画面へ持っていけます。", "steps": ["上が個別メール、下が全体配信の一覧です。使いたい文面を探します", "カードに出ている件名と本文の見本を読み、内容を確かめます", "カードの下の「対象」を見て、送りたい相手と合うか確認します", "「この文面で送信」（全体配信は「この文面で配信」）を押します", "開いた送信画面で宛先を選び、必要なら文面を直して送ります"], "tips": ["この画面は見本を見るためのものです。文面を書き直すのは、ボタンを押して移った送信画面で行います", "送信画面で直した文面は、その送信だけに使われます。見本はそのまま残るので、次の方にもきれいな状態から始められます", "〔お名前〕〔お子様〕などのカッコは、送るときに宛先ごとの名前に自動で入れ替わります。そのまま残しておいて大丈夫です", "「〇月〇日」「〇曜日」のような〇印は自動では入りません。送る前に必ずご自身で書き直してください"], "faq": [{"q": "文面を直したいのですが、この画面で書き換えられますか？", "a": "この画面では書き換えられません。「この文面で送信」を押して移った画面で、件名と本文を自由に直せます。直した内容はその送信にだけ使われ、こちらの見本は変わりません。"}, {"q": "〔お名前〕と書いてありますが、このまま送られてしまいませんか？", "a": "大丈夫です。送信するときに、宛先の保護者様のお名前へ自動で入れ替わります。送信画面のプレビューで、実際に送られる文面を確かめられます。"}, {"q": "どの文面を使えばよいか分かりません。", "a": "各カードの下に「対象」が書かれています。体験前の方、在園児の保護者様など、送りたい相手に合うものをお選びください。迷ったときはマネージャーにご確認ください。"}]}, "staff": {"summary": "職員の名簿（役職・保有資格・入社日と勤続年数・健康診断日）をまとめて管理できる画面です。健康診断の期限をお知らせしたり、身分証や資格証の控えを保管したり、システムにログインするアカウントを発行したりできます。", "steps": ["左のメニューから「職員管理」を選びます。", "「職員を追加」を押し、氏名・役職・保有資格・入社日を入れて保存します。", "一覧のえんぴつマークを押し、直近の健康診断日を入れます。", "同じ画面の「身分証・証明書の保管」で、画像またはURLを追加します。", "ログインが必要な方は「アカウント作成」を押し、ID・パスワード・役割を決めます。"], "tips": ["健康診断日を入れると、その1年後が次回期限として自動で表示されます。期限の30日前から黄色の「要更新」、過ぎると赤の「期限切れ」になり、画面のいちばん上にもお知らせが出ます。", "「身分証・証明書の保管」の欄は、いったん保存したあと一覧のえんぴつマークから開くと出てきます。新しく追加する画面には出ませんので、まず保存してください。", "登録した画像は、今お使いの端末の中だけに保存されます。別のパソコンやスマホからは見えませんので、園で使う端末を決めておくと安心です。", "監査や提出の前は「労働者名簿を出力」を押すと、全職員の一覧を印刷できます。", "編集画面で「基本シフト（早・日・遅）」を選んでおくと、シフト表で一括して反映できます。"], "faq": [{"q": "健康診断のところに出る「要更新」って、どういう意味ですか？", "a": "前回の健診日から1年が近づいたときに出る印です。期限の30日前から黄色の「要更新」、期限を過ぎると赤の「期限切れ」になります。新しい健診日を入れていただくと、元の緑の表示に戻ります。"}, {"q": "資格証や免許証の写真を入れても大丈夫でしょうか？", "a": "登録した画像はこの端末の中だけに保存され、外部には送られません。ただし共有の端末や持ち出しにはご注意ください。Googleドライブに保管している場合は、画像の代わりにURLを貼り付けることもできます。"}, {"q": "職員が退職したときは、削除したほうがいいですか？", "a": "削除ではなく、えんぴつマークから「退職日」を入れることをおすすめします。名簿に残るので、勤続年数などの記録も残せます。ゴミ箱マークを押すと、その職員の情報は消えてしまいます。"}]}, "audit": {"summary": "監査で必要な書類を「①児童関係」から「⑤給食」まで一覧で確認し、書類ごとに準備状況（未・対応中・済）を記録できる画面です。それぞれの書類を作る画面へその場で移動でき、最後に最終チェックリストとして印刷できます。", "steps": ["上の「監査日」に日程が決まったら入力し、残り日数を確認します", "①〜⑤の一覧から書類を探し、左の欄で「未・対応中・済」を選びます", "システムで作る書類は、右のボタンを押してその画面へ移動します", "書類名の下の「保管：」欄に、園での置き場所を入力します", "最後に「監査パッケージ（最終チェックリスト）を出力」を押して印刷します"], "tips": ["書類名の横の青い「年度前」は3〜4月に整えるもの、オレンジの「運営中」は毎日の記録で溜まっていくものです", "現場監査は5〜11月に予告なく来ます。日々の記録を毎日つけておけば、そのまま提示できます", "緑色の「システム内データ」は、その書類のデータがどれくらい溜まっているかの目安です。「未格納」と出たらまだ登録されていません", "状態や保管先は、選んだり入力したりした時点で自動で保存されます。保存ボタンを押す必要はありません", "一番下の「虐待防止チェックシート」は3ヶ月に1回。監査でも確認されるので、実施日と実施者まで入れておきましょう"], "faq": [{"q": "「未」「対応中」「済」は、どう使い分ければいいですか？", "a": "まだ手をつけていないものは「未」、作りかけ・確認中のものは「対応中」、監査でそのまま出せる状態になったら「済」を選んでください。システムで作れる書類は、はじめから「対応中」になっています。"}, {"q": "監査の日程がまだ決まっていないのですが、空欄のままでいいですか？", "a": "はい、空欄のままで大丈夫です。書類監査の日程は自治体から連絡が入ってから確定しますので、決まってから入力すると残り日数が表示されます。現場監査は予告なしのため、日々の記録は続けてください。"}, {"q": "印刷した最終チェックリストには、何が載りますか？", "a": "①〜⑤すべての書類名と、状態・保管場所・「年度前／運営中」の区分・システム内のデータ量が一覧で出ます。提出漏れがないかの最終確認にお使いください。"}]}, "settings": {"summary": "送信設定・振込先口座・料金設定・請求書の体裁に加え、職員のログインアカウントの発行、役割ごとの権限、テンプレートの表示権限、データのバックアップと変更ログを管理する画面です。", "steps": ["送信元アドレスやBCC、園名などの送信設定を入力します。", "振込先口座・料金設定・請求書の体裁を必要に応じて入力します。", "「保存」を押して、入力した内容を確定します。", "職員アカウントの表で、ログインIDと役割を発行します。", "権限管理の表で、役割ごとに見せる画面をチェックします。"], "tips": ["送信設定・振込口座・請求書の体裁は、一番下の「保存」を押すまで反映されません。料金や登園オプションの追加は、入力したその場で保存されます。", "「職員アカウント」と「権限管理」は、管理者としてログインしているときだけ表示されます。ご自身の役割は画面左下のお名前の下に出ています。", "権限管理でチェックを外した画面は、その役割の先生のメニューから見えなくなります。まず一人で試してから、全体に反映すると安心です。", "データはお使いの端末の中に保存されます。月に一度は「バックアップをダウンロード」を押して、ファイルをパソコンに保管してください。"], "faq": [{"q": "「職員アカウント」や「権限管理」のところが見当たりません。", "a": "この2つは、役割が「管理者」の方でログインしたときだけ表示されます。画面左下にご自身の役割が出ていますので、ご確認のうえ、管理者の先生にお願いしてください。"}, {"q": "口座番号を入れても大丈夫ですか。", "a": "入力した口座情報はお使いの端末の中だけに保存され、外部に公開されることはありません。ただし共用の端末をお使いのときは、使い終わったらログアウトしてください。"}, {"q": "別のパソコンで開いたら、設定が空になっていました。", "a": "設定は端末ごとに保存されるため、そのままでは引き継がれません。前の端末で「バックアップをダウンロード」したファイルを、新しい端末の「バックアップから復元」で読み込んでください。"}]}, "tasks": {"summary": "その月にやることを自動で表示する画面です。システムに記録があるものは自動で「記録あり」になり、それ以外はチェックで完了にできます。年間の一覧も確認できます。", "steps": ["画面の上で、確認したい月を選びます。", "「毎月やること」を上から順に確認します。", "その月だけのタスクを右側で確認します。", "「開く」を押して、その記録の画面へ移動します。", "終わったものはチェックを入れて完了にします。"], "tips": ["身体測定や避難訓練など、システムに記録があるものは自動で「記録あり」になります。手作業でのチェックは不要です。", "月初にこの画面を開いて、その月にやることをひととおり見ておくと、提出忘れを防げます。", "「なぜ必要か」の一文に、監査での位置づけが書いてあります。判断に迷ったときの参考にしてください。", "下の年間一覧で、来月以降の予定も先に確認できます。"], "faq": [{"q": "チェックを入れ忘れると、どうなりますか。", "a": "未完了として赤い印のまま残ります。ダッシュボードの監査カードにも未了として表示されますので、気づいたときにチェックしてください。"}, {"q": "自動で「記録あり」になる条件は何ですか。", "a": "その月の記録がシステムに保存されているかを見ています。たとえば身体測定はその月の測定記録、避難訓練はその月の実施記録があるかどうかで判定します。"}, {"q": "園独自のタスクを追加できますか。", "a": "現在は決まった一覧の表示のみです。追加が必要な場合は、開発担当にご相談ください。"}]}};
var helpOpen=false;
function helpFor(page){return HELP_DATA[page]||null;}
function initHelp(){
  if(document.getElementById('helpPanel'))return;
  var p=el('div',{id:'helpPanel'});document.body.appendChild(p);
  document.addEventListener('click',function(e){
    if(!helpOpen)return;
    if(e.target.closest&&(e.target.closest('#helpPanel')||e.target.closest('#helpBtn')))return;
    helpOpen=false;p.classList.remove('open');
  });
}
function renderHelpButton(page){
  var bar=document.querySelector('.topbar');if(!bar)return;
  var old=document.getElementById('helpBtn');if(old)old.remove();
  if(!helpFor(page))return;
  var b=el('button',{id:'helpBtn',title:'この画面の使い方'},'?');
  var crumbBox=bar.firstElementChild;
  if(crumbBox&&crumbBox.parentNode===bar){
    var wrap=document.getElementById('helpWrap');
    if(!wrap){wrap=el('span',{id:'helpWrap'});wrap.style.cssText='display:inline-flex;align-items:center;margin-left:10px;';crumbBox.appendChild(wrap);}
    wrap.innerHTML='';wrap.appendChild(b);
  }else bar.appendChild(b);

給をお願いします。", "manualKeyword": "熱中症"}, {"id": "nosebleed", "title": "鼻血", "triggers": ["鼻血", "はなぢ", "鼻血が出た", "鼻から血", "鼻をぶつけた"], "urgency": "様子見", "immediate": ["座らせて少し前かがみにし、顔をやや下向きにする（血をのどに流し込まない）", "小鼻（鼻の柔らかい部分）を左右からしっかりつまんで5〜10分圧迫する", "上を向かせない・首の後ろを叩かない・ティッシュを奥まで詰めない", "冷たいタオルで鼻の付け根を冷やしてもよい", "出血時刻・量・繰り返しの有無を記録し、止まりにくい・繰り返す場合は保護者へ連絡する"], "call119": "15〜20分圧迫しても止まらない／出血量が非常に多い／頭部や顔面を強く打った後の鼻血／繰り返し出る・大量の鼻血は受診。ぐったりする場合は救急要請。", "parentTalk": "いつ・どのくらい出て、どう対応して止まったかを伝え、繰り返す・止まりにくい場合は受診をお願いします。", "manualKeyword": "鼻血（鼻出血）"}], "parentGuides": [{"id": "injury-under-care", "situation": "園の管理下でお子様に怪我をさせてしまった時（擦り傷・打撲など）", "howto": ["まず「状況説明」と「お詫び」を先に述べる。園でお預かりしている中で起きたことへの責任ある姿勢を最初に示す", "事実を時系列で正確に伝える（いつ・どこで・どんな活動中に・どう起きて・どう対応したか）。『たぶん』『〜だと思う』といった憶測や個人の感想は避ける", "行った応急手当の内容を具体的に伝える（例：流水で洗い冷やした 等）。医療的な診断・判断は行わず、園の対応事実のみを述べる", "現在のお子様の様子（患部の状態・機嫌・受け答え・食欲）を具体的に報告する", "頭部・腹部の打撲、意識・嘔吐・けいれん・止まらない出血などがある場合は『大丈夫』と自己判断せず、園の危機管理マニュアルに従い嘱託医・かかりつけ医への受診や救急要請、保護者への即時連絡を行う", "発生時刻・状況・対応・受診結果を事故記録簿に残し、園内で共有して再発防止につなげる", "保護者の心情に配慮し、質問には誠実に答える。今後の見守り・再発防止の視点も添える"]}, {"id": "child-to-child-trouble", "situation": "子ども同士のトラブル（噛みつき・ひっかき・叩く・玩具の取り合い等）", "howto": ["被害を受けた側の保護者へは、事実（時間・場所・状況・園の対応）を正確に伝え、まずお詫びと患部の状態を説明する", "相手の子どもの実名は原則出さない。『お友達との関わりの中で』と表現し、双方のプライバシーに配慮する", "発達段階でよくある行動であっても『よくあることなので』と軽く扱わず、園として防げなかった点を誠実に伝える", "背景（場所の取り合い・眠かった等）は『感想』ではなく、観察した事実として簡潔に添える", "加害側の保護者へ伝える場合も、叱責でなく事実の共有と、家庭での関わりを一緒に考える姿勢にする", "双方の保護者へ一貫した事実を伝え、園内で記録・共有して対応を統一する", "園として関わり方や環境設定を見直し、再発防止に努める旨を伝える"]}, {"id": "fever-pickup-request", "situation": "発熱・体調不良でお迎えを依頼する時", "howto": ["体温・測定時刻・機嫌・食欲・具体的な症状（咳・嘔吐・下痢・発疹など）を客観的に伝える", "園の登園・お迎え基準（園規定の体温など）に沿って連絡していることを添える", "『大丈夫そう』などの安易な判断や過度な安心を与えず、経過観察が必要な状態であることを冷静に伝える", "感染症が疑われる場合は、園規定に沿って受診や登園許可証の必要性を案内する（診断は医師に委ねる）", "お迎えまでの間も落ち着いて見守る。ぐったり・呼吸が苦しそう・繰り返す嘔吐・けいれん等の悪化があれば救急要請と、かかりつけ医・保護者への即時連絡を行う", "保護者の就労状況に配慮を示しつつ、お子様の体調を最優先にする姿勢を伝える", "帰宅後に症状が続く・強くなる場合はかかりつけ医への受診を検討いただくよう促す"]}, {"id": "belongings-request", "situation": "持ち物・忘れ物・記名などをお願い／相談する時", "howto": ["何が・いつ・どれくらい必要かを具体的に、分かりやすく伝える", "責める口調を避け、家庭の負担にも配慮した『お願い』の形にする。準備が難しい時は園でも対応する旨を添える", "記名のお願いなど繰り返しの依頼は、個人を責める形でなく園全体のお知らせとして角が立たないようにする", "高価な物や思い出の品を紛失した時は、事実と園の探索状況を正直に伝え、お詫びする"]}, {"id": "developmental-concern", "situation": "発達や気になる様子について保護者に相談する時", "howto": ["『診断』は行わない。園で観察した具体的な行動・場面を事実として伝える（専門的な判断は専門機関に委ねる）", "一方的な指摘でなく、家庭での様子を伺いながら一緒に考える姿勢をとる", "保護者が不安になりすぎないよう、できていること・成長している面も併せて伝える", "必要に応じて、園の巡回相談・自治体窓口・専門機関の利用を、保護者の意向を尊重しながら案内する", "面談は落ち着いて話せる時間と場所を用意し、記録に残して園内で共有する"]}, {"id": "allergy-response", "situation": "食物アレルギー対応・誤食が疑われる時", "howto": ["食物アレルギーは、必ず生活管理指導表・個別対応票に基づいて対応し、園の献立と照合する", "誤食・誤飲が疑われる時は、まずお子様の状態を観察し、園の緊急時対応マニュアル・主治医の指示に従う", "呼吸困難・全身のじんましん・繰り返す嘔吐・ぐったりなどアナフィラキシーが疑われる症状があれば、ためらわず救急要請（119）と主治医・保護者への連絡を行う", "薬（エピペン等）は具体的な薬剤名・量を職員が独自に判断せず、主治医の指示・個別対応票に従って対応する", "発生後は保護者へ事実（何を・どれくらい・いつ・症状・園の対応・受診の有無）を正確に伝え、記録に残す", "対応内容を園内で共有し、献立確認や配膳手順など再発防止を見直す"]}, {"id": "head-injury-judgment", "situation": "頭を打った・高い所から転落など受診判断に迷う時", "howto": ["打った部位・おおよその高さ・状況・時刻を正確に記録し、その後の様子を継続して観察する", "頭部・腹部の打撲は受傷直後に異常がなくても後から症状が出ることがあるため、『大丈夫』と即断しない", "意識がおかしい・嘔吐を繰り返す・けいれん・顔色が悪い・出血が止まらない等があれば、救急要請とかかりつけ医・嘱託医への相談を最優先にする", "判断に迷う場合は園の危機管理マニュアルに従い、嘱託医・保護者へ相談のうえ受診を検討する", "保護者へは家庭での観察ポイントを伝えつつ、園で医療的な指示を代替せず、受診先の医師の指示に従う旨を明確にする"]}, {"id": "emergency-choking-collapse", "situation": "窒息・意識消失など一刻を争う緊急時", "howto": ["お子様の反応・呼吸・顔色を確認し、大声で応援を呼び、役割分担して119通報を最優先に行う", "窒息時は年齢に応じた対応（乳児は背部叩打法・胸部突き上げ法、幼児は腹部突き上げ法など、園の救命講習・マニュアルに沿う）を行い、改善しなければ直ちに救急要請する", "反応・呼吸がなければ、園の研修内容に沿って心肺蘇生を開始し、AEDを手配する", "具体的な手技は必ず園の救命講習・危機管理マニュアルに基づいて行い、独自判断で薬剤等を用いない（個別の薬は主治医の指示・個別対応票に従う）", "対応と並行して保護者へ連絡し、状況と搬送先を伝える", "落ち着いてから、時系列の事実を正確に記録に残し、園内・関係機関で共有する"]}, {"id": "our-child-caused-injury", "situation": "自園のお子様が他児を怪我させてしまった側の保護者へ連絡する時", "howto": ["事実（時間・場所・状況・園の対応）を、叱責ではなく共有として正確に伝える", "相手の子どもの実名や詳細な個人情報は伝えない", "家庭を一方的に責めず、園でも防止に努める姿勢と、家庭での関わりを一緒に考える提案をする", "発達段階の一般的な傾向として理解しつつ、『仕方ない』と流さず誠実に向き合う", "対応と経過を記録し、園内で共有する"]}, {"id": "toileting-accident", "situation": "お漏らし・排泄の失敗などデリケートな連絡をする時", "howto": ["お子様の自尊心に配慮し、園では責めずに落ち着いて対応したことを伝える", "事実を簡潔に、明るすぎず重すぎないトーンで共有する", "下痢・頻尿など体調のサインの可能性があれば観察を続け、必要なら受診を勧める", "着替えの補充など具体的なお願いは、負担に配慮した依頼の形にする"]}], "parentTemplates": [{"id": "injury-minor", "label": "怪我のご連絡（軽症・園内で対応済み）", "body": "〔保護者名〕様\n\nいつもお世話になっております。〔園名〕〔担任名〕です。\n本日〔時間〕頃、〔場所・活動〕の際に、〔お子様〕が〔状況（例：走っていて転倒し）〕、〔部位〕を〔怪我の内容（例：擦りむき）〕ました。お預かりしている中でのことで、申し訳ございません。\n\n園ではすぐに〔応急手当の内容（例：流水で洗い、冷やしました）〕を行いました。その後の〔お子様〕は、〔現在の様子（例：機嫌よく過ごし、痛がる様子は落ち着いています）〕。\n\nお迎えの際に患部をご確認いただき、ご帰宅後も様子を見ていただけますと幸いです。気になる変化がありましたら、遠慮なくお知らせください。"}, {"id": "injury-medical", "label": "怪我のご連絡（受診の経過・お願い）", "body": "〔保護者名〕様\n\nお世話になっております。〔園名〕〔担任名〕です。緊急でご連絡いたします。\n本日〔時間〕頃、〔場所・活動〕の際に、〔お子様〕が〔状況〕、〔部位〕を〔怪我の内容〕ました。園での出来事で、ご心配をおかけし申し訳ございません。\n\n園で〔応急手当の内容〕を行い、〔嘱託医／かかりつけ医〕へ相談のうえ、〔受診状況（例：◯◯医院を受診しました／受診をお願いしたく存じます）〕。〔医師の指示があれば記載〕。\n\nつきましては、〔お迎え・受診同行等のお願い〕についてご相談させてください。お手数をおかけしますが、〔連絡先〕までご連絡いただけますでしょうか。今後の様子や通院については、受診先の指示に従ってまいります。"}, {"id": "fever-pickup", "label": "発熱によるお迎えのお願い", "body": "〔保護者名〕様\n\nお世話になっております。〔園名〕〔担任名〕です。\n〔時間〕に〔お子様〕の体温を測ったところ〔体温〕℃で、〔症状（例：少し元気がなく、頬が赤い様子）〕が見られます。園の基準に沿って、お迎えをお願いしたくご連絡いたしました。\n\n現在は〔今の様子〕で、静かな場所で休んで過ごしています。お忙しいところ恐れ入りますが、お迎えのご都合をお知らせいただけますでしょうか。\nお迎えまでの間も様子を見守り、変化がありましたら改めてご連絡いたします。ご帰宅後、症状が続く・強くなるようでしたら、かかりつけ医へのご受診をご検討ください。"}, {"id": "absence-thanks", "label": "欠席連絡へのお礼・お見舞い", "body": "〔保護者名〕様\n\nご連絡ありがとうございます。〔お子様〕の欠席、承りました。\n〔症状・診断名があれば記載〕とのこと、どうぞご無理なさらず、ゆっくり休養なさってください。〔お子様〕の回復を職員一同願っております。\n\n登園の再開は、〔お子様〕の体調と、必要な場合は医師の指示に合わせてご判断ください。〔登園許可証が必要な感染症の場合の案内〕。ご不明な点がありましたら、いつでもお問い合わせください。お大事になさってください。"}, {"id": "event-notice", "label": "行事のご案内", "body": "〔保護者名〕様\n\nいつもお世話になっております。〔園名〕です。\nこのたび、下記のとおり〔行事名〕を開催いたします。〔お子様〕の成長を一緒に見守る機会となりましたら幸いです。\n\n・日時：〔日付〕〔時間〕\n・場所：〔場所〕\n・持ち物：〔持ち物〕\n・お願い：〔服装・駐車場・提出物など〕\n\nご不明な点や参加のご都合につきましては、〔期日〕までに〔連絡方法〕でお知らせください。皆さまのご参加をお待ちしております。"}, {"id": "peer-trouble", "label": "お友達との関わりでの怪我のご連絡", "body": "〔保護者名〕様\n\nお世話になっております。〔園名〕〔担任名〕です。\n本日〔時間〕頃、〔場所・活動〕の中で、お友達との関わりの際に、〔お子様〕の〔部位〕に〔状態（例：ひっかき傷）〕ができました。お預かりしている中で防ぎきれず、申し訳ございません。\n\n園ではすぐに〔対応内容〕を行い、その後は〔現在の様子〕です。園として関わり方や環境を見直し、再発防止に努めてまいります。ご帰宅後も患部の様子をご確認いただき、気になる点がありましたらお知らせください。"}, {"id": "symptom-observation", "label": "体調の変化についてのご連絡（経過観察）", "body": "〔保護者名〕様\n\nお世話になっております。〔園名〕〔担任名〕です。\n本日〔時間〕頃から、〔お子様〕に〔症状（例：軽い咳、食欲がいつもより少ない様子）〕が見られました。現在の体温は〔体温〕℃で、今のところ〔今の様子〕で過ごしています。\n\nすぐにお迎えが必要な状態ではありませんが、念のためお知らせいたします。園でも引き続き様子を見守り、変化があれば改めてご連絡いたします。ご帰宅後も様子を見ていただき、気になるようでしたらかかりつけ医へのご相談をご検討ください。"}, {"id": "belongings", "label": "持ち物についてのお願い", "body": "〔保護者名〕様\n\nいつもお世話になっております。〔園名〕〔担任名〕です。\n〔お子様〕の〔持ち物（例：着替え／おむつ／連絡帳）〕が〔状況（例：残りが少なくなっています／本日見当たりませんでした）〕。お手数をおかけしますが、〔対応のお願い（例：明日ご持参いただけますでしょうか）〕。\n\nご準備が難しい場合は園でも対応いたしますので、ご相談ください。また、持ち物へのお名前のご記入にご協力いただけますと助かります。よろしくお願いいたします。"}, {"id": "allergy-check", "label": "アレルギー対応の確認のお願い", "body": "〔保護者名〕様\n\nお世話になっております。〔園名〕です。\n〔お子様〕の食物アレルギー対応について、より安全にお預かりするため、〔生活管理指導表／個別対応票〕の内容を確認させていただきたくご連絡いたしました。\n\n〔確認事項（例：除去食の範囲、主治医の指示内容、緊急時の対応方法）〕について、最新の状況を教えていただけますでしょうか。緊急時の対応やお薬については、主治医の指示・個別対応票に沿って進めてまいります。ご面談のお時間を〔候補日〕で調整いただけますと幸いです。"}, {"id": "emergency-call", "label": "緊急時のご連絡（救急要請）", "body": "〔保護者名〕様\n\n〔園名〕〔担任名〕です。緊急のご連絡です。\n〔時間〕頃、〔お子様〕に〔状況（例：強くぶつけて、反応が普段と異なる様子）〕があり、園の危機管理マニュアルに従い、救急要請（119）を行いました。現在〔対応状況（例：救急隊が到着し、◯◯病院へ搬送予定です）〕。\n\n〔搬送先／集合場所〕へお越しいただけますでしょうか。詳しい状況は、この電話で続けてお伝えします。まずは落ち着いて、お気をつけてお越しください。"}], "activities": [{"id": "rainy-indoor", "label": "雨の日の室内あそび", "ideas": ["新聞紙ビリビリあそび：破く感触と音を楽しみ、手指の力を育てる", "新聞紙プール：ちぎった紙に全身でうもれ、開放感を味わう", "段ボールハウス・トンネルづくり：入る・くぐる空間あそびで探索心を育む", "風船バレー：落とさず追いかけ、全身運動と目と手の協応を養う", "室内サーキット（マット・平均台・トンネル）：雨天でも運動欲求を満たす", "手作りボウリング（ペットボトル）：ねらって倒し、数への興味を育てる", "宝さがしゲーム：室内に隠したものを探し、観察力・集中力を育てる", "スズランテープのれんくぐり：かき分けてくぐる感触あそびを楽しむ", "手あそび・わらべうた：注目を集め、落ち着いて皆で楽しむ", "お絵かき・自由画：思いを自由に表現し、気持ちを発散する"]}, {"id": "sunny-outdoor", "label": "晴れた日の戸外あそび", "ideas": ["しゃぼん玉あそび：追いかけながら風や光の変化を感じる", "色水あそび：花や絵の具で色が変わる不思議を楽しむ", "虫さがし（ダンゴムシ・アリ）：身近な生き物に興味を持ち、いのちに触れる", "かけっこ・鬼ごっこ：思いきり走り、体力とルール理解を育てる", "砂場でごちそうづくり：見立て・つもりあそびで想像力を広げる", "散歩・自然観察：季節の移ろいや町の様子に気づく", "どろんこあそび：ダイナミックに感触を味わい開放感を得る", "鉄棒・のぼり棒に挑戦：全身の力とバランス感覚を養う", "花・葉っぱ集め：自然物への興味と集める喜びを味わう", "影ふみあそび：太陽と影の関係に気づき、体を動かす"]}, {"id": "spring-craft", "label": "春の製作・活動（3〜5月）", "ideas": ["ちょうちょ製作（にじみ絵）：春の生き物に親しみ、色の広がりを楽しむ", "こいのぼり製作：伝統行事に触れ、健やかな成長を願う", "たんぽぽ・つくしの壁面づくり：春の草花に興味を持つ", "母の日・父の日の似顔絵：身近な人へ感謝の気持ちを表す", "野菜苗・種まき（栽培活動）：世話をする心と生長を待つ楽しみを育てる", "いちご製作（指スタンプ）：旬の果物に親しみ、指先を使う", "手形・足形アート：進級や成長の記録を残す", "チューリップの折り紙：折る手順を楽しみ、達成感を味わう"]}, {"id": "summer-water", "label": "夏の製作・水あそび（6〜8月）", "ideas": ["水あそび・プール：水の感触を全身で味わい、開放感を楽しむ", "色水ジュース屋さん：混色の変化とやりとりあそびを楽しむ", "氷あそび：冷たさ・溶ける変化を五感で感じる", "あじさい製作（花紙まるめ）：梅雨の花に親しみ、手指を使う", "すいか・かき氷製作：夏の食べ物に親しみ、季節を感じる", "魚つりごっこ（プール）：ねらって取る集中力を育てる", "うちわ・七夕かざり製作：季節の行事に触れ、願いを込める", "泥・砂のダイナミック感触あそび：素材を存分に味わい発散する"]}, {"id": "autumn-nature", "label": "秋の製作・自然あそび（9〜11月）", "ideas": ["どんぐり・落ち葉ひろい：自然物を集め、季節の変化に気づく", "落ち葉のスタンプ・貼り絵：形や色の違いを見比べて楽しむ", "どんぐりマラカス：自然物で音の出る玩具を作り鳴らす", "さつまいも掘り：収穫の喜びと食べ物への関心を育てる", "みのむし・とんぼ製作：秋の生き物に親しむ", "お月見だんご製作：伝統行事の由来に触れる", "まつぼっくりツリー・けん玉づくり：自然物を使った玩具で遊ぶ", "焼きいもごっこ（新聞紙）：季節の食を見立てて楽しむ"]}, {"id": "winter-craft", "label": "冬の製作・あそび（12〜2月）", "ideas": ["雪あそび・氷の観察：冬ならではの自然を体感する", "手袋・マフラー製作：冬の衣服に親しみ、寒さに気づく", "鏡もち・門松製作：お正月の伝統に触れる", "雪だるま・雪の結晶かざり：冬の風物を表現する", "節分の鬼のお面づくり：伝統行事を知り、豆まきを楽しむ", "凧づくり・凧あげ：昔あそびを体験し、戸外で走る", "福笑い・こま・かるた：正月の伝承あそびに親しむ", "ポカポカスープごっこ：温かい食べ物を見立てて楽しむ"]}, {"id": "age-0-1", "label": "0・1歳児向けあそび", "ideas": ["いないいないばあ：人と関わる楽しさと安心感を知る", "感触あそび（寒天・小麦粉ねんど）：素材に触れ、五感を刺激する", "音の出るおもちゃふり：手の動きと音の関係に気づく", "ハイハイ・つかまり立ちのマット山：全身を使い運動発達を促す", "ふれあいわらべうた：スキンシップで情緒の安定を育む", "ボール転がし：追視と手を伸ばす動きを促す", "びりびり紙あそび：破く感触と音を楽しむ", "型はめ・入れる出す：手指の巧緻性を育てる"]}, {"id": "age-2", "label": "2歳児向けあそび", "ideas": ["シール貼り：位置を決めて貼る指先の操作を楽しむ", "なぐり描き・クレヨンあそび：描く楽しさと自己表現を味わう", "おままごと・見立てあそび：イメージを共有し、言葉を育てる", "大きな紙にダイナミックお絵かき：全身で表現し発散する", "粘土あそび（丸める・ちぎる）：手指の力と創造性を育てる", "ジャンプ・階段のぼり：粗大運動でバランスを養う", "簡単な手あそび歌：模倣とリズムを楽しむ", "のりで貼る製作：素材をくっつける面白さを知る"]}, {"id": "age-3", "label": "3歳児向けあそび", "ideas": ["はさみで一回切り・連続切り：道具の扱いに慣れ、集中する", "だるまさんがころんだ：簡単なルールを守って遊ぶ楽しさを知る", "折り紙（三角・四角折り）：手順に沿って折る達成感を味わう", "お店屋さんごっこ：役割を分け、言葉のやりとりを楽しむ", "リズム運動・模倣ダンス：音に合わせて体を動かす", "なぞなぞ・言葉あそび：言葉への関心を広げる", "色・形の仲間分け：認識力と考える力を育てる", "種から育てる栽培活動：世話をし、生長を観察する"]}, {"id": "age-4-5", "label": "4・5歳児向けあそび", "ideas": ["ドッジボール・リレー：ルール理解と協力・競争の面白さを味わう", "協同製作（大型ダンボール工作）：友だちと相談し作り上げる", "かるた・すごろく：文字や数への興味を育てる", "縄跳び・鉄棒に挑戦：目標を持ってやり遂げる力を育む", "実験あそび（混色・浮く沈む）：予想し確かめる科学的思考を養う", "劇あそび・合奏：役割を担い、表現する喜びを味わう", "地図・宝さがしゲーム：考えて行動する力を育てる", "クッキング（おにぎり・白玉）：食への関心と協同の達成感を得る"]}, {"id": "seasonal-events", "label": "季節の行事（夏祭り・運動会・ハロウィン・クリスマス 等）", "ideas": ["夏祭りごっこ（おみこし・盆踊り・屋台）：地域文化に親しみ、祝う楽しさを味わう", "運動会（かけっこ・玉入れ・親子競技）：成長を発揮し達成感を味わう", "ハロウィンパーティー（仮装・お菓子めぐり）：異文化に触れ、変身を楽しむ", "クリスマス会（サンタ・製作・プレゼント）：わくわく感と季節を祝う", "七夕まつり（短冊・笹かざり）：願いを込め、伝統に触れる", "お正月あそび会（もちつき・福笑い）：日本の伝統文化を体験する", "節分・豆まき会：行事の由来を知り、厄払いを楽しむ", "ひなまつり会：伝統行事に親しみ、成長を祝う", "誕生日会：一人ひとりの成長を皆で祝う", "生活発表会・お遊戯会：日頃の育ちを表現し、自信を育む"]}, {"id": "english-activities", "label": "英語で楽しむ活動", "ideas": ["Hello Song / あいさつの歌：英語の音とリズムに親しむ", "色・数の英語ゲーム（Red, Blue, One, Two）：身近な言葉を英語で知る", "動物まねっこ（Animal actions）：単語と動作を結びつけて楽しむ", "英語絵本の読み聞かせ：物語を通して英語の響きに触れる", "Head, Shoulders, Knees and Toes：歌いながら体の部位を覚える", "フルーツバスケット（英語版）：単語を使ったゲームで友だちと交流する", "天気の英語（Sunny, Rainy, Cloudy）：日常と結びつけて言葉を覚える", "チャンツ・ダンス：英語のリズムにのって体を動かす"]}, {"id": "music-rhythm", "label": "音楽・リズム・表現あそび", "ideas": ["リトミック（歩く・止まる・走る）：音の変化を感じ体で表現する", "手作り楽器の合奏（マラカス・タンバリン）：音を合わせる楽しさを味わう", "季節のうた・歌あそび：歌を通して季節や生活を感じる", "動物・乗り物になりきり表現：イメージを体で自由に表す", "スカーフ・リボンあそび：音楽に合わせひらひら動かし表現を楽しむ", "まねっこリズム（手拍子・足踏み）：リズム感と模倣する力を育てる", "パラバルーン：友だちと息を合わせ一体感を味わう", "ペープサート鑑賞：物語の世界に親しみ想像を広げる"]}], "careTips": [{"id": "tip-special-care", "topic": "配慮が必要な子への関わり方", "guidance": ["「困った子」ではなく「困っている子」という視点で見てみる。行動の裏にある本人の気持ちや理由を探る姿勢を大切に。", "できないことより、今できていることや得意なことに目を向け、小さな成長を具体的な言葉にして伝える。", "指示は一度に一つ、短く具体的に。「片付けてね」より「積み木を箱に入れようね」など、その子に伝わりやすい言い方を試す。", "次に何をするかを、絵カードや実物を使って事前に知らせ、見通しが持てるようにする。", "担任だけで抱え込まず、園全体・保護者・必要に応じて専門機関と情報を共有し、その子に合った関わりをチームで探る。", "体調や気分でその日の状態は変わるもの。「昨日できたのに」と比べず、今日のその子に合わせて関わる。"]}, {"id": "tip-biting", "topic": "かみつき・ひっかきへの対応", "guidance": ["まずは噛まれた・ひっかかれた子の手当てと気持ちのケアを最優先に。大人が落ち着いて対応する。", "噛んだ子を強く叱るより、「〇〇したかったんだね」と気持ちを代弁したうえで、「噛むと痛いよ」と短く伝える。", "言葉で気持ちを表しにくい時期に起きやすい。「かして」「いや」など、代わりの言葉やサインを一緒に練習してみる。", "起きた時間・場所・状況を記録し、取り合い・空腹・眠い時間帯などパターンを探ると予防につながる。", "玩具の数を増やす、コーナーを分ける、切り替え時に余裕を持たせるなど、環境面から起きにくくする工夫を。", "保護者にはどちらの子の名前も伝えないのが基本。園としての対応と再発防止の姿勢を丁寧に説明する。"]}, {"id": "tip-iyaiya", "topic": "イヤイヤ期（自我の育ち）への関わり", "guidance": ["「イヤ」は成長の証。困った行動ではなく、自分でやりたい気持ちの芽生えとして受けとめてみる。", "「ダメ」で止めるより、「こっちとこっち、どっちにする?」と選べる場面をつくると、自分で決めた満足感が得られやすい。", "気持ちが高ぶっている時は説得より、まず「イヤだったね」と受けとめ、落ち着くのを待つ。", "時間に余裕を持たせ、「あと一回やったらおしまいね」など、本人が納得できる区切りを一緒に決める。", "切り替えられた時・できた時はすかさず具体的にほめる。「自分で靴はけたね」と行動を言葉にする。", "毎日続くと大人も疲れるもの。職員同士で交代したり、気持ちを共有し合いながら関わる。"]}, {"id": "tip-eating", "topic": "食が細い子・偏食への対応", "guidance": ["食事の量や好みには個人差が大きい。「全部食べる」を目標にせず、食べる楽しさを感じられることを大切に。", "最初から少なめに盛り、「食べられた」経験を積めるように。おかわり制にすると自信につながることも。", "無理強いは逆効果になりやすい。ひと口かじれた、皿にのせられた、という小さな一歩も認めていく。", "苦手な食材は調理法や見た目を変えたり、友だちや保育者が美味しそうに食べる姿を見せてみる。", "遊び疲れや体調、時間帯でも食欲は変わる。その日の様子に合わせて柔軟に対応する。", "家庭での様子も聞きながら園と歩調を合わせる。極端な偏食は必要に応じて栄養士や専門機関と連携。"]}, {"id": "tip-transition", "topic": "場面の切り替えが苦手な子への支援", "guidance": ["突然の「おしまい」は不安になりやすい。「時計の針が上にきたらお片付け」など事前の予告で見通しを持たせる。", "終わりが本人に分かる形で。タイマー、歌、絵カードなど、その子に合った合図を見つける。", "遊びに没頭している時ほど切り替えにくい。「あと3回すべったらごはんね」と本人と一緒に区切りを決める。", "次の活動が楽しみになる声かけを。「お片付けしたら、大好きな絵本の時間だよ」。", "切り替えられた時は「自分で止められたね」とその頑張りを認める。うまくいかない日があっても責めない。", "一斉の切り替えが難しい子には、少し早めに声をかける、個別に付き添うなど、その子のペースを尊重する。"]}, {"id": "tip-slow-development", "topic": "発達がゆっくりな子への声かけ", "guidance": ["月齢や周りの子と比べず、その子自身の「昨日からの一歩」に目を向ける。", "言葉はゆっくり、短く、具体的に。ジェスチャーや実物、絵を添えると伝わりやすい。", "反応や理解に時間がかかることもある。答えを急かさず、待つ時間を大切にする。", "できたことはその場ですぐ・具体的にほめる。成功体験の積み重ねが自信と次への意欲になる。", "「〇〇しない」より「〇〇しようね」と、してほしい行動を肯定形で伝える。", "保護者は不安を抱えていることも。園での小さな育ちの姿を具体的に共有し、一緒に喜べる関係を築く。必要に応じて専門機関と連携。"]}, {"id": "tip-separation-anxiety", "topic": "分離不安・泣いて登園する子への対応", "guidance": ["泣くのは愛着が育っている証。「泣かないで」より「さみしいね、ママ大好きだもんね」と気持ちを受けとめる。", "保護者と離れる場面はだらだら長引かせず、笑顔で短く見送れるよう保護者にも協力をお願いする。", "抱っこやスキンシップで安心できる子も。無理に遊びへ誘わず、まずは安心できる大人のそばで過ごせるように。", "好きな遊びや、家から持ってきた安心グッズ（タオル等）が支えになることもある。", "「お迎えは必ず来る」という見通しを繰り返し優しく伝える。泣き止んだ後の様子も保護者に共有すると安心につながる。", "慣れるまでの時間は子どもによってさまざま。焦らず、その子のペースを見守る。"]}, {"id": "tip-nap", "topic": "午睡（お昼寝）が苦手な子への配慮", "guidance": ["眠りに必要な時間や量は個人差が大きい。「寝かせる」より「体を休める」ことを目標にしてみる。", "静かな環境・カーテン・トントンなど、その子が安心して入眠できる方法を探る。", "どうしても眠れない子には、横になって静かに過ごす、絵本を見るなど、無理に寝かしつけない選択肢も。", "午前中の活動量や生活リズムが影響することも。家庭での睡眠の様子も聞きながら調整する。", "眠くなる時間帯には個人差がある。全員一斉ではなく、眠くなった子から横になれる柔軟さも大切に。", "寝つけない状態が続く時は保護者と情報を共有し、生活リズム全体を一緒に見直す。", "うつ伏せ寝や顔まわりの寝具など、午睡中の安全確認（SIDS予防）はどの子にも欠かさず行う。"]}, {"id": "tip-conflict", "topic": "友だち同士のトラブル・けんかへの関わり", "guidance": ["すぐに止めて裁くより、まず双方の安全を確保し、それぞれの気持ちや言い分を聞く姿勢を持つ。", "「どっちが悪い」を決めるのが目的ではない。お互いの気持ちに気づけるよう、両方の思いを言葉にして橋渡しする。", "自分の気持ちを言葉にするのが難しい年齢・発達もある。「かなしかったのかな?」と代弁しながら整理を手伝う。", "大人が解決を急がず、子ども同士で「かして」「ごめんね」「いいよ」のやりとりが生まれるのを見守る。", "手が出てしまった場合も、行動は止めつつ、その裏にあった気持ちは受けとめる。", "トラブルは育ちのチャンス。悪いことと決めつけず、人との関わりを学ぶ機会として捉える。"]}], "staffTemplates": [{"id": "tmpl-shift-change", "label": "シフト変更のお願い", "body": "お疲れさまです。〇〇（クラス／担当）の【氏名】です。\n\n私事で恐縮ですが、下記の日程についてシフト変更をお願いできないでしょうか。\n\n・対象日：【〇月〇日（〇）】\n・現在のシフト：【　　　】\n・理由：【通院／家庭の事情 など簡単に】\n・補足：【時間帯の希望などあれば】\n\nご都合のつく方がいらっしゃいましたら、【期日】までに【連絡先／記入欄】へお知らせください。急なお願いで申し訳ありませんが、よろしくお願いいたします。"}, {"id": "tmpl-training", "label": "研修・園内研修の案内", "body": "お疲れさまです。下記のとおり研修を実施しますので、ご確認をお願いします。\n\n・テーマ：【　　　】\n・日時：【〇月〇日（〇）〇:〇〜〇:〇】\n・場所：【　　　（オンラインの場合はURL）】\n・対象：【全職員／〇歳児担当 など】\n・持ち物：【筆記用具・資料 など】\n・欠席・遅刻の場合：【期日までに〇〇へ連絡】\n\n当日参加が難しい方には、後日資料の共有と振り返りを行います。学びを日々の保育に活かしていけるよう、よろしくお願いいたします。"}, {"id": "tmpl-hiyari", "label": "ヒヤリハット共有", "body": "お疲れさまです。ヒヤリハットの共有です。責任を追及するものではなく、みんなで再発を防ぐための共有ですので、気づいたことは遠慮なく記録・報告をお願いします。\n\n・発生日時：【〇月〇日（〇）〇:〇頃】\n・場所／場面：【　　　】\n・対象児：【年齢・状況（個人が特定されすぎない範囲で）】\n・どんなことが起きたか：【　　　】\n・ケガの有無：【なし／あり（程度）】\n・その場の対応：【　　　】\n・考えられる原因：【　　　】\n・今後の対策・気をつけたい点：【　　　】\n\n同じ場面は他のクラスでも起こり得ます。朝礼・昼礼でも共有し、環境や動線の見直しにつなげましょう。"}, {"id": "tmpl-monthly-mtg", "label": "月案会議の案内", "body": "お疲れさまです。来月の月案会議を下記のとおり行います。\n\n・日時：【〇月〇日（〇）〇:〇〜】\n・場所：【　　　】\n・議題：\n　1. 今月の子どもの姿・振り返り\n　2. 来月のねらいと活動計画\n　3. 行事・保護者対応の確認\n　4. 配慮が必要な子の情報共有\n　5. その他（各クラスからの提案）\n\n事前に、今月の子どもの様子で共有したいエピソードや、来月やってみたい活動を【期日】までにまとめておいてください。短い時間でも中身の濃い話し合いにできればと思います。よろしくお願いします。"}, {"id": "tmpl-infection", "label": "感染症発生時の共有・注意喚起", "body": "お疲れさまです。園内での感染症について情報共有です。\n\n・病名／症状：【　　　】\n・発生状況：【〇歳児クラスで〇名 など】\n・現在の対応：【消毒・換気・保護者への周知 など】\n・お願いしたいこと：\n　・手洗い・消毒、玩具や共有部分の消毒の徹底\n　・体調不良児の早めの検温と、変化があれば速やかに共有\n　・保護者への登園時の体調確認の声かけ\n\n不安をあおらないよう、保護者へは園で決めた内容で丁寧にお伝えください。状況が変わり次第、追って共有します。"}, {"id": "tmpl-event-roles", "label": "行事準備・役割分担のお願い", "body": "お疲れさまです。【行事名】の準備について、役割分担のお願いです。\n\n・行事名：【　　　】\n・日時：【〇月〇日（〇）】\n・ねらい：【子どもたちにどんな経験をしてほしいか】\n\n【役割・担当（案）】\n　・進行：【　　】\n　・製作・装飾：【　　】\n　・音響・記録（写真）：【　　】\n　・保護者対応・受付：【　　】\n　・当日の安全管理：【　　】\n\n担当や進め方で気づいたこと、変更の希望があれば【期日】までにお知らせください。子どもたちが安心して楽しめる一日になるよう、無理なく協力して進めましょう。"}, {"id": "tmpl-handover", "label": "申し送り・連絡帳記入のお願い", "body": "お疲れさまです。日々の申し送りと連絡帳について、改めてお願いです。\n\n・申し送り：登降園時の子どもの体調・けが・保護者からの伝言は、口頭だけでなく【申し送りノート／アプリ】に必ず記入をお願いします。\n・連絡帳：その日のエピソードはできるだけ具体的に。「元気に過ごしました」だけでなく、遊び・食事・友だちとの関わりなど、保護者が家庭での姿を思い浮かべられる一言を添えて。\n・気になる様子（食欲・機嫌・睡眠など）は、些細なことでも記録・共有を。\n\n伝え漏れは事故や保護者の不安につながります。忙しい時間帯こそ、ひと呼吸おいて確認し合いましょう。"}]};

/* ---- 使い方サポート ---------------------------------------- */
var helpMode=false;                 /* true … 操作の質問モード */
var helpStep=null;                  /* 手順を1つずつ出すときの控え */

/* ヘルプが足したボタンを配線する。aiRender を通らないので自前で行う。 */
function helpWire(){
  var b=$('#aiBody'); if(!b)return;
  b.querySelectorAll('[data-helpnext]:not([data-wired])').forEach(function(btn){
    btn.setAttribute('data-wired','1');
    btn.onclick=function(){btn.disabled=true;helpNextStep();};});
  b.querySelectorAll('[data-helpnav]:not([data-wired])').forEach(function(btn){
    btn.setAttribute('data-wired','1');
    btn.onclick=function(){AI_OPEN=false;$('#aiPanel').classList.remove('open');go(btn.getAttribute('data-helpnav'));};});
  b.querySelectorAll('[data-helpok]:not([data-wired])').forEach(function(btn){
    btn.setAttribute('data-wired','1');
    btn.onclick=function(){btn.disabled=true;aiPush('bot','よかったです。ほかにもあればいつでもどうぞ。');};});
  b.querySelectorAll('[data-helpng]:not([data-wired])').forEach(function(btn){
    btn.setAttribute('data-wired','1');
    btn.onclick=function(){btn.disabled=true;helpEscalate(btn.getAttribute('data-helpng'));};});
  b.querySelectorAll('[data-helpcopy]:not([data-wired])').forEach(function(btn){
    btn.setAttribute('data-wired','1');
    btn.onclick=function(){
      var t=document.getElementById('helpEscBody');
      if(!t)return;
      t.select();
      try{document.execCommand('copy');btn.textContent='コピーしました';}
      catch(e){btn.textContent='選択しました。⌘Cでコピーしてください';}
    };});
  b.scrollTop=b.scrollHeight;
}
function helpRole(){
  var st=(typeof currentStaff==='function')?currentStaff():null;
  return st?st.role:'一般';
}
/* いま開いている画面。go() の引数はローカルなので、画面の状態から判定する。 */
function helpPageNow(){
  var a=document.querySelector('#nav a.active');
  if(a&&a.getAttribute('data-go'))return a.getAttribute('data-go');
  var sec=[].slice.call(document.querySelectorAll('section[data-page]'))
    .filter(function(x){return !x.hidden;})[0];
  return sec?sec.getAttribute('data-page'):'home';
}
function helpTitle(p){
  if(HELP_KB[p])return HELP_KB[p].t;
  if(typeof TITLES!=='undefined'&&TITLES[p])return TITLES[p][1];
  return p;
}
/* 聞かれたことを控える。どの画面が分かりにくいかを後から見るため。 */
function helpLog(q,hit){
  var a=stGet('help_log',[])||[];
  a.push({at:new Date().toISOString().slice(0,16).replace('T',' '),
    q:String(q).slice(0,120), page:helpPageNow(), role:helpRole(), hit:hit?1:0});
  stSet('help_log',a.slice(-300));
}
/* 質問が「操作のこと」かどうかを見る */
function helpIsOperation(q){
  return /(使い方|やり方|どこ|どうやって|方法|操作|できない|わからない|分からない|入力|印刷|出力|保存|設定|登録|変更|削除|表示されない|出ない|エラー|ログイン|パスワード|権限|反映)/.test(q);
}
/* 画面をさがす */
function helpFindPage(q){
  var best=null,bs=0;
  Object.keys(HELP_KB).forEach(function(p){
    var k=HELP_KB[p],hay=k.t+' '+k.can+' '+(k.steps||[]).join(' ')+' '+(k.tips||[]).join(' ');
    var v=aiScore(hay,q)+aiScore(k.t,q)*3;
    /* 先生が実際に使う言葉。ここが当たったら強く採る */
    if(k.kw){
      k.kw.split(' ').forEach(function(w){
        if(w&&w.length>=2&&q.indexOf(w)>-1)v+=6;
      });
    }
    if(v>bs){bs=v;best=p;}
  });
  Object.keys(HELP_SHORT).forEach(function(p){
    var v=aiScore(helpTitle(p)+' '+HELP_SHORT[p],q)+aiScore(helpTitle(p),q)*3;
    if(v>bs){bs=v;best=p;}
  });
  return bs>=2?best:null;
}
function helpAnswer(q){
  /* よく押されるものは、決まった答えを返す */
  if(/この画面の使い方/.test(q)){helpLog(q,1);return helpShowPage(helpPageNow(),false);}
  if(/はじめて/.test(q)){helpLog(q,1);return helpFirstTime();}
  if(/担当者に聞く|有人|人に聞/.test(q)){helpLog(q,1);return helpEscalate(helpPageNow());}
  if(/印刷|出力/.test(q)&&HELP_KB[helpPageNow()]){
    helpLog(q,1);
    aiPush('bot','「'+helpTitle(helpPageNow())+'」で出せるもの\n'+HELP_KB[helpPageNow()].out);
    return helpActions(helpPageNow());
  }
  if(/パスワード/.test(q)){
    helpLog(q,1);
    aiPush('bot','パスワードの変更は、左下の「パスワード変更」から行えます。\n他の方のパスワードを変えるときは、設定 → 職員アカウント で行います（管理者のみ）。');
    return helpActions('settings');
  }
  var p=helpFindPage(q)||helpPageNow();
  helpLog(q,!!helpFindPage(q));
  return helpShowPage(p,!helpFindPage(q));
}
/* 画面の使い方を出す。役割によって出し分ける。 */
function helpFirstTime(){
  var role=helpRole();
  var list=(role==='一般')
   ? [['朝いちばんに','ダッシュボードで「本日の記録」を見て、赤いものから入れます','dashboard'],
      ['毎日の記録','日常チェックで、登園→健康→午睡→安全点検→日報の順に入れます','records'],
      ['保護者から連絡が来たら','保護者DMで返信します。未読はダッシュボードにも出ます','dm']]
   : [['まず園の情報','設定で園名・連絡先を入れます','settings'],
      ['次に職員','職員管理で職員を登録し、設定でログインアカウントを作ります','staff'],
      ['そして園児','生徒台帳で園児を登録します。緊急連絡先は2件必須です','roster'],
      ['毎日の運用','日常チェックを担任の方に入れてもらいます','records'],
      ['監査の準備','監査対応で26項目の状態を管理します','audit']];
  aiPush('bot','はじめての方へ（'+role+'の方向け）');
  var h='';
  list.forEach(function(x,i){h+='<div class="ss" style="margin-bottom:6px;"><b>'+(i+1)+'. '+aiEsc(x[0])+'</b><br>'+aiEsc(x[1])+'</div>';});
  var d=el('div',{class:'ai-sec'},h);
  list.forEach(function(x){d.appendChild(el('button',{'data-helpnav':x[2]},x[0]+' をひらく'));});
  $('#aiBody').appendChild(d);
  helpWire();
}
function helpShowPage(p,guessed){
  var k=HELP_KB[p];
  if(!k){
    var short=HELP_SHORT[p];
    aiPush('bot',(guessed?'いま開いている「'+helpTitle(p)+'」でよろしいでしょうか。\n\n':'')
      +(short||'この画面の詳しい手引きはまだ用意できていません。')
      +'\n\n解決しない場合は、下の「担当者に聞く」からご連絡ください。');
    helpActions(p);
    return;
  }
  var role=helpRole();
  var forMe=(k.role.indexOf(role)>-1);
  var h='<div class="st">'+aiEsc(k.t)+'</div>'
    +'<div class="ss">'+aiEsc(k.can)+'</div>';
  if(!forMe){
    h+='<div class="ss" style="margin-top:6px;color:#854F0B;">この画面は主に「'
      +aiEsc(k.role.join('・'))+'」の方が使います。'
      +(role==='一般'?'見えていない場合は、権限の設定によるものです。':'')+'</div>';
  }
  var d=el('div',{class:'ai-sec'},h);
  $('#aiBody').appendChild(d);
  helpStep={page:p,i:0};
  helpNextStep();
}
function helpNextStep(){
  if(!helpStep)return;
  var k=HELP_KB[helpStep.page];
  if(!k||!k.steps){helpFinish();return;}
  if(helpStep.i>=k.steps.length){helpFinish();return;}
  var n=helpStep.i+1;
  aiPush('bot','【手順 '+n+'／'+k.steps.length+'】\n'+k.steps[helpStep.i]);
  helpStep.i++;
  var d=el('div',{class:'ai-sec'},'');
  var b=el('button',{'data-helpnext':'1'},helpStep.i>=k.steps.length?'手順はここまで':'次の手順 →');
  d.appendChild(b);
  /* 途中でも、その画面を開いたり相談したりできるようにする */
  d.appendChild(el('button',{'data-helpnav':helpStep.page},'この画面をひらく'));
  d.appendChild(el('button',{'data-helpng':helpStep.page},'解決しない'));
  $('#aiBody').appendChild(d);
  helpWire();
}
function helpFinish(){
  var p=helpStep?helpStep.page:helpPageNow();
  var k=HELP_KB[p];
  helpStep=null;
  if(k){
    var h='';
    if(k.tips&&k.tips.length)h+='<div class="ss"><b>つまずきやすい点</b><br>'
      +k.tips.map(function(t){return '・'+aiEsc(t);}).join('<br>')+'</div>';
    if(k.out)h+='<div class="ss" style="margin-top:6px;"><b>出せるもの</b><br>'+aiEsc(k.out)+'</div>';
    if(k.paper)h+='<div class="ss" style="margin-top:6px;"><b>紙で書きたいとき</b><br>'+aiEsc(k.paper)+'</div>';
    if(h)$('#aiBody').appendChild(el('div',{class:'ai-sec'},h));
  }
  helpActions(p);
}
function helpActions(p){
  var d=el('div',{class:'ai-sec'},'<div class="ss">解決しましたか。</div>');
  d.appendChild(el('button',{'data-helpnav':p},'この画面をひらく'));
  d.appendChild(el('button',{'data-helpok':'1'},'解決しました'));
  d.appendChild(el('button',{'data-helpng':p},'担当者に聞く'));
  $('#aiBody').appendChild(d);
  helpWire();
}
/* 有人へ引き継ぐ。何を見ていて、誰が、何に困ったかを添える。 */
function helpEscalate(p){
  var st=(typeof currentStaff==='function')?currentStaff():null;
  var q=(stGet('help_log',[])||[]).slice(-1)[0];
  var body='EduGrow の操作についてのお問い合わせです。\n\n'
    +'【お困りの内容】\n'+((q&&q.q)||'（未入力）')+'\n\n'
    +'【ご利用の状況】\n'
    +'・開いていた画面：'+helpTitle(p)+'\n'
    +'・ご担当：'+(st?st.name+'（'+st.role+'）':'（未ログイン）')+'\n'
    +'・園：'+((stGet('settings',{})||{}).school||'')+'\n'
    +'・日時：'+new Date().toLocaleString('ja-JP')+'\n\n'
    +'このあと、担当よりご連絡いたします。';
  aiPush('bot','担当者への連絡内容をご用意しました。\n開いた画面で送信してください。平日9〜17時に順次ご返信します。');
  var a=stGet('help_esc',[])||[];
  a.push({at:new Date().toISOString().slice(0,16).replace('T',' '),page:p,
    role:helpRole(),q:(q&&q.q)||''});
  stSet('help_esc',a.slice(-100));
  /* 画面を移さず、その場で写せるようにする。
     個別メール送信の画面はテンプレートで本文が上書きされるため、
     こちらから差し込むと消えてしまう。 */
  var d=el('div',{class:'ai-sec'},
    '<div class="ss"><b>担当者への連絡内容</b></div>'
    +'<textarea id="helpEscBody" rows="9" style="width:100%;box-sizing:border-box;margin-top:7px;'
    +'border:1px solid var(--line);border-radius:10px;padding:9px;font-size:12px;'
    +'font-family:inherit;line-height:1.7;">'+aiEsc(body)+'</textarea>'
    +'<div class="ss" style="margin-top:6px;">'
    +'support@edugrow.jp　平日9〜17時に順次ご返信します。</div>');
  d.appendChild(el('button',{'data-helpcopy':'1'},'この内容をコピー'));
  d.appendChild(el('button',{'data-helpnav':'compose'},'メール画面をひらく'));
  $('#aiBody').appendChild(d);
  helpWire();
}

var AI_OPEN=false, aiStarted=false, aiClip=[];
function initAI(){
  if(document.getElementById('aiFab'))return;
  var fab=el('button',{id:'aiFab',title:'保育アシスタント'},'💬<span class="dot"></span>');
  var panel=el('div',{id:'aiPanel'});
  panel.innerHTML='<div class="ai-head"><span style="font-size:20px;">🤖</span><div class="t">EduGrow サポート<small>保育の相談と、使い方の案内</small></div><button id="aiClose">×</button></div>'
    +'<div class="ai-tabs"><button id="aiTabCare" class="on">保育の相談</button><button id="aiTabHelp">使い方</button></div>'
    +'<div class="ai-body" id="aiBody"></div>'
    +'<div class="ai-chips" id="aiChips"></div>'
    +'<div class="ai-foot"><input id="aiInput" placeholder="症状や相談を入力（例：転んで頭を打った）"><button id="aiSend">➤</button></div>'
    +'<div class="ai-note">現場サポート用の知識ベース＋危機管理マニュアル連動。緊急時は必ず119通報・受診・園の指示を優先。将来AI接続で自由会話に対応予定。</div>';
  document.body.appendChild(panel);document.body.appendChild(fab);
  fab.onclick=function(){AI_OPEN=!AI_OPEN;panel.classList.toggle('open',AI_OPEN);var dot=fab.querySelector('.dot');if(dot)dot.style.display='none';if(AI_OPEN&&!aiStarted){aiStarted=true;aiGreet();}};
  $('#aiClose').onclick=function(){AI_OPEN=false;panel.classList.remove('open');};
  $('#aiSend').onclick=aiSubmit;
  $('#aiInput').addEventListener('keydown',function(e){if(e.key==='Enter')aiSubmit();});
  $('#aiTabCare').onclick=function(){helpMode=false;aiTabs();};
  $('#aiTabHelp').onclick=function(){helpMode=true;aiTabs();
    aiPush('bot','使い方をご案内します。\nいま開いているのは「'+helpTitle(helpPageNow())+'」です。\n知りたい操作を入れるか、下のボタンからお選びください。');};
  var chips=['怪我の対応','睡眠中の異変','保護者への伝え方','雨の日の活動','配慮が必要な子','今日のタスク'];
  $('#aiChips').innerHTML=chips.map(function(c){return '<button data-aichip="'+esc(c)+'">'+c+'</button>';}).join('');
  $('#aiChips').querySelectorAll('[data-aichip]').forEach(function(b){b.onclick=function(){if(!AI_OPEN){AI_OPEN=true;panel.classList.add('open');if(!aiStarted){aiStarted=true;aiGreet();}}aiAsk(b.getAttribute('data-aichip'));};});
}
function aiPush(role,html){var b=$('#aiBody');var d=el('div',{class:role==='me'?'ai-msg me':'ai-msg bot'},html);b.appendChild(d);b.scrollTop=b.scrollHeight;}
function aiGreet(){aiPush('bot','保育の現場をサポートします🌿\n・けが／体調の急変など「今すぐの対処」\n・保護者への伝え方や連絡文\n・活動アイデア・配慮のヒント\n・今日やること／提出期限\n下のボタンか、気になる症状・相談をそのまま入力してください。');}
function aiSubmit(){var v=$('#aiInput').value.trim();if(!v)return;$('#aiInput').value='';aiAsk(v);}
function aiAsk(q){
  aiPush('me',aiEsc(q));
  /* 使い方モード、または操作についての質問なら、使い方で答える */
  if(helpMode||helpIsOperation(q)){
    setTimeout(function(){helpAnswer(q);},160);
    return;
  }
  var r=aiRoute(q);setTimeout(function(){aiRender(r);},160);
}
/* タブの見た目と、下のボタンを切り替える */
function aiTabs(){
  var c=$('#aiTabCare'),h=$('#aiTabHelp');
  if(c)c.className=helpMode?'':'on';
  if(h)h.className=helpMode?'on':'';
  var inp=$('#aiInput');
  if(inp)inp.placeholder=helpMode?'操作の質問を入力（例：登園シートの出し方）':'症状や相談を入力（例：転んで頭を打った）';
  var chips=helpMode
    ? ['この画面の使い方','はじめての方へ','監査の準備','印刷のしかた','パスワードを変えたい','担当者に聞く']
    : ['怪我の対応','睡眠中の異変','保護者への伝え方','雨の日の活動','配慮が必要な子','今日のタスク'];
  $('#aiChips').innerHTML=chips.map(function(x){return '<button data-aichip="'+esc(x)+'">'+x+'</button>';}).join('');
  $('#aiChips').querySelectorAll('[data-aichip]').forEach(function(b){b.onclick=function(){
    if(!AI_OPEN){AI_OPEN=true;$('#aiPanel').classList.add('open');if(!aiStarted){aiStarted=true;aiGreet();}}
    aiAsk(b.getAttribute('data-aichip'));};});
}
function aiEsc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function aiScore(hay,q){var t=q.replace(/[はをにがのでとやへも、。・？?！!　\s]+/g,' ').split(' ').filter(function(w){return w.length>=2;});var s=0;t.forEach(function(w){if(hay.indexOf(w)>-1)s++;});return s;}

function kbMatchScenario(q){
  var best=null,bs=0;
  (KB.scenarios||[]).forEach(function(sc){
    var s=0;(sc.triggers||[]).forEach(function(tr){
      if(!tr)return;
      if(q.indexOf(tr)>-1)s+=3;                                   // 完全一致
      else if(tr.length>=3&&q.indexOf(tr.slice(0,-1))>-1)s+=2;    // 語幹一致（青ざめる→青ざめて 等）
    });
    s+=aiScore(sc.title,q);
    if(s>bs){bs=s;best=sc;}
  });
  return bs>=2?best:null;
}
function aiManualByKeyword(kw){
  if(typeof KIKI_SECTIONS==='undefined'||!kw)return [];
  var sc=KIKI_SECTIONS.map(function(s){var hay=s.title+' '+s.body;var v=0;String(kw).split(/[\s・/（）()、,]+/).forEach(function(w){if(w&&w.length>=2&&hay.indexOf(w)>-1)v+=(s.title.indexOf(w)>-1?3:1);});return {s:s,v:v};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;}).slice(0,2);
  return sc.map(function(x){var body=(typeof kikiSubstPlain==='function')?kikiSubstPlain(kikiBody(x.s)):x.s.body;return {id:x.s.id,title:x.s.title,snip:body.replace(/\n+/g,' ').slice(0,150)+'…'};});
}
function aiRoute(q){
  if(/(保護者|伝え方|連絡文|連絡帳|おたより|お便り|謝|クレーム|伝える|伝えたい)/.test(q)) return aiParent(q);
  var sc=kbMatchScenario(q);
  if(sc) return {scenario:sc};
  if(/(活動|あそび|遊び|製作|工作|行事|雨の日|夏祭り|運動会|ハロウィン|クリスマス|ネタ|アイデア|ねらい|プログラム案)/.test(q)) return aiActivities(q);
  if(/(配慮|関わり|かみつき|噛みつき|ひっかき|イヤイヤ|発達|声かけ|落ち着かない|切り替え|多動|癇癪|かんしゃく)/.test(q)) return aiCare(q);
  if(/(職員|スタッフ|先生方|研修|MTG|ミーティング|シフト連絡|周知)/.test(q)) return aiStaff(q);
  if(/(今日|やること|タスク|todo|未記入|提出|期限|準備|リマインド|忘れ|準備物)/i.test(q)) return aiTasks();
  if(/(メール|配信|お知らせ配信|送信)/.test(q)) return {text:'メール作成をサポートします。用途に合わせて開いてください。',nav:[{label:'個別メール',page:'compose'},{label:'全体配信',page:'broadcast'}]};
  if(/(カリキュラム|月案|週案|日案|指導計画|月間|年間計画)/.test(q)) return aiCurriculum();
  return aiTrouble(q);
}
function aiParent(q){
  var g=(KB.parentGuides||[]).map(function(x){return {x:x,v:aiScore(x.situation,q)};}).sort(function(a,b){return b.v-a.v;})[0];
  var tpls=(KB.parentTemplates||[]).map(function(x){return {x:x,v:aiScore(x.label,q)};}).sort(function(a,b){return b.v-a.v;});
  var cards=[];
  if(g&&g.x){cards.push({title:'💬 伝え方のポイント：'+g.x.situation,body:(g.x.howto||[]).map(function(h){return '・'+h;}).join('\n')});}
  var top=tpls.filter(function(t){return t.v>0;}).slice(0,2);if(!top.length)top=tpls.slice(0,2);
  top.forEach(function(t){cards.push({title:'✉️ '+t.x.label,body:t.x.body,buttons:[{label:'コピー',copy:t.x.body},{label:'個別メールを開く',nav:'compose'}]});});
  return {text:'保護者への伝え方をサポートします。事実を時系列で正確に・憶測は避け・まずお詫びと状況説明を。',cards:cards};
}
function aiActivities(q){
  var sets=(KB.activities||[]).map(function(x){return {x:x,v:aiScore(x.label,q)};}).sort(function(a,b){return b.v-a.v;});
  var top=sets.filter(function(s){return s.v>0;}).slice(0,3);if(!top.length)top=sets.slice(0,3);
  var cards=top.map(function(s){return {title:'🎨 '+s.x.label,body:(s.x.ideas||[]).map(function(i){return '・'+i;}).join('\n'),buttons:[{label:'カリキュラムに反映',nav:'curriculum'}]};});
  return {text:'活動アイデアです。年齢・天気・季節で聞くと絞り込めます。',cards:cards,chips:[{label:'雨の日',q:'雨の日の活動'},{label:'夏の製作',q:'夏の製作アイデア'},{label:'行事',q:'行事のアイデア'}]};
}
function aiCare(q){
  var tips=(KB.careTips||[]).map(function(x){return {x:x,v:aiScore(x.topic,q)};}).sort(function(a,b){return b.v-a.v;});
  var top=tips.filter(function(t){return t.v>0;}).slice(0,2);if(!top.length)top=tips.slice(0,2);
  var cards=top.map(function(t){return {title:'🌱 '+t.x.topic,body:(t.x.guidance||[]).map(function(g){return '・'+g;}).join('\n')};});
  return {text:'関わり方のヒントです。その子のペースに合わせて、園やご家庭と連携しながら。',cards:cards};
}
function aiStaff(q){
  var tpls=(KB.staffTemplates||[]).map(function(x){return {x:x,v:aiScore(x.label,q)};}).sort(function(a,b){return b.v-a.v;});
  var top=tpls.filter(function(t){return t.v>0;}).slice(0,3);if(!top.length)top=tpls.slice(0,3);
  var cards=top.map(function(t){return {title:'📣 '+t.x.label,body:t.x.body,buttons:[{label:'コピー',copy:t.x.body}]};});
  return {text:'職員向けの連絡文の雛形です。',cards:cards};
}
function aiTasks(){
  var keys=[['登園シート','rec_登園シート'],['安全点検','rec_安全点検'],['午睡チェック','rec_午睡チェック'],['健康チェック','rec_健康チェック'],['業務日報','rec_日報']];
  var undone=[];keys.forEach(function(k){if(!stGet(k[1],{})[todayISO()])undone.push(k[0]);});
  var lines=['📋 本日（'+fmt(todayISO())+'）'];
  lines.push(undone.length?'🔲 未記録：'+undone.join('・'):'✅ 本日の記録は完了');
  var mk=todayISO().slice(0,7);
  var reminders=[];
  if(!stGet('rec_身体測定',{})[mk])reminders.push('今月の身体測定が未記録です');
  try{if(typeof auditState==='function'){var as=auditState();var pend=Object.keys(as).filter(function(k){return as[k]!=='完了'&&as[k]!=='対応中';}).length;if(pend)reminders.push('監査チェックの未対応項目があります');}}catch(e){}
  reminders.push('避難訓練は毎月1回。今月の実施記録をご確認ください');
  if(reminders.length){lines.push('');lines.push('⏰ 準備・確認：');reminders.forEach(function(r){lines.push('・'+r);});}
  return {text:lines.join('\n'),nav:[{label:'日常記録',page:'records'},{label:'避難訓練',page:'drill'},{label:'提出書類ナビ',page:'reqnav'},{label:'監査対応',page:'audit'}]};
}
function aiCurriculum(){
  var t='🗓 今月のカリキュラム（'+(CUR.month||curMonthKey())+'）\nテーマ：'+(CUR.theme||'未設定');
  var dtxt=(typeof curDayText==='function')?curDayText('Pre',todayISO()):'';
  if(dtxt)t+='\n本日(Pre)：'+dtxt;
  return {text:t,nav:[{label:'カリキュラムを開く',page:'curriculum'},{label:'デイリーメールを作る',page:'broadcast'}],chips:[{label:'活動アイデア',q:'活動アイデア'},{label:'行事の提案',q:'行事のアイデア'}]};
}
function aiTrouble(q){
  var secs=aiManualByKeyword(q);
  if(!secs.length)return {text:'うまく見つけられませんでした🙏\n「けが」「発熱」「誤飲」「不審者」「保護者への伝え方」「雨の日の活動」などで聞いてみてください。'};
  return {text:'「'+q+'」に関する危機管理マニュアルの該当箇所です👇',manualSecs:secs};
}
function aiRender(r){
  var b=$('#aiBody');
  if(r.text)aiPush('bot',aiEsc(r.text));
  if(r.scenario){
    var sc=r.scenario;var uc=sc.urgency==='緊急'?'#E24B4A':(sc.urgency==='注意'?'#854F0B':'#0B5F8F');
    var secs=aiManualByKeyword(sc.manualKeyword);
    var h='<div class="st" style="color:'+uc+';">'+(sc.urgency==='緊急'?'🚨 ':(sc.urgency==='注意'?'⚠️ ':'🟢 '))+aiEsc(sc.title)+'　<span style="font-size:10px;background:'+uc+';color:#fff;border-radius:99px;padding:1px 8px;">'+aiEsc(sc.urgency)+'</span></div>';
    h+='<div class="ss"><b>今すぐ</b><br>'+(sc.immediate||[]).map(function(s,i){return (i+1)+'. '+aiEsc(s);}).join('<br>')+'</div>';
    if(sc.call119)h+='<div class="ss" style="margin-top:6px;"><b>🚑 救急要請・受診の目安</b><br>'+aiEsc(sc.call119)+'</div>';
    if(sc.parentTalk)h+='<div class="ss" style="margin-top:6px;"><b>👪 保護者への伝え方</b><br>'+aiEsc(sc.parentTalk)+'</div>';
    var d=el('div',{class:'ai-sec'},h);d.style.borderLeft='4px solid '+uc;
    if(secs.length){var bt=el('button',{'data-aiopen':secs[0].id},'危機管理マニュアルで開く →');d.appendChild(bt);}
    var pb=el('button',{'data-aiask':'保護者への伝え方（'+sc.title+'）'},'保護者連絡文を作る');d.appendChild(pb);
    var rb=el('button',{'data-ainav':'records','data-airec':'ヒヤリハット・怪我'},'記録に残す');d.appendChild(rb);
    b.appendChild(d);
  }
  if(r.manualSecs){r.manualSecs.forEach(function(s){var d=el('div',{class:'ai-sec'},'<div class="st">🛡 '+aiEsc(s.title)+'</div><div class="ss">'+aiEsc(s.snip)+'</div>');var bt=el('button',{'data-aiopen':s.id},'危機管理マニュアルで開く →');d.appendChild(bt);b.appendChild(d);});}
  if(r.cards){r.cards.forEach(function(c){var d=el('div',{class:'ai-sec'},'<div class="st">'+aiEsc(c.title)+'</div><div class="ss">'+aiEsc(c.body)+'</div>');(c.buttons||[]).forEach(function(bn){var bt;if(bn.copy!=null){var idx=aiClip.push(bn.copy)-1;bt=el('button',{'data-aicopy':idx},bn.label);}else if(bn.nav){bt=el('button',{'data-ainav':bn.nav},bn.label);}else if(bn.ask){bt=el('button',{'data-aiask':bn.ask},bn.label);}if(bt)d.appendChild(bt);});b.appendChild(d);});}
  if(r.nav&&r.nav.length){var dn=el('div',{class:'ai-sec'});r.nav.forEach(function(a){var bt=el('button',{'data-ainav':a.page},a.label);if(a.rec)bt.setAttribute('data-airec',a.rec);if(a.dg)bt.setAttribute('data-aidg',a.dg);dn.appendChild(bt);});b.appendChild(dn);}
  if(r.chips&&r.chips.length){var dc=el('div',{class:'ai-sec'},'<div class="ss" style="margin-bottom:2px;">続けて聞く：</div>');r.chips.forEach(function(c){var bt=el('button',{'data-aiask':c.q},c.label);bt.style.background='#fff';bt.style.color='var(--teal-d)';bt.style.border='1px solid var(--teal-l)';dc.appendChild(bt);});b.appendChild(dc);}
  b.scrollTop=b.scrollHeight;
  /* 使い方サポートのボタン */
  b.querySelectorAll('[data-helpnext]').forEach(function(btn){btn.onclick=function(){btn.disabled=true;helpNextStep();};});
  b.querySelectorAll('[data-helpnav]').forEach(function(btn){btn.onclick=function(){
    AI_OPEN=false;$('#aiPanel').classList.remove('open');go(btn.getAttribute('data-helpnav'));};});
  b.querySelectorAll('[data-helpok]').forEach(function(btn){btn.onclick=function(){
    btn.disabled=true;aiPush('bot','よかったです。ほかにもあればいつでもどうぞ。');};});
  b.querySelectorAll('[data-helpng]').forEach(function(btn){btn.onclick=function(){
    btn.disabled=true;helpEscalate(btn.getAttribute('data-helpng'));};});
  b.querySelectorAll('[data-aiopen]').forEach(function(btn){btn.onclick=function(){aiOpenSection(btn.getAttribute('data-aiopen'));};});
  b.querySelectorAll('[data-aiask]').forEach(function(btn){btn.onclick=function(){aiAsk(btn.getAttribute('data-aiask'));};});
  b.querySelectorAll('[data-aicopy]').forEach(function(btn){btn.onclick=function(){var tx=aiClip[+btn.getAttribute('data-aicopy')]||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toastAI('コピーしました');},function(){toastAI('コピーできませんでした');});}else{toastAI('コピー非対応の環境です');}};});
  b.querySelectorAll('[data-ainav]').forEach(function(btn){btn.onclick=function(){AI_OPEN=false;$('#aiPanel').classList.remove('open');var _r=btn.getAttribute('data-airec');if(_r)recType=_r;if(btn.getAttribute('data-aidg'))dgType=btn.getAttribute('data-aidg');var _p=btn.getAttribute('data-ainav');go(_r?recPageOf(_r):_p);};});
}
function toastAI(m){var t=document.getElementById('aiToast');if(!t){t=el('div',{id:'aiToast'});t.style.cssText='position:fixed;right:24px;bottom:96px;z-index:950;background:#222;color:#fff;padding:9px 15px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .2s;';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity='0';},1800);}
function aiOpenSection(id){AI_OPEN=false;$('#aiPanel').classList.remove('open');dgType='危機管理マニュアル';kikiSel=id;go('docgen');}
