<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="img/icon_miraiwa.png">
<title>未来WA クリエイター｜教育者・教育事業者のページ</title>
<style>
  :root{
    /* 未来WA と同じ色。ただしこちらは「仕事の道具」なので、面は白を広く取る */
    --o:#F59A2E;--p:#EB4E9B;--b:#2D9CDB;--g:#6FBE44;--c:#3FC1E0;
    --bg:#FAF7F3;--card:#ffffff;--line:#ECE4DA;--line2:#F7F2EB;
    --tx:#23262E;--tx2:#6E6A72;--tx3:#A9A3AB;
    --ok:#3E9B57;--warn:#C98A1E;--bad:#C4483F;
    --radius:16px;--shadow:0 2px 12px rgba(120,80,40,.07);
    --rail:236px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14.5px;width:100%;padding:10px 12px;
    border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--tx);}
  textarea{line-height:1.75;resize:vertical;}
  a{color:inherit;}

  .demo{background:#23262E;color:#fff;font-size:11.5px;padding:7px 14px;text-align:center;line-height:1.5;}

  /* ---- 骨組み ---- */
  .app{display:flex;min-height:100vh;}
  .rail{width:var(--rail);flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .rail .brand{padding:16px 16px 12px;border-bottom:1px solid var(--line);}
  .rail .brand img{width:118px;display:block;}
  .rail .brand .sub{font-size:10.5px;color:var(--tx2);margin-top:5px;letter-spacing:.04em;}
  .rail nav{padding:9px 8px;flex:1;}
  .rail nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;
    padding:9px 11px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--tx2);text-align:left;}
  .rail nav button .ico{font-size:16px;line-height:1;width:20px;text-align:center;}
  .rail nav button:hover{background:var(--line2);}
  .rail nav button.on{background:#FDECF4;color:var(--p);}
  .rail nav .grp{font-size:10.5px;color:var(--tx3);padding:13px 12px 5px;letter-spacing:.08em;font-weight:700;}
  .rail .foot{padding:11px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;
    align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
  .top h1{margin:0;font-size:17px;font-weight:800;}
  .top .crumb{font-size:11.5px;color:var(--tx3);}
  .top .who{margin-left:auto;display:flex;align-items:center;gap:9px;}
  .wrap{padding:20px;max-width:1080px;width:100%;}

  /* ---- 部品 ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card.tight{padding:13px;}
  h2.sec{font-size:15px;font-weight:800;margin:22px 2px 11px;display:flex;align-items:center;gap:8px;}
  h2.sec:first-child{margin-top:2px;}
  .muted{color:var(--tx2);font-size:12.5px;line-height:1.75;}
  .mini{color:var(--tx3);font-size:11.5px;}
  .row{display:flex;gap:12px;align-items:center;}
  .grid{display:grid;gap:12px;}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--p);color:#fff;
    border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:700;}
  .btn:hover{filter:brightness(1.06);}
  .btn.sec{background:#fff;color:var(--p);border:1.5px solid var(--p);}
  .btn.gh{background:#fff;color:var(--tx2);border:1px solid var(--line);}
  .btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px;}
  .btn.wide{width:100%;}
  .btn[disabled]{opacity:.5;pointer-events:none;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
    font-size:12.5px;font-weight:600;color:var(--tx2);}
  .chip.on{background:var(--p);color:#fff;border-color:var(--p);}
  .chip.sm{padding:4px 10px;font-size:11.5px;}
  .lbl{font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.05em;margin:13px 0 6px;}
  .lbl:first-child{margin-top:0;}

  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
    background:var(--line2);color:var(--tx2);border:1px solid var(--line);}
  .tag.pub{background:#EAF6EC;color:var(--ok);border-color:#CDE8D4;}
  .tag.draft{background:#FBF1DD;color:var(--warn);border-color:#F0E0BE;}

  /* 数字のタイル */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
  .tile b{display:block;font-size:22px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;}
  .tile span{font-size:11.5px;color:var(--tx3);}
  .tile .dlt{font-size:11px;font-weight:700;margin-top:3px;}
  /* タイルは押せるようにした（スマホでは左の一覧が出ないので、ここが入口になる） */
  button.tile{width:100%;text-align:left;font:inherit;color:var(--tx);cursor:pointer;}
  button.tile:hover{border-color:var(--p);}
  .tile .go{display:block;font-size:11px;font-weight:700;color:var(--p);margin-top:5px;}
  .up{color:var(--ok);} .down{color:var(--bad);}

  /* ランク */
  .rankbox{background:linear-gradient(135deg,#FFF9F2,#FDF0F6);border:1px solid #F4E3D6;}
  .rankname{font-size:20px;font-weight:800;letter-spacing:.03em;}
  .rankbar{height:9px;border-radius:99px;background:#F0E7DC;overflow:hidden;margin:11px 0 7px;}
  .rankbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--o),var(--p));}
  .rankrow{display:flex;gap:5px;margin-top:12px;}
  .rankrow div{flex:1;text-align:center;font-size:10.5px;padding:5px 2px;border-radius:8px;
    background:#fff;border:1px solid var(--line);color:var(--tx3);font-weight:600;}
  .rankrow div.on{background:var(--p);color:#fff;border-color:var(--p);}
  .rankrow div.past{background:#FCE4EF;color:var(--p);border-color:#F6CFE2;}

  .boostline{margin-top:10px;font-size:13px;}
  .boostline b{font-size:19px;font-weight:800;color:var(--p);}
  .rankrow div em{display:block;font-style:normal;font-size:9.5px;opacity:.8;margin-top:1px;}
  .todobox{margin-top:13px;padding-top:12px;border-top:1px solid #F0DCC8;}
  .todoh{font-size:13px;font-weight:800;}
  .todo{display:flex;align-items:baseline;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;margin-bottom:7px;}
  .todo .tk{font-size:13px;font-weight:700;}
  .todo .ts{font-size:11.5px;color:var(--tx3);margin-left:auto;white-space:nowrap;}
  /* 一覧 */
  .item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);}
  .item:first-child{border-top:none;padding-top:2px;}
  .item .ic{width:40px;height:40px;border-radius:12px;background:var(--line2);display:flex;
    align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .item .bd{flex:1;min-width:0;}
  .item .ttl{font-weight:700;font-size:13.5px;}
  .item .stats{display:flex;gap:12px;margin-top:5px;font-size:11.5px;color:var(--tx3);
    font-variant-numeric:tabular-nums;flex-wrap:wrap;}
  .item .acts{display:flex;gap:6px;flex-shrink:0;}

  .empty{text-align:center;color:var(--tx3);font-size:13px;padding:34px 16px;
    border:1px dashed var(--line);border-radius:14px;background:#fff;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:5px;}
  .field .hint{font-size:11px;color:var(--tx3);margin-top:4px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:84px;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:9px 8px;font-size:12.5px;font-weight:600;color:var(--tx2);}
  .seg button.on{background:var(--p);color:#fff;border-color:var(--p);}

  table.t{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top;}
  table.t th{font-size:11.5px;color:var(--tx3);font-weight:700;white-space:nowrap;}
  .scrollx{overflow-x:auto;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#23262E;color:#fff;
    padding:11px 20px;border-radius:99px;font-size:13px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.22);}

  /* いま「どこに保存されているか」を画面の隅に小さく出す。
     つながっていないときも黙らせない。黙っていると、保存できたと思い込んでしまうため。 */
  .synctag{position:fixed;left:10px;bottom:10px;z-index:150;background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:5px 11px;font-size:11px;color:var(--tx2);box-shadow:var(--shadow);
    max-width:64vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .synctag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);
    margin-right:6px;vertical-align:middle;}
  .synctag.on i{background:var(--ok);}
  .synctag.ng i{background:var(--bad);}

  /* 下の「その他」から開く引き出し。
     スマホでは左の一覧が消えるので、ここから8つの画面すべてに行けるようにする。 */
  .sheetwrap{display:none;}
  .sheetwrap.open{display:block;}
  .sheetbg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(35,38,46,.38);z-index:180;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:181;background:#fff;
    border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto;}
  .sheet .sh{font-size:13px;font-weight:800;}
  .sheet .grp{font-size:10.5px;color:var(--tx3);padding:12px 4px 4px;letter-spacing:.08em;font-weight:700;}
  .sheet button.mi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    padding:11px 8px;border-radius:11px;font-size:14px;font-weight:700;color:var(--tx);text-align:left;}
  .sheet button.mi .ico{font-size:18px;width:22px;text-align:center;}
  .sheet button.mi.on{background:#FDECF4;color:var(--p);}

  /* モバイル */
  .tabbar{display:none;}
  @media(max-width:899px){
    .rail{display:none;}
    .wrap{padding:14px;}
    .top{padding:11px 14px;}
    .g2,.g3,.g4{grid-template-columns:1fr;}
    .tabbar{display:flex;position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
      z-index:30;padding:5px 2px calc(5px + env(safe-area-inset-bottom));}
    .tabbar button{flex:1;background:none;border:none;padding:6px 2px;font-size:10px;font-weight:700;
      color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:2px;}
    .tabbar button .ico{font-size:17px;line-height:1;}
    .tabbar button.on{color:var(--p);}
    /* 下タブに重ならないよう、保存先の表示を少し上げる */
    .synctag{bottom:calc(60px + env(safe-area-inset-bottom));}
    .item{flex-wrap:wrap;}
    .item .acts{width:100%;}
  }
</style>
</head>

    var have={};cur.forEach(function(x){have[String(x.id)]=1;});

    if(add.length){cur=cur.concat(add);stSet('wa_products',cur);}

function fmtDate(iso){
  if(!iso)return '';
  var d=new Date(iso);
  if(isNaN(d))return String(iso);
  var w=['日','月','火','水','木','金','土'][d.getDay()];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）';
}

var WHO={role:'',name:'',tenant:'',tried:false,busy:false};
WHO.load=function(cb){
  if(WHO.tried||WHO.busy||!API.online()){cb&&cb();return;}
  WHO.busy=true;WHO.tried=true;
  API.call('GET','/auth/me')
    .then(function(j){WHO.role=String((j&&j.role)||'');WHO.name=String((j&&j.name)||'');
      WHO.tenant=String((j&&j.tenant_name)||'');})
    .catch(function(){WHO.role='';})
    .then(function(){WHO.busy=false;cb&&cb();});
};

/* ============================================================
   保護者の画面から届いたもの（注文・イベントの申込・お名前）
   ------------------------------------------------------------
   受け取ったものは、この端末に保存しないし、サーバへ送り返さない。
   ・送り返すと、同じものが行ったり来たりし続ける。
   ・端末に控えを残すと、あとで別の職員が開いたときに、
     権限が無いのに古い名簿が読めてしまう。
   取れなかったときは、見本の数字に置き換えない。理由をそのまま書く。
   ============================================================ */
/* 注文を1件ずつ見分ける印。番号は保護者の端末で作られたものなので、
   園が振り直せない。買った中身で組み立てる（園の画面と同じ作り方）。 */
function ordKey(o){
  return String((o&&o.id)||'')+'|'+String((o&&o.at)||'')+'|'+String((o&&o.childId)||'');
}
var ORD={rows:null,tried:false,busy:false,err:''};
ORD.load=function(cb){
  if(ORD.tried||ORD.busy||!isSchool()){cb&&cb(false);return;}
  ORD.busy=true;ORD.tried=true;
  API.call('GET','/parent-state?key=wa_orders')
    .then(function(j){
      var seen={},out=[];
      (j.rows||[]).forEach(function(r){
        (Array.isArray(r.value)?r.value:[]).forEach(function(o){
          if(!o)return;
          var k=ordKey(o);
          if(seen[k])return; seen[k]=1; out.push(o);
        });
      });
      /* 新しいものを上に */
      out.sort(function(a,b){return String((b&&b.at)||'').localeCompare(String((a&&a.at)||''));});
      ORD.rows=out;ORD.err='';
    })
    .catch(function(e){ORD.rows=null;ORD.err=e.message;})
    .then(function(){ORD.busy=false;cb&&cb(true);});
};
ORD.reload=function(cb){ORD.tried=false;ORD.rows=null;ORD.load(cb);};

/* イベントの申込の名簿。園児の名前が入るので、
   サーバは管理者・マネージャーにしか渡さない（403が返る）。 */
var JOINS={by:null,tried:false,busy:false,err:''};
JOINS.load=function(cb){
  if(JOINS.tried||JOINS.busy||!canSeeNames()){cb&&cb(false);return;}
  JOINS.busy=true;JOINS.tried=true;
  API.call('GET','/parent-state?key=wa_ev_joindetail')
    .then(function(j){
      var by={};
      (j.rows||[]).forEach(function(r){
        (Array.isArray(r.value)?r.value:[]).forEach(function(v){
          if(!v||!v.id)return;
          var k=String(v.id);
          if(!by[k])by[k]=[];
          by[k].push(v);
        });
      });
      JOINS.by=by;JOINS.err='';
    })
    .catch(function(e){JOINS.by=null;JOINS.err=e.message;})
    .then(function(){JOINS.busy=false;cb&&cb(true);});
};
JOINS.reload=function(cb){JOINS.tried=false;JOINS.by=null;JOINS.load(cb);};

/* 園児のお名前。園の帳簿（/state）から読むだけで、書き戻さない。
   生徒台帳（studentProfiles）は管理者・マネージャーにしか渡らないので、
   一般の職員のときは名字だけになることがある。
   出せないだけで、作り話はしない。 */
var NAMES={c:null,sp:{},tried:false,busy:false};
NAMES.take=function(d){
  if(!d)return;
  if(Array.isArray(d.contacts)){NAMES.c=d.contacts;NAMES.tried=true;}
  if(d.studentProfiles&&typeof d.studentProfiles==='object')NAMES.sp=d.studentProfiles;
};
NAMES.load=function(cb){
  if(NAMES.tried||NAMES.busy||!isSchool()){cb&&cb(false);return;}
  NAMES.busy=true;NAMES.tried=true;
  API.call('GET','/state')
    .then(function(j){NAMES.take(j.data||{});})
    .catch(function(){})
    .then(function(){NAMES.busy=false;cb&&cb(true);});
};
function childOf(cid){
  if(!NAMES.c||cid==null||cid==='')return null;
  return NAMES.c.filter(function(x){return String(x.id)===String(cid);})[0]||null;
}
/* お名前の出し方。取れないときは、見本の名前に落とさない。 */
function childLabel(cid){
  if(cid==null||cid==='')return '（園外のご家庭）';
  if(!NAMES.c)return '（お名前は取れていません）';
  var c=childOf(cid);
  if(!c)return '（園の連絡先にありません）';
  var p=NAMES.sp[String(c.id)]||{};
  var ln=String(p.lastName||'').trim(),fn=String(p.firstName||'').trim();
  if(!ln){var nm=String(c.name||'').replace(/　/g,' ').trim().split(/\s+/);ln=nm[0]||'';}
  if(!fn)fn=String(c.child||'').replace(/ちゃん|くん/g,'');
  var full=((ln?ln+' ':'')+fn).trim();
  return full||String(c.name||'')||'（お名前は取れていません）';
}
function parentLabel(cid){var c=childOf(cid);return c?String(c.name||''):'';}

/* ---- ランクの計算 ----
   スプレッドシートの「ランク評価項目」8つを、実際の数字から出す。
   何をどう数えているかを画面にも出すので、上げ方が分かる。 */
function rankScore(){
  var P=posts(),E=events(),C=comms(),PR=products(),O=orders();
  var pub=function(a){return a.filter(function(x){return x.status==='public';});};
  var sum=function(a,f){var n=0;a.forEach(function(x){n+=(f(x)||0);});return n;};

  var allPub=pub(P).concat(pub(E)).concat(pub(C)).concat(pub(PR));
  var nItems=allPub.length;
  var rev=sum(allPub,function(x){return x.stats&&x.stats.review;});
  var rated=allPub.filter(function(x){return x.stats&&x.stats.rating;});
  var avg=rated.length?sum(rated,function(x){return x.stats.rating;})/rated.length:0;
  /* 自分が出しているものの注文だけを数える（他の出品者の売上は入れない） */
  var mine={};PR.forEach(function(p){mine[String(p.id)]=1;});
  var myO=O.filter(function(o){return mine[String(o.pid)];});
  var sold=myO.length;
  var view=sum(allPub,function(x){return x.stats&&x.stats.view;});
  var save=sum(allPub,function(x){return x.stats&&x.stats.save;});
  var like=sum(allPub,function(x){return x.stats&&x.stats.like;});
  var sales=sum(myO,function(o){return o.amount;});

  function pct(v,goal){return Math.max(0,Math.min(100,Math.round(v/goal*100)));}
  var items={
    items : pct(nItems,10),
    star  : avg?Math.max(0,Math.min(100,Math.round((avg-3.0)/2.0*100))):0,  /* ★3.0で0、★5.0で100 */
    review: pct(rev,25),
    /* 件数と金額の両方を見る。数多く売れた方も、大口の方も評価されるように。 */
    sold  : Math.round((pct(sold,20)+pct(sales,120000))/2)
  };
  var total=0;
  RANK_ITEMS.forEach(function(it){total+=items[it.k]*it.w;});
  total=Math.round(total);

  var idx=0;
  for(var i=RANKS.length-1;i>=0;i--){ if(total>=RANKS[i].min){idx=i;break;} }
  var next=idx<RANKS.length-1?RANKS[idx+1].min:100;

  return {items:items,total:total,idx:idx,next:next,boost:RANKS[idx].boost,
    raw:{nItems:nItems,avg:avg,review:rev,sold:sold,view:view,save:save,like:like,sales:sales,
         nPost:pub(P).length,nEvent:pub(E).length,nCom:pub(C).length,nProd:pub(PR).length}};
}

/* 「あと◯ポイント」では何をすればいいか分からないので、
   1つやれば届く行動を、実際の数で出す。 */
function rankTodo(R){
  if(R.idx>=RANKS.length-1)return [];
  var need=RANKS[R.idx+1].min-R.total;      /* 総合であと何点いるか */
  var raw=R.raw,out=[];
  RANK_ITEMS.forEach(function(it){
    var now=R.items[it.k];
    if(now>=100)return;
    var up=Math.ceil(need/it.w);            /* その項目で何点あげればよいか */
    if(now+up>100)return;                   /* 1項目では届かないものは出さない */
    var target=Math.ceil((now+up)/100*it.goal);
    if(it.k==='items') out.push({t:'出しているものを あと '+(target-raw.nItems)+' 件ふやす',
      sub:'いま '+raw.nItems+' 件 → '+target+' 件'});
    else if(it.k==='review') out.push({t:'口コミを あと '+(target-raw.review)+' 件もらう',
      sub:'いま '+raw.review+' 件 → '+target+' 件'});
    else if(it.k==='sold') out.push({t:'あと '+(target-raw.sold)+' 件 売れる',
      sub:'いま '+raw.sold+' 件 → '+target+' 件'});
    else if(it.k==='star'){
      var needStar=3.0+(now+up)/100*2.0;
      out.push({t:'平均評価を ★'+needStar.toFixed(1)+' まで上げる',
        sub:'いま ★'+(raw.avg?raw.avg.toFixed(1):'—')});
    }
  });
  return out;
}

function nextHint(R){
  if(R.idx>=4)return '運営審査を通過しています。';
  var low=RANK_ITEMS.slice().sort(function(a,b){return R.items[a.k]-R.items[b.k];})[0];
  /* 項目の鍵とそろえる。ずれていると「undefined。」と出てしまう。 */
  var hint={
    post:'公開中の投稿をあと数本ふやすと伸びます',
    pop:'閲覧数・保存数・いいね数が伸びると上がります',
    trust:'口コミの数と平均評価が効きます。返信もしてみてください',
    sold:'商品の販売実績が伸びると上がります',
    event:'イベントの開催数と、定員に対する申込率で決まります',

function filterSort(type,arr){

    if(t==='amazon')return x.src==='amazon';
    return t==='all'||x.status===t;});
  return a.slice().sort(function(x,y){
    if(s==='sales')return (salesOf(y)||0)-(salesOf(x)||0);
    var k=s==='review'?'review':s;
    return ((y.stats&&y.stats[k])||0)-((x.stats&&x.stats[k])||0);

function salesOf(x){

  if(!n&&x.fee&&x.applied){var f=parseInt(String(x.fee).replace(/[^0-9]/g,''),10)||0;n=f*x.applied;}
  return n;
}

/* 保護者が申し込んだ記録を、サーバから受け取る。
   wa_ev_joins は「そのご家庭が申し込んだイベント番号の一覧」なので、
   これを全家庭ぶん数えれば、イベントごとの申込数になる。
   名前は入っていない。名前が要る名簿は園の画面にある。 */
var EVJOIN={n:null,busy:false,
  load:function(cb){
    if(EVJOIN.n||EVJOIN.busy||!API.online()){cb&&cb();return;}
    EVJOIN.busy=true;
    API.call('GET','/parent-state?key=wa_ev_joins')
      .then(function(j){
        var n={};
        (j.rows||[]).forEach(function(r){
          /* 同じご家庭が同じイベントに二重に入っていても、1件として数える */
          var seen={};
          (Array.isArray(r.value)?r.value:[]).forEach(function(id){
            var k=String(id);
            if(seen[k])return; seen[k]=1;
            n[k]=(n[k]||0)+1;
          });
        });
        EVJOIN.n=n;
      })
      .catch(function(){EVJOIN.n=null;})
      .then(function(){EVJOIN.busy=false;cb&&cb();});
  },
  /* サーバから取れていればその数、取れていなければ見本の数字 */
  of:function(x){
    /* 受け取れているなら、載っていないイベントは「まだ0件」。
       ここで見本の数字に戻すと、誰も申し込んでいないイベントが
       「9名」などと出てしまう。 */
    if(EVJOIN.n)return {n:EVJOIN.n[String(x.id)]||0,real:true};
    return {n:x.applied||0,real:false};
  }
};

var anTab='post';
function analyticsHTML(){
  var R=rankScore(),raw=R.raw;
  var E=events().filter(function(x){return x.status==='public';});
  var C=comms().filter(function(x){return x.status==='public';});
  var applyRate=raw.cap?Math.round(raw.applied/raw.cap*100):0;
  var joinRate=C.length?Math.round(raw.keep*100):0;

  var head='<h2 class="sec">📊 分析</h2>'

      return '<button class="chip'+(anTab===x[0]?' on':'')+'" data-an="'+x[0]+'">'+x[1]+'</button>';}).join('')
    +'</div>';

  if(anTab==='post'){
    var P=posts().filter(function(x){return x.status==='public';});
    var top=P.slice().sort(function(a,b){return b.stats.view-a.stats.view;}).slice(0,5);
    return head
      +'<div class="tiles">'
        +'<div class="tile"><b>'+num(raw.view)+'</b><span>閲覧数</span></div>'
        +'<div class="tile"><b>'+num(raw.save)+'</b><span>保存数</span></div>'
        +'<div class="tile"><b>'+num(raw.like)+'</b><span>いいね数</span></div>'
        +'<div class="tile"><b>'+yen(raw.sales)+'</b><span>売上</span></div>'
        +'<div class="tile"><b>'+num(raw.review)+'</b><span>口コミ</span></div>'
        +'<div class="tile"><b>'+(raw.rating?raw.rating.toFixed(1):'—')+'</b><span>平均評価</span></div>'
      +'</div>'
      +'<div class="card" style="margin-top:14px;"><div class="lbl">よく見られている投稿</div>'
        +'<div class="scrollx"><table class="t"><thead><tr><th>タイトル</th><th>閲覧</th><th>保存</th><th>いいね</th><th>保存率</th></tr></thead><tbody>'
        +(top.length?top.map(function(x){
          var r=x.stats.view?Math.round(x.stats.save/x.stats.view*1000)/10:0;
          return '<tr><td>'+esc(x.t)+'</td><td>'+num(x.stats.view)+'</td><td>'+num(x.stats.save)
            +'</td><td>'+num(x.stats.like)+'</td><td>'+r+'%</td></tr>';}).join('')
          :'<tr><td colspan="5" class="mini">公開中の投稿がありません</td></tr>')
        +'</tbody></table></div></div>'
      +adviceHTML(R);
  }
  return head
    +'<div class="tiles">'
      +'<div class="tile"><b>'+E.length+'</b><span>開催イベント</span></div>'
      +'<div class="tile"><b>'+num(raw.applied)+'</b><span>申込者</span></div>'
      +'<div class="tile"><b>'+applyRate+'%</b><span>申込率（定員比）</span></div>'
      +'<div class="tile"><b>'+num(raw.members)+'</b><span>コミュニティ参加者</span></div>'
      +'<div class="tile"><b>'+joinRate+'%</b><span>参加者の継続率</span></div>'
      +'<div class="tile"><b>'+num(raw.review)+'</b><span>口コミ・レビュー</span></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px;"><div class="lbl">イベントごとの申込</div>'
      +'<div class="scrollx"><table class="t"><thead><tr><th>イベント</th><th>開催日</th><th>申込</th><th>定員</th><th>申込率</th></tr></thead><tbody>'
      +(E.length?E.map(function(x){
        var r=x.cap?Math.round(x.applied/x.cap*100):0;
        return '<tr><td>'+esc(x.t)+'</td><td>'+esc(fmtDate(x.date))+'</td><td>'+x.applied+'</td><td>'+x.cap+'</td>'
          +'<td><span class="'+(r>=70?'up':(r<40?'down':''))+'">'+r+'%</span></td></tr>';}).join('')
        :'<tr><td colspan="5" class="mini">公開中のイベントがありません</td></tr>')
      +'</tbody></table></div></div>'
    +adviceHTML(R);
}
function adviceHTML(R){
  /* スプレッドシートの「おすすめ改善」。数字から機械的に出している */
  var tips=[];
  var raw=R.raw;
  if(raw.view&&raw.save/raw.view<0.06)
    tips.push('見られてはいるが保存されにくい状態です。冒頭の1行に「何歳向けか」と「用意するもの」を入れると保存されやすくなります。');
  if(raw.nPost<6)
    tips.push('公開中の投稿が'+raw.nPost+'本です。まず6本を目安にすると、あなたのページを見た方が回遊しはじめます。');
  if(raw.cap&&raw.applied/raw.cap<0.5)
    tips.push('イベントの申込が定員の半分を切っています。定員を実態に合わせて下げると、申込率が上がって表示順にも効きます。');
  if(raw.review<10)
    tips.push('口コミが'+raw.review+'件です。参加された方に一言お願いすると、信頼度の評価が上がります。');
  if(raw.rating&&raw.rating<4.2)
    tips.push('平均評価が'+raw.rating.toFixed(1)+'です。低い評価の口コミに返信すると、返信率も評価に入ります。');
  if(!tips.length)tips.push('いまのところ、目立って直すところはありません。投稿の間隔を保つことが次のランクにいちばん効きます。');
  return '<div class="card"><div class="lbl">おすすめ改善</div>'
    +'<ul style="margin:0;padding-left:19px;font-size:13px;line-height:1.9;">'
    +tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'
    +'<div class="mini" style="margin-top:9px;">※ AIによる詳細分析は、ゴールド以上またはPremiumで使えるようにする予定です。</div></div>';
}

/* ============================================================
   ダウンロード教材のファイル
   ------------------------------------------------------------
   実際にお渡しするPDFなどは、この端末にも、園の帳簿（wa_products）にも
   持たない。サーバの専用の入口（/school/download-files）に預ける。
   ・園の帳簿に入れると、園の画面が同期のたびに数MBを運ぶことになる。
   ・保護者に配る入れ物に入れると、買っていないご家庭にも配られてしまう。
   お渡しできるのは、園が注文の画面で「受け取りました」を押したご家庭だけ。
   その判断はサーバがしていて、この画面はその結果を見せているだけ。
   ============================================================ */

/* 出品の番号。園の画面（index.html の azAdd）と同じ数え方にそろえてある。 */
function nextProductId(){
  var mx=100;
  allProducts().forEach(function(p){
    var n=parseInt(p.id,10);
    if(String(p.id)===String(n)&&n>mx)mx=n;
  });
  return mx+1;
}
/* 大きさを読みやすく。先生が「4MBまで」と見比べられるように。 */
function sizeText(n){
  var v=(+n||0);
  if(v<1024)return v+'バイト';
  if(v<1024*1024)return Math.round(v/1024)+'KB';
  return (Math.round(v/1024/1024*10)/10)+'MB';
}

/* 預かっているファイルの一覧。中身は返ってこない（名前と大きさだけ）。 */
var DLF={map:null,all:null,tried:false,busy:false,err:'',
  load:function(cb){
    if(DLF.busy||DLF.tried||!API.online()){cb&&cb(false);return;}
    DLF.busy=true;DLF.tried=true;
    API.call('GET','/school/download-files')
      .then(function(j){
        var m={};
        (j.files||[]).forEach(function(f){m[String(f.productId)]=f;});
        /* 行き先を失ったファイルも出すので、返ってきたものはそのままも控えておく */
        DLF.map=m;DLF.all=(j.files||[]);DLF.err='';
      })
      .catch(function(e){DLF.map=null;DLF.err=e.message;})
      .then(function(){DLF.busy=false;cb&&cb(true);});
  },
  refresh:function(cb){DLF.tried=false;DLF.load(cb);}
};

/* ============================================================
   園どうしの貸し借り
   ------------------------------------------------------------
   使わなくなった大きな遊具や、行事のときだけ要る物を、園どうしで貸し借りする。
   ここは相手の園があることなので、端末の中には何も持たない。
   つないでいないときは、見本も出さずにその旨だけを書く
   （見本を出すと、誰にも見えていない出品を「出している」と思わせてしまう）。

   送料・こわれたときの扱い・手数料は、まだ決まっていない。
   決まっていない金額を画面に出すと、その額で話がついたと思われるので、
   「運営と調整中」とそのまま書く。
   ============================================================ */
var RL_CATS=['遊具','行事の道具','楽器','机・いす','衣装','本・教材','その他'];
var RL={
  tab:stGet('rl_tab','items'),   /* items=よその園の出品 / mine=自分の出品 / reqs=申し込み */
  info:null, infoTried:false,
  items:null, mine:null, reqs:null,
  open:null,        /* いま開いているもの {kind:'item'|'req'|'edit', id, item} */
  detail:null, req:null, msgs:null,
  q:'', busy:false, err:''
};
var RLPHOTO=null;   /* 選んだ写真の控え {name,body} */

/* いま出している画面に足りないものだけを、順に取りに行く。 */
RL.load=function(cb){
  if(!API.online()||RL.busy){cb&&cb(false);return;}
  var jobs=[],o=RL.open;
  if(!RL.infoTried){
    RL.infoTried=true;
    jobs.push({p:'/rental/info',f:function(j){RL.info=j;}});
  }
  if(o&&o.kind==='edit'){
    if(o.id&&!o.item)jobs.push({p:'/rental/items/'+encodeURIComponent(o.id),f:function(j){
      var it=j.item||{};
      /* 写真も受け取っておく。受け取らずに保存すると、いまの写真が消える
         （サーバは送られてきた内容で全部を置き換えるため）。 */
      RL.open.item={id:it.id,title:it.title,cat:it.cat,qty:it.qty,cond:it.cond,
        photo:it.photo,pref:it.pref,city:it.city,note:it.note,status:it.status};
    }});
  }else if(o&&o.kind==='item'){
    if(!RL.detail)jobs.push({p:'/rental/items/'+encodeURIComponent(o.id),f:function(j){RL.detail=j.item||null;}});
  }else if(o&&o.kind==='req'){
    if(!RL.req)jobs.push({p:'/rental/requests/'+encodeURIComponent(o.id),f:function(j){RL.req=j.request||null;}});
    if(RL.msgs===null)jobs.push({p:'/rental/requests/'+encodeURIComponent(o.id)+'/messages',
      f:function(j){RL.msgs=j.messages||[];}});
  }else{
    if(RL.tab==='items'&&RL.items===null)
      jobs.push({p:'/rental/items'+(RL.q?'?q='+encodeURIComponent(RL.q):''),f:function(j){RL.items=j.items||[];}});
    if(RL.tab==='mine'&&RL.mine===null)
      jobs.push({p:'/rental/items/mine',f:function(j){RL.mine=j.items||[];}});
    if(RL.tab==='reqs'&&RL.reqs===null)
      jobs.push({p:'/rental/requests',f:function(j){RL.reqs=j.requests||[];}});
  }
  if(!jobs.length){cb&&cb(false);return;}
  RL.busy=true;RL.err='';
  var i=0;
  function step(){
    if(i>=jobs.length){RL.busy=false;cb&&cb(true);return;}
    var j=jobs[i++];
    API.call('GET',j.p)
      .then(function(r){j.f(r);})
      .catch(function(e){RL.err=e.message;})
      .then(step);
  }
  step();
};
RL.reload=function(){
  RL.err='';RL.info=null;RL.infoTried=false;
  RL.items=null;RL.mine=null;RL.reqs=null;RL.detail=null;RL.req=null;RL.msgs=null;
  if(RL.open&&RL.open.kind==='edit'&&RL.open.id)RL.open.item=null;
};

/* 誰が、どこからどこへ進められるか。サーバ（rental.js の RULE）を写している。
   ここに無いものを出すと、押しても進まない押しボタンになる。 */
function rlNext(q){
  var out=[];
  if(q.side==='貸し手'){
    if(q.status==='申込'){out.push({s:'承認',l:'承認する'});out.push({s:'見送り',l:'見送る',g:1});}
    else if(q.status==='承認')out.push({s:'貸出中',l:'お渡ししました'});
    else if(q.status==='貸出中')out.push({s:'返却済',l:'返ってきました'});
  }else{
    if(q.status==='申込'||q.status==='承認')out.push({s:'取消',l:'取り消す',g:1});
  }
  return out;
}

/* 種類や扱いを選ぶと画面を組み直すので、その前に打ちかけの文字を控える。
   控えないと、名前を書いたあとに種類を選んだだけで消えてしまう。 */
function rlCollect(){
  var it=RL.open&&RL.open.item;
  if(!it)return;
  var g=function(i){var e=document.getElementById(i);return e?e.value:undefined;},v;
  v=g('rl_title'); if(v!==undefined)it.title=v.trim();
  v=g('rl_cond');  if(v!==undefined)it.cond=v.trim();
  v=g('rl_pref');  if(v!==undefined)it.pref=v.trim();
  v=g('rl_city');  if(v!==undefined)it.city=v.trim();
  v=g('rl_note');  if(v!==undefined)it.note=v;
  v=g('rl_qty');   if(v!==undefined)it.qty=parseInt(v,10)||1;
}

function wireRental(){
  var $=function(i){return document.getElementById(i);};
  /* 押しボタンの配線。使い回しの入れ物（var b など）に受けて、その入れ物を
     押されたときに読むと、あとで別のボタンを入れた時点で、先に配ったはずの
     押しボタンがそちらを指してしまう（申し込みの押しボタンが押せなくなった）。
     押した瞬間に「そのボタン自身」が渡るようにする。 */
  function on(id,fn){
    var el=document.getElementById(id);
    if(el)el.onclick=function(){return fn(el);};
  }

  document.querySelectorAll('[data-rt]').forEach(function(el){el.onclick=function(){
    RL.tab=el.getAttribute('data-rt');stSet('rl_tab',RL.tab);RL.open=null;RL.err='';render();};});
  document.querySelectorAll('[data-rlitem]').forEach(function(el){el.onclick=function(){
    RL.open={kind:'item',id:el.getAttribute('data-rlitem')};RL.detail=null;RL.err='';render();};});
  document.querySelectorAll('[data-rlreq]').forEach(function(el){el.onclick=function(){
    RL.open={kind:'req',id:el.getAttribute('data-rlreq')};RL.req=null;RL.msgs=null;RL.err='';render();};});
  document.querySelectorAll('[data-rledit]').forEach(function(el){el.onclick=function(){
    RL.open={kind:'edit',id:el.getAttribute('data-rledit'),item:null};RLPHOTO=null;RL.err='';render();};});
  document.querySelectorAll('[data-rldel]').forEach(function(el){el.onclick=function(){
    if(!confirm('この出品を消します。よろしいですか。'))return;
    API.call('DELETE','/rental/items/'+encodeURIComponent(el.getAttribute('data-rldel')))
      .then(function(){toast('消しました');RL.mine=null;RL.items=null;render();})
      .catch(function(e){toast(e.message);});};});

  on('rl_reload',function(){RL.reload();render();});
  on('rl_back',  function(){RL.open=null;RLPHOTO=null;RL.err='';render();});
  on('rl_new',   function(){
    RL.open={kind:'edit',id:'',item:{qty:1,status:'公開',cat:RL_CATS[0]}};RLPHOTO=null;render();});
  on('rl_find',  function(){
    var e=$('rl_q');RL.q=e?e.value.trim():'';RL.items=null;render();});

  /* 出品の編集。選び直しても打ちかけが消えないよう、先に控える。 */
  (function(){
    var it=RL.open&&RL.open.item;
    if(!it)return;
    var box=$('rl_cat');
    if(box)box.querySelectorAll('[data-v]').forEach(function(x){x.onclick=function(){
      rlCollect();it.cat=x.getAttribute('data-v');render();};});
    var sg=$('rl_status');
    if(sg)sg.querySelectorAll('[data-v]').forEach(function(x){x.onclick=function(){
      rlCollect();it.status=x.getAttribute('data-v');render();};});
    var ph=$('rl_photo');
    if(ph)ph.onchange=function(){
      var f=ph.files&&ph.files[0];
      if(!f){RLPHOTO=null;return;}
      if(f.size>1024*1024){toast('写真が大きすぎます（1MBまで）');ph.value='';return;}
      var r=new FileReader();
      r.onload=function(){rlCollect();RLPHOTO={name:f.name,body:String(r.result)};render();};
      r.onerror=function(){toast('写真を読み込めませんでした');};
      r.readAsDataURL(f);
    };
    var sv=$('rl_save');
    if(sv)sv.onclick=function(){
      rlCollect();
      if(!it.title){toast('品物の名前を入れてください');return;}
      var body={title:it.title,cat:it.cat||'',qty:it.qty||1,cond:it.cond||'',
        pref:it.pref||'',city:it.city||'',note:it.note||'',status:it.status||'公開',
        /* 写真を選び直していないときは、いま登録されているものをそのまま送り返す。
           送らないと、サーバ側で写真が消える。 */
        photo:RLPHOTO?RLPHOTO.body:(it.photo||'')};
      sv.disabled=true;
      API.call(it.id?'PUT':'POST','/rental/items'+(it.id?'/'+encodeURIComponent(it.id):''),body)
        .then(function(){
          toast(it.id?'直しました':'出しました');
          RLPHOTO=null;RL.open=null;RL.mine=null;RL.items=null;
          RL.tab='mine';stSet('rl_tab','mine');render();
        })
        .catch(function(e){sv.disabled=false;toast(e.message);});
    };
  })();

  /* 申し込む */
  on('rq_send',function(el){
    var g=function(i){var e=$(i);return e?e.value.trim():'';};
    var from=g('rq_from');
    if(!from){toast('いつから借りたいかを入れてください');return;}
    el.disabled=true;
    API.call('POST','/rental/items/'+encodeURIComponent(RL.open.id)+'/request',
      {wantFrom:from,wantTo:g('rq_to'),
       terms:{shipping:g('rq_ship'),damage:g('rq_dmg'),note:g('rq_note')}})
      .then(function(j){
        /* 文言はサーバのものをそのまま出す。園ごとに違う言い方にしないため。 */
        toast(j.message||'申し込みを送りました');
        RL.open=null;RL.reqs=null;RL.tab='reqs';stSet('rl_tab','reqs');render();
      })
      .catch(function(e){el.disabled=false;toast(e.message);});
  });

  /* 進める。決めたことも、このときいっしょに送る。 */
  document.querySelectorAll('[data-rldecide]').forEach(function(el){el.onclick=function(){
    var s=el.getAttribute('data-rldecide');
    if(!confirm('「'+s+'」にします。よろしいですか。'))return;
    var g=function(i){var e=$(i);return e?e.value.trim():'';};
    el.disabled=true;
    API.call('POST','/rental/requests/'+encodeURIComponent(RL.open.id)+'/decide',
      {status:s,terms:{shipping:g('tm_ship'),damage:g('tm_dmg'),note:g('tm_note')}})
      .then(function(j){
        toast('「'+j.request.status+'」にしました');
        if(j.warn)alert(j.warn);
        RL.req=null;RL.msgs=null;RL.reqs=null;render();
      })
      .catch(function(e){el.disabled=false;toast(e.message);});};});

  on('rl_send',function(el){
    var e=$('rl_msg'),t=e?e.value.trim():'';
    if(!t){toast('内容を入れてください');return;}
    el.disabled=true;
    API.call('POST','/rental/requests/'+encodeURIComponent(RL.open.id)+'/messages',{text:t})
      .then(function(){RL.msgs=null;render();})
      .catch(function(err){el.disabled=false;toast(err.message);});
  });
}

var TITLES={home:['つくる','HOME'],posts:['つくる','あそぶ・まなぶ'],shop:['つくる','ショップ出品'],
  events:['つくる','イベント'],comms:['つくる','コミュニティ'],
  rental:['つくる','園どうしの貸し借り'],sold:['みる','売れたもの'],analytics:['みる','分析'],
  rank:['みる','ランク制度'],me:['みる','マイページ'],editor:['つくる','投稿する']};

function render(){
  /* 園の職員でなくなったとき（ログインが切れたときなど）に、
     園だけの画面が開いたまま残らないようにする。分からないときは HOME に戻す。 */
  var pg=PAGES.filter(function(x){return x.p===page;})[0];
  if(pg&&pg.s&&!isSchool()){page='home';evRoster=null;}
  if(!isSchool())evRoster=null;
  var M=me(),R=rankScore();
  document.getElementById('nav').innerHTML=railHTML();
  document.getElementById('tabbar').innerHTML=tabbarHTML();
  document.getElementById('sheet').innerHTML=sheetHTML();
  document.getElementById('railFoot').innerHTML=
    esc(M.biz.name)+'<br>'+esc(RANKS[R.idx].n)+' ・ '+num(M.points)+'pt';
  var key=editing?'editor':page;
  document.getElementById('crumb').textContent=TITLES[key][0];
  document.getElementById('ttl').textContent=TITLES[key][1];
  document.getElementById('who').innerHTML=
    '<span class="tag">'+esc(RANKS[R.idx].n)+'</span>'
    +'<span class="mini" style="white-space:nowrap;">'+esc(M.name)+'</span>';

  var v=document.getElementById('view');
  if(editing){ v.innerHTML=editorHTML();
    /* ダウンロード教材のときだけ、預かっているファイルを確かめて組み直す */
    if(editing.type==='shop'&&editing.item.cat==='ダウンロード教材')
      DLF.load(function(hit){ if(hit&&editing){v.innerHTML=editorHTML();wire();} }); }
  else if(page==='home') v.innerHTML=homeHTML();
  else if(page==='posts') v.innerHTML=postsHTML();
  else if(page==='shop'){ v.innerHTML=shopHTML();
    /* 園のときだけ、預かっているファイルの様子を見に行く。取れたら描き直す。 */
    if(isSchool())DLF.load(function(hit){
      if(hit&&page==='shop'&&!editing){v.innerHTML=shopHTML();wire();} }); }
  else if(page==='events'){ v.innerHTML=eventsHTML();
    /* 申込の数は、開いたときに一度だけ取りに行く。取れたら描き直す。 */
    EVJOIN.load(function(){ if(page==='events'&&!editing){v.innerHTML=eventsHTML();wire();} });
    /* 名簿を開いているときだけ、どなたが申し込んだかとお名前を取りに行く。
       開くたびに取り直すので、この端末には残らない。 */
    if(evRoster){
      var evAgain=function(hit){
        if(hit&&page==='events'&&evRoster&&!editing){v.innerHTML=eventsHTML();wire();} };
      JOINS.load(evAgain);NAMES.load(evAgain);
    } }
  else if(page==='sold'){ v.innerHTML=soldHTML();
    /* 注文とお名前は、開いたときに取りに行く（園の帳簿には書かない） */
    var soAgain=function(hit){
      if(hit&&page==='sold'&&!editing){v.innerHTML=soldHTML();wire();} };
    ORD.load(soAgain);NAMES.load(soAgain); }
  else if(page==='comms') v.innerHTML=commsHTML();
  else if(page==='rental'){ v.innerHTML=rentalHTML();
    /* 端末の中には控えを持たないので、開くたびにサーバから取り直す */
    RL.load(function(hit){ if(hit&&page==='rental'){v.innerHTML=rentalHTML();wire();} }); }
  else if(page==='analytics') v.innerHTML=analyticsHTML();
  else if(page==='rank') v.innerHTML=rankHTML();
  else if(page==='me') v.innerHTML=meHTML();
  wire();
  window.scrollTo(0,0);
}

function wire(){
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){
    editing=null;evRoster=null;page=b.getAttribute('data-go');closeSheet();render();};});
  /* 「その他」を押したら引き出しを開く（中身は render() で作ってある） */
  document.querySelectorAll('[data-more]').forEach(function(b){b.onclick=openSheet;});
  var sc=document.getElementById('sheetClose'); if(sc)sc.onclick=closeSheet;
  var sb=document.getElementById('sheetbg');    if(sb)sb.onclick=closeSheet;
  document.querySelectorAll('[data-lt]').forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-lt').split('|');listTab[p[0]]=p[1];render();};});
  document.querySelectorAll('[data-ls]').forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-ls').split('|');listSort[p[0]]=p[1];render();};});
  document.querySelectorAll('[data-an]').forEach(function(b){b.onclick=function(){
    anTab=b.getAttribute('data-an');render();};});
  document.querySelectorAll('[data-plan]').forEach(function(b){b.onclick=function(){
    toast('「'+b.getAttribute('data-plan')+'」のお申し込みは、次のフェーズで対応します。');};});

  /* 新規作成 */
  document.querySelectorAll('[data-new]').forEach(function(b){b.onclick=function(){
    var k=b.getAttribute('data-new');
    if(k==='idea')      editing={type:'posts', item:{kind:'play',cat:'工作',ages:[]}};
    else if(k==='market')editing={type:'shop',  item:{cat:'教材',emoji:'📦'}};
    else if(k==='event') editing={type:'events',item:{target:EV_TARGETS[0],theme:'',kind:'',ages:[]}};
    else if(k==='community')editing={type:'comms',item:{cat:'子育て'}};
    /* 外部の教材も、中身は同じ商品の帳簿（wa_products）の1行。
       src:'amazon' の印で、保護者の画面では運営が発行したリンクとして出る。 */
    else if(k==='amazon')editing={type:'shop',item:{cat:'教材',emoji:'📎',src:'amazon',price:0,use:true}};
    else editing={type:'new',item:{}};
    evRoster=null;
    render();};});

  document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-edit').split('|');
    var arr=listOf(p[0]),it=arr.filter(function(x){return String(x.id)===p[1];})[0];
    if(it){editing={type:p[0],item:JSON.parse(JSON.stringify(it))};render();}};});

  document.querySelectorAll('[data-pub]').forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-pub').split('|'),arr=listOf(p[0]);
    arr.forEach(function(x){if(String(x.id)===p[1])x.status=(x.status==='public'?'draft':'public');});
    saveOf(p[0],arr);toast('状態を変えました');render();};});

  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){
    var p=b.getAttribute('data-del').split('|');
    if(!confirm('削除します。よろしいですか。'))return;
    saveOf(p[0],listOf(p[0]).filter(function(x){return String(x.id)!==p[1];}));
    toast('削除しました');render();};});

  /* パスワードの表示 */
  var pt=document.getElementById('pwToggle');
  if(pt)pt.onclick=function(){
    var el=document.getElementById('pwMask'),M=me();
    var shown=el.getAttribute('data-shown')==='1';
    el.textContent=shown?'••••••••':(M.pw||'（未設定）');
    el.setAttribute('data-shown',shown?'0':'1');
    pt.textContent=shown?'表示する':'隠す';};

  /* マイページの保存 */
  var sm=document.getElementById('saveMe');
  if(sm)sm.onclick=function(){
    var M=me(),g=function(i){var e=document.getElementById(i);return e?e.value.trim():'';};
    M.name=g('m_name');M.dob=g('m_dob');M.email=g('m_email');M.tel=g('m_tel');M.addr=g('m_addr');
    M.biz.name=g('b_name');M.biz.regNo=g('b_reg');M.biz.tel=g('b_tel');
    M.biz.addr=g('b_addr');M.biz.email=g('b_email');
    saveMe(M);toast('保存しました');render();};

  wireRental();
  wireSchool();
  wireEditor();
}

  /* 園のおすすめの並び */

      x.amz=x.amz||{};x.amz.status='requested';x.amz.at=todayISO();}});
    saveProducts(ps);amzLog(id,'再申請');
    toast('申請しました');render();};});

  /* 行き先を失ったファイルを消す */

    if(!confirm('このファイルを消します。もう誰にも渡りません。よろしいですか。'))return;
    API.call('DELETE','/school/download-files/'+encodeURIComponent(b.getAttribute('data-dlorph')))
      .then(function(){toast('消しました');DLF.refresh(function(){render();});})
      .catch(function(e){toast(e.message);});};});
}
function listOf(t){return t==='posts'?posts():t==='shop'?products():t==='events'?events():comms();}
function saveOf(t,a){t==='posts'?savePosts(a):t==='shop'?saveProducts(a):t==='events'?saveEvents(a):saveComms(a);}

function wireEditor(){
  if(!editing)return;
  var x=editing.item;
  var back=document.getElementById('edBack');
  if(back)back.onclick=function(){editing=null;render();};

  /* 選択の見た目を切り替える（1つだけ選ぶもの） */
  function pick(boxId,set){
    var box=document.getElementById(boxId);
    if(!box)return;
    box.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){
      /* 打ちかけの文字を先に控えてから描き直す（せっかく書いたものを消さないため） */
      try{collect();}catch(e){}
      set(b.getAttribute('data-v'));render();};});
  }
  pick('f_kind',function(v){x.kind=v;x.cat=(v==='learn'?LEARN_CATS:PLAY_CATS)[0];});
  pick('f_cat',function(v){x.cat=v;});
  pick('f_mode',function(v){x.sub=(v==='sub');x.rental=(v==='rental');});
  pick('f_aim',function(v){x.aim=v;});
  pick('f_rec',function(v){x.rec=(v==='1');});
  pick('f_so',function(v){x.schoolOnly=(v==='1');});
  pick('f_target',function(v){x.target=v;x.theme='';x.kind='';});
  pick('f_theme',function(v){ if(x.target==='保護者向けイベント')x.kind=v; else x.theme=v; });

  /* 年齢は複数えらべる */
  var ab=document.getElementById('f_ages');
  if(ab)ab.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){
    try{collect();}catch(e){}
    var a=b.getAttribute('data-v');x.ages=x.ages||[];
    var i=x.ages.indexOf(a);
    if(i>-1)x.ages.splice(i,1);else x.ages.push(a);
    x.ages.sort(function(p,q){return AGES.indexOf(p)-AGES.indexOf(q);});
    render();};});

  function collect(){
    var g=function(i){var e=document.getElementById(i);return e?e.value.trim():'';};
    if(editing.type==='posts'){x.t=g('f_t');x.d=g('f_d');}
    else if(editing.type==='shop'){
      x.name=g('f_t');x.desc=g('f_d');
      if(x.src==='amazon'){
        /* 外部の教材は園が値段をつけない。リンクの行き先が変わったら、運営の確認をやり直す。 */
        var u=g('f_url'),old=(x.amz&&x.amz.url)||'';
        x.price=0;x.emoji=x.emoji||'📎';
        x.amz=x.amz||{};
        x.amz.url=u;
        if(u!==old||!x.amz.status||x.amz.status==='none'){
          x.amz.status='requested';x.amz.at=todayISO();}
        var nd=g('f_need');
        if(nd)x.need=nd; else delete x.need;
      }else{
        x.price=parseInt(g('f_price'),10)||0;x.emoji=g('f_emoji')||'📦';
      }
    }
    else if(editing.type==='events'){x.t=g('f_t');x.d=g('f_d');x.date=g('f_date');
      x.cap=parseInt(g('f_cap'),10)||0;x.place=g('f_place');x.fee=g('f_fee');}
    else if(editing.type==='comms'){x.t=g('f_t');x.d=g('f_d');}
  }
  function problem(){
    var title=(editing.type==='shop')?x.name:x.t;
    if(!title)return (editing.type==='shop'?'商品名':'タイトル')+'を入れてください';
    if(editing.type==='shop'&&x.src==='amazon'){
      /* 行き先の分からないリンクを保護者に出さないため、Amazonの商品ページだけを受け付ける */
      if(!/^https:\/\/(www\.)?amazon\.co\.jp\//i.test((x.amz&&x.amz.url)||''))
        return 'Amazon（amazon.co.jp）の商品ページのアドレスを入れてください';
      return '';
    }
    if(editing.type==='shop'&&!x.price)return '価格を入れてください';
    if(editing.type==='events'&&!x.date)return '開催日を入れてください';
    if((editing.type==='posts'||editing.type==='events')&&(!x.ages||!x.ages.length))
      return '対象の年齢をひとつ以上えらんでください';
    return '';
  }
  function store(status){
    collect();
    var ng=problem();
    if(ng){toast(ng);return;}
    var type=editing.type;              /* editing を消す前に控えておく */
    var wasNew=!x.id;                   /* 番号を振る前に控えておく */
    var arr=listOf(type);
    if(!x.id){
      /* 商品の番号だけは数字にする。園の画面（index.html）が数字で採番していて、
         お渡しするファイルを預ける入口（/school/download-files）も、数字の番号しか
         受け付けないため。文字のまじった番号で作ると、出品はできるのにファイルだけ
         預けられない、という状態になってしまう。 */
      x.id=(type==='shop')?nextProductId():uid(type);
      x.at=todayISO();
      x.stats={view:0,save:0,like:0,review:0,rating:0};
      x.by=MY_SELLER;                       /* どの出品者のものかを残す */
      if(type==='events'){x.applied=x.applied||0;}
      if(type==='comms'){x.members=x.members||0;x.keep=x.keep||0;}
      if(type==='shop'){x.aim=x.aim||'';x.rec=false;}
      x.status=status;
      arr.push(x);
    }else{
      x.status=status;
      for(var i=0;i<arr.length;i++)if(String(arr[i].id)===String(x.id))arr[i]=x;
    }
    saveOf(type,arr);
    /* 外部の教材は、だれがいつ申請したかを残す（あとで確かめられるように） */
    if(type==='shop'&&x.src==='amazon'&&x.amz&&x.amz.status==='requested')
      amzLog(x.id,wasNew?'新規申請':'再申請');
    toast(status==='public'
      ?(x.src==='amazon'?'申請しました。運営がリンクを発行するまで、保護者の画面にボタンは出ません。'
                        :'公開しました。保護者の画面に出ます。')
      :'下書きに保存しました');
    editing=null;
    page=type;                          /* 作ったものの一覧へ戻る */
    render();
  }
  /* ── 商品の写真。長い辺を600pxに縮めてから帳簿に入れる（そのままだと重い） ── */
  var fim=document.getElementById('f_img');
  if(fim)fim.onchange=function(){
    var f=fim.files&&fim.files[0];
    if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var MX=600,sc=Math.min(1,MX/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        try{collect();}catch(e){}
        x.img=cv.toDataURL('image/jpeg',0.78);
        render();
      };
      im.onerror=function(){toast('写真を読み込めませんでした');};
      im.src=rd.result;
    };
    rd.onerror=function(){toast('写真を読み込めませんでした');};
    rd.readAsDataURL(f);
  };
  var fix=document.getElementById('f_imgx');
  if(fix)fix.onclick=function(){try{collect();}catch(e){}delete x.img;render();};

  /* ── お渡しするファイル（ダウンロード教材のときだけ出る） ── */
  var fi=document.getElementById('dl_file');
  if(fi)fi.onchange=function(){
    var f=fi.files&&fi.files[0];
    if(!f){DLPICK=null;return;}
    /* 大きさは選んだ時点で見る。送ってから断られると、待たせただけになる。 */
    if(f.size>4*1024*1024){toast('ファイルが大きすぎます（4MBまで）');fi.value='';return;}
    if(!/\.(pdf|png|jpe?g)$/i.test(f.name)){toast('PDF・PNG・JPEG のみ預かれます');fi.value='';return;}
    var r=new FileReader();
    r.onload=function(){DLPICK={pid:String(x.id),name:f.name,body:String(r.result),size:f.size};render();};
    r.onerror=function(){toast('ファイルを読み込めませんでした');};
    r.readAsDataURL(f);
  };
  var ds=document.getElementById('dl_save');
  if(ds)ds.onclick=function(){
    if(!DLPICK||DLPICK.pid!==String(x.id)){toast('ファイルを選んでください');return;}
    var gn=function(i,d){var e=document.getElementById(i),n=e?parseInt(e.value,10):NaN;
      return isNaN(n)?d:n;};
    ds.disabled=true;
    API.call('POST','/school/download-files',
      {productId:String(x.id),name:DLPICK.name,body:DLPICK.body,
       days:gn('dl_days',90),maxCount:gn('dl_count',10)})
      .then(function(j){
        DLPICK=null;
        toast('ファイルを預かりました');
        /* 日数や回数を短くしようとしたときは、サーバがそのままにする。黙って変えない。 */
        if(j.kept)alert(j.kept);
        DLF.refresh(function(){render();});
      })
      .catch(function(e){ds.disabled=false;toast(e.message);});
  };
  var dd=document.getElementById('dl_del');
  if(dd)dd.onclick=function(){
    if(!confirm('お渡しをやめます。すでにお申し込みいただいたご家庭も、受け取れなくなります。よろしいですか。'))return;
    API.call('DELETE','/school/download-files/'+encodeURIComponent(String(x.id)))
      .then(function(){toast('お渡しをやめました');DLF.refresh(function(){render();});})
      .catch(function(e){toast(e.message);});
  };

  var s=document.getElementById('edSave');   if(s)s.onclick=function(){store('public');};
  var d=document.getElementById('edDraft');  if(d)d.onclick=function(){store('draft');};
  var dl=document.getElementById('edDel');
  if(dl)dl.onclick=function(){
    if(!confirm('削除します。よろしいですか。'))return;
    saveOf(editing.type,listOf(editing.type).filter(function(y){return String(y.id)!==String(x.id);}));
    editing=null;toast('削除しました');render();};
}

/* ============================================================
   サーバとの同期（つないだときだけ動く）
   ------------------------------------------------------------
   これまでは端末の中（ブラウザ）だけに保存していたが、
   運営の決めごとでサーバにも保存することになった。
   つなぎ先とログインの控えは、園の画面（index.html）と同じ場所を見る。
   同じ端末で園の画面からログイン済みなら、そのまま使える。
   つないでいないときは、これまで通り端末の中だけで動く
   （お客さまにお見せする「お試し」が壊れないように）。
   ============================================================ */

/* サーバに送ってよいもの。ここに無いものは送らない。
   （つなぎ先やログインの控えを、うっかり送らないため） */
/* wa_settings（還元率）・wa_order_recv（受け取りました）・wa_amz_log（外部教材の申請の記録）も
   ここに入れる。入れないと、還元率を変えても別の端末に伝わらず、
   「受け取りました」を押しても保護者の画面が変わらない
   （保護者はサーバ経由でこの記録を見るため）。
   これらを書くのは園だけの画面なので、園以外の出品者が送ることはない。 */
var SYNC_KEYS=['wa_posts','wa_events_user','wa_comms_user','wa_creator','wa_products',
  'wa_settings','wa_order_recv','wa_amz_log'];

var API={
  base:function(){return String(stGet('apiBase','')||'').replace(/\/$/,'');},
  tenant:function(){return stGet('apiTenant',null);},
  /* ログインの控えは、園の画面ではタブの中（sessionStorage）に置いている。
     別のタブで開かれるとそれが引き継がれないことがあるので、端末の控えも見る。
     この画面では控えを消さない（元のタブが使い続けているため）。 */
  token:function(){
    var t='';
    try{t=sessionStorage.getItem('cocoas_apiToken')||'';}catch(e){}
    if(!t){
      var o=null;
      try{o=localStorage.getItem('cocoas_apiToken');}catch(e){}
      if(o){
        try{o=JSON.parse(o);}catch(e){o=null;}
        if(o&&typeof o==='string')t=o;
      }
    }
    return t;
  },
  enabled:function(){return !!API.base();},
  online:function(){return API.enabled()&&!!API.token();},
  call:function(method,path,body){
    var h={'Content-Type':'application/json'};
    if(API.token())h.Authorization='Bearer '+API.token();
    return fetch(API.base()+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401)throw new Error('ログインの期限が切れました。園の画面でログインし直してください。');
        if(!r.ok)throw new Error(j.error||('通信できませんでした（'+r.status+'）'));
        return j;});});
  }
};

var SYNC={queue:{},timer:null,busy:false,on:false,
  /* 保存のたびに、変わったものを控えておく。
     続けて何度も保存しても、少し待ってからまとめて1回だけ送る。 */
  mark:function(key){
    if(!SYNC.on||!API.online())return;
    if(SYNC_KEYS.indexOf(key)<0)return;
    SYNC.queue[key]=true;
    clearTimeout(SYNC.timer);
    SYNC.timer=setTimeout(SYNC.push,1200);
  },
  push:function(){
    if(!API.online()||SYNC.busy)return Promise.resolve();
    var keys=Object.keys(SYNC.queue);
    if(!keys.length)return Promise.resolve();
    SYNC.busy=true;SYNC.queue={};SYNC.setStatus('保存中…');
    var data={};
    keys.forEach(function(k){try{data[k]=JSON.parse(localStorage.getItem('cocoas_'+k));}catch(e){data[k]=null;}});
    return API.call('PUT','/state',{data:data})
      .then(function(){SYNC.setStatus('サーバに保存しました','ok');})
      /* 送れなかったものは控えに戻す。次に何か保存したときに、いっしょに送り直す。 */
      .catch(function(e){keys.forEach(function(k){SYNC.queue[k]=true;});
        SYNC.setStatus('まだ保存できていません：'+e.message,'ng');})
      .then(function(){SYNC.busy=false;});
  },
  pull:function(){
    if(!API.online())return Promise.resolve();
    SYNC.setStatus('読み込み中…');
    return API.call('GET','/state').then(function(j){
      var d=j.data||{};
      /* 園児のお名前は、ここで受け取ってメモリにだけ置く。
         端末には書かない（園の画面が持っている連絡先を上書きしないため）。 */
      NAMES.take(d);
      Object.keys(d).forEach(function(k){
        /* つなぎ先やログインの控えは、サーバの返事で書き換えない（園の乗っ取りを防ぐため） */
        if(/^(apiToken|apiBase|apiTenant|psession|staffSession|staffAccounts|parentAccounts)$/.test(k))return;
        /* この画面が使うものだけを受け取る。
           園の帳簿ぜんぶを書き戻すと、同じ端末で開いている園の画面が
           まだ送れていない書きかけを、こちらが上書きして消してしまう。 */
        if(SYNC_KEYS.indexOf(k)<0)return;
        if(d[k]===null||d[k]===undefined)return;
        /* ここで stSet を使うと、読み込んだものをそのまま送り返してしまうので、直に書く */
        try{localStorage.setItem('cocoas_'+k,JSON.stringify(d[k]));}catch(e){}
      });
      SYNC.setStatus('サーバと同じ内容です','ok');
      return j;
      return true;
    }).catch(function(e){
      /* 読めなくても画面は動かす（端末の中にあるものを、そのまま使う）。
         ただしサーバへは送らない。呼び出し元に失敗を伝える。 */
      SYNC.setStatus('読み込めませんでした：'+e.message,'ng');
      return false;
    });
  },
  setStatus:function(t,kind){
    var el=document.getElementById('syncStatus');
    if(!el)return;
    el.className='synctag'+(kind==='ok'?' on':(kind==='ng'?' ng':''));
    el.innerHTML='<i></i>'+esc(t);
  }
};

/* stSet を包んで、保存したものを自動でサーバへ送る。
   画面の側は、これまで通り stSet を呼ぶだけでよい。 */
(function(){
  var raw=stSet;
  stSet=function(k,v){raw(k,v);try{SYNC.mark(k);}catch(e){}};
})();

/* この画面は、園の画面から別のタブとして開かれる（ログインの控えを引き継ぐため）。
   そのままだと、この画面に何か差し込まれたときに、開いたもとの園の管理画面へ
   直接手が届いてしまう。この画面は開いたもとを使わないので、つながりを切っておく。
   （開き方そのもの＝index.html 側の window.open は、別の担当の受け持ち） */
try{window.opener=null;}catch(e){}

/* ---- 起動 ---- */
function boot(ok){
  /* サーバから読み込んだあとに on にする。
     先に on にすると、読み込む前の中身をサーバへ送り返してしまう。
     見本のデータを作る前に on にしているのは、
     サーバがまだ空のときに、その見本もサーバへ残すため。

     読み込みに失敗したときは on にしない。
     通信が一瞬切れただけで、この端末の見本データが
     その園の本物の投稿を上書きしてしまうため
     （見本は status:'public' なので、そのまま保護者の画面にも出てしまう）。 */
  SYNC.on=(ok!==false);
  me();posts();events();comms();
  render();
  if(ok===false)SYNC.setStatus('読み込めなかったので、この端末だけに保存します','ng');
}
if(API.online()){
  var t=API.tenant()||{};
  SYNC.setStatus((t.name?t.name+'／':'')+'読み込み中…');
  /* 描く前に、だれであるかを確かめる。
     先に描くと、園の画面が一瞬出てから消える（園以外の人に見せてしまう）。 */
  SYNC.pull().then(function(ok){WHO.load(function(){boot(ok!==false);});});
}else{
  /* つないでいないとき。何も出さないと「サーバに保存された」と思い込んでしまうので、必ず出す。 */
  SYNC.setStatus(API.enabled()
    ? 'ログインしていません（この端末だけに保存）'
    : 'この端末だけに保存しています');
  boot();
}
</script>
