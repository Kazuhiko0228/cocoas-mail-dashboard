<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>未来WA ｜ 保育をもっと自由に</title>
<style>
  :root{
    /* 未来WA：5枚の花びらの色。teal系の変数名は残しつつ中身をポップに差し替え */
    --teal:#EB4E9B;--teal-d:#C43478;--teal-l:#F27BB4;--accent:#F59A2E;
    --o:#F59A2E;--p:#EB4E9B;--b:#2D9CDB;--g:#6FBE44;--c:#3FC1E0;
    --bg:#FFF7EF;--card:#ffffff;--line:#F2E7DA;--line2:#FBF3EA;
    --tx:#23262E;--tx2:#6E6A72;--tx3:#A9A3AB;
    --amber:#F59A2E;--pink:#EB4E9B;--blue:#2D9CDB;
    --radius:20px;--shadow:0 3px 16px rgba(120,80,40,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--tx);}
  input:focus,select,textarea:focus{outline:none;border-color:var(--teal-l);}
  textarea{resize:vertical;line-height:1.6;}
  label{font-size:12.5px;color:var(--tx2);font-weight:600;display:block;margin-bottom:5px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(96deg,var(--o),var(--p));color:#fff;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:600;width:100%;transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.sec{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
  .btn.ghost{background:transparent;color:var(--tx2);border:none;font-weight:500;width:auto;padding:8px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .muted{color:var(--tx2);font-size:12.5px;}
  .demo-ribbon{background:#2c2c2c;color:#fff;font-size:11px;text-align:center;padding:4px;letter-spacing:.04em;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--line2);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:500;}

  /* ===== Login ===== */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 22px 40px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .brand .logo{width:auto;height:auto;background:none;box-shadow:none;display:block;}
  .brand .logo img{width:210px;max-width:70vw;height:auto;display:block;}
  .brand h1{font-size:19px;margin:2px 0 0;font-weight:700;}
  .brand .sub{font-size:12.5px;color:var(--tx2);}
  .field{margin-bottom:13px;}
  .link{color:var(--teal);font-weight:600;font-size:13.5px;background:none;border:none;text-decoration:underline;}
  .divider{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12px;margin:20px 0 14px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .sample-fam{display:flex;flex-direction:column;gap:8px;}
  .fam-btn{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;text-align:left;width:100%;}
  .fam-btn .av{width:38px;height:38px;border-radius:50%;background:var(--teal-l);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:15px;}
  .fam-btn .nm{font-weight:600;font-size:14.5px;}
  .fam-btn .em{font-size:11.5px;color:var(--tx2);}
  .err{background:#FCEBEB;color:#A32D2D;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:12px;display:none;}

  /* ===== Portal ===== */
  /* ===== 花びらのデザインシステム =====
     ロゴは「中心に子どもがいて、5つの支えが囲んでいる」という形。
     それを飾りではなくナビゲーションの構造として使う。
     タブ＝花びら。いまどの花びらにいるかが、ヘッダーの花で分かる。 */
  .topbar{position:sticky;top:0;z-index:20;background:var(--card);color:var(--tx);
    padding:11px 16px 12px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);}
  .topbar .walogo{height:28px;width:auto;flex-shrink:0;}
  .topbar .who .p{color:var(--tx2);}
  .topbar .who .n{color:var(--tx);}
  .topbar .out{background:var(--line2);border:1px solid var(--line);color:var(--tx2);}

  /* 現在地を示す花。押すとホームへ戻る */
  .bloom{width:52px;height:52px;flex-shrink:0;background:none;border:none;padding:0;display:block;}
  .bloom svg{width:100%;height:100%;display:block;}
  .bloom .pt{transform-origin:50% 50%;transition:opacity .32s ease,transform .32s cubic-bezier(.34,1.4,.5,1);opacity:.36;}
  .bloom .pt.on{opacity:1;transform:scale(1.16);}
  .bloom .core{transition:r .3s ease;}

  /* 花びら型のカード：3つの角は丸く、1つだけ絞る。ただの角丸との差はここ */
  .card{border-radius:22px 22px 22px 7px;}
  .card.petal-o{border-left:3px solid var(--o);}
  .card.petal-p{border-left:3px solid var(--p);}
  .card.petal-b{border-left:3px solid var(--b);}
  .card.petal-g{border-left:3px solid var(--g);}
  .card.petal-c{border-left:3px solid var(--c);}

  /* 見出しに、その画面の花びら色の小さな花びらを添える */
  h2.sec::before{content:"";width:12px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:var(--secc,var(--p));flex-shrink:0;transform:rotate(-12deg);}
  .sec-o{--secc:var(--o);} .sec-p{--secc:var(--p);} .sec-b{--secc:var(--b);}
  .sec-g{--secc:var(--g);} .sec-c{--secc:var(--c);}

  /* 空の状態にも花を出す（無機質な「データがありません」を避ける） */
  .bloom-empty{display:flex;flex-direction:column;align-items:center;gap:11px;padding:26px 10px;color:var(--tx3);font-size:13px;text-align:center;}
  .bloom-empty svg{width:56px;height:56px;opacity:.34;}
  .topbar .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .topbar .who{flex:1;min-width:0;}
  .topbar .who .p{font-size:11px;opacity:.85;line-height:1.2;}
  .topbar .who .n{font-size:15.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .out{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:600;}
  .scroll{flex:1;overflow-y:auto;padding:16px 15px 90px;}
  h2.sec{font-size:15px;font-weight:700;margin:4px 2px 11px;display:flex;align-items:center;gap:8px;}
  .sec-more{margin-left:auto;font-size:12px;color:var(--teal);font-weight:600;background:none;border:none;}

  /* Campaign banner */
  .promo{border-radius:18px;padding:20px 18px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 22px rgba(0,0,0,.14);}
  .promo .tag{display:inline-block;background:rgba(255,255,255,.25);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;margin-bottom:9px;letter-spacing:.03em;}
  .promo h3{margin:0 0 5px;font-size:21px;font-weight:800;line-height:1.25;}
  .promo p{margin:0 0 13px;font-size:13px;opacity:.95;}
  .promo .cta{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#222;border:none;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;}
  .promo .emoji{position:absolute;right:-6px;bottom:-14px;font-size:96px;opacity:.22;transform:rotate(-12deg);pointer-events:none;}

  /* posts */
  .post{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2);}
  .post:first-child{border-top:none;}
  .post .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .post .bd{flex:1;min-width:0;}
  .post .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;}
  .post .d{font-size:11.5px;color:var(--tx3);margin-top:1px;}
  .post .x{font-size:13px;color:var(--tx2);margin-top:4px;white-space:pre-wrap;}
  .new{background:var(--pink);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 7px;letter-spacing:.03em;}

  /* SNS */
  .sns-row{display:flex;gap:10px;}
  .sns-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 6px;color:var(--tx);text-decoration:none;position:relative;}
  .sns-btn .e{font-size:24px;}
  .sns-btn .l{font-size:11.5px;font-weight:600;}
  .sns-btn .dot{position:absolute;top:8px;right:12px;width:9px;height:9px;background:var(--pink);border-radius:50%;border:2px solid #fff;}

  /* attendance */
  .seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
  .seg button{flex:1;min-width:66px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--tx2);}
  .seg button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .att-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2);}
  .att-item .dt{font-weight:700;font-size:13px;min-width:64px;}
  .badge-k{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;}

  /* growth */
  .g-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .g-table th,.g-table td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line2);}
  .g-table th{font-size:11.5px;color:var(--tx2);font-weight:600;}
  .g-table td.mo{text-align:left;font-weight:600;}
  .spark{display:flex;align-items:flex-end;gap:7px;height:82px;padding:8px 2px 0;}
  .spark .b{flex:1;background:linear-gradient(180deg,var(--teal-l),var(--teal));border-radius:6px 6px 0 0;position:relative;min-height:5px;}
  .spark .b span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx2);font-weight:600;}
  .spark .b em{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx3);font-style:normal;}

  /* bottom nav */
  .tabbar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--tx3);font-size:10.5px;font-weight:600;position:relative;min-height:46px;
    transition:color .2s;}
  .tabbar button .e{font-size:19px;line-height:1;transition:transform .26s cubic-bezier(.34,1.4,.5,1);}
  /* 選ばれているタブの下に、その花びらの色の小さな花びらが咲く */
  .tabbar button::after{content:"";position:absolute;bottom:1px;width:16px;height:5px;border-radius:99px;
    background:currentColor;opacity:0;transform:scaleX(.4);transition:opacity .24s,transform .24s;}
  .tabbar button.on::after{opacity:1;transform:scaleX(1);}
  .tabbar button.on .e{transform:translateY(-2px) scale(1.14);}
  .tabbar button.on{color:var(--tabc,var(--p));}
  .tabbar button.t-home.on{color:var(--p);} .tabbar button.t-att.on{color:var(--o);}
  .tabbar button.t-growth.on{color:var(--g);} .tabbar button.t-bill.on{color:var(--b);}
  .tabbar button.t-dm.on{color:var(--c);} .tabbar button.t-news.on{color:var(--p);}
  @media (prefers-reduced-motion:reduce){.bloom .pt,.tabbar button .e,.tabbar button::after{transition:none;}}
  .bloom .pt.dormant{opacity:.5;}
  /* あそぶ／まなぶ のしぼりこみ */
  .fsearch{position:relative;margin-top:12px;}
  .fsearch input{padding-right:38px;}
  .fclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
    border:none;background:var(--line);color:var(--tx2);font-size:15px;line-height:1;}
  .flabel{font-size:11.5px;font-weight:700;color:var(--tx2);margin:13px 0 7px;}
  .fchips{display:flex;gap:7px;flex-wrap:wrap;}
  .fchips .chip{padding:7px 13px;font-size:12.5px;min-height:34px;}
  .fchips .chip.on{background:var(--secc,var(--p));border-color:transparent;color:#fff;font-weight:700;}
  .petal-o+.fcount,.card.petal-o .fchips .chip.on{--secc:var(--o);}
  .fcount{font-size:12px;color:var(--tx3);margin:2px 2px 10px;font-weight:600;}
  .ftags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .ftag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line2);color:var(--tx2);}
  .ftag.age{background:transparent;border:1px solid var(--line);color:var(--tx3);}

  /* ===== PC版 =====
     スマホは下のタブバー、PCは左に花びらのナビ。同じ構造を画面幅で切り替える。 */
  .shell{flex:1;display:flex;min-height:0;}
  .sidenav{display:none;}
  @media(min-width:860px){
    body{background:linear-gradient(160deg,#FFF7EF,#FDEFF4 60%,#EFF7FD);}
    .phone{max-width:1180px;min-height:100vh;box-shadow:none;background:transparent;padding:0 24px;}
    .topbar{border-radius:0 0 20px 20px;margin-bottom:20px;padding:15px 22px;}
    .topbar .walogo{height:34px;order:-1;margin-right:4px;}
    .shell{gap:22px;align-items:flex-start;}
    .sidenav{display:flex;flex-direction:column;gap:6px;width:212px;flex-shrink:0;position:sticky;top:92px;
      background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);}
    .sidenav .sn{display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;
      padding:12px 14px;border-radius:14px;font-size:14px;font-weight:700;color:var(--tx2);cursor:pointer;min-height:48px;
      transition:background .16s,color .16s;}
    .sidenav .sn .e{font-size:20px;line-height:1;}
    .sidenav .sn:hover{background:var(--line2);}
    .sidenav .sn.on{color:#fff;}
    .sidenav .sn.t-school.on{background:var(--b);} .sidenav .sn.t-play.on{background:var(--o);}
    .sidenav .sn.t-learn.on{background:var(--g);}  .sidenav .sn.t-store.on{background:var(--p);}
    .sidenav .sn.t-me.on{background:var(--c);}
    .sidenav .sn.dis{color:var(--tx3);border:1.5px dashed var(--line);}
    .scroll{padding:0 0 60px;max-width:820px;}
    /* PCで押しっぱなしの帯にならないよう、操作ボタンは内容に合わせる */
    .scroll .btn{width:auto;min-width:200px;padding:12px 26px;}
    .scroll .btn.sec{min-width:0;}
    .tabbar{display:none;}
    h2.sec{font-size:16px;margin-top:22px;}
    .card{margin-bottom:16px;}
  }
  @media(min-width:1120px){
    .scroll .card{max-width:none;}
  }

  /* toast */
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty{text-align:center;color:var(--tx3);padding:26px 10px;font-size:13.5px;}
  .info{background:#E6F1FB;color:#0C447C;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.6;}
</style>
</head>
<body>
<div class="phone">
  <div class="demo-ribbon">デモ版（プロトタイプ）｜ ログイン・データはこの端末内のみ。本番は認証・DBをサーバ側で保護します</div>
  <div id="root"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   COCOAS KIDS 保護者ページ（プロトタイプ）
   - 職員ダッシュボード(index.html)と同一オリジンのlocalStorageでデータ共有
   - 出欠連絡は職員側の rec_登園シート に反映 / 身体測定・配信は共有データを表示
   - デモ認証（本物のセキュリティではない）。将来バックエンドに載せ替え可能な設計。
   ========================================================================= */

/* ---- shared storage helpers (index.html と同じ prefix 'cocoas_') ---- */
function stGet(k,d){try{var v=JSON.parse(localStorage.getItem('cocoas_'+k));return v==null?d:v;}catch(e){return d;}}
function stSet(k,v){localStorage.setItem('cocoas_'+k,JSON.stringify(v));}
function pad(n){return String(n).padStart(2,'0');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDaysISO(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var WD=['日','月','火','水','木','金','土'];
function fmtDate(s){if(!s)return'';var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);return (+p[1])+'/'+(+p[2])+'（'+WD[d.getDay()]+'）';}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function childName(c){return (c.child||'').replace(/ちゃん|くん/g,'');}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---- seed sample data if empty (standalone で動くように・実データは入れない) ---- */
function seedEnrolled(){return [
  {id:11,kind:'enrolled',klass:'Pre',name:"高橋 さくら",child:"心春ちゃん",email:"takahashi@example.com",dob:"2023-05-10",days:"月・水・金",lunch:true,long:false},
  {id:12,kind:'enrolled',klass:'Pre',name:"渡辺 直樹",child:"大翔くん",email:"watanabe@example.com",dob:"2023-09-15",days:"火・木・金",lunch:true,long:true},
  {id:13,kind:'enrolled',klass:'Pre',name:"加藤 麻衣",child:"美桜ちゃん",email:"kato@example.com",dob:"2024-07-20",days:"月・火・木・金",lunch:false,long:false},
  {id:14,kind:'enrolled',klass:'Kinder',name:"山田 健太",child:"結菜ちゃん",email:"yamada@example.com",dob:"2022-06-18",days:"月・火・水・木・金",lunch:true,long:true},
  {id:15,kind:'enrolled',klass:'Kinder',name:"松本 千夏",child:"湊くん",email:"matsumoto@example.com",dob:"2022-11-02",days:"月・火・水・木・金",lunch:true,long:false}
];}
function enrolled(){return (stGet('contacts',null)||[]).filter(function(c){return c.kind==='enrolled';});}

/* 子どもごとの分かりやすいデモ用パスワード（画面に表示するので秘密ではない） */
var DEMO_PW={11:'kokoro',12:'hiroto',13:'mio',14:'yuna',15:'minato'};
function demoPwFor(c){return DEMO_PW[c.id]||('cocoas'+c.id);}

function seedAll(){
  if(!localStorage.getItem('cocoas_contacts')) stSet('contacts',seedEnrolled());
  var en=enrolled();
  // parent accounts: email -> {childId, pw}
  // 既知のデモ児(11-15)は毎回パスワードを確定（古い保存 'cocoas' 等を上書きして、画面表示と必ず一致させる）
  var acc=stGet('parentAccounts',null)||{};
  en.forEach(function(c){
    if(DEMO_PW[c.id]) acc[c.email]={childId:c.id,pw:DEMO_PW[c.id]};
    else if(!acc[c.email]) acc[c.email]={childId:c.id,pw:demoPwFor(c)};
  });
  stSet('parentAccounts',acc);
  // body-measure sample (rec_身体測定): 直近4ヶ月
  if(!localStorage.getItem('cocoas_rec_身体測定')){

function login(email,pw){
  email=(email||'').trim().toLowerCase();pw=(pw||'').trim();
  var acc=stGet('parentAccounts',{});var a=acc[email];
  // デモのため寛容に：登録PW／全国共通の 'cocoas'／その子の既定PW のいずれでもログイン可
  if(a && (pw===String(a.pw)||pw==='cocoas'||pw===DEMO_PW[a.childId])){sessionStorage.setItem('cocoas_psession',a.childId);return true;}
  return false;
}
function loginByChild(id){sessionStorage.setItem('cocoas_psession',id);}
function logout(){
  sessionStorage.removeItem('cocoas_wa_guest');sessionStorage.removeItem('cocoas_psession');render();}
function resetDemo(){
  ['parentAccounts','absence_log'].forEach(function(k){localStorage.removeItem('cocoas_'+k);});
  Object.keys(localStorage).filter(function(k){return k.indexOf('cocoas_posts_seen_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  sessionStorage.removeItem('cocoas_psession');
  seedAll();
}

var tab='school', authView='login', resetEmail='';

/* 園とつながっていなくても使える。未来WAは一般の保護者向けにも開いている */
function isGuest(){return sessionStorage.getItem('cocoas_wa_guest')==='1';}
function render(){
  var c=sessionChild();
  if(!c&&!isGuest()){document.getElementById('root').innerHTML=loginHTML();wireAuth();return;}
  document.getElementById('root').innerHTML=portalHTML(c);
  wirePortal(c);
}

/* ---------- LOGIN / PW flow ---------- */
function loginHTML(){
  if(authView==='reset') return resetHTML();
  if(authView==='newpw') return newpwHTML();
  var en=enrolled();
  return '<div class="login-wrap">'
    +'<div class="brand"><div class="logo"><img src="'+WA_LOGO+'" alt="未来WA 〜保育をもっと自由に〜"></div><div class="sub" style="margin-top:8px;">COCOAS KIDS 大宮与野校</div></div>'
    +'<div class="err" id="loginErr"></div>'
    +'<div class="field"><label>メールアドレス</label><input id="li_email" type="email" placeholder="you@example.com" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>'
    +'<div class="field"><label>パスワード</label><input id="li_pw" type="text" placeholder="パスワード" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>'
    +'<button class="btn" id="li_go">ログイン</button>'

    +'<button class="btn sec" id="li_guest">まずは教材だけ見てみる</button>'

function wireAuth(){
  var gb=document.getElementById('li_guest');
  if(gb)gb.onclick=waEnterGuest;
  var $=function(id){return document.getElementById(id);};
  if(authView==='login'){
    $('li_go').onclick=function(){
      if(login($('li_email').value.toLowerCase(),$('li_pw').value)){render();}
      else{var e=$('loginErr');e.textContent='メールアドレスまたはパスワードが違います。';e.style.display='block';}
    };
    $('li_pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('li_go').click();});
    $('li_forgot').onclick=function(){authView='reset';render();};
    document.querySelectorAll('[data-fill]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-fill').split('|');$('li_email').value=p[0]||'';$('li_pw').value=p[1]||'';$('loginErr').style.display='none';if(login((p[0]||'').toLowerCase(),p[1]||'')){render();}else{toast('自動入力しました。「ログイン」を押してください');}};});
    if($('li_reset'))$('li_reset').onclick=function(){resetDemo();render();toast('テスト用アカウントを作り直しました');};
  } else if(authView==='reset'){
    $('rs_go').onclick=function(){var em=($('rs_email').value||'').trim().toLowerCase();var acc=stGet('parentAccounts',{});if(!em){toast('メールアドレスを入力してください');return;}resetEmail=em;authView='newpw';render();toast('再設定リンクを送信しました（デモ）');};
    $('rs_back').onclick=function(){authView='login';render();};
  } else if(authView==='newpw'){
    $('np_go').onclick=function(){
      var p=$('np_pw').value,p2=$('np_pw2').value;var e=$('npErr');

    if(f.age&&x.ages.indexOf(f.age)<0)return false;

      if((x.t+x.d+x.cat).toLowerCase().indexOf(q)<0)return false;}

      +'<div class="flabel">カテゴリ</div>'+chips('cat',cats,f.cat)
      +'<div class="flabel">年齢</div>'+chips('age',WA_AGES,f.age)
    +'</div>'
    +'<div class="fcount">'+list.length+'件</div>'
    +(list.length?list.map(function(x){
      return '<div class="card petal-'+col+'" style="display:flex;gap:13px;align-items:flex-start;">'
        +'<div style="font-size:27px;flex-shrink:0;line-height:1.2;">'+esc(x.e)+'</div>'

        +'<div class="ftags"><span class="ftag">'+esc(x.cat)+'</span>'
          +x.ages.slice(0,3).map(function(a){return '<span class="ftag age">'+esc(a)+'</span>';}).join('')
          +(x.ages.length>3?'<span class="ftag age">ほか</span>':'')+'</div>'
        +'</div></div>';}).join('')
      :bloomEmpty('条件に合うものが見つかりませんでした'));
}
function wireFeed(kind){
  var sc=document.getElementById('scroll');
  sc.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){
    waFeed[kind][b.getAttribute('data-f')]=b.getAttribute('data-v');
    sc.innerHTML=feedHTML(kind);wireFeed(kind);};});
  var q=document.getElementById('fq');
  if(q){
    q.oninput=function(){
      waFeed[kind].q=q.value;
      var pos=q.selectionStart;
      sc.innerHTML=feedHTML(kind);wireFeed(kind);
      var n=document.getElementById('fq');
      if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
    };
  }
  var x=document.getElementById('fqx');
  if(x)x.onclick=function(){waFeed[kind].q='';sc.innerHTML=feedHTML(kind);wireFeed(kind);};
}

/* ---------- PORTAL ----------
   ロゴの5枚の花びらを、そのまま画面の構造にしている。
   タブ＝花びら。中心（ホーム）に子どもがいて、5つの支えが囲む、という形をなぞる。 */
/* 5つのタブ＝ロゴの5枚の花びら。園とつながると「スクール」が咲く。
   つながっていない家庭でも、あそぶ・まなぶ・ストア・マイページは使える。 */
var PETALS=[
  {t:'school',c:'var(--b)', a:-90,  e:'🏫', l:'スクール'},
  {t:'play',  c:'var(--o)', a:-18,  e:'🎨', l:'あそぶ'},
  {t:'learn', c:'var(--g)', a:54,   e:'🌱', l:'まなぶ'},
  {t:'store', c:'var(--p)', a:126,  e:'🛍️', l:'ストア'},
  {t:'me',    c:'var(--c)', a:198,  e:'👤', l:'マイページ'}
];
/* 園とつながっているか。つながっていなければ「スクール」の花びらは休眠する */
function waLinked(){return !!sessionChild();}
function waEnterGuest(){sessionStorage.setItem('cocoas_wa_guest','1');tab='store';render();}
/* いまどの花びらにいるかを示す花。押すとホームへ戻る */
function bloomSVG(active,size){
  var s=size||52;
  var linked=waLinked();
  var petals=PETALS.map(function(p){
    /* 園とつながっていないと、スクールの花びらは咲かない（輪郭だけ残る） */
    if(p.t==='school'&&!linked){
      return '<ellipse class="pt dormant" cx="0" cy="-13" rx="7.6" ry="10.4" fill="none"'
        +' stroke="'+p.c+'" stroke-width="1.3" stroke-dasharray="3 2.4" transform="rotate('+p.a+')"/>';
    }
    var on=(p.t===active);
    return '<ellipse class="pt'+(on?' on':'')+'" cx="0" cy="-13" rx="7.6" ry="10.4" fill="'+p.c+'"'
      +' transform="rotate('+p.a+')"/>';
  }).join('');
  var core=linked?6.6:5.2;
  return '<svg viewBox="-24 -24 48 48" width="'+s+'" height="'+s+'" aria-hidden="true">'
    +'<g>'+petals+'</g>'
    +'<circle class="core" r="'+core+'" fill="#fff" stroke="var(--line)" stroke-width="1"/>'
    +'<circle cx="-1.9" cy="-1" r="1.05" fill="var(--tx)"/><circle cx="1.9" cy="-1" r="1.05" fill="var(--tx)"/>'
    +'<path d="M-1.9 1.7 q1.9 1.9 3.8 0" stroke="var(--tx)" stroke-width="1" fill="none" stroke-linecap="round"/>'
    +'</svg>';
}
function portalHTML(c){
  var linked=!!c;
  return '<div class="topbar">'
    +'<button class="bloom" id="bloomBtn" aria-label="'+(linked?'スクールへ':'マイページへ')+'">'+bloomSVG(tab)+'</button>'
    +'<div class="who">'
      +(linked?'<div class="p">'+esc(c.klass)+'クラス</div><div class="n">'+esc(c.child)+'</div>'
              :'<div class="p">未来WA</div><div class="n">園とつながっていません</div>')+'</div>'
    +'<img src="'+WA_LOGO+'" alt="未来WA" class="walogo">'
    +'<button class="out" id="logout">'+(linked?'ログアウト':'ログイン')+'</button>'
    +'</div>'
    /* PC では左に花びらのナビを出し、スマホでは下のタブバーになる */
    +'<div class="shell">'
      +'<nav class="sidenav">'+PETALS.map(function(p){
        var dis=(p.t==='school'&&!linked);
        return '<button data-tab="'+p.t+'" class="sn t-'+p.t+(tab===p.t?' on':'')+(dis?' dis':'')+'">'
          +'<span class="e">'+p.e+'</span><span class="l">'+esc(dis?'園とつながる':p.l)+'</span></button>';}).join('')
      +'</nav>'
      +'<div class="scroll" id="scroll"></div>'
    +'</div>'
    +'<div class="tabbar">'+PETALS.map(function(p){
      var dis=(p.t==='school'&&!linked);
      return tabBtn(p.t,p.e,dis?'つながる':p.l);}).join('')+'</div>';
}
function tabBtn(id,e,l){return '<button data-tab="'+id+'" class="t-'+id+(tab===id?' on':'')+'"><span class="e">'+e+'</span>'+l+'</button>';}
/* 中身が無いときも、無機質な文字だけにしない */
function bloomEmpty(msg){
  return '<div class="bloom-empty">'+bloomSVG('',56)+'<div>'+esc(msg)+'</div></div>';
}

function wirePortal(c){
  document.getElementById('logout').onclick=logout;
  var bb=document.getElementById('bloomBtn');
  if(bb)bb.onclick=function(){tab=c?'school':'me';render();};
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-tab');render();};});
  var sc=document.getElementById('scroll'),linked=!!c;
  if(tab==='school'){
    if(!linked){sc.innerHTML=linkHTML();wireLink();return;}
    /* homeHTML と newsHTML はどちらも「おたより・キャンペーン・SNS」を描画するため、
       並べると同じものが2度出る。スクールタブは newsHTML（全件）に一本化する。 */
    sc.innerHTML=newsHTML(c)+attHTML(c)+dmHTML(c);
  }
  else if(tab==='play') sc.innerHTML=feedHTML('play');
  else if(tab==='learn') sc.innerHTML=(linked?growthHTML(c):'')+feedHTML('learn');
  else if(tab==='store') sc.innerHTML=storeHTML(c);
  else if(tab==='me') sc.innerHTML=meHTML(c);
  wireCommon(c);
  if(tab==='school'){wireAtt(c);wireDM(c);}
  if(tab==='play') wireFeed('play');
  if(tab==='learn') wireFeed('learn');
  if(tab==='store') wireStore(c);
  if(tab==='me') wireMe(c);
}

/* ---- shared bits ---- */
function promoHTML(){
  var cp=stGet('campaign',{});if(!cp.on)return'';
  return '<div class="promo" style="background:'+esc(cp.bg||'linear-gradient(135deg,#ff8a5b,#ff5f7e)')+';">'
    +'<span class="emoji">'+esc(cp.emoji||'🎉')+'</span>'
    +(cp.tag?'<span class="tag">'+esc(cp.tag)+'</span>':'')
    +'<h3>'+esc(cp.title||'')+'</h3><p>'+esc(cp.sub||'')+'</p>'
    +'<button class="cta" data-cta="'+esc(cp.ctaUrl||'#')+'">'+esc(cp.ctaText||'くわしく見る')+' →</button></div>';
}
function postIcon(type){return {sns:'📷',daily:'📖',news:'📢',event:'🎪'}[type]||'📩';}
function postIconBg(type){return {sns:'#FBEAF0',daily:'#EAF3DE',news:'#E6F1FB',event:'#FAEEDA'}[type]||'#eef0ec';}
function seenPosts(){return stGet('posts_seen_'+ (sessionStorage.getItem('cocoas_psession')||'x'), []);}
function markSeen(ids){stSet('posts_seen_'+(sessionStorage.getItem('cocoas_psession')||'x'), ids);}
function allPosts(){
  var posts=(stGet('posts',[])||[]).slice();
  // 職員の全体配信(history)も おたより として取り込む
  var hist=stGet('history',[])||[];
  hist.forEach(function(h,i){ if(h && h.body && (String(h.tpl||'').indexOf('デイリー')>-1||String(h.tpl||'').indexOf('配信')>-1||String(h.tpl||'').indexOf('お知らせ')>-1)){
    posts.push({id:'h'+i,date:(h.time||todayISO()).slice(0,10),type:'daily',title:esc(h.subject||h.tpl||'園からのおたより'),body:h.body});
  }});
  posts.sort(function(a,b){return (a.date<b.date)?1:(a.date>b.date?-1:0);});
  return posts;
}
function postRow(p,isNew){
  return '<div class="post"><div class="ic" style="background:'+postIconBg(p.type)+';">'+postIcon(p.type)+'</div>'
    +'<div class="bd"><div class="t">'+esc(p.title)+(isNew?'<span class="new">NEW</span>':'')+'</div>'
    +'<div class="d">'+fmtDate(p.date)+'</div>'
    +'<div class="x">'+esc(p.body||'')+'</div>'
    +(p.url?'<button class="link" style="margin-top:5px;" data-open="'+esc(p.url)+'">開く →</button>':'')+'</div></div>';
}
function snsHTML(){
  var s=stGet('sns',{});
  var posts=allPosts();var seen=seenPosts();
  var newSns=posts.some(function(p){return p.type==='sns'&&seen.indexOf(p.id)<0;});
  return '<div class="card"><h2 class="sec">🔗 SNS・最新情報</h2><div class="sns-row">'
    +'<a class="sns-btn" href="'+esc(s.instagram||'#')+'" target="_blank" rel="noopener"><span class="e">📷</span><span class="l">Instagram</span>'+(newSns?'<span class="dot"></span>':'')+'</a>'
    +'<a class="sns-btn" href="'+esc(s.line||'#')+'" target="_blank" rel="noopener"><span class="e">💬</span><span class="l">LINE</span></a>'
    +'<a class="sns-btn" href="'+esc(s.youtube||'#')+'" target="_blank" rel="noopener"><span class="e">▶️</span><span class="l">YouTube</span></a>'
    +'</div>'+(newSns?'<div class="muted" style="margin-top:10px;">📷 Instagramに新しい投稿があります。</div>':'')+'</div>';
}
function wireCommon(c){
  document.querySelectorAll('[data-cta],[data-open]').forEach(function(b){b.onclick=function(){var u=b.getAttribute('data-cta')||b.getAttribute('data-open');if(u&&u!=='#')window.open(u,'_blank','noopener');else toast('リンク先はデモのため未設定です');};});
}

/* ---- HOME ---- */
function homeHTML(c){
  var posts=allPosts();var seen=seenPosts();
  var latest=posts.slice(0,3);
  // mark home-visible posts as seen
  setTimeout(function(){markSeen(posts.map(function(p){return p.id;}));},1200);
  var newCount=posts.filter(function(p){return seen.indexOf(p.id)<0;}).length;
  return promoHTML()
    +'<div class="card"><h2 class="sec sec-b">📩 園からのおたより'+(newCount?' <span class="new">'+newCount+'件の新着</span>':'')+'<button class="sec-more" data-tab2="news">すべて見る</button></h2>'
    +(latest.length?latest.map(function(p){return postRow(p,seen.indexOf(p.id)<0);}).join(''):bloomEmpty('まだおたよりはありません'))+'</div>'
    + snsHTML()
    +'<div class="card"><h2 class="sec sec-o">📅 おやすみの連絡</h2><div class="muted" style="margin-bottom:11px;">当日・事前のおやすみ／遅刻などを園に連絡できます。</div><button class="btn sec" data-tab2="att">出欠連絡をひらく</button></div>';
}

/* ---- ATTENDANCE ---- */
var attKind='欠席';
function attStoreKey(){return 'rec_登園シート';}
function submitAbsence(c,date,kind,reason){
  var K=attStoreKey();var data=stGet(K,{});
  var day=data[date]||{klass:c.klass,rows:{},weather:'',temp:'',hum:'',memo:'',by:''};
  if(!day.rows)day.rows={};
  /* 職員側の登園シートと同じ記号にする。ここがずれると、保護者の連絡が園の画面に反映されない。
     職員側は ['','●','早','遅','休'] を使う（index.html の登園シート） */
  var mark = kind==='欠席'?'休':(kind==='遅刻'?'遅':(kind==='早退'?'早':'●'));
  var prev=day.rows[c.id]||{};
  day.rows[c.id]=Object.assign(prev,{att:mark,absent:kind==='欠席',parentNote:{kind:kind,reason:reason,at:new Date().toLocaleString('ja-JP')}});
  data[date]=day;stSet(K,data);
  // parent-side log
  var log=stGet('absence_log',[]);log.push({childId:c.id,date:date,kind:kind,reason:reason,at:new Date().toLocaleString('ja-JP')});stSet('absence_log',log);
}
function myAbsences(c){return (stGet('absence_log',[])||[]).filter(function(a){return a.childId===c.id;}).sort(function(a,b){return a.date<b.date?1:-1;});}
function attHTML(c){
  var list=myAbsences(c);
  return '<div class="card"><h2 class="sec sec-o">📅 おやすみ・遅刻の連絡</h2>'
    +'<div class="info" style="margin-bottom:14px;">送信すると、園の出欠記録にすぐ反映されます。前日までのご連絡にご協力ください。</div>'
    +'<div class="field"><label>日付</label><input id="at_date" type="date" value="'+addDaysISO(1)+'" min="'+todayISO()+'"></div>'
    +'<div class="field"><label>区分</label><div class="seg" id="at_seg">'
      +['欠席','遅刻','早退','お迎え変更'].map(function(k){return '<button data-k="'+k+'" class="'+(k===attKind?'on':'')+'">'+k+'</button>';}).join('')+'</div></div>'
    +'<div class="field"><label>理由・伝えたいこと</label><textarea id="at_reason" rows="3" placeholder="例：発熱のためお休みします（37.8度）"></textarea></div>'
    +'<button class="btn" id="at_send">この内容で園に連絡する</button></div>'
    +'<div class="card"><h2 class="sec">🗒 連絡の履歴</h2>'
    +(list.length?list.map(function(a){var col=a.kind==='欠席'?'#FCEBEB;color:#A32D2D':(a.kind==='遅刻'||a.kind==='早退'?'#FAEEDA;color:#854F0B':'#E6F1FB;color:#0C447C');return '<div class="att-item"><div class="dt">'+fmtDate(a.date)+'</div><div style="flex:1;"><span class="badge-k" style="background:'+col+';">'+esc(a.kind)+'</span><div class="muted" style="margin-top:4px;">'+esc(a.reason||'（理由なし）')+'</div><div style="font-size:10.5px;color:var(--tx3);margin-top:2px;">送信：'+esc(a.at)+'</div></div></div>';}).join(''):bloomEmpty('まだ連絡はありません'))+'</div>';
}
function wireAtt(c){
  var $=function(id){return document.getElementById(id);};
  $('at_seg').querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){attKind=b.getAttribute('data-k');$('at_seg').querySelectorAll('[data-k]').forEach(function(x){x.classList.toggle('on',x===b);});};});
  $('at_send').onclick=function(){
    var date=$('at_date').value;var reason=$('at_reason').value.trim();
    if(!date){toast('日付を選んでください');return;}
    submitAbsence(c,date,attKind,reason);
    toast('園に連絡しました（'+attKind+'）');
    tab='att';render();
  };
}

/* ---- GROWTH (身体測定) ---- */
function kaupVal(h,w){h=parseFloat(h);w=parseFloat(w);if(!h||!w)return null;return (w*10000/(h*h));}
function growthHTML(c){
  var bm=stGet('rec_身体測定',{})||{};
  var months=Object.keys(bm).sort();
  var rows=months.map(function(mk){var r=(bm[mk].rows||{})[c.id]||{};return {mk:mk,h:r.h,w:r.w};}).filter(function(r){return r.h||r.w;});
  var head='<div class="card"><h2 class="sec sec-g">📈 '+esc(c.child)+'のせいちょう</h2>';
  if(!rows.length) return head+'<div class="empty">まだ身体測定の記録がありません。<br>測定後にこちらに反映されます。</div></div>';
  // spark for height
  var hs=rows.map(function(r){return parseFloat(r.h)||0;});var mn=Math.min.apply(null,hs),mx=Math.max.apply(null,hs);var rng=(mx-mn)||1;
  var spark='<div class="muted" style="margin:2px 0 22px;">身長の推移（cm）</div><div class="spark">'+rows.map(function(r){var h=parseFloat(r.h)||0;var pct=18+((h-mn)/rng)*78;return '<div class="b" style="height:'+pct+'%;"><span>'+(r.h||'-')+'</span><em>'+r.mk.slice(5)+'月</em></div>';}).join('')+'</div>';
  var table='<table class="g-table" style="margin-top:14px;"><thead><tr><th style="text-align:left;">月</th><th>身長</th><th>体重</th><th>カウプ指数</th></tr></thead><tbody>'
    +rows.map(function(r){var k=kaupVal(r.h,r.w);return '<tr><td class="mo">'+r.mk.replace('-','年')+'月</td><td>'+(r.h||'-')+'</td><td>'+(r.w||'-')+'</td><td>'+(k?k.toFixed(1):'-')+'</td></tr>';}).join('')+'</tbody></table>';
  return head+spark+table+'<div class="muted" style="margin-top:12px;">カウプ指数の目安：15〜17がふつうです。ご心配な点は園にご相談ください。</div></div>';
}



/* ---- 請求（園からの請求書） ---- */
function billHTML(c){
  var all=stGet('invoices',{})||{};
  var months=Object.keys(all).sort().reverse();
  var rows=[];
  months.forEach(function(mk){var r=(all[mk]||{})[c.id];if(r&&['送付済','入金済'].indexOf(r.status)>-1)rows.push({mk:mk,r:r});});
  var head='<div class="card"><h2 class="sec sec-b">💴 保育料のご請求</h2>';
  if(!rows.length)return head+'<div class="empty">現在お知らせしている請求はありません。<br>発行されるとこちらに表示されます。</div></div>';
  return head+rows.map(function(x){
    var paid=x.r.status==='入金済';
    var L=[];var P=(stGet('settings',{})||{}).pricing||{plans:{}};
    return '<div style="border:1px solid #e7e8e3;border-radius:14px;padding:13px 15px;margin-bottom:10px;">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">'
      +'<span style="font-weight:700;font-size:15px;">'+(+x.mk.split('-')[1])+'月分</span>'
      +'<span style="background:'+(paid?'#EAF3DE':'#FAEEDA')+';color:'+(paid?'#27500A':'#854F0B')+';border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;">'+(paid?'お支払い済み':'お支払いのお願い')+'</span></div>'
      +'<div style="font-size:22px;font-weight:700;margin-bottom:4px;">¥'+Number(x.r.total||0).toLocaleString()+'</div>'
      +'<div class="muted" style="font-size:12.5px;">お支払期日：'+(x.r.due?x.r.due:'園からのご案内をご確認ください')+'</div>'
      +'</div>';
  }).join('')+'<div class="muted" style="margin-top:6px;font-size:12px;">内訳・お振込先は園からお送りしたメールをご確認ください。ご不明な点は「メッセージ」からお問い合わせいただけます。</div></div>';
}

/* ---- DM（園とのメッセージ） ---- */
function dmNow(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function dmThread(id){var t=stGet('dmThreads',{});return t[id]||{messages:[]};}
function dmUnreadParent(id){return dmThread(id).messages.filter(function(m){return m.from==='staff'&&!m.readByParent;}).length;}
function dmMarkReadParent(id){var t=stGet('dmThreads',{});if(!t[id])return;t[id].messages.forEach(function(m){if(m.from==='staff')m.readByParent=true;});stSet('dmThreads',t);}
function dmHTML(c){
  var th=dmThread(c.id);
  var head='<div class="card"><h2 class="sec sec-c">💬 園とのメッセージ</h2><div class="muted" style="margin-bottom:11px;">担任・園からの連絡や、ご家庭からのご相談をやりとりできます。送信すると園に通知が届きます。</div>';
  var log='<div id="pdmLog" style="max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:4px 0;">'
    +(th.messages.length?th.messages.map(function(m){var mine=m.from==='parent';
      return '<div style="align-self:'+(mine?'flex-end':'flex-start')+';max-width:82%;">'
        +'<div style="font-size:10.5px;color:#98a09a;margin-bottom:2px;text-align:'+(mine?'right':'left')+';">'+(mine?'あなた':esc(m.by||'園'))+' ・ '+esc(m.at)+'</div>'
        +'<div style="padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;'+(mine?'background:#0F6E56;color:#fff;border-bottom-right-radius:5px;':'background:#fff;border:1px solid #e7e8e3;border-bottom-left-radius:5px;')+'">'+esc(m.text)+'</div></div>';}).join('')
      :bloomEmpty('まだメッセージはありません'))+'</div>';
  var form='<div style="margin-top:12px;"><textarea id="pdmText" rows="3" placeholder="園へのご連絡・ご相談を入力してください" style="width:100%;box-sizing:border-box;border:1px solid #e7e8e3;border-radius:12px;padding:11px;font-size:14px;font-family:inherit;"></textarea>'
    +'<button class="btn sec" id="pdmSend" style="margin-top:8px;width:100%;">送信する</button><div class="muted" id="pdmMsg" style="margin-top:8px;"></div></div>';
  return head+log+form+'</div>';
}
function wireDM(c){
  dmMarkReadParent(c.id);
  var log=document.getElementById('pdmLog');if(log)log.scrollTop=log.scrollHeight;
  document.getElementById('pdmSend').onclick=function(){
    var tx=document.getElementById('pdmText').value.trim();
    if(!tx){alert('メッセージを入力してください');return;}
    var t=stGet('dmThreads',{});if(!t[c.id])t[c.id]={messages:[]};
    t[c.id].messages.push({id:Date.now(),from:'parent',by:c.name,text:tx,at:dmNow(),readByStaff:false,readByParent:true});
    stSet('dmThreads',t);
    /* 園へ通知メール（返信URL付き）— 実送信はバックエンド接続後 */
    var st=stGet('settings',{})||{},school=st.school||'COCOAS KIDS International School',sender=st.sender||'omiya@cocoas-kids.com';
    var hist=stGet('history',[])||[];
    hist.push({date:addDaysISO(0),time:dmNow().slice(5),tpl:'DM通知（園へ）',to:school,email:sender,from:c.email||'',
      subject:'【DM】'+c.name+' 様（'+esc(c.child||'')+'）よりメッセージが届いています',
      body:c.name+' 様よりメッセージが届いています。\n\n----------\n'+tx+'\n----------\n\n下記より内容の確認・ご返信をお願いいたします。\n'+location.href.split('?')[0].replace(/[^\/]*$/,'')+'index.html?dm='+c.id});
    stSet('history',hist);
    document.getElementById('pdmText').value='';
    render();
    var m=document.getElementById('pdmMsg');if(m)m.innerHTML='<span style="color:#0F6E56;font-weight:600;">送信しました。園に通知が届きます。</span>';
  };
}

/* ---- NEWS (all posts) ---- */
function newsHTML(c){
  var posts=allPosts();var seen=seenPosts();
  setTimeout(function(){markSeen(posts.map(function(p){return p.id;}));},1200);
  return promoHTML()+'<div class="card"><h2 class="sec sec-p">📢 園からのおたより・お知らせ</h2>'
    +(posts.length?posts.map(function(p){return postRow(p,seen.indexOf(p.id)<0);}).join(''):bloomEmpty('まだおたよりはありません'))+'</div>'
    + snsHTML();
}

/* wire sec-more / tab2 buttons (delegated after render) */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab2]');if(t){tab=t.getAttribute('data-tab2');render();}
});

/* ---- boot ---- */
seedAll();
render();
</script>
