<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>未来WA ｜ 保育をもっと自由に</title>
<style>
  :root{
    /* 未来WA：5枚の花びらの色。teal系の変数名は残しつつ中身をポップに差し替え */
    --teal:#EB4E9B;--teal-d:#C43478;--teal-l:#F27BB4;--accent:#F59A2E;
    --o:#F59A2E;--p:#EB4E9B;--b:#2D9CDB;--g:#6FBE44;--c:#3FC1E0;
    --bg:#FFF7EF;--card:#ffffff;--line:#F2E7DA;--line2:#FBF3EA;
    --tx:#23262E;--tx2:#6E6A72;--tx3:#A9A3AB;
    --amber:#F59A2E;--pink:#EB4E9B;--blue:#2D9CDB;
    --radius:20px;--shadow:0 3px 16px rgba(120,80,40,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.06);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--tx);}
  input:focus,select,textarea:focus{outline:none;border-color:var(--teal-l);}
  textarea{resize:vertical;line-height:1.6;}
  label{font-size:12.5px;color:var(--tx2);font-weight:600;display:block;margin-bottom:5px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(96deg,var(--o),var(--p));color:#fff;border:none;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:600;width:100%;transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.sec{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
  .btn.ghost{background:transparent;color:var(--tx2);border:none;font-weight:500;width:auto;padding:8px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .muted{color:var(--tx2);font-size:12.5px;}
  .demo-ribbon{background:#2c2c2c;color:#fff;font-size:11px;text-align:center;padding:4px;letter-spacing:.04em;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--line2);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:500;}

  /* ===== Login ===== */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 22px 40px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .brand .logo{width:auto;height:auto;background:none;box-shadow:none;display:block;}
  .brand .logo img{width:210px;max-width:70vw;height:auto;display:block;}
  .brand h1{font-size:19px;margin:2px 0 0;font-weight:700;}
  .brand .sub{font-size:12.5px;color:var(--tx2);}
  .field{margin-bottom:13px;}
  .link{color:var(--teal);font-weight:600;font-size:13.5px;background:none;border:none;text-decoration:underline;}
  .divider{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:12px;margin:20px 0 14px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .sample-fam{display:flex;flex-direction:column;gap:8px;}
  .fam-btn{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;text-align:left;width:100%;}
  .fam-btn .av{width:38px;height:38px;border-radius:50%;background:var(--teal-l);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:15px;}
  .fam-btn .nm{font-weight:600;font-size:14.5px;}
  .fam-btn .em{font-size:11.5px;color:var(--tx2);}
  .err{background:#FCEBEB;color:#A32D2D;border-radius:11px;padding:10px 13px;font-size:13px;margin-bottom:12px;display:none;}

  /* ===== Portal ===== */
  /* ===== 花びらのデザインシステム =====
     ロゴは「中心に子どもがいて、5つの支えが囲んでいる」という形。
     それを飾りではなくナビゲーションの構造として使う。
     タブ＝花びら。いまどの花びらにいるかが、ヘッダーの花で分かる。 */
  .topbar{position:sticky;top:0;z-index:20;background:var(--card);color:var(--tx);
    padding:11px 16px 12px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);}
  .topbar .walogo{height:28px;width:auto;flex-shrink:0;}
  .topbar .who .p{color:var(--tx2);}
  .topbar .who .n{color:var(--tx);}
  .topbar .out{background:var(--line2);border:1px solid var(--line);color:var(--tx2);}

  /* 現在地を示す花。押すとホームへ戻る */
  .bloom{width:52px;height:52px;flex-shrink:0;background:none;border:none;padding:0;display:block;}
  .bloom svg{width:100%;height:100%;display:block;}
  .bloom .pt{transform-origin:0 0;transition:opacity .32s ease,transform .32s cubic-bezier(.34,1.4,.5,1);opacity:.36;}
  .bloom .pt.on{opacity:1;transform:scale(1.16);}
  .bloom .core{transition:r .3s ease;}

  /* 花びら型のカード：3つの角は丸く、1つだけ絞る。ただの角丸との差はここ */
  .card{border-radius:22px 22px 22px 7px;}
  .card.petal-o{border-left:3px solid var(--o);}
  .card.petal-p{border-left:3px solid var(--p);}
  .card.petal-b{border-left:3px solid var(--b);}
  .card.petal-g{border-left:3px solid var(--g);}
  .card.petal-c{border-left:3px solid var(--c);}

  /* 見出しに、その画面の花びら色の小さな花びらを添える */
  h2.sec::before{content:"";width:12px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:var(--secc,var(--p));flex-shrink:0;transform:rotate(-12deg);}
  .sec-o{--secc:var(--o);} .sec-p{--secc:var(--p);} .sec-b{--secc:var(--b);}
  .sec-g{--secc:var(--g);} .sec-c{--secc:var(--c);}

  /* 空の状態にも花を出す（無機質な「データがありません」を避ける） */
  .bloom-empty{display:flex;flex-direction:column;align-items:center;gap:11px;padding:26px 10px;color:var(--tx3);font-size:13px;text-align:center;}
  .bloom-empty svg{width:56px;height:56px;opacity:.34;}
  .topbar .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .topbar .who{flex:1;min-width:0;}
  .topbar .who .p{font-size:11px;opacity:.85;line-height:1.2;}
  .topbar .who .n{font-size:15.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ヘッダーは白背景なので、白文字だとボタンが見えなくなる。読める配色にする */
  .scroll{flex:1;overflow-y:auto;padding:16px 15px 90px;}
  h2.sec{font-size:15px;font-weight:700;margin:4px 2px 11px;display:flex;align-items:center;gap:8px;}
  .sec-more{margin-left:auto;font-size:12px;color:var(--teal);font-weight:600;background:none;border:none;}

  /* Campaign banner */
  .promo{border-radius:18px;padding:20px 18px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 22px rgba(0,0,0,.14);}
  .promo .tag{display:inline-block;background:rgba(255,255,255,.25);border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700;margin-bottom:9px;letter-spacing:.03em;}
  .promo h3{margin:0 0 5px;font-size:21px;font-weight:800;line-height:1.25;}
  .promo p{margin:0 0 13px;font-size:13px;opacity:.95;}
  .promo .cta{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#222;border:none;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;}
  .promo .emoji{position:absolute;right:-6px;bottom:-14px;font-size:96px;opacity:.22;transform:rotate(-12deg);pointer-events:none;}

  /* posts */
  .post{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2);}
  .post:first-child{border-top:none;}
  .post .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .post .bd{flex:1;min-width:0;}
  .post .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;}
  .post .d{font-size:11.5px;color:var(--tx3);margin-top:1px;}
  .post .x{font-size:13px;color:var(--tx2);margin-top:4px;white-space:pre-wrap;}
  .new{background:var(--pink);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;padding:1px 7px;letter-spacing:.03em;}

  /* SNS */
  .sns-row{display:flex;gap:10px;}
  .sns-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 6px;color:var(--tx);text-decoration:none;position:relative;}
  .sns-btn .e{font-size:24px;}
  .sns-btn .l{font-size:11.5px;font-weight:600;}
  .sns-btn .dot{position:absolute;top:8px;right:12px;width:9px;height:9px;background:var(--pink);border-radius:50%;border:2px solid #fff;}

  /* attendance */
  .seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
  .seg button{flex:1;min-width:66px;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--tx2);}
  .seg button.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .att-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2);}
  .att-item .dt{font-weight:700;font-size:13px;min-width:64px;}
  .badge-k{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;}

  /* growth */
  .g-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .g-table th,.g-table td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line2);}
  .g-table th{font-size:11.5px;color:var(--tx2);font-weight:600;}
  .g-table td.mo{text-align:left;font-weight:600;}
  .spark{display:flex;align-items:flex-end;gap:7px;height:82px;padding:8px 2px 0;}
  .spark .b{flex:1;background:linear-gradient(180deg,var(--teal-l),var(--teal));border-radius:6px 6px 0 0;position:relative;min-height:5px;}
  .spark .b span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx2);font-weight:600;}
  .spark .b em{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx3);font-style:normal;}

  /* bottom nav */
  .tabbar{position:sticky;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--tx3);font-size:10.5px;font-weight:600;position:relative;min-height:46px;
    transition:color .2s;}
  .tabbar button .e{font-size:19px;line-height:1;transition:transform .26s cubic-bezier(.34,1.4,.5,1);}
  /* 選ばれているタブの下に、その花びらの色の小さな花びらが咲く */
  .tabbar button::after{content:"";position:absolute;bottom:1px;width:16px;height:5px;border-radius:99px;
    background:currentColor;opacity:0;transform:scaleX(.4);transition:opacity .24s,transform .24s;}
  .tabbar button.on::after{opacity:1;transform:scaleX(1);}
  .tabbar button.on .e{transform:translateY(-2px) scale(1.14);}
  .tabbar button.on{color:var(--tabc,var(--p));}
  .tabbar button.t-home.on{color:var(--p);} .tabbar button.t-att.on{color:var(--o);}
  .tabbar button.t-growth.on{color:var(--g);} .tabbar button.t-bill.on{color:var(--b);}
  .tabbar button.t-connect.on{color:var(--c);} .tabbar button.t-store.on{color:var(--p);}
  .whobtn{background:none;border:none;text-align:left;padding:0;cursor:pointer;flex:1;min-width:0;}
  .whoarrow{color:var(--tx3);font-weight:400;}
  .tbadge{display:inline-block;min-width:15px;padding:0 4px;margin-left:3px;border-radius:99px;
    background:var(--p);color:#fff;font-size:9px;font-weight:800;line-height:15px;vertical-align:top;}
  .sidenav .sn.t-connect.on{background:var(--c);}
  @media (prefers-reduced-motion:reduce){.bloom .pt,.tabbar button .e,.tabbar button::after{transition:none;}}
  .bloom .pt.dormant{opacity:.5;}
  /* あそぶ／まなぶ のしぼりこみ */
  .fsearch{position:relative;margin-top:12px;}
  .fsearch input{padding-right:38px;}
  .fclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
    border:none;background:var(--line);color:var(--tx2);font-size:15px;line-height:1;}
  .flabel{font-size:11.5px;font-weight:700;color:var(--tx2);margin:13px 0 7px;}
  .fchips{display:flex;gap:7px;flex-wrap:wrap;}
  .fchips .chip{padding:7px 13px;font-size:12.5px;min-height:34px;}
  .fchips .chip.on{background:var(--secc,var(--p));border-color:transparent;color:#fff;font-weight:700;}
  .petal-o+.fcount,.card.petal-o .fchips .chip.on{--secc:var(--o);}
  .fcount{font-size:12px;color:var(--tx3);margin:2px 2px 10px;font-weight:600;}
  .ftags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
  .ftag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--line2);color:var(--tx2);}
  .ftag.age{background:transparent;border:1px solid var(--line);color:var(--tx3);}
  .evmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--tx2);}
  .sirow{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px;}
  .sirow .k{color:var(--tx2);width:74px;flex-shrink:0;font-weight:600;font-size:12.5px;}
  .silinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
  .silinks .chip{text-decoration:none;color:var(--tx);}
  /* 最近見たもの（横スクロール） */
  .recent{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;}
  .rcard{flex:0 0 118px;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 6px;
    padding:11px 10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;cursor:pointer;min-height:44px;}
  .rcard .rem{font-size:21px;line-height:1;}
  .rcard .rnm{font-size:11.5px;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .rcard .rpr{font-size:11px;color:var(--tx2);font-weight:700;}
  .prodcard:active{transform:scale(.995);}
  .pthumb{width:56px;height:56px;border-radius:15px;background:var(--line2);display:flex;align-items:center;
    justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .pgo{color:var(--tx3);font-size:20px;flex-shrink:0;margin-left:2px;}
  /* 出品者アカウント */
  .savatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
    flex-shrink:0;overflow:hidden;font-weight:800;line-height:1;}
  .savatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .sellerchip{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;
    border-top:1px solid var(--line);margin-top:10px;padding:9px 0 1px;cursor:pointer;text-align:left;font:inherit;color:inherit;}
  .sellerchip .snm{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sellerchip .skind{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);
    border-radius:999px;padding:1px 7px;flex-shrink:0;}
  .sellerchip .pgo{margin-left:auto;font-size:17px;}
  .sellerchip:hover .snm{text-decoration:underline;}
  /* NEW と、記事のお気に入り・保存 */
  .newbadge{display:inline-block;background:var(--o);color:#fff;font-size:9.5px;font-weight:800;
    letter-spacing:.06em;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:2px;}
  .postacts{display:flex;gap:8px;margin-top:11px;}
  .pact{flex:1;font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--tx2);cursor:pointer;}
  .pact:hover{background:var(--line2);}
  .pact.on{border-color:var(--o);color:var(--o);background:#FFF6EE;}
  /* スクールガイド */
  .guide-row{display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
  .guide-row:hover{border-color:var(--b);}
  .guide-row .pgo{align-self:center;}
  .gicon{width:42px;height:42px;border-radius:13px;background:var(--line2);display:flex;
    align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .gicon.f{background:#FDF1E3;}
  .gpoints{margin:13px 0 0;padding-left:19px;font-size:13.5px;line-height:1.9;}
  .gpoints li{margin-bottom:5px;}
  /* スマホのブラウザは画面の中にPDFを出せないので、そこでは埋め込みを隠す */
  @media(max-width:767px){.pdfembed{display:none;}}
  /* 園からのメッセージの 既読／返信する */
  .dmacts{display:flex;gap:7px;margin-top:6px;}
  .dmbtn{font:inherit;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--tx2);cursor:pointer;}
  .dmbtn.re{border-color:var(--c);color:var(--c);}
  .dmbtn:hover{background:var(--line2);}
  .dmread{font-size:11px;color:var(--tx3);padding:4px 2px;}
  .dmreply{margin-top:8px;}
  .dmreply textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;
    padding:10px;font-size:13.5px;font-family:inherit;}
  .shero{display:flex;gap:13px;align-items:center;}
  .sstat{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .sstat b{display:block;font-size:16px;font-weight:800;}
  .sstat span{font-size:11px;color:var(--tx3);}
  .hide{display:none !important;}
  .sns-btn .e{display:flex;align-items:center;justify-content:center;line-height:0;}
  .sns-btn .e svg{display:block;}
  .sns-btn.ig:hover{border-color:#B900B4;}
  .sns-btn.ln:hover{border-color:#06C755;}
  .sns-btn.yt:hover{border-color:#FF0000;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .sent-ok{background:var(--g-s,#EAF6E2);color:#2C5A12;border-radius:13px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.6;}
  .hist-in{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .hist-t{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .msgacts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .msgbtn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;
    padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .msgbtn.on{background:var(--g);border-color:var(--g);color:#fff;}
  .msgbtn.rep{background:var(--c);border-color:var(--c);color:#fff;}
  .pback{background:none;border:none;color:var(--p);font-weight:700;font-size:13.5px;padding:6px 2px 10px;cursor:pointer;min-height:44px;}
  .phero{height:210px;border-radius:20px;background:linear-gradient(150deg,var(--o-s,#FDF0E4),var(--p-s,#FCE5F0));
    display:flex;align-items:center;justify-content:center;font-size:74px;overflow:hidden;}
  .phero img{width:100%;height:100%;object-fit:cover;display:block;}
  @media(min-width:860px){.phero{height:280px;}}
  /* 商品のくわしい内容 */
  .sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.34);z-index:60;display:flex;align-items:flex-end;justify-content:center;}

<script>
/* ============================================================================
   画面へ文字を差し込む「出口」を、一か所にまとめて安全にする仕組み

   これまでの作りでは、園児名・保護者名・自由記入などを画面に出すときに
   esc() を書き忘れた場所が、そのまま穴になっていました。
   出口は 130 か所以上あり、一つずつ直すやり方では必ず取りこぼします。

   そこで「差し込む場所を直す」のではなく、
   「差し込む瞬間を、必ずここに通す」形に変えます。
   いったん画面の外（表示にも通信にも使われない別の文書）で組み立て、
   動きを持つ部分（on◯◯ の指定、script など）を取り除いてから画面へ移します。
   組み立て中は画像も読み込まれないため、img の onerror のような仕掛けは
   動き出す前に取り除かれます。

     ・見た目、レイアウト、style、data-◯◯ の指定はそのまま残します
     ・相対パスのリンク（例 parent.html、./img/a.png、#top）は弾きません
     ・日本語のキーや記号もそのまま残します
     ・このシステムは on◯◯ を文字列で書いていない（すべて el.onclick = ... の

  var DROPRE=/<\s*\/?\s*(script|iframe|object|embed|base|link|meta|form|noscript|frame|frameset|applet|template|style)[\s\/>]/i;

    }
    var all=root.querySelectorAll('*');
    for(i=0;i<all.length;i++){
      el=all[i];at=el.attributes;if(!at)continue;
      for(k=at.length-1;k>=0;k--){

        if(ln==='srcdoc'||ln==='formaction'||ln==='ping'||ln==='is'){el.removeAttribute(nm);continue;}
        base=ln.indexOf(':')>-1?ln.slice(ln.lastIndexOf(':')+1):ln;

  function build(tagName,html,foreign){
    var host,sv;
    if(foreign){
      host=LAB.createElement('div');
      rawSet.call(host,'<svg>'+html+'</svg>');
      scrub(host,html);
      sv=host.firstChild;
      return (sv&&sv.nodeType===1)?sv:host;
    }
    try{host=LAB.createElement(tagName||'div');}catch(e){host=LAB.createElement('div');}
    rawSet.call(host,html);

     もとの指定（selected）から選び直して、これまでとまったく同じ状態に戻す。
     指定が無いときは先頭（使えない項目は飛ばす）＝ブラウザと同じ決まりにする。 */
  function fixOne(sel){
    var op=sel.options,last=-1,first=-1,j,pg;
    if(!op)return;
    for(j=0;j<op.length;j++){
      if(op[j].hasAttribute('selected'))last=j;
      if(first<0){
        pg=op[j].parentNode;
        if(!op[j].disabled&&!(pg&&pg.tagName==='OPTGROUP'&&pg.disabled))first=j;
      }
    }
    if(sel.multiple){for(j=0;j<op.length;j++)op[j].selected=op[j].hasAttribute('selected');}

     もとから画面にあった選択肢には絶対に触らない
     （例：画面の一部を追記しただけなのに、別の選択欄が先頭に戻ってしまう事故を防ぐ）。 */
  function fixAdded(added,host){
    var i,j,q;
    if(host&&host.tagName==='SELECT')fixOne(host);
    for(i=0;i<added.length;i++){
      if(added[i].nodeType!==1)continue;
      if(added[i].tagName==='SELECT')fixOne(added[i]);

  var od=null;
  try{od=Object.getOwnPropertyDescriptor(Element.prototype,'outerHTML');}catch(e){od=null;}
  if(od&&od.set&&od.get){

  W.__xssAudit=function(root){

      for(k=0;k<at.length;k++){
        ln=at[k].name.toLowerCase();
        if(ln.indexOf('on')===0){out.handlers++;if(out.samples.length<10)out.samples.push(el.tagName+'['+ln+']');continue;}

/* ---- shared storage helpers (index.html と同じ prefix 'cocoas_') ---- */
function stGet(k,d){try{var v=JSON.parse(localStorage.getItem('cocoas_'+k));return v==null?d:v;}catch(e){return d;}}
function stSet(k,v){localStorage.setItem('cocoas_'+k,JSON.stringify(v));}
/* ========== パスワードの保管（平文をやめる） ==========
   ブラウザに標準で入っている暗号の機能（Web Crypto）を使い、パスワードを
   PBKDF2（15万回・SHA-256）のハッシュに変えてから保存します。
   端末に残るのは「ハッシュ」と「ソルト」だけで、パスワードそのものは残りません。
   照合には少し時間がかかるため、結果はコールバックでお返しします。
   ※ 古い環境などで暗号の機能が使えないときは、これまでどおりの動きに戻します
     （安全性は下がりますが、ログインできなくなるより良いと判断しました）。 */
var CRED={
  IT:150000,
  can:function(){try{return !!(window.crypto&&window.crypto.subtle&&window.crypto.subtle.importKey&&window.TextEncoder&&window.btoa&&window.atob);}catch(e){return false;}},
  _b64:function(buf){var b=new Uint8Array(buf),s='',i;for(i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);},
  _bin:function(s){var r=atob(String(s)),a=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;},
  _salt:function(){var a=new Uint8Array(16),i;try{window.crypto.getRandomValues(a);}catch(e){for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);}return a;},
  _bits:function(pw,salt,it){
    var raw=new TextEncoder().encode(String(pw));
    return window.crypto.subtle.importKey('raw',raw,{name:'PBKDF2'},false,['deriveBits'])
      .then(function(k){return window.crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},k,256);});
  },
  /* パスワードからハッシュを作ります。使えない環境では null をお返しします。 */
  hash:function(pw,done){
    done=done||function(){};
    if(!CRED.can()||!pw){done(null);return;}
    var salt=CRED._salt();
    try{
      CRED._bits(pw,salt,CRED.IT).then(function(bits){
        done({v:1,alg:'PBKDF2-SHA256',it:CRED.IT,salt:CRED._b64(salt),h:CRED._b64(bits)});
      },function(){done(null);});
    }catch(e){done(null);}
  },
  /* 入力されたパスワードが、保存されているハッシュと合っているかを調べます。 */
  verify:function(pw,rec,done){
    done=done||function(){};
    if(!rec||!rec.h||!rec.salt||!CRED.can()||!pw){done(false);return;}
    try{
      CRED._bits(pw,CRED._bin(rec.salt),rec.it||CRED.IT).then(function(bits){
        done(CRED._same(CRED._b64(bits),rec.h));
      },function(){done(false);});
    }catch(e){done(false);}
  },
  /* どこで違っていても同じ時間で答えるように、最後まで比べます。 */
  _same:function(a,b){
    if(typeof a!=='string'||typeof b!=='string'||a.length!==b.length)return false;
    var d=0,i;for(i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);
    return d===0;
  }
};

function pad(n){return String(n).padStart(2,'0');}

/* 保育の「○歳児」は、その年度の4月1日時点の年齢で決まる */
function ageClass(dob){
  if(!dob)return '';
  var d=new Date(dob);if(isNaN(d))return '';
  var now=new Date(),fy=now.getFullYear()-(now.getMonth()<3?1:0);
  var apr=new Date(fy,3,1),a=apr.getFullYear()-d.getFullYear();
  if(apr.getMonth()<d.getMonth()||(apr.getMonth()===d.getMonth()&&apr.getDate()<d.getDate()))a--;
  return (a>=0&&a<=6)?a+'歳児':'';
}

/* ========== 自動ロック（保護者アプリ） ==========
   しばらく操作がないと、画面をおおって鍵をかけます。
   おおうだけなので、入力の途中の内容は消えません。 */
var PLOCK={
  MS:30*60*1000, MAXMS:60*60*1000,
  last:Date.now(), locked:false, started:false, timer:null,
  bump:function(){PLOCK.last=Date.now();},
  start:function(){
    if(PLOCK.started)return;PLOCK.started=true;PLOCK.bump();
    var evs=['mousedown','keydown','touchstart','wheel','focusin'],i;
    for(i=0;i<evs.length;i++){try{document.addEventListener(evs[i],PLOCK.bump,true);}catch(e){}}
    PLOCK.timer=setInterval(PLOCK.tick,20000);
  },
  typing:function(){
    var a=document.activeElement;
    if(!a)return false;
    if(a.isContentEditable)return true;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||''))return String(a.value||'')!=='';
    return false;
  },
  tick:function(){
    if(PLOCK.locked)return;
    if(!sessionChild())return;
    var idle=Date.now()-PLOCK.last;
    if(idle<PLOCK.MS)return;
    if(idle<PLOCK.MAXMS&&PLOCK.typing())return;
    PLOCK.lock();
  },
  lock:function(){
    var c=sessionChild();
    if(PLOCK.locked||!c)return;
    PLOCK.locked=true;
    var ov=document.getElementById('plock');
    if(!ov){ov=document.createElement('div');ov.id='plock';document.body.appendChild(ov);}
    ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#0F6E56;display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML='<div style="background:#fff;border-radius:20px;max-width:360px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:inherit;">'
      +'<div style="font-size:18px;font-weight:700;margin-bottom:6px;">画面をロックしました</div>'
      +'<div style="font-size:12.5px;color:#666;line-height:1.75;margin-bottom:14px;">しばらく操作がなかったため、鍵をかけました。<br>入力の途中の内容は消えていません。パスワードを入れると、続きからお使いいただけます。</div>'
      +'<div id="plErr" style="color:#B00;font-size:12px;margin-bottom:8px;display:none;"></div>'
      +'<input id="plPw" type="password" placeholder="パスワード" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" style="width:100%;border:1px solid #ddd;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">'
      +'<button id="plGo" style="width:100%;background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">ロックを解除する</button>'
      +'<div style="text-align:center;margin-top:12px;"><button id="plOut" style="background:none;border:none;color:#666;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">ログアウトする</button></div>'
      +'</div>';
    var go=document.getElementById('plGo'),pw=document.getElementById('plPw'),er=document.getElementById('plErr');
    go.onclick=function(){
      var v=pw.value;
      if(!v){er.textContent='パスワードを入力してください';er.style.display='block';return;}
      er.style.display='none';go.disabled=true;go.textContent='確認中…';
      login(c.email,v,function(ok){
        go.disabled=false;go.textContent='ロックを解除する';
        if(ok){PLOCK.unlock();return;}
        er.textContent='パスワードが違います';er.style.display='block';
      });
    };
    pw.addEventListener('keydown',function(e){if(e.key==='Enter')go.click();});
    document.getElementById('plOut').onclick=function(){PLOCK.unlock();logout();};
    try{pw.focus();}catch(e){}
  },
  unlock:function(){
    var ov=document.getElementById('plock');
    if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
    PLOCK.locked=false;PLOCK.bump();
  }
};
/* 平文のまま残っているパスワードを、ハッシュへ置き換えます
   （置き換えたあとも、同じパスワードでログインできます）。 */
function parentCredSweep(){
  if(!CRED.can())return;
  var acc=stGet('parentAccounts',{}),list=[];
  Object.keys(acc).forEach(function(e){
    var a=acc[e];
    if(a&&a.pw!=null&&String(a.pw)!==''&&!a.pwh)list.push(e);
  });
  if(!list.length)return;
  var made={},n=0;
  list.forEach(function(e){
    CRED.hash(String(acc[e].pw),function(rec){
      if(rec)made[e]=rec;
      if(++n<list.length)return;
      var cur=stGet('parentAccounts',{}),ch=false;
      Object.keys(made).forEach(function(k){
        if(cur[k]&&!cur[k].pwh){cur[k].pwh=made[k];delete cur[k].pw;ch=true;}
      });
      if(ch)stSet('parentAccounts',cur);
    });
  });
}

  var acc=stGet('parentAccounts',{});

  var n='',i;
  for(i=0;i<6;i++)n+=String(Math.floor(Math.random()*10));
  return n;
}

/* ログインの確認。ハッシュの照合に少し時間がかかるため、結果はコールバックでお返しします。
   まだ平文のまま残っているものは、照合が通った瞬間にハッシュへ置き換えます。
   （置き換えによって、ログインできなくなることはありません） */
function login(email,pw,cb){
  cb=cb||function(){};
  email=(email||'').trim().toLowerCase();pw=(pw||'').trim();
  var acc=stGet('parentAccounts',{}),a=acc[email];
  /* パスワードが空のままログインできてしまわないようにします。 */
  if(!a||!pw){cb(false);return;}
  function grant(){sessionStorage.setItem('cocoas_psession',a.childId);cb(true);}
  if(a.pwh){CRED.verify(pw,a.pwh,function(ok){if(ok)grant();else cb(false);});return;}
  var old=(a.pw==null)?'':String(a.pw).trim();
  if(old&&pw===old){
    CRED.hash(pw,function(rec){
      if(rec){a.pwh=rec;delete a.pw;stSet('parentAccounts',acc);}
      grant();
    });
    return;
  }
  cb(false);
}
function loginByChild(id){sessionStorage.setItem('cocoas_psession',id);}
function logout(){
  sessionStorage.removeItem('cocoas_wa_guest');sessionStorage.removeItem('cocoas_psession');render();}
function resetDemo(){
  ['parentAccounts','absence_log'].forEach(function(k){localStorage.removeItem('cocoas_'+k);});
  Object.keys(localStorage).filter(function(k){return k.indexOf('cocoas_posts_seen_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  sessionStorage.removeItem('cocoas_psession');
  seedAll();
}

var tab='school', authView='login', resetEmail='';

/* 園とつながっていなくても使える。未来WAは一般の保護者向けにも開いている */
function isGuest(){return sessionStorage.getItem('cocoas_wa_guest')==='1';}
var lastTab=null;
function render(){
  var c=sessionChild();
  if(!c&&!isGuest()){document.getElementById('root').innerHTML=loginHTML();wireAuth();return;}
  /* つながっていないのにスクールを開こうとしたら、ストアへ寄せる（白紙を出さない） */
  if(!c&&tab==='school'&&typeof linkHTML!=='function')tab='store';
  document.getElementById('root').innerHTML=portalHTML(c);
  wirePortal(c);
  /* タブが変わったときだけ先頭へ戻す。同じタブ内の絞り込みでは位置を保つ */
  if(lastTab!==tab){lastTab=tab;try{window.scrollTo(0,0);}catch(e){}}
  try{if(sessionChild())PLOCK.start();}catch(e){}
}

function wireAuth(){
  var gb=document.getElementById('li_guest');
  if(gb)gb.onclick=waEnterGuest;
  var $=function(id){return document.getElementById(id);};
  if(authView==='login'){
    $('li_go').onclick=function(){
      var b=$('li_go'),e=$('loginErr');
      e.style.display='none';b.disabled=true;b.textContent='確認中…';
      login($('li_email').value.toLowerCase(),$('li_pw').value,function(ok){
        b.disabled=false;b.textContent='ログイン';
        if(ok){render();return;}
        e.textContent='メールアドレスまたはパスワードが違います。';e.style.display='block';
      });
    };
    $('li_pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('li_go').click();});
    $('li_forgot').onclick=function(){authView='reset';render();};
    /* タップだけではログインしません。メールアドレスを入れるところまでです。 */
    document.querySelectorAll('[data-fill]').forEach(function(b){b.onclick=function(){
      $('li_email').value=b.getAttribute('data-fill')||'';
      $('li_pw').value='';$('loginErr').style.display='none';
      try{$('li_pw').focus();}catch(e){}
      toast('メールアドレスを入れました。パスワードを入力してください');
    };});
    if($('li_reset'))$('li_reset').onclick=function(){resetDemo();render();toast('テスト用アカウントを作り直しました');};
  } else if(authView==='reset'){
    $('rs_go').onclick=function(){
      var em=($('rs_email').value||'').trim().toLowerCase();
      if(!em){toast('メールアドレスを入力してください');return;}
      /* どのメールアドレスにご登録があるかを、この画面から分からないようにしています
         （順番に試して、登録済みのアドレスを探されないようにするためです）。 */
      resetEmail=em;resetCode=makeResetCode(em);authView='newpw';render();
      toast('ご登録があれば、再設定のご案内をお送りします');
    };
    $('rs_back').onclick=function(){authView='login';render();};
  } else if(authView==='newpw'){
    $('np_go').onclick=function(){
      var code=($('np_code').value||'').trim(),p=$('np_pw').value,p2=$('np_pw2').value,e=$('npErr');
      /* 確認コードが合わないかぎり、先へ進めません
         （メールアドレスを入れただけで、他のご家庭のページに入れてしまわないようにするためです）。 */
      if(!resetCode||code!==resetCode){e.textContent='確認コードが違います。';e.style.display='block';return;}
      if(p.length<8){e.textContent='パスワードは8文字以上にしてください。';e.style.display='block';return;}
      if(p!==p2){e.textContent='パスワードが一致しません。';e.style.display='block';return;}
      var acc=stGet('parentAccounts',{});
      if(!acc[resetEmail]){resetCode='';authView='login';render();return;}
      CRED.hash(p,function(rec){
        if(rec){acc[resetEmail].pwh=rec;delete acc[resetEmail].pw;}
        else{acc[resetEmail].pw=p;delete acc[resetEmail].pwh;}
        delete acc[resetEmail].seed;
        stSet('parentAccounts',acc);
        /* ここではログインしません。新しいパスワードで、あらためてログインしていただきます。 */
        resetCode='';authView='login';render();
        toast('パスワードを変更しました。新しいパスワードでログインしてください');
      });
    };
    $('np_back').onclick=function(){authView='login';render();};
  }
}

/* ---------- 教材ストア（EC） ----------
   未来WAの収益の柱。園とつながっている家庭には「先生が選んだ」文脈がつき、
   購入の一部が園に還元される。つながっていない家庭でも買える（一般のECとして成立させる）。 */
function yen(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP');}
function nowStr(){var d=new Date(),z=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}

function escImgSrc(u){u=String(u||'').replace(/[\s\u0000-\u001f]/g,'');
  return /^data:image\//i.test(u)?u.replace(/&/g,'&amp;').replace(/"/g,'&quot;'):'';}

}

function waSellers(){
  var st=stGet('wa_sellers',null),base=WA_SELLERS.slice();
  base[0]=JSON.parse(JSON.stringify(base[0]));base[0].name=waSchoolName();
  if(!st||!st.length)return base;
  /* 端末に登録された写真・紹介文があれば上書きする */
  return base.map(function(s){
    var o=st.filter(function(x){return x.id===s.id;})[0];
    if(!o)return s;
    var m={};for(var k in s)m[k]=s[k];
    if(o.img)m.img=o.img; if(o.bio)m.bio=o.bio; if(o.name&&s.id!=='school')m.name=o.name;
    return m;
  });
}
function waSeller(id){
  var l=waSellers(),s=l.filter(function(x){return x.id===(id||'school');})[0];
  return s||l[0];
}
/* 名前から色を決めるので、写真がなくても出品者ごとに見た目が変わる */
function sellerHue(name){var h=0,s=String(name||'');
  for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}
function sellerAvatar(s,px){
  px=px||38;
  var im=escImgSrc(s.img);
  if(im)return '<span class="savatar" style="width:'+px+'px;height:'+px+'px;">'
    +'<img src="'+im+'" alt="'+esc(s.name)+'"></span>';
  var h=sellerHue(s.name),ini=String(s.name||'?').replace(/^[（(【]/,'').charAt(0);
  return '<span class="savatar" style="width:'+px+'px;height:'+px+'px;'
    +'background:hsl('+h+',62%,92%);color:hsl('+h+',58%,34%);font-size:'+Math.round(px*0.44)+'px;">'
    +esc(ini)+'</span>';
}
/* カードの下に出す「アカウント画像＋アカウント名」。押すと出品者ページへ。 */

function isSchoolProduct(x){return !x.by||x.by==='school';}
/* 1枚の商品カード。顔は絵文字ではなく出品者のアカウント画像を下に出す。 */
function prodCardHTML(x){
  var im=escImgSrc(x.img);
  return '<div class="card prodcard" style="padding-bottom:12px;">'
    +'<div data-open="'+esc(x.id)+'" style="display:flex;gap:12px;align-items:center;cursor:pointer;">'
      +'<div class="pthumb">'+(im?'<img src="'+im+'" alt="">':'<span>'+esc(x.emoji)+'</span>')+'</div>'
      +'<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:14px;">'+esc(x.name)
        +(x.rec?' <span class="chip" style="background:var(--g);color:#fff;border:none;padding:2px 8px;font-size:10.5px;">おすすめ</span>':'')
        +(x.rental?' <span class="chip" style="padding:2px 8px;font-size:10.5px;">レンタル</span>':'')+'</div>'
        +'<div class="muted">'+esc(x.desc)+(x.aim?' ・ '+esc(x.aim):'')+'</div></div>'
      +'<div style="text-align:right;flex-shrink:0;"><div style="font-weight:800;font-size:14px;">'+yen(x.price)+'</div>'
        +(x.sub?'<div class="muted" style="font-size:10.5px;">／月</div>':'')+'</div>'
      +'<span class="pgo">›</span></div>'
    +'<div style="display:flex;gap:8px;margin-top:11px;">'
      +'<button class="btn sec" data-open="'+esc(x.id)+'" style="flex:1;">教材の詳細を見る</button>'
      +'<button class="btn" data-buy="'+esc(x.id)+'" style="flex:1;">購入する</button></div>'
    +sellerChip(x.by)
    +'</div>';
}
function storeHTML(c){
  var ps=waProducts(),linked=!!c;
  if(!linked)ps=ps.filter(function(x){return !x.schoolOnly;});
  var all=ps.slice();
  if(waStoreKind==='school')ps=ps.filter(isSchoolProduct);
  if(waStoreKind==='general')ps=ps.filter(function(x){return !isSchoolProduct(x);});
  var inKind=ps.slice();
  if(waStoreCat)ps=ps.filter(function(x){return x.cat===waStoreCat;});
  if(waStoreQ){var q=waStoreQ.toLowerCase();
    ps=ps.filter(function(x){var s=waSeller(x.by);
      return ((x.name||'')+(x.desc||'')+(x.cat||'')+(x.aim||'')+(s.name||'')).toLowerCase().indexOf(q)>-1;});}
  ps=ps.slice().sort(function(a,b){
    if(waStoreSort==='low')return (a.price||0)-(b.price||0);
    if(waStoreSort==='high')return (b.price||0)-(a.price||0);
    if(waStoreSort==='name')return String(a.name||'').localeCompare(String(b.name||''),'ja');
    return (b.rec?1:0)-(a.rec?1:0);
  });
  var kindRow='<div class="flabel">区分</div><div class="fchips">'
    +WA_STORE_KINDS.map(function(k){
      var n=k[0]===''?all.length:all.filter(function(x){
        return k[0]==='school'?isSchoolProduct(x):!isSchoolProduct(x);}).length;
      return '<button class="chip'+(waStoreKind===k[0]?' on':'')+'" data-sk="'+esc(k[0])+'">'+esc(k[1])+(n?' '+n:'')+'</button>';
    }).join('')+'</div>';
  var searchRow='<div class="fsearch"><input id="stq" value="'+esc(waStoreQ)+'" placeholder="商品や出品者をさがす（例：ワーク）">'
    +(waStoreQ?'<button class="fclear" id="stqx" aria-label="消す">×</button>':'')+'</div>'
    +kindRow
    +'<div class="flabel">並べかえ</div><div class="fchips">'
    +WA_SORTS.map(function(s){return '<button class="chip'+(waStoreSort===s[0]?' on':'')+'" data-ss="'+esc(s[0])+'">'+esc(s[1])+'</button>';}).join('')
    +'</div>';
  var catRow=searchRow+'<div class="flabel">カテゴリ</div><div class="fchips">'
    +'<button class="chip'+(waStoreCat===''?' on':'')+'" data-sc="">すべて</button>'
    +WA_STORE_CATS.map(function(k){
      var n=inKind.filter(function(x){return x.cat===k;}).length;
      if(!n&&waStoreCat!==k)return '';
      return '<button class="chip'+(waStoreCat===k?' on':'')+'" data-sc="'+esc(k)+'">'+esc(k)+(n?' '+n:'')+'</button>';}).join('')
    +'</div>';
  /* 区分をしぼっていないときは、園のものと一般のものを見出しで分けて並べる */
  var body;
  if(!ps.length)body=bloomEmpty('この条件の商品はまだありません');
  else if(waStoreKind)body=ps.map(prodCardHTML).join('');
  else{
    var sc=ps.filter(isSchoolProduct),gn=ps.filter(function(x){return !isSchoolProduct(x);});
    body=(sc.length?'<div class="flabel" style="margin:14px 2px 8px;">園からのおすすめ教材</div>'+sc.map(prodCardHTML).join(''):'')
        +(gn.length?'<div class="flabel" style="margin:14px 2px 8px;">一般サービス</div>'+gn.map(prodCardHTML).join(''):'');
  }
  return '<h2 class="sec sec-g">🛍️ ストア</h2>'
    +(linked
      ? '<div class="muted" style="margin:-4px 2px 14px;line-height:1.75;">'
        +esc(waSchoolName())+'が、実際に導入・おすすめしている教材リストです。'
        +'教材購入時はこちらからお買い求めください。</div>'
      : '<div class="card petal-c"><div style="font-weight:700;font-size:14px;">おうちで使える教材</div>'
        +'<div class="muted" style="margin-top:5px;">園とつながると、先生が選んだ教材や園指定の用品も表示されます。</div>'
        +'<button class="btn sec" id="wantLink" style="margin-top:11px;">園とつながる</button></div>')
    +recentHTML(all)
    +'<div class="card petal-p">'+catRow+'</div>'
    +'<div class="fcount">'+ps.length+'件</div>'
    +body
    +'<div id="waKick" style="display:none;" class="card petal-g"></div>';
}
function recentHTML(all){
  var ids=waViewed(),items=[];
  ids.forEach(function(id){
    var p=all.filter(function(x){return String(x.id)===String(id);})[0];
    if(p)items.push(p);});
  if(!items.length)return '';
  return '<div class="flabel" style="margin:2px 2px 8px;">最近見たもの</div>'
    +'<div class="recent">'+items.map(function(x){
      return '<button class="rcard" data-open="'+esc(x.id)+'">'
        +'<span class="rem">'+esc(x.emoji)+'</span>'
        +'<span class="rnm">'+esc(x.name)+'</span>'
        +'<span class="rpr">'+yen(x.price)+(x.sub?'／月':'')+'</span></button>';}).join('')
    +'</div>';
}
function wireStore(c){
  /* 商品を見たら履歴に残し、その場でくわしい内容を開く */
  document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(e){
    if(e.target.closest('[data-buy]'))return;
    var id=b.getAttribute('data-open');
    waSeeProduct(id); waProdOpen=id; render();
  };});
  var bk=document.getElementById('pBack');
  if(bk)bk.onclick=function(){waProdOpen=null;render();};
  /* 検索と並べかえ */
  var q=document.getElementById('stq');
  if(q)q.oninput=function(){
    waStoreQ=q.value;var pos=q.selectionStart;
    var sc2=document.getElementById('scroll');
    sc2.innerHTML=storeHTML(c);wireStore(c);
    var n2=document.getElementById('stq');
    if(n2){n2.focus();try{n2.setSelectionRange(pos,pos);}catch(e){}}
  };
  var qx=document.getElementById('stqx');
  if(qx)qx.onclick=function(){waStoreQ='';var sc2=document.getElementById('scroll');sc2.innerHTML=storeHTML(c);wireStore(c);};
  document.querySelectorAll('[data-ss]').forEach(function(b){b.onclick=function(){
    waStoreSort=b.getAttribute('data-ss');
    var sc2=document.getElementById('scroll');sc2.innerHTML=storeHTML(c);wireStore(c);};});
  var wl=document.getElementById('wantLink');
  if(wl)wl.onclick=function(){tab='me';render();};
  document.querySelectorAll('[data-sk]').forEach(function(b){b.onclick=function(){
    waStoreKind=b.getAttribute('data-sk');waStoreCat='';
    var sc=document.getElementById('scroll');sc.innerHTML=storeHTML(c);wireStore(c);};});
  document.querySelectorAll('[data-sc]').forEach(function(b){b.onclick=function(){
    waStoreCat=b.getAttribute('data-sc');
    var sc=document.getElementById('scroll');
    sc.innerHTML=storeHTML(c);wireStore(c);};});
  wireSeller();
  document.querySelectorAll('[data-buy]').forEach(function(b){b.onclick=function(){
    if(b.disabled)return;                     /* 二重に注文が入らないようにする */
    var id=+b.getAttribute('data-buy'),p=waProducts().filter(function(x){return x.id===id;})[0];
    if(p){b.disabled=true;b.textContent='お手続き中…';}
    if(!p)return;
    var rate=waKickRate(),kb=c?Math.round(p.price*rate):0;
    var a=waOrders();
    /* 買ったあとの様子はマイページの「購入履歴・配送状況」で見てもらう */
    a.push({id:Date.now(),at:nowStr(),childId:c?c.id:null,pid:p.id,name:p.name,
      amount:p.price,kickback:kb,by:p.by||'school',status:'paid',eta:addDaysISO(todayISO(),4)});
    stSet('wa_orders',a);
    toast('ご購入ありがとうございます。配送状況はマイページで見られます。');
    setTimeout(function(){b.disabled=false;b.textContent='購入する';},1500);
  };});
}
/* 出品者のアカウント名を押したら、その出品者のページへ */
function wireSeller(){
  document.querySelectorAll('[data-seller]').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    waSellerOpen=b.getAttribute('data-seller');render();};});
}

var waFeed={play:{cat:'',age:'',q:'',view:'all'},learn:{cat:'',age:'',q:'',view:'all'}};
/* 記事の投稿日。ago は「何日前の投稿か」。1週間以内のものを NEW として上に出す。 */
function feedAt(x){return addDaysISO(-(x.ago||0));}
function isNewPost(x){return (x.ago||99)<=7;}
function feedItems(kind){return kind==='play'?WA_PLAY_ITEMS:WA_LEARN_ITEMS;}
function feedFind(id){
  return WA_PLAY_ITEMS.concat(WA_LEARN_ITEMS).filter(function(x){return x.id===id;})[0];
}
/* 閲覧履歴・お気に入り・保存済み。この端末におぼえておく。 */
function feedSeenList(){return stGet('wa_feed_seen',[])||[];}
function feedSee(id){
  var a=feedSeenList().filter(function(x){return x!==id;});
  a.unshift(id);stSet('wa_feed_seen',a.slice(0,60));
}
function feedFavs(){return stGet('wa_feed_fav',[])||[];}
function feedSaves(){return stGet('wa_feed_save',[])||[];}
function feedToggle(key,id){
  var k=key==='fav'?'wa_feed_fav':'wa_feed_save';
  var a=stGet(k,[])||[],i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.unshift(id);
  stSet(k,a);return i<0;
}
var WA_FEED_VIEWS=[['all','すべて'],['seen','閲覧履歴'],['fav','お気に入り'],['save','保存済み']];
/* 記事1件のカード */
function feedCard(x,col,isPlay){
  var fav=feedFavs().indexOf(x.id)>-1,sav=feedSaves().indexOf(x.id)>-1;
  return '<div class="card petal-'+col+'">'
    +'<div data-post="'+esc(x.id)+'" style="display:flex;gap:13px;align-items:flex-start;cursor:pointer;">'
      +'<div style="font-size:27px;flex-shrink:0;line-height:1.2;">'+esc((isPlay&&WA_PLAY_EMOJI[x.cat])||x.e)+'</div>'
      +'<div style="min-width:0;flex:1;"><div style="font-weight:700;font-size:14.5px;">'
        +(isNewPost(x)?'<span class="newbadge">NEW</span>':'')+esc(x.t)+'</div>'
      +'<div class="muted" style="margin-top:5px;">'+esc(x.d)+'</div>'
      +'<div class="ftags"><span class="ftag">'+esc(x.cat)+'</span>'
        +x.ages.slice(0,3).map(function(a){return '<span class="ftag age">'+esc(a)+'</span>';}).join('')
        +(x.ages.length>3?'<span class="ftag age">ほか</span>':'')
        +'<span class="ftag age">'+esc(fmtDate?fmtDate(feedAt(x)):feedAt(x))+'</span></div>'
      +'</div><span class="pgo">›</span></div>'
    +'<div class="postacts">'
      +'<button class="pact'+(fav?' on':'')+'" data-fav="'+esc(x.id)+'">'+(fav?'♥':'♡')+' お気に入り</button>'
      +'<button class="pact'+(sav?' on':'')+'" data-save="'+esc(x.id)+'">'+(sav?'★':'☆')+' 保存</button>'
    +'</div></div>';
}
function feedHTML(kind){
  var f=waFeed[kind],isPlay=(kind==='play');
  var cats=isPlay?WA_PLAY_CATS:WA_LEARN_CATS;
  var items=feedItems(kind);
  var col=isPlay?'o':'g', ttl=isPlay?'🎨 あそぶ':'🌱 まなぶ';
  var sub=isPlay?'おうちでできる遊びを、カテゴリと年齢から探す。':'子育てと保育の読みものを、テーマと年齢から探す。';
  var view=f.view||'all';
  var list=items.filter(function(x){
    if(f.cat&&x.cat!==f.cat)return false;
    if(f.age&&x.ages.indexOf(f.age)<0)return false;
    if(f.q){var q=f.q.toLowerCase();
      if((x.t+x.d+x.cat).toLowerCase().indexOf(q)<0)return false;}
    return true;
  });
  /* 閲覧履歴は見た順、お気に入り・保存は入れた順で並べる */
  if(view==='seen'){var sn=feedSeenList();
    list=sn.map(function(id){return list.filter(function(x){return x.id===id;})[0];}).filter(Boolean);}
  else if(view==='fav'){var fv=feedFavs();
    list=fv.map(function(id){return list.filter(function(x){return x.id===id;})[0];}).filter(Boolean);}
  else if(view==='save'){var sv=feedSaves();
    list=sv.map(function(id){return list.filter(function(x){return x.id===id;})[0];}).filter(Boolean);}
  else{
    /* 1週間以内の投稿を上に、そのあとは新しい順 */
    list=list.slice().sort(function(a,b){
      var an=isNewPost(a)?0:1,bn=isNewPost(b)?0:1;
      return an!==bn?an-bn:(a.ago||0)-(b.ago||0);});
  }
  function chips(name,vals,cur){
    return '<div class="fchips">'
      +'<button class="chip'+(cur===''?' on':'')+'" data-f="'+esc(name)+'" data-v="">すべて</button>'
      +vals.map(function(v){
        var em=(isPlay&&name==='cat'&&WA_PLAY_EMOJI[v])?WA_PLAY_EMOJI[v]+' ':'';
        return '<button class="chip'+(cur===v?' on':'')+'" data-f="'+esc(name)+'" data-v="'+esc(v)+'">'+em+esc(v)+'</button>';}).join('')
      +'</div>';
  }
  var nNew=items.filter(isNewPost).length;
  var counts={all:items.length,seen:feedSeenList().length,fav:feedFavs().length,save:feedSaves().length};
  var empty={seen:'まだ見た記事はありません',fav:'まだお気に入りはありません',save:'まだ保存したものはありません',
             all:'条件に合うものが見つかりませんでした'}[view];
  return '<h2 class="sec sec-'+col+'">'+ttl+'</h2>'
    +'<div class="fchips" style="margin:0 2px 12px;">'
      +WA_FEED_VIEWS.map(function(v){
        var n=counts[v[0]];
        return '<button class="chip'+(view===v[0]?' on':'')+'" data-fv="'+esc(v[0])+'">'+esc(v[1])+(n?' '+n:'')+'</button>';
      }).join('')+'</div>'
    +'<div class="card petal-'+col+'"><div class="muted">'+sub+'</div>'
      +'<div class="fsearch"><input id="fq" value="'+esc(f.q)+'" placeholder="さがす（例：'+(isPlay?'工作':'睡眠')+'）">'
        +(f.q?'<button class="fclear" id="fqx" aria-label="消す">×</button>':'')+'</div>'
      +'<div class="flabel">カテゴリ</div>'+chips('cat',cats,f.cat)
      +'<div class="flabel">年齢</div>'+chips('age',WA_AGES,f.age)
    +'</div>'
    +'<div class="fcount">'+list.length+'件'+(view==='all'&&nNew?'　うち この1週間の新着 '+nNew+'件':'')+'</div>'
    +(list.length?list.map(function(x){return feedCard(x,col,isPlay);}).join('')
      :bloomEmpty(empty));
}

      +'<div class="ftags">'+x.ages.map(function(a){return '<span class="ftag age">'+esc(a)+'</span>';}).join('')+'</div>'
      +'<div class="postacts" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;">'
        +'<button class="pact'+(fav?' on':'')+'" data-fav="'+esc(x.id)+'">'+(fav?'♥':'♡')+' お気に入り</button>'
        +'<button class="pact'+(sav?' on':'')+'" data-save="'+esc(x.id)+'">'+(sav?'★':'☆')+' 保存</button>'
      +'</div>'
    +'</div>'
    +(same.length?'<div class="flabel" style="margin:16px 2px 8px;">'+esc(x.cat)+'のほかの記事</div>'
      +same.map(function(y){return feedCard(y,col,isPlay);}).join(''):'');
}
function wireFeed(kind){
  /* 絞り込みで置き換えるのは feed の箱だけ */
  var sc=document.getElementById('feedZone')||document.getElementById('scroll');
  function redraw(){sc.innerHTML=feedHTML(kind);wireFeed(kind);}
  sc.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){
    waFeed[kind][b.getAttribute('data-f')]=b.getAttribute('data-v');redraw();};});
  sc.querySelectorAll('[data-fv]').forEach(function(b){b.onclick=function(){
    waFeed[kind].view=b.getAttribute('data-fv');redraw();};});
  var q=document.getElementById('fq');
  if(q){
    q.oninput=function(){
      waFeed[kind].q=q.value;
      var pos=q.selectionStart;
      redraw();
      var n=document.getElementById('fq');
      if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
    };
  }
  var x=document.getElementById('fqx');
  if(x)x.onclick=function(){waFeed[kind].q='';redraw();};
  wirePostActs(kind);
}
/* 記事を開く・お気に入り・保存。詳細ページからも使う。 */
function wirePostActs(kind){
  document.querySelectorAll('[data-post]').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-post');
    feedSee(id);waPostOpen=id;render();};});
  document.querySelectorAll('[data-fav]').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    var on=feedToggle('fav',b.getAttribute('data-fav'));
    toast(on?'お気に入りに入れました':'お気に入りから外しました');render();};});
  document.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    var on=feedToggle('save',b.getAttribute('data-save'));
    toast(on?'保存しました':'保存をやめました');render();};});
  var pb=document.getElementById('postBack');
  if(pb)pb.onclick=function(){waPostOpen=null;render();};
}

function wireGuide(c){

  var q=document.getElementById('gq');
  if(q)q.oninput=function(){
    waGuideQ=q.value;var pos=q.selectionStart;
    var sc=document.getElementById('scroll');sc.innerHTML=guideHTML(c);wireGuide(c);
    var n=document.getElementById('gq');
    if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}};
  var qx=document.getElementById('gqx');
  if(qx)qx.onclick=function(){waGuideQ='';var sc=document.getElementById('scroll');sc.innerHTML=guideHTML(c);wireGuide(c);};
  document.querySelectorAll('[data-gc]').forEach(function(b){b.onclick=function(){
    waGuideCat=b.getAttribute('data-gc');
    var sc=document.getElementById('scroll');sc.innerHTML=guideHTML(c);wireGuide(c);};});
  document.querySelectorAll('[data-doc]').forEach(function(b){b.onclick=function(){
    openDoc(b.getAttribute('data-doc'),c);};});
}

function wireMe(c){
  var g=document.getElementById('goLink');
  if(g)g.onclick=function(){tab='school';render();};
  document.querySelectorAll('[data-goto]').forEach(function(b){b.onclick=function(){
    tab=b.getAttribute('data-goto');render();};});
  document.querySelectorAll('[data-doc]').forEach(function(b){b.onclick=function(){
    openDoc(b.getAttribute('data-doc'),c);};});
  var gg=document.getElementById('goGuide');
  if(gg)gg.onclick=function(){waGuideView=true;render();};
}

/* ---------- PORTAL ----------
   ロゴの5枚の花びらを、そのまま画面の構造にしている。
   タブ＝花びら。中心（ホーム）に子どもがいて、5つの支えが囲む、という形をなぞる。 */
/* 5つのタブ＝ロゴの5枚の花びら。園とつながると「スクール」が咲く。
   つながっていない家庭でも、あそぶ・まなぶ・ストア・マイページは使える。 */
var PETALS=[
  {t:'school',c:'var(--b)', a:-90,  e:'🏫', l:'スクール'},
  {t:'play',  c:'var(--o)', a:-18,  e:'🎨', l:'あそぶ'},
  {t:'learn', c:'var(--g)', a:54,   e:'🌱', l:'まなぶ'},
  {t:'store', c:'var(--p)', a:126,  e:'🛍️', l:'ストア'},
  {t:'connect',c:'var(--c)',a:198,  e:'🤝', l:'つながる'}
];
/* 園とつながっているか。つながっていなければ「スクール」の花びらは休眠する */
function waLinked(){return !!sessionChild();}
function waEnterGuest(){sessionStorage.setItem('cocoas_wa_guest','1');tab='store';render();}
/* いまどの花びらにいるかを示す花。押すとホームへ戻る */
function bloomSVG(active,size){
  var s=size||52;
  var linked=waLinked();
  var petals=PETALS.map(function(p){
    /* 園とつながっていないと、スクールの花びらは咲かない（輪郭だけ残る） */
    if(p.t==='school'&&!linked){
      return '<ellipse class="pt dormant" cx="0" cy="-13" rx="7.6" ry="10.4" fill="none"'
        +' stroke="'+p.c+'" stroke-width="1.3" stroke-dasharray="3 2.4" transform="rotate('+p.a+')"/>';
    }
    var on=(p.t===active);
    return '<ellipse class="pt'+(on?' on':'')+'" cx="0" cy="-13" rx="7.6" ry="10.4" fill="'+p.c+'"'
      +' transform="rotate('+p.a+')"/>';
  }).join('');
  var core=linked?6.6:5.2;
  return '<svg viewBox="-24 -24 48 48" width="'+s+'" height="'+s+'" aria-hidden="true">'
    +'<g>'+petals+'</g>'
    +'<circle class="core" r="'+core+'" fill="#fff" stroke="var(--line)" stroke-width="1"/>'
    +'<circle cx="-1.9" cy="-1" r="1.05" fill="var(--tx)"/><circle cx="1.9" cy="-1" r="1.05" fill="var(--tx)"/>'
    +'<path d="M-1.9 1.7 q1.9 1.9 3.8 0" stroke="var(--tx)" stroke-width="1" fill="none" stroke-linecap="round"/>'
    +'</svg>';
}
function portalHTML(c){
  var linked=!!c;
  return '<div class="topbar">'
    +'<button class="bloom" id="bloomBtn" aria-label="'+(linked?'スクールへ':'マイページへ')+'">'+bloomSVG(tab)+'</button>'
    +'<button class="who whobtn" id="meBtn" aria-label="マイページをひらく">'
      +(linked?'<div class="p">'+esc(c.klass)+'クラス</div><div class="n">'+esc(c.child)+' <span class="whoarrow">›</span></div>'
              :'<div class="p">未来WA</div><div class="n">園とつながっていません <span class="whoarrow">›</span></div>')+'</button>'
    +'<img src="'+WA_LOGO+'" alt="未来WA" class="walogo">'
    +'<button class="out" id="logout">'+(linked?'ログアウト':'ログイン')+'</button>'
    +'</div>'
    /* PC では左に花びらのナビを出し、スマホでは下のタブバーになる */
    +'<div class="shell">'
      +'<nav class="sidenav">'+PETALS.map(function(p){
        var dis=(p.t==='school'&&!linked);
        return '<button data-tab="'+esc(p.t)+'" class="sn t-'+p.t+(tab===p.t?' on':'')+(dis?' dis':'')+'">'
          +'<span class="e">'+p.e+'</span><span class="l">'+esc(dis?'園とつながる':p.l)+'</span></button>';}).join('')
      +'</nav>'
      +'<div class="scroll" id="scroll"></div>'
    +'</div>'
    +'<div class="tabbar">'+PETALS.map(function(p){
      var dis=(p.t==='school'&&!linked);

      /* 先生からのメッセージが届いていることが、タブで分かるようにする */
      if(p.t==='school'&&linked){
        var u=0;try{u=dmUnreadParent(c.id)||0;}catch(e){}

      }
      return tabBtn(p.t,p.e,lb);}).join('')+'</div>';

function tabBtn(id,e,l){return '<button data-tab="'+esc(id)+'" class="t-'+id+(tab===id?' on':'')+'"><span class="e">'+e+'</span>'+l+'</button>';}
/* ラベルに入るバッジ。数字だけを入れるので esc は不要（呼び出し側で件数のみ） */
/* 中身が無いときも、無機質な文字だけにしない */
function bloomEmpty(msg){
  return '<div class="bloom-empty">'+bloomSVG('',56)+'<div>'+esc(msg)+'</div></div>';
}

function wirePortal(c){
  document.getElementById('logout').onclick=logout;
  var mb=document.getElementById('meBtn');
  if(mb)mb.onclick=function(){tab='me';render();};
  var bb=document.getElementById('bloomBtn');
  if(bb)bb.onclick=function(){tab=c?'school':'store';render();};
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){
    if(b.getAttribute('data-tab')!=='store')waProdOpen=null;
    if(b.getAttribute('data-tab')!=='connect'){waEventOpen=null;waPersonOpen=null;}
    waSellerOpen=null;waPostOpen=null;
    tab=b.getAttribute('data-tab');render();};});
  var sc=document.getElementById('scroll'),linked=!!c;
  /* 出品者ページ・投稿者ページは、どのタブからでも開けるので先に見る */
  if(waSellerOpen){
    sc.innerHTML=sellerPageHTML(waSellerOpen,c);
    wireCommon(c);wireStore(c);
    var sb=document.getElementById('sBack');
    if(sb)sb.onclick=function(){waSellerOpen=null;render();};
    wireEvJoin(c);
    return;
  }
  if(waPersonOpen){
    sc.innerHTML=personPageHTML(waPersonOpen);
    wireCommon(c);wireEvJoin(c);
    return;
  }
  /* スクールガイド（入園時の一式）。マイページから入る */
  if(waGuideView){
    sc.innerHTML=waGuideOpen?guidePageHTML(waGuideOpen,c):guideHTML(c);
    wireCommon(c);wireGuide(c);
    if(!waGuideOpen){
      var gx=document.createElement('button');
      gx.className='pback';gx.textContent='‹ マイページにもどる';
      gx.onclick=function(){waGuideView=false;render();};
      sc.insertBefore(gx,sc.firstChild);
    }
    return;
  }
  if(tab==='school'){
    if(!linked){sc.innerHTML=linkHTML();wireLink();return;}
    /* homeHTML と newsHTML はどちらも「おたより・キャンペーン・SNS」を描画するため、
       並べると同じものが2度出る。スクールタブは newsHTML（全件）に一本化する。 */
    /* 依頼どおりの並び：出欠・連絡（履歴を内包）→ 園からの個人メッセージ → おたより・SNS */
    sc.innerHTML=attHTML(c)+dmHTML(c)+newsHTML(c);
  }
  else if(tab==='play') sc.innerHTML=waPostOpen?feedPageHTML(waPostOpen,'play')
    :'<div id="feedZone">'+feedHTML('play')+'</div>';
  /* 身体記録は依頼どおりマイページへ移したので、まなぶタブには出さない */
  else if(tab==='learn') sc.innerHTML=waPostOpen?feedPageHTML(waPostOpen,'learn')
    :'<div id="feedZone">'+feedHTML('learn')+'</div>';
  else if(tab==='store'){
    var op=waProdOpen?waProducts().filter(function(x){return String(x.id)===String(waProdOpen);})[0]:null;
    sc.innerHTML=op?productPageHTML(op,c):storeHTML(c);
  }
  else if(tab==='connect') sc.innerHTML=waEventOpen?eventPageHTML(waEventOpen,c):connectHTML(c);
  else if(tab==='me') sc.innerHTML=meHTML(c);
  wireCommon(c);
  if(tab==='school'){wireAtt(c);wireDM(c);}
  if(tab==='play') waPostOpen?wirePostActs('play'):wireFeed('play');
  if(tab==='learn') waPostOpen?wirePostActs('learn'):wireFeed('learn');
  if(tab==='store') wireStore(c);
  if(tab==='connect') wireConnect(c);
  if(tab==='me') wireMe(c);
}

function allPosts(){
  var posts=(stGet('posts',[])||[]).slice();
  // 職員の全体配信(history)も おたより として取り込む
  /* 職員の一斉配信は、宛先1件につき1行ずつ履歴に残る。
     そのまま取り込むと同じおたよりが家庭数ぶん並び、他の家庭あての分まで混ざるため、
     ①ログイン中の家庭あて（宛先不明のものは全体配信とみなす）だけを拾い
     ②同じ日付・件名・本文のものは1件にまとめる。 */
  var hist=stGet('history',[])||[],me=sessionChild(),seenKey={};
  var myMail=me?String(me.email||'').toLowerCase():'';
  hist.forEach(function(x,i){
    if(!x||!x.body)return;
    var tpl=String(x.tpl||'');
    if(!(tpl.indexOf('デイリー')>-1||tpl.indexOf('配信')>-1||tpl.indexOf('お知らせ')>-1))return;
    var to=String(x.email||'').toLowerCase();
    if(myMail&&to&&to!==myMail)return;           /* 他の家庭あては出さない */
    var d=(x.date||todayISO()).slice(0,10);
    var k=d+'|'+(x.subject||x.tpl||'')+'|'+String(x.body).slice(0,80);
    if(seenKey[k])return; seenKey[k]=1;          /* 同じおたよりは1件だけ */
    posts.push({id:'h'+i,date:d,type:'daily',title:(x.subject||x.tpl||'園からのおたより'),body:x.body});
  });
  posts.sort(function(a,b){return (a.date<b.date)?1:(a.date>b.date?-1:0);});
  return posts;
}

var attKind='欠席';
function attStoreKey(){return 'rec_登園シート';}
function submitAbsence(c,date,kind,reason){
  var K=attStoreKey();var data=stGet(K,{});
  var day=data[date]||{klass:c.klass,rows:{},weather:'',temp:'',hum:'',memo:'',by:''};
  if(!day.rows)day.rows={};
  /* 職員側の登園シートと同じ記号にする。ここがずれると、保護者の連絡が園の画面に反映されない。
     職員側は ['','●','早','遅','休'] を使う（index.html の登園シート） */
  /* お迎え変更は出欠そのものではないので、記号は書き換えず連絡だけ残す */
  var mark = kind==='欠席'?'休':(kind==='遅刻'?'遅':(kind==='早退'?'早':null));
  var prev=day.rows[c.id]||{};
  var upd={parentNote:{kind:kind,reason:reason,at:new Date().toLocaleString('ja-JP')}};
  if(mark){upd.att=mark;upd.absent=(kind==='欠席');}
  day.rows[c.id]=Object.assign(prev,upd);
  data[date]=day;stSet(K,data);
  // parent-side log
  var log=stGet('absence_log',[]);log.push({childId:c.id,date:date,kind:kind,reason:reason,at:new Date().toLocaleString('ja-JP')});stSet('absence_log',log);
}

          +(m.readByParent?'<span class="dmread">既読 ✓</span>'
                          :'<button class="dmbtn" data-read="'+esc(m.id)+'">既読</button>')
          +'<button class="dmbtn re" data-reply="'+esc(m.id)+'">返信する</button></div>'
          +'<div class="dmreply hide" id="rep_'+esc(m.id)+'">'
            +'<textarea rows="3" placeholder="返信を入力してください"></textarea>'
            +'<button class="btn sec" data-send="'+esc(m.id)+'" style="margin-top:7px;">この内容を返信する</button></div>')
        +'</div>';}).join('')
      :bloomEmpty('まだメッセージはありません'))+'</div>';
  var form='<div style="margin-top:12px;"><textarea id="pdmText" rows="3" placeholder="園へのご連絡・ご相談を入力してください" style="width:100%;box-sizing:border-box;border:1px solid #e7e8e3;border-radius:12px;padding:11px;font-size:14px;font-family:inherit;"></textarea>'
    +'<button class="btn sec" id="pdmSend" style="margin-top:8px;width:100%;">送信する</button><div class="muted" id="pdmMsg" style="margin-top:8px;"></div></div>';
  return head+log+form+'</div>';
}
function wireDM(c){
  var log=document.getElementById('pdmLog');if(log)log.scrollTop=log.scrollHeight;
  document.querySelectorAll('[data-read]').forEach(function(b){b.onclick=function(){
    dmMarkOne(c.id,b.getAttribute('data-read'));render();};});
  document.querySelectorAll('[data-reply]').forEach(function(b){b.onclick=function(){
    var box=document.getElementById('rep_'+b.getAttribute('data-reply'));
    if(!box)return;
    box.classList.toggle('hide');
    if(!box.classList.contains('hide')){var t=box.querySelector('textarea');if(t)t.focus();}
  };});
  document.querySelectorAll('[data-send]').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-send'),box=document.getElementById('rep_'+id);
    var t=box&&box.querySelector('textarea'),tx=t?t.value.trim():'';
    if(!tx){toast('返信を入力してください');return;}
    dmSend(c,tx);
    dmMarkOne(c.id,id);
    toast('返信しました。内容は「連絡の履歴」にも残ります。');
    render();
  };});
  document.getElementById('pdmSend').onclick=function(){
    var tx=document.getElementById('pdmText').value.trim();
    if(!tx){alert('メッセージを入力してください');return;}
    dmSend(c,tx);
    document.getElementById('pdmText').value='';
    render();
    var m=document.getElementById('pdmMsg');if(m)m.innerHTML='<span style="color:#0F6E56;font-weight:600;">送信しました。園に通知が届きます。</span>';
  };
}
/* 送信の中身は、下の欄からでも返信ボタンからでも同じ */
function dmSend(c,tx){
    var t=stGet('dmThreads',{});if(!t[c.id])t[c.id]={messages:[]};
    t[c.id].messages.push({id:Date.now(),from:'parent',by:c.name,text:tx,at:dmNow(),readByStaff:false,readByParent:true});
    stSet('dmThreads',t);
    /* 園へ通知メール（返信URL付き）— 実送信はバックエンド接続後 */
    var st=stGet('settings',{})||{},school=st.school||'COCOAS KIDS International School',sender=st.sender||'omiya@cocoas-kids.com';
    var hist=stGet('history',[])||[];
    hist.push({date:addDaysISO(0),time:dmNow().slice(5),tpl:'DM通知（園へ）',to:school,email:sender,from:c.email||'',
      subject:'【DM】'+c.name+' 様（'+esc(c.child||'')+'）よりメッセージが届いています',
      body:c.name+' 様よりメッセージが届いています。\n\n----------\n'+tx+'\n----------\n\n下記より内容の確認・ご返信をお願いいたします。\n'+location.href.split('?')[0].replace(/[^\/]*$/,'')+'index.html?dm='+c.id});
    stSet('history',hist);
}

/* ---- NEWS (all posts) ---- */
function newsHTML(c){
  var posts=allPosts();var seen=seenPosts();
  setTimeout(function(){markSeen(posts.map(function(p){return p.id;}));},1200);
  return promoHTML()+'<div class="card"><h2 class="sec sec-p">📢 園からのおたより・お知らせ</h2>'
    +(posts.length?posts.map(function(p){return postRow(p,seen.indexOf(p.id)<0);}).join(''):bloomEmpty('まだおたよりはありません'))+'</div>'
    + snsHTML();
}

/* wire sec-more / tab2 buttons (delegated after render) */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab2]');if(t){tab=t.getAttribute('data-tab2');render();}
});

/* ---- boot ---- */
seedAll();
render();
</script>
