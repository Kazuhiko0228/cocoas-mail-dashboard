<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>EduGrow｜園務管理システム</title>
<style>
  :root{
    --teal:#0B5F8F; --teal-d:#063E5F; --teal-l:#0C84B4; --accent:#28ACD9;
    --bg:#F4F7FA; --card:#ffffff; --line:#E4E9EF; --line2:#EDF1F6;
    --tx:#1B2733; --tx2:#5B6875; --tx3:#98A2AE;
    --blue-b:#E6F1FB; --blue-t:#123E6B;
    --amber-b:#FAEEDA; --amber-t:#854F0B;
    --green-b:#EAF3DE; --green-t:#27500A;
    --gray-b:#F1EFE8; --gray-t:#5F5E5A;
    --purple-b:#EEEDFE; --purple-t:#3C3489;
    --pink-b:#FBEAF0; --pink-t:#72243E;
    --logo-navy:#003054; --logo-blue:#0C84B4; --logo-cyan:#28ACD9; --logo-green:#60B448;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:248px;background:linear-gradient(180deg,#04283A 0%,#063E5F 46%,#0A5478 100%);color:#DCEAF4;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#04283A;flex-shrink:0;}
  .brand .name{font-size:15px;font-weight:600;color:#fff;line-height:1.2;}
  .brand .brandlogo{height:30px;width:auto;background:#fff;border-radius:8px;padding:5px 9px;display:block;}
  .brand .sub{font-size:11px;color:#9fc7b8;}
  .nav{padding:12px 12px;flex:1;overflow:auto;}
  .nav-label{font-size:10.5px;letter-spacing:.08em;color:#7faa9b;padding:14px 12px 6px;text-transform:uppercase;}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfe3da;text-decoration:none;font-size:13.5px;margin-bottom:2px;cursor:pointer;}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav a.active{background:var(--teal-l);color:#fff;font-weight:500;}
  .nav a svg{width:18px;height:18px;flex-shrink:0;}
  .nav .badge{margin-left:auto;background:#f0a23a;color:#3a2403;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;}
  .side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#9fc7b8;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;}
  .topbar h1{font-size:18px;font-weight:600;margin:0;}
  .topbar .crumb{font-size:12px;color:var(--tx3);}
  .spacer{flex:1;}
  .sender-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);background:var(--bg);padding:7px 12px;border-radius:10px;border:1px solid var(--line);}
  .content{padding:24px 26px;max-width:1140px;width:100%;}
  section[data-page][hidden]{display:none;}
  button{font-family:inherit;cursor:pointer;}
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);transition:.12s;}
  .btn:hover{background:#F7F9FC;}
  .btn svg{width:16px;height:16px;}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500;}
  .btn-primary:hover{background:var(--teal-d);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--tx2);}
  .btn-ghost:hover{background:#f0f1ee;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .grid{display:grid;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .card h3{font-size:14.5px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card h3 svg{width:17px;height:17px;color:var(--teal);}
  /* サイドバーの開閉 */
  .nav-label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    border-radius:8px;transition:background .12s;}
  .nav-label:hover{background:rgba(255,255,255,.07);}
  .nav-label .caret{margin-left:auto;font-size:9px;opacity:.6;transition:transform .16s;}
  .nav-label.closed .caret{transform:rotate(-90deg);}
  .nav-label .cnt{font-size:10px;opacity:.55;font-variant-numeric:tabular-nums;}
  .nav-grp{overflow:hidden;transition:max-height .18s ease;}
  .nav-grp.closed{max-height:0 !important;}
  .page-h h1{display:flex;align-items:center;gap:9px;}
  .page-h h1 svg{width:21px;height:21px;color:var(--teal);flex-shrink:0;}
  .metric{display:flex;align-items:center;gap:14px;}
  .metric .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .metric .ico svg{width:22px;height:22px;}
  .metric .num{font-size:26px;font-weight:600;line-height:1;}
  .metric .lab{font-size:12.5px;color:var(--tx2);margin-top:3px;}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:500;}
  /* 書類格納の入口 */
  .docpick{transition:border-color .12s,transform .12s;}
  .docpick:hover{border-color:#0B5F8F;transform:translateY(-1px);}
  .dpic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;}
  .dpic svg{width:22px;height:22px;}
  .dpstat{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);}
  .dpstat b{font-size:19px;font-weight:800;color:var(--tx);}
  @media(max-width:880px){.docpick+.docpick{margin-top:0;}}
  /* スクールガイド */
  .gd-row{display:flex;gap:13px;align-items:center;}
  .gd-ic{width:42px;height:42px;border-radius:13px;background:#EFF1EE;display:flex;align-items:center;
    justify-content:center;font-size:19px;flex-shrink:0;}
  .gd-ic.f{background:#FAEEDA;}
  .gd-act{display:flex;gap:7px;flex-shrink:0;}
  .btn.xs{padding:7px 14px;font-size:12.5px;width:auto;}
  .btn.xs.gh{background:#fff;color:#A32D2D;border:1px solid #E8D3D3;}
  .note-b{font-size:12px;line-height:1.75;background:#E6F1FB;border:1px solid #CFE0F2;
    border-radius:10px;padding:10px 13px;color:#123E6B;}
  @media(max-width:640px){.gd-row{flex-wrap:wrap;}.gd-act{width:100%;margin-top:4px;}}
  .st-問い合わせ{background:var(--gray-b);color:var(--gray-t);}
  .st-体験予約{background:var(--blue-b);color:var(--blue-t);}
  .st-体験済{background:var(--amber-b);color:var(--amber-t);}
  .st-入園意向{background:var(--green-b);color:var(--green-t);}
  .st-入園決定{background:var(--purple-b);color:var(--purple-t);}
  .st-在園{background:var(--teal);color:#fff;}
  .st-退園{background:#E7E8E3;color:#5F5E5A;}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--tx2);border:1px solid var(--line);display:inline-block;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;color:var(--tx3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;}
  td{padding:11px 10px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .row-name{font-weight:500;}
  .row-sub{font-size:12px;color:var(--tx3);}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--teal-l);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;}
  input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--tx);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--teal-l);box-shadow:0 0 0 3px rgba(29,158,117,.13);}
  label{font-size:12px;color:var(--tx2);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:8px 16px;font-size:13px;color:var(--tx2);}
  .seg button.on{background:var(--teal);color:#fff;}
  .task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);}
  .task:last-child{border-bottom:none;}
  .task .tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
  .funnel-row .fl{width:78px;font-size:12.5px;color:var(--tx2);}
  .funnel-bar{flex:1;height:24px;background:#f0f1ee;border-radius:7px;overflow:hidden;}
  .funnel-bar > div{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:9px;color:#fff;font-size:12px;font-weight:600;}
  .reci{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff;}
  .reci.on{border-color:var(--teal-l);background:#f1faf6;}
  .reci input{width:auto;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--tx2);cursor:pointer;}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px;white-space:pre-wrap;font-size:12.8px;line-height:1.7;max-height:440px;overflow:auto;}
  .send-log{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .send-log .li{display:flex;align-items:center;gap:9px;font-size:12.8px;color:var(--tx2);}
  .pbar{height:7px;background:#EDF1F6;border-radius:99px;overflow:hidden;margin-top:6px;}
  .pbar > div{height:100%;width:0;background:var(--teal-l);transition:width .25s;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,28,24,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal{background:#fff;border-radius:16px;width:500px;max-width:100%;max-height:90vh;overflow:auto;padding:24px;}
  .modal h2{font-size:17px;margin:0 0 18px;}
  .agenda{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line2);}
  .agenda:last-child{border-bottom:none;}
  .agenda .date{width:62px;flex-shrink:0;text-align:center;}
  .agenda .date .d{font-size:22px;font-weight:600;line-height:1;}
  .agenda .date .m{font-size:11px;color:var(--tx3);}
  .cal-banner{background:#f1faf6;border:1px dashed var(--teal-l);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;}
  .muted{color:var(--tx2);font-size:12.5px;}
  .empty{text-align:center;color:var(--tx3);padding:30px;font-size:13px;}
  .scrollx{overflow-x:auto;}
  /* 長文の記載欄：中身の量に合わせて高さが伸びるので、スクロールせずに全文が見える */
  textarea.autogrow{resize:vertical;overflow:hidden;min-height:40px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  /* 表の中に長文が入る画面：セルを上ぞろえにして、長い語も折り返す */
  table.wraptbl td{vertical-align:top;word-break:break-word;}
  table.wraptbl th{vertical-align:bottom;}
  /* 防火管理台帳・消火訓練の表：列の幅を決めうちにして、記載欄が細くつぶれないようにする。
     画面のはばがたりないときは、列を細らせずに表ごと横スクロールさせる */
  table.bktbl{table-layout:fixed;min-width:800px;}
  table.bktbl.bk-kunren{min-width:820px;}
  table.bktbl input[type="date"]{width:100%;}
  .napcell{min-width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:11.5px;cursor:pointer;padding:0;}
  .napcell.v仰{background:#EAF3DE;color:#27500A;}
  .napcell.v横{background:#E6F1FB;color:#123E6B;}
  .napcell.v伏{background:#FCEBEB;color:#A32D2D;font-weight:600;}
  .shiftcell{min-width:40px;height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;cursor:pointer;padding:0;}
  .shiftcell.s早{background:#FAEEDA;color:#854F0B;}
  .shiftcell.s日{background:#EAF3DE;color:#27500A;}
  .shiftcell.s遅{background:#E6F1FB;color:#123E6B;}
  .shiftcell.s休{background:#F1EFE8;color:#98A2AE;}
  #printArea{display:none;}
  @page{size:A4 landscape;margin:14mm;}
  @media print{
    .app,#modalRoot,#aiFab,#aiPanel{display:none !important;}
    #printArea .shift-print table{table-layout:fixed;width:100%;font-size:8.5px;}
    #printArea .shift-print th,#printArea .shift-print td{padding:2px 1px;text-align:center;overflow:hidden;}
    #printArea .shift-print th.nm,#printArea .shift-print td.nm{width:78px;text-align:left;font-size:9px;white-space:nowrap;}
    #printArea .shift-print th.we,#printArea .shift-print td.we{background:#f0f0f0;}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;font-size:12px;}
    #printArea h1{font-size:18px;margin:0 0 4px;}
    #printArea h2{font-size:14px;margin:14px 0 6px;}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px;page-break-inside:auto;}
    #printArea th,#printArea td{border:1px solid #888;padding:5px 7px;text-align:left;}
    /* 記入用紙は列が多く幅が狭いので、余白を詰めて必ず枠内に収める */
    #printArea .blankform{table-layout:fixed;width:100%;}
    #printArea .blankform th,#printArea .blankform td{
      padding:3px 2px;text-align:center;vertical-align:middle;line-height:1.25;
      overflow:hidden;word-break:break-word;overflow-wrap:anywhere;hyphens:none;}
    #printArea .blankform thead th{font-weight:700;}
    #printArea .blankform td.nm,#printArea .blankform th.nm{text-align:left;}
    #printArea .bf-pad{padding:2mm;}
    #printArea .print-foot{margin-top:16px;font-size:11px;color:#333;}
  }
  /* ===== ホーム（アプリ一覧）: 保育士が迷わず選べるよう、大きなタイルで並べる ===== */
  .hgroup{margin-bottom:26px;}
  .hgroup h3{font-size:13px;font-weight:700;color:var(--tx2);margin:0 0 12px 2px;letter-spacing:.02em;display:flex;align-items:center;gap:9px;}
  .hgroup h3::after{content:"";flex:1;height:1px;background:var(--line);}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px;}
  .tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px 13px;
    display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;text-align:center;
    transition:transform .12s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(20,50,40,.04);}
  .tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(20,50,40,.22);border-color:var(--teal-l);}
  .tile:active{transform:translateY(0);}
  .tile:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .tile .ti{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tile .ti svg{width:26px;height:26px;}
  .tile .tl{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--tx);}
  .tile .tb{position:absolute;top:9px;right:9px;min-width:19px;height:19px;border-radius:99px;background:#E24B4A;color:#fff;
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1;}
  .tile .tb.ok{background:var(--accent);}
  .tile .ts{font-size:10.5px;color:var(--tx3);line-height:1.3;}
  .tile.attn{border-color:#F0B7B4;background:linear-gradient(180deg,#FFF8F7,var(--card));}
  .hhero{background:linear-gradient(105deg,var(--teal-d),var(--teal) 62%,var(--accent));border-radius:18px;padding:20px 22px;color:#fff;margin-bottom:24px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .hhero .hh{flex:1;min-width:220px;}
  .hhero h2{font-size:19px;margin:0 0 5px;color:#fff;}
  .hhero p{font-size:13px;margin:0;color:rgba(255,255,255,.88);line-height:1.6;}
  .hhero .hstat{display:flex;gap:9px;flex-wrap:wrap;}
  .hstat b{background:rgba(255,255,255,.17);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  @media(max-width:880px){.sidebar{display:none;}.content{padding:18px;}.tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
    .tile{padding:13px 7px 11px;}.tile .ti{width:46px;height:46px;border-radius:13px;}.tile .tl{font-size:11.5px;}}
  /* ===== 保育AIアシスタント ウィジェット ===== */
  #aiFab{position:fixed;right:22px;bottom:22px;z-index:900;width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;border:none;box-shadow:0 8px 22px rgba(15,110,86,.42);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;transition:transform .1s;}
  #aiFab:hover{transform:scale(1.06);}
  #aiFab .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;background:#f0a23a;border-radius:50%;border:2px solid #fff;}
  #aiPanel{position:fixed;right:22px;bottom:92px;z-index:900;width:384px;max-width:calc(100vw - 32px);height:566px;max-height:calc(100vh - 130px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.22);display:none;flex-direction:column;overflow:hidden;}
  #aiPanel.open{display:flex;}
  .ai-head{background:var(--teal);color:#fff;padding:13px 15px;display:flex;align-items:center;gap:10px;}
  .ai-head .t{font-weight:700;font-size:14.5px;flex:1;line-height:1.25;}
  .ai-head .t small{display:block;font-weight:400;font-size:10.5px;opacity:.85;}
  .ai-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);}
  .ai-tabs button{flex:1;background:none;border:none;padding:10px 8px;font:inherit;font-size:12.5px;
    font-weight:700;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;}
  .ai-tabs button.on{color:var(--teal);border-bottom-color:var(--teal);}
  .ai-head button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:8px;width:28px;height:28px;font-size:17px;cursor:pointer;line-height:1;}
  .ai-body{flex:1;overflow-y:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:10px;}
  .ai-msg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;}
  .ai-msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;}
  .ai-msg.me{background:var(--teal);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
  .ai-sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-self:flex-start;max-width:94%;}
  .ai-sec .st{font-weight:700;color:var(--teal-d);margin-bottom:3px;font-size:12.5px;}
  .ai-sec .ss{color:var(--tx2);font-size:12px;line-height:1.55;}
  .ai-sec button{margin:8px 6px 0 0;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .ai-chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 10px;background:var(--bg);}
  .ai-chips button{background:#fff;border:1px solid var(--teal-l);color:var(--teal-d);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .ai-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#fff;}
  .ai-foot input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;font-family:inherit;}
  .ai-foot button{background:var(--teal);color:#fff;border:none;border-radius:11px;width:44px;font-size:16px;cursor:pointer;}
  .ai-note{font-size:10px;color:var(--tx3);text-align:center;padding:0 12px 9px;background:#fff;line-height:1.4;}
  /* ===== 使い方ヘルプ ===== */
  #helpBtn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--tx2);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;}
  #helpBtn:hover{border-color:var(--teal);color:var(--teal);}
  #helpPanel{position:fixed;right:22px;top:78px;z-index:880;width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.2);display:none;}
  #helpPanel.open{display:block;}
  #helpPanel .hp-head{background:var(--teal);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:8px;border-radius:16px 16px 0 0;position:sticky;top:0;}
  #helpPanel .hp-head .t{font-weight:700;font-size:14px;flex:1;}
  #helpPanel .hp-head button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:8px;width:26px;height:26px;font-size:16px;cursor:pointer;line-height:1;}
  #helpPanel .hp-body{padding:14px 15px 16px;font-size:13px;line-height:1.75;}
  #helpPanel h4{margin:14px 0 6px;font-size:12.5px;color:var(--teal-d);}
  #helpPanel ol,#helpPanel ul{margin:0;padding-left:1.2em;}
  #helpPanel li{margin-bottom:4px;}
  #helpPanel .hp-faq{border-top:1px solid var(--line2);padding-top:8px;margin-top:6px;}
  #helpPanel .hp-faq .q{font-weight:600;font-size:12.5px;}
  #helpPanel .hp-faq .a{color:var(--tx2);font-size:12.5px;margin-bottom:8px;}
  /* ===== 職員ログイン（RBAC） ===== */
  #staffLogin{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0B5F8F,#063E5F);display:none;align-items:center;justify-content:center;padding:20px;}
  #staffLogin .sl-box{background:#fff;border-radius:20px;max-width:430px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto;}
  #staffLogin h2{margin:0 0 4px;font-size:20px;color:var(--tx);}
  #staffLogin .sl-sub{color:var(--tx2);font-size:12.5px;margin-bottom:18px;line-height:1.5;}
  #staffLogin .sl-acc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.1s;}
  #staffLogin .sl-acc:hover{border-color:var(--teal);background:#F0FAF6;}
  #staffLogin .sl-acc .rl{margin-left:auto;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap;}
  #staffLogin .sl-form{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;}
  #staffLogin .sl-hint{margin-top:12px;border-top:1px solid var(--line);padding-top:11px;}
  #staffLogin .sl-hint button{background:none;border:none;color:var(--tx2);font:inherit;font-size:12px;
    text-decoration:underline;cursor:pointer;padding:0;}
  #staffLogin .sl-hint-w{font-size:11.5px;line-height:1.7;background:#FDF3E3;border:1px solid #F0DCBC;
    border-radius:9px;padding:9px 11px;margin:9px 0;color:#7A5312;}
  #staffLogin .sl-hint-r{font-size:11.5px;line-height:1.7;color:var(--tx2);margin:9px 0;}
  #staffLogin .sl-hint table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #staffLogin .sl-hint td{border-bottom:1px solid var(--line);padding:6px 4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #staffLogin .sl-hint td:last-child{text-align:right;color:var(--tx2);font-family:inherit;}
  #staffLogin input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px;font-family:inherit;box-sizing:border-box;}
  #staffLogin button.sl-go{width:100%;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
  #staffLogin .sl-err{color:#B00;font-size:12px;margin-bottom:8px;display:none;}
  /* AIが下書きを書いているあいだの、進んでいるように見せる帯 */
  @keyframes aiBar{0%{margin-left:-40%;}100%{margin-left:100%;}}
</style>

function nextDelivery(d){
  var now=addDays(0),y=now.getFullYear(),mo=now.getMonth();
  if(d.rule==='daily')return now;
  if(d.rule==='monthly'){var t=new Date(y,mo,d.day);if(t<now)t=new Date(y,mo+1,d.day);return t;}
  if(d.rule==='annual'){var t=new Date(y,d.month,d.day);if(t<now)t=new Date(y+1,d.month,d.day);return t;}
  if(d.rule==='quarter'){var ms=[2,5,8,11],cs=[];[y,y+1].forEach(function(yy){ms.forEach(function(m){cs.push(new Date(yy,m+1,0));});});cs=cs.filter(function(t){return t>=now;}).sort(function(a,b){return a-b;});return cs[0];}
  return null;
}

/* 印刷本文の安全化。
   印刷の本文は44か所から渡され、そこに園児名や自由記入がそのまま入る。
   1か所ずつ直すと必ず漏れるので、ここで一度「切り離した文書」に組み立ててから、
   スクリプトや外部読み込み、on◯◯ の属性を取り除いて画面へ移す。
   表や書式はそのまま残るので、印刷の見た目は変わらない。 */
function printSanitize(html){
  var doc=document.implementation.createHTMLDocument('');
  doc.body.innerHTML=html;
  var kill=doc.body.querySelectorAll('script,iframe,object,embed,base,link,meta,form,noscript');
  for(var i=kill.length-1;i>=0;i--)kill[i].parentNode.removeChild(kill[i]);
  var all=doc.body.querySelectorAll('*');
  for(var j=0;j<all.length;j++){
    var e=all[j],at=e.attributes,k;
    for(k=at.length-1;k>=0;k--){
      var n=at[k].name.toLowerCase(),v=String(at[k].value||'');
      if(n.indexOf('on')===0||n==='srcdoc'||n==='formaction'){e.removeAttribute(at[k].name);continue;}
      if((n==='href'||n==='src'||n==='xlink:href')&&/^\s*(javascript|data:text\/html|vbscript)/i.test(v))e.removeAttribute(at[k].name);
    }
  }
  return doc.body.innerHTML;
}

function dlFile(name,content,mime){var blob=new Blob(["﻿"+content],{type:(mime||'text/html')+';charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
/* 画面にだけ出す補足表示（列見出しの「（自動）」など）は data-noexport を付けておき、
   Excel保存では列名に混ざらないよう取り除く。データそのものには一切触れない。 */
function exportCellText(cell){
  if(!cell.querySelector('[data-noexport]'))return cell.textContent;
  var c=cell.cloneNode(true);
  [].slice.call(c.querySelectorAll('[data-noexport]')).forEach(function(n){n.parentNode.removeChild(n);});
  return c.textContent;
}
function tableToHtml(t){
  var out='<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;">';
  [].slice.call(t.querySelectorAll('tr')).forEach(function(tr){out+='<tr>';
    [].slice.call(tr.children).forEach(function(cell){
      var tag=cell.tagName==='TH'?'th':'td',cs=cell.getAttribute('colspan'),rs=cell.getAttribute('rowspan');
      var val='',inp=cell.querySelector('input,select,textarea');
      if(inp){val=inp.tagName==='SELECT'?(inp.options[inp.selectedIndex]?inp.options[inp.selectedIndex].text:''):inp.value;}
      else{var btn=cell.querySelector('button');val=(btn?btn.textContent:exportCellText(cell)).replace(/\s+/g,' ').trim();}
      if(val==='—')val='';
      out+='<'+tag+(cs?' colspan="'+cs+'"':'')+(rs?' rowspan="'+rs+'"':'')+'>'+val.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</'+tag+'>';
    });
    out+='</tr>';});
  return out+'</table>';
}

/* 送信済みメール：同じ日時・同じ種別の送信を1件にまとめて表示（宛先が多くても履歴を追いやすくする） */
var SENT_SNAP=[];
function sentMailGroups(filter){
  SENT_SNAP=(DB.history||[]).slice();   /* DB.history は毎回作り直されるので、この場で控えを取る */
  var f=filter||function(){return true;},map={},order=[];
  SENT_SNAP.forEach(function(x,gi){
    if(!f(x,gi))return;
    var k=(x.time||'')+'|'+(x.tpl||'');
    if(!map[k]){map[k]={time:x.time,tpl:x.tpl,items:[],idx:[]};order.push(k);}
    map[k].items.push(x);map[k].idx.push(gi);
  });
  return order.map(function(k){return map[k];}).sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
}
function sentMailCard(title,filter){
  var groups=sentMailGroups(filter).slice(-20).reverse();
  return '<div class="card" style="margin-top:16px;"><h3>'+ic('mail')+(title||'送信済みメール')+'</h3>'+
    (groups.length?'<div class="muted" style="margin-bottom:8px;">1回の送信をまとめて表示しています。行をクリックすると宛先と本文を確認できます。</div><table><thead><tr><th style="width:130px;">日時</th><th>種別</th><th>宛先</th><th style="width:70px;text-align:right;">件数</th><th style="width:40px;"></th></tr></thead><tbody>'
      +groups.map(function(g){
        var names=g.items.map(function(x){return x.to;});
        var shown=names.slice(0,3).join('・')+(names.length>3?' ほか'+(names.length-3)+'名':'');
        return '<tr style="cursor:pointer;" data-sgroup="'+esc(g.idx.join(','))+'"><td class="row-sub">'+esc(g.time||'')+'</td><td>'+esc(g.tpl||'')+'</td><td class="row-sub" style="max-width:360px;overflow:hidden;text-overflow:ellipsis;">'+esc(shown)+'</td><td style="text-align:right;">'+g.items.length+'名</td><td style="text-align:right;color:var(--tx3);">'+ic('mail').replace('<svg','<svg style="width:15px;height:15px;vertical-align:-2px;"')+'</td></tr>';}).join('')

    var img=new Image();
    img.onload=function(){
      var MW=420,sc=Math.min(1,MW/img.width),w=Math.round(img.width*sc),hh=Math.round(img.height*sc);

   見出しの下にある項目を1つの箱にまとめ、見出しを押すと閉じる。
   いま開いている画面のある組は、閉じていても自動で開く。 */
function navGroups(){
  var nav=document.getElementById('nav');
  if(!nav||nav.getAttribute('data-grouped'))return;
  var kids=[].slice.call(nav.children),groups=[],cur=null;
  kids.forEach(function(el){
    if(el.classList&&el.classList.contains('nav-label')){
      cur={label:el,items:[]};groups.push(cur);
    }else if(cur){cur.items.push(el);}
  });
  var open=stGet('navOpen',null);
  groups.forEach(function(g,i){
    var box=document.createElement('div');
    box.className='nav-grp';
    var name=(g.label.textContent||'').trim();
    box.setAttribute('data-grp',name);
    g.label.parentNode.insertBefore(box,g.label.nextSibling);
    g.items.forEach(function(x){box.appendChild(x);});
    g.label.innerHTML='<span>'+esc(name)+'</span>'
      +'<span class="cnt">'+g.items.length+'</span><span class="caret">▼</span>';
    g.label.setAttribute('data-grp',name);
    g.label.setAttribute('role','button');
    g.label.setAttribute('tabindex','0');
    var closed=open?(open.indexOf(name)<0):false;   /* 控えが無いときは全部ひらく */
    setGrp(g.label,box,!closed,true);
    g.label.onclick=function(){
      var nowOpen=box.classList.contains('closed');
      setGrp(g.label,box,nowOpen,false);
      saveNavOpen();
    };
    g.label.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();g.label.click();}};
  });
  nav.setAttribute('data-grouped','1');
  navRevealActive();
}
function setGrp(label,box,open,instant){
  if(open){
    box.classList.remove('closed');label.classList.remove('closed');
    box.style.maxHeight=instant?'none':(box.scrollHeight+'px');
    if(!instant)setTimeout(function(){if(!box.classList.contains('closed'))box.style.maxHeight='none';},200);
  }else{
    box.style.maxHeight=box.scrollHeight+'px';
    void box.offsetHeight;
    box.classList.add('closed');label.classList.add('closed');
  }
}
function saveNavOpen(){
  var out=[];

/* ══ 説明文を、文の区切りで行分けする ═══════════════
   ひとつの文の途中で行が変わると、2行目が左端から始まるため、
   別の文がはじまったように見えてしまう（Remiさんのご指摘）。
   「。」で行を分けて、1行が1文になるようにする。

   説明文は画面ごとに60か所以上あるので、1か所ずつ直すのではなく、
   画面を描いたあとにまとめて整える。 */
function tidyNotes(root){
  var scope=root||document;
  try{
    var els=scope.querySelectorAll('.muted, .note, [data-note]');
    [].forEach.call(els,function(el){
      if(el.getAttribute('data-tidy'))return;          /* 二度はやらない */
      if(el.closest('table'))return;                   /* 表の中は行が詰まるので触らない */
      if(el.closest('[data-legal]'))return;            /* 規約の本文はそのまま */
      if(el.querySelector('input,select,textarea,button,a'))return;  /* 操作を含むものは触らない */
      var t=el.textContent||'';
      if(t.length<40)return;                           /* 短い注記はそのままでよい */
      if((t.match(/。/g)||[]).length<2)return;          /* 1文なら分ける必要がない */
      el.setAttribute('data-tidy','1');
      splitAtPeriod(el);
    });
  }catch(e){ /* 見た目の調整なので、失敗しても画面は止めない */ }
}
/* 中の文字だけを見て、「。」のうしろで改行を入れる。
   太字などの飾りはそのまま残す。 */
function splitAtPeriod(el){
  var walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null,false);
  var nodes=[],n;
  while((n=walk.nextNode()))nodes.push(n);
  nodes.forEach(function(node){
    var v=node.nodeValue;
    if(v.indexOf('。')<0)return;
    /* 「。」のうしろで切る。最後の「。」のあとに文字が無いときは、改行を足さない。 */
    var parts=v.split('。');
    var tail=parts.pop();
    if(!parts.length)return;
    var frag=document.createDocumentFragment();
    parts.forEach(function(p,i){
      frag.appendChild(document.createTextNode(p+'。'));
      var nextHasText=(i<parts.length-1)||tail.trim().length>0;
      if(nextHasText)frag.appendChild(document.createElement('br'));
    });
    if(tail)frag.appendChild(document.createTextNode(tail));
    node.parentNode.replaceChild(frag,node);
  });
}

    any.forEach(function(a){nav.appendChild(a);});
  });
  nav.removeAttribute('data-grouped');
  try{navGroups();}catch(e){}
  try{wireNav();}catch(e){}
}

/* ══ プランと役職による出し分け ════════════════
   料金表のプランに合わせて、見せるものを切り替える。
   サーバにつないでいるときは契約のプランを使い、
   つないでいないときは設定で選んだものを使う（試作を見せるため）。 */
var PLAN_RANK={connect:1,standard:2,pro:3,business:3};
function myPlan(){
  /* 契約しているプランは、まずログインのときにサーバから受け取ったものを見る。
     ここを localStorage の cocoas_plan だけにすると、
     同期の口から書き換えて、自分でプランの制限を外せてしまう。
     サーバにつないでいないとき（試作・デモ）だけ、端末の設定を使う。 */
  var t=null;
  try{ t=(typeof API!=='undefined'&&API.tenant)?API.tenant():null; }catch(e){ t=null; }
  var p=(t&&t.plan)||stGet('plan','pro');
  return PLAN_RANK[p]?p:'pro';
}
function planAllows(need){
  if(!need)return true;
  return PLAN_RANK[myPlan()]>=PLAN_RANK[need];
}

}

/* まだ作っていない画面は出さない。押しても何も起きないマスを作らないため。 */
function egHasPage(p){
  if(!p)return false;
  try{ return !!document.querySelector('section[data-page="'+p+'"]'); }catch(e){ return false; }
}
function egNav(){
  var out=[];
  EG_NAV.forEach(function(g){
    if(g.boss&&!isBoss())return;
    if(!planAllows(g.plan))return;
    var items=g.items.filter(function(x){
      if(x.boss&&!isBoss())return false;
      if(!planAllows(x.plan))return false;
      if(x.sub){
        x=Object.assign({},x,{sub:x.sub.filter(function(y){return egHasPage(y.p);})});
        return x.sub.length>0;
      }
      return egHasPage(x.p);
    }).map(function(x){
      return x.sub?Object.assign({},x,{sub:x.sub.filter(function(y){return egHasPage(y.p);})}):x;
    });
    if(items.length)out.push({cat:g.cat,items:items});
  });
  return out;
}

/* ══ 営業分析（Proプラン）══════════════════════
   リードの状態から数字を出す。数字のもとは連絡先の「ステータス」。
   出しているのは集計であって、予測ではない。 */
var SALES_GROUP={
  '体験前':['体験前 日程調整中','体験前 日程調整済','オンライン前 日程調整中',
            'オンライン後 体験日程調整中','オンライン後 体験日程調整済'],
  '体験後':['体験後 検討中','🔥入園見込み','長期見込み'],
  '入園':['入園 確定'],
  '離脱':['連絡不通','NG']
};
function salesStats(){
  var leads=DB.contacts.filter(function(c){return c.kind==='lead';});
  var g={'体験前':0,'体験後':0,'入園':0,'離脱':0,'その他':0}, byStatus={};
  leads.forEach(function(c){
    var st=c.status||'';
    byStatus[st]=(byStatus[st]||0)+1;
    var hit=null;
    Object.keys(SALES_GROUP).forEach(function(k){ if(SALES_GROUP[k].indexOf(st)>-1)hit=k; });
    g[hit||'その他']++;
  });
  var total=leads.length;
  var trial=g['体験後']+g['入園'];          /* 体験まで進んだ数 */
  var rate=function(a,b){ return b?Math.round(a/b*1000)/10:null; };
  /* 月ごとの動き（受付日から） */
  var by={}; leads.forEach(function(c){
    var m=String(c.date||'').slice(0,7); if(!m)return;
    by[m]=by[m]||{n:0,win:0,lost:0};
    by[m].n++;
    if(SALES_GROUP['入園'].indexOf(c.status)>-1)by[m].win++;
    if(SALES_GROUP['離脱'].indexOf(c.status)>-1)by[m].lost++;
  });
  /* 離脱の理由。メモから拾う */
  var reasons={};
  leads.filter(function(c){return SALES_GROUP['離脱'].indexOf(c.status)>-1;}).forEach(function(c){
    var t=(c.note||c.memo||'').trim();
    var key=t?t.slice(0,18):'理由の記録なし';
    reasons[key]=(reasons[key]||0)+1;
  });
  return {
    total:total, g:g, byStatus:byStatus, months:by, reasons:reasons,
    trialRate:rate(trial,total), winRate:rate(g['入園'],total),
    lostRate:rate(g['離脱'],total),
    winOfTrial:rate(g['入園'],trial)
  };
}
/* 数字を見て気づいたことを言う。当てずっぽうは言わない。 */
function salesFindings(x){
  var out=[];
  if(!x.total){ return [{lv:'warn',t:'リードがまだ登録されていません。連絡先に「リード」として登録すると、ここに数字が出ます。'}]; }
  if(x.trialRate!=null&&x.trialRate<40)
    out.push({lv:'warn',t:'体験まで進んだのが '+x.trialRate+'% です。問い合わせのあと、体験の日程を決めるところで止まっている可能性があります。'});
  if(x.winOfTrial!=null&&x.winOfTrial>=50)
    out.push({lv:'ok',t:'体験まで来た方の '+x.winOfTrial+'% が入園に至っています。体験そのものは効いています。'});
  if(x.winOfTrial!=null&&x.winOfTrial<30&&x.g['体験後'])
    out.push({lv:'warn',t:'体験のあとの決定が '+x.winOfTrial+'% にとどまっています。体験後のフォローを見直す余地があります。'});
  if(x.lostRate!=null&&x.lostRate>=30)
    out.push({lv:'warn',t:'離脱が '+x.lostRate+'% です。連絡不通が多い場合は、初回連絡までの日数を短くすると変わることがあります。'});
  var noReason=x.reasons['理由の記録なし']||0;
  if(noReason>0)
    out.push({lv:'warn',t:'離脱のうち '+noReason+'件は理由が記録されていません。理由が残ると、次の打ち手が決められます。'});
  if(!out.length)out.push({lv:'ok',t:'いまのところ、目立った偏りは見つかりませんでした。'});
  return out;
}

/* ══════════════════════════════════════════════════
   Bluetooth体温計との連携（A&D UT-201BLE を想定）

   共通の決まり（Health Thermometer Service）に従う体温計なら、
   メーカーのアプリを通さずに、この画面から直接読める。

   つながらない端末（iPad の Safari など）では、同じ流れのまま
   手入力に切り替わる。画面の作りは変えない。
   ══════════════════════════════════════════════════ */
var THERMO={
  SERVICE:0x1809,          /* Health Thermometer Service */
  MEASURE:0x2A1C,          /* Temperature Measurement */
  INTERM :0x2A1E,          /* Intermediate Temperature（測定中の値） */
  dev:null, ch:null, chI:null, cb:null, last:null,

  /* この端末で使えるか。iPad・iPhone の Safari は使えない。 */
  supported:function(){ return !!(navigator&&navigator.bluetooth); },
  why:function(){
    if(THERMO.supported())return '';
    var ua=navigator.userAgent||'';
    if(/iPhone|iPad|iPod/.test(ua))
      return 'iPhone・iPad では、ブラウザから体温計につなぐことができません（Apple の仕様）。'
        +'Android のタブレットかパソコンをお使いいただくか、このまま手で入力してください。';
    if(/Firefox/.test(ua))
      return 'Firefox は体温計との接続に対応していません。Chrome か Edge をお使いください。';
    return 'このブラウザは体温計との接続に対応していません。Chrome か Edge をお使いください。';
  },
  connected:function(){ return !!(THERMO.dev&&THERMO.dev.gatt&&THERMO.dev.gatt.connected); },

  /* つなぐ。ブラウザの決まりで、職員が押した直後にしか呼べない。
     朝に1回つなげば、その日はつながったまま使える。 */
  connect:function(done){
    done=done||function(){};
    if(!THERMO.supported()){done(false,THERMO.why());return;}
    navigator.bluetooth.requestDevice({
      filters:[{services:[THERMO.SERVICE]}],
      optionalServices:[THERMO.SERVICE]
    }).then(function(d){
      THERMO.dev=d;
      d.addEventListener('gattserverdisconnected',function(){
        THERMO.ch=null;THERMO.chI=null;
        try{aiToast('体温計との接続が切れました');}catch(e){}
        try{thFlowRender();}catch(e){}
      });
      return d.gatt.connect();
    }).then(function(g){ return g.getPrimaryService(THERMO.SERVICE); })
      .then(function(sv){
        /* 測定完了の値。機種によっては測定中の値も流れてくる。 */
        return sv.getCharacteristic(THERMO.MEASURE).then(function(c){
          THERMO.ch=c;
          c.addEventListener('characteristicvaluechanged',function(e){
            THERMO.handle(e.target.value,true);
          });
          return c.startNotifications();
        }).then(function(){
          return sv.getCharacteristic(THERMO.INTERM).then(function(c2){
            THERMO.chI=c2;
            c2.addEventListener('characteristicvaluechanged',function(e){
              THERMO.handle(e.target.value,false);
            });
            return c2.startNotifications();
          }).catch(function(){ /* 測定中の値を出さない機種もある。無くてよい */ });
        });
      })
      .then(function(){ done(true,''); })
      .catch(function(e){
        var m=String(e&&e.message||e);
        if(/cancell?ed|User cancelled/i.test(m))done(false,'');
        else done(false,'つながりませんでした：'+m);
      });
  },
  disconnect:function(){
    try{ if(THERMO.dev&&THERMO.dev.gatt&&THERMO.dev.gatt.connected)THERMO.dev.gatt.disconnect(); }catch(e){}
    THERMO.dev=null;THERMO.ch=null;THERMO.chI=null;
  },

  /* 受け取った値をほどく。
     体温計は IEEE-11073 という、ふつうの小数とは違う形で数値を送ってくる。
     先頭1バイトが目印で、続く4バイトが値。目印の一番下のビットが
     立っていたら華氏なので、摂氏に直す。 */
  handle:function(dv,final){
    var v=THERMO.parse(dv);
    if(v==null)return;
    THERMO.last={c:v,at:new Date(),final:!!final};
    if(THERMO.cb)THERMO.cb(v,!!final);
  },
  parse:function(dv){
    try{
      if(!dv||dv.byteLength<5)return null;
      var flags=dv.getUint8(0);
      var raw=dv.getUint32(1,true);
      var mant=raw&0x00FFFFFF;
      /* 使えない値を表す決まった並び。取り違えないよう先に弾く。 */
      if(mant===0x007FFFFF||mant===0x00800000||mant===0x007FFFFE||mant===0x00800002)return null;
      if(mant>=0x800000)mant-=0x1000000;
      var exp=raw>>24;
      if(exp>=0x80)exp-=0x100;
      var val=mant*Math.pow(10,exp);
      if(flags&0x01)val=(val-32)*5/9;         /* 華氏で来たら摂氏へ */
      if(!isFinite(val)||val<25||val>45)return null;   /* 体温としてありえない値は捨てる */
      return Math.round(val*10)/10;
    }catch(e){ return null; }
  }
};

/* 登園シートを描き直す。
   体温を保存したあと、これを呼ばないと画面に出ないだけでなく、
   edTouen が抱えている古い記録があとから保存されて体温が消えてしまう。
   登園シートを開いていないときは、何もしない。 */
function thRedraw(){
  try{
    if(typeof edTouen!=='function')return;
    if(typeof recType!=='undefined'&&recType!=='登園（出席）')return;
    if(!document.querySelector('[data-ta]'))return;
    edTouen();
  }catch(e){ console.error('[登園シートの描き直し]',e.message); }
}

/* ══ 測定の流れ ════════════════════════════════ */
var THF={open:false, child:null, state:'wait', temp:null, left:0, timer:null, undo:0, undoTimer:null};
var TH_WAIT=60;   /* 測定待ちの秒数 */
var TH_UNDO=6;    /* 取消・再測定を出しておく秒数 */

function thFlowStart(child){
  THF.open=true; THF.child=child; THF.state='wait'; THF.temp=null; THF.left=TH_WAIT;
  clearInterval(THF.timer); clearTimeout(THF.undoTimer);
  THERMO.cb=function(v,final){
    if(!THF.open||THF.state!=='wait')return;
    if(!final){ THF.temp=v; thFlowRender(); return; }   /* 測定中は表示だけ */
    thFlowGot(v);
  };
  THF.timer=setInterval(function(){
    THF.left--;
    if(THF.left<=0){ clearInterval(THF.timer); THF.state='timeout'; }
    thFlowRender();
  },1000);
  thFlowRender();
}
function thFlowGot(v){
  clearInterval(THF.timer);
  THF.temp=v; THF.state='got';
  thFlowSave(v);                       /* 受け取ったらすぐ保存する */
  THF.undo=TH_UNDO;
  clearInterval(THF.undoTimer);
  THF.undoTimer=setInterval(function(){
    THF.undo--;
    if(THF.undo<=0){ clearInterval(THF.undoTimer); thFlowClose(); }
    else thFlowRender();
  },1000);
  thFlowRender();
}
function thFlowSave(v){
  try{
    var K='rec_登園シート', data=stGet(K,{}), day=(typeof recDate!=='undefined'&&recDate)?recDate:todayISO();
    var d=data[day]||{klass:'Pre',weather:'',temp:'',hum:'',rows:{},memo:'',by:''};
    var r=d.rows[THF.child.id]||{att:'',temp:'',opts:{}};
    r.temp=String(v);
    d.rows[THF.child.id]=r; data[day]=d; stSet(K,data);
    thRedraw();
  }catch(e){ console.error('[体温の保存]',e.message); }
}
function thFlowUndo(){
  try{
    var K='rec_登園シート', data=stGet(K,{}), day=(typeof recDate!=='undefined'&&recDate)?recDate:todayISO();
    var d=data[day]; if(d&&d.rows[THF.child.id]){ d.rows[THF.child.id].temp=''; stSet(K,data); }
    thRedraw();
  }catch(e){}
  clearInterval(THF.undoTimer);
  THF.state='wait'; THF.temp=null; THF.left=TH_WAIT;
  clearInterval(THF.timer);
  THF.timer=setInterval(function(){
    THF.left--; if(THF.left<=0){clearInterval(THF.timer);THF.state='timeout';} thFlowRender();
  },1000);
  thFlowRender();
}
function thFlowClose(){
  THF.open=false; THERMO.cb=null;
  clearInterval(THF.timer); clearInterval(THF.undoTimer);
  var el=document.getElementById('thFlow'); if(el)el.remove();
}

      +(THF.temp?'<div style="font-size:12px;color:#A26A12;">測定中の値です。確定するまでお待ちください</div>':'')
      +'<div style="margin-top:14px;height:6px;background:#EEF0F3;border-radius:6px;overflow:hidden;">'
      +'<div style="height:6px;background:#0B5F8F;width:'+Math.round(THF.left/TH_WAIT*100)+'%;transition:width .9s linear;"></div></div>'
      +'<div style="font-size:12px;color:#6C7686;margin-top:6px;">測定待ち　残り '+THF.left+' 秒</div>'
      +(conn?'':'<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">'
        +'<input id="thMan" type="number" step="0.1" placeholder="36.5" '

    );
  } else if(THF.state==='timeout'){
    html=box(
      '<div style="font-size:20px;font-weight:800;margin-bottom:6px;">'+nm+' さん</div>'
      +'<div style="font-size:13.5px;color:#A26A12;line-height:1.85;">'
      +'時間内に測定できませんでした。もう一度測るか、手で入力してください。</div>'
      +'<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">'
      +'<input id="thMan" type="number" step="0.1" placeholder="36.5" '
      +'style="width:120px;padding:10px;border:1px solid #E2E5EA;border-radius:9px;font-size:17px;text-align:center;">'
      +'<button class="btn" id="thManOK">入力する</button></div>'
      +'<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;">'
      +'<button class="btn btn-sm" id="thAgain">もう一度測る</button>'
      +'<button class="btn btn-sm" id="thSkip">あとで測る</button></div>'
    );
  } else {
    var hot=THF.temp>=37.5;
    html=box(
      '<div style="font-size:12px;color:#1D7A56;font-weight:700;">保存しました</div>'
      +'<div style="font-size:22px;font-weight:800;margin:8px 0 2px;">'+nm+' さん</div>'
      +'<div style="font-size:52px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px;color:'
      +(hot?'#A3302F':'#1D7A56')+';">'+THF.temp.toFixed(1)+'<span style="font-size:24px;">℃</span></div>'
      +(hot?'<div style="font-size:13px;color:#A3302F;font-weight:700;margin-top:4px;">'
        +'37.5℃以上です。園の決まりに沿って対応してください。</div>':'')
      +'<div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">'
      +'<button class="btn btn-sm" id="thUndo">取消・再測定（'+THF.undo+'）</button>'
      +'<button class="btn btn-primary btn-sm" id="thDone">つぎへ</button></div>'
    );
  }
  el.innerHTML=html;

  var $$=function(id){return document.getElementById(id);};
  if($$('thSkip'))$$('thSkip').onclick=thFlowClose;
  if($$('thDone'))$$('thDone').onclick=thFlowClose;
  if($$('thUndo'))$$('thUndo').onclick=thFlowUndo;
  if($$('thAgain'))$$('thAgain').onclick=function(){ thFlowStart(THF.child); };
  if($$('thConn'))$$('thConn').onclick=function(){
    THERMO.connect(function(ok,msg){
      if(ok)aiToast('体温計につながりました');
      else if(msg)alert(msg);
      thFlowRender();
    });
  };
  if($$('thManOK'))$$('thManOK').onclick=function(){
    var v=parseFloat($$('thMan').value);
    if(!(v>=25&&v<=45)){ alert('体温を 25〜45 の範囲で入力してください。'); return; }
    thFlowGot(Math.round(v*10)/10);
  };
  if($$('thMan'))$$('thMan').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&$$('thManOK'))$$('thManOK').click();
  });
}

}

/* ── 記録から事実を集める ─────────────────────
   ここで集めたものだけを根拠にする。推測はこのあとの段で行い、
   画面では「記録から」と「AIが読み取った」を分けて出す。 */
function aiAgeOf(dob){
  if(!dob)return null;
  var d=String(dob).slice(0,10).split('-'); if(d.length<3)return null;
  var t=todayISO().split('-');
  var y=+t[0]-+d[0];
  if((+t[1])<(+d[1])||((+t[1])===(+d[1])&&(+t[2])<(+d[2])))y--;
  return y<0?0:y;
}
function aiFacts(klass){
  var kids=enrolled().filter(function(c){return c.klass===klass;});
  var ages={},minA=null,maxA=null;
  kids.forEach(function(c){
    var a=aiAgeOf(c.dob);
    if(a==null)return;
    ages[a]=(ages[a]||0)+1;
    if(minA==null||a<minA)minA=a;
    if(maxA==null||a>maxA)maxA=a;
  });
  /* 発達記録・ヒヤリハット・身体測定の件数と、直近の日付 */
  function scan(key){
    var v=stGet(key,{})||{},n=0,last='',ids={};
    Object.keys(v).forEach(function(period){
      var rows=v[period]&&v[period].rows?v[period].rows:v[period];
      if(!rows||typeof rows!=='object')return;
      Object.keys(rows).forEach(function(id){
        n++; ids[id]=rows[id];
      });
      if(period>last)last=period;
    });
    return {n:n,last:last,ids:ids};
  }
  var hattatsu=scan('rec_発達'), hiyari=scan('rec_hiyari'), shintai=scan('rec_身体測定');
  var cls=aiClassOf(klass);
  return {
    klass:klass, kids:kids, count:kids.length,
    ages:ages, minAge:minA, maxAge:maxA,
    ageSpread:(minA!=null&&maxA!=null)?(maxA-minA):0,
    staff:cls.staff||2,
    perStaff:cls.staff?Math.ceil(kids.length/cls.staff):kids.length,
    hattatsu:hattatsu, hiyari:hiyari, shintai:shintai,
    hasRecords:(hattatsu.n+hiyari.n+shintai.n)>0
  };
}

/* ── 道具の使いかたを、子どもごとに分ける ─────────
   クラスまるごと「使える・使えない」で決めない。
   発達記録に書いてあればそれを使い、無ければ年齢から見立てたうえで
   「記録が足りない」とはっきり書く。 */
var AI_SCISSOR=[
  {k:'self',  l:'自分で使う',              hint:'はさみを自分で扱える'},
  {k:'watch', l:'保育者が見守りながら使う', hint:'見守りがあれば扱える'},
  {k:'with',  l:'保育者と一緒に使う',       hint:'手を添えれば扱える'},
  {k:'tear',  l:'紙を手でちぎる',           hint:'はさみは使わない'},
  {k:'pick',  l:'切ってある素材から選ぶ',   hint:'はさみは使わない'},
];
function aiToolLevel(child,facts){
  /* 発達記録に「はさみ」の記述があれば、それを最優先で読む */
  var rec=facts.hattatsu.ids[child.id];
  var txt=rec?JSON.stringify(rec):'';
  if(/はさみ|ハサミ/.test(txt)){
    if(/一人で|自分で|ひとりで/.test(txt))return {k:'self',src:'記録から'};
    if(/見守|そばで/.test(txt))          return {k:'watch',src:'記録から'};
    if(/一緒|手を添え|介助/.test(txt))    return {k:'with',src:'記録から'};
    if(/まだ|難し|使わない/.test(txt))    return {k:'tear',src:'記録から'};
  }
  var a=aiAgeOf(child.dob);
  var k = a==null?'with' : (a>=4?'self' : a===3?'watch' : a===2?'with' : 'tear');
  return {k:k,src:'年齢からの見立て',need:true};
}
function aiToolGroups(klass){
  var f=aiFacts(klass),g={},need=0;
  f.kids.forEach(function(c){
    var t=aiToolLevel(c,f);
    (g[t.k]=g[t.k]||[]).push({name:c.child||c.name,src:t.src});
    if(t.need)need++;
  });
  return {groups:g,needCheck:need,facts:f};
}

/* ── クラス像（AIが読み取ったもの）──────────────
   記録から分かることと、ヒアリングで教えていただいたことを合わせる。 */
function aiProfile(klass){
  var f=aiFacts(klass), c=aiClassOf(klass), h=c.hearing||{};
  var lines=[];
  if(f.count) lines.push('在籍 '+f.count+'名。'+(f.minAge!=null?f.minAge+'歳〜'+f.maxAge+'歳':'年齢の記録が不足'));
  if(f.ageSpread>=2) lines.push('クラスの中で発達の幅が大きいため、同じ活動でも参加のしかたを分ける必要があります。');
  if(f.staff) lines.push('先生 '+f.staff+'名。1人あたり およそ '+f.perStaff+'名を見ることになります。');
  if(f.hattatsu.n) lines.push('発達記録が '+f.hattatsu.n+'件（直近 '+(f.hattatsu.last||'—')+'）。');
  else lines.push('発達記録がまだありません。記録が増えるほど、提案が実態に近づきます。');
  if(f.hiyari.n) lines.push('ヒヤリハット・怪我の記録が '+f.hiyari.n+'件。安全上の配慮に反映します。');
  var mood=(h.mood||[]).join('、'), grow=(h.growth||[]).join('、'), sup=(h.support||[]).join('、');
  if(mood) lines.push('雰囲気：'+mood);
  if(grow) lines.push('最近の成長：'+grow);
  if(sup)  lines.push('援助したいこと：'+sup);
  if(c.policy) lines.push('クラス方針：'+c.policy);
  var ph=aiSetup().philosophy;
  if(ph) lines.push('スクール理念：'+ph);
  return {lines:lines, facts:f, hearing:h, hasHearing:!!(h&&(h.mood||h.growth||h.support))};
}

/* ══ AIにつなぐ ════════════════════════════
   文章はサーバごしに Gemini が書き、
   人数・はさみの段階・ヒヤリハットの件数といった「記録から出る数字」は
   これまでどおり画面が入れる。AIに数字を作らせない。

   APIキーはサーバの中だけにある。この画面には持たせない
   （このファイルは公開しているので、置くと誰でも読めてしまう）。 */
var AI_KINDS={month:'月案',week:'週案',day:'日案',craft:'制作'};
var AI_NET={busy:false, last:null, note:''};

function aiCanServer(){
  try{ return typeof API!=='undefined' && API.online(); }catch(e){ return false; }
}

/* クラスの様子を、送ってよい形の短い文にまとめる。
   氏名は入れない（サーバ側でも落とすが、ここでも入れない）。 */
function aiFactsText(klass){
  try{
    var p=aiProfile(klass), f=p.facts, tg=aiToolGroups(klass);
    var out=[];
    if(f.minAge!=null)out.push('年齢の幅は'+f.minAge+'〜'+f.maxAge+'歳。');
    var g=[];
    AI_SCISSOR.forEach(function(x){
      var l=tg.groups[x.k]; if(l&&l.length)g.push(x.l+'が'+l.length+'名');
    });
    if(g.length)out.push('はさみの段階は '+g.join('、')+'。');
    if(f.hiyari&&f.hiyari.n)out.push('この学期のヒヤリハットは'+f.hiyari.n+'件。');
    if(p.note)out.push(String(p.note).slice(0,300));
    return out.join('');
  }catch(e){ return ''; }
}

/* サーバに文章を書いてもらう。
   返ってくるのは決まった項目だけなので、そのまま下書きに重ねられる。 */
function aiAskServer(kind,klass,period,extra){
  var jp=AI_KINDS[kind];
  if(!jp||!aiCanServer())return Promise.resolve(null);
  var m=period||(String(+todayISO().slice(5,7))+'月');
  var body={
    kind:jp, klass:klass, period:m,
    ageLabel:(function(){try{var f=aiProfile(klass).facts;
      return (f.minAge!=null)?(f.minAge+'歳児'):'';}catch(e){return '';}})(),
    season:AI_SEASON[m]||'',
    facts:aiFactsText(klass)
  };
  if(extra&&extra.aim)body.aim=extra.aim;
  if(extra&&extra.note)body.note=extra.note;
  return API.call('POST','/ai/plan',body)
    .then(function(j){ return (j&&j.data)?j.data:null; })
    .catch(function(e){ AI_NET.note=e.message||''; return null; });
}

/* AIが書いた文章を、いまの下書きに重ねる。
   base に無い項目は入れない（画面が知らない項目を増やさないため）。 */
function aiMerge(base,got,only){
  if(!got)return base;
  only.forEach(function(k){
    var v=got[k];
    if(v===undefined||v===null)return;
    if(Array.isArray(v)){
      if(!v.length)return;
      /* 中身が「一日の流れ」「週の流れ」のような組のときは、そのまま入れる。
         ここで文字列にしてしまうと、曜日や時刻が消えてしまう。 */
      base[k]=v.map(function(x){
        return (x&&typeof x==='object')?x:String(x);
      });
    }
    else if(typeof v==='string'){ if(v.trim())base[k]=v.trim(); }
    else base[k]=v;
  });
  return base;
}

/* ── 上と下の計画がつながっているか確かめる ────────
   年案・月案・週案・日案がばらばらにならないよう、
   ねらいに共通する言葉があるかを見る。無ければ画面で知らせる。 */
function aiConsistency(klass){
  var ps=aiPlans().filter(function(x){return x.klass===klass;});
  var year=ps.filter(function(x){return x.kind==='year';}).slice(-1)[0];
  var mon =ps.filter(function(x){return x.kind==='month';}).slice(-1)[0];
  var week=ps.filter(function(x){return x.kind==='week';}).slice(-1)[0];
  var out=[];
  if(!year)out.push({lv:'warn',t:'年間発達マップがまだありません。月案のもとになるものです。'});
  if(year&&mon){
    var ym=(year.data.months||[]).filter(function(x){return x.month===mon.data.period;})[0];
    if(ym){
      var key=(ym.aim||'').replace(/[。、]/g,'').slice(0,4);
      if(key&&mon.data.aim.indexOf(key)<0)
        out.push({lv:'warn',t:mon.data.period+'の月案が、年間発達マップのねらいとつながっていない可能性があります。'});
      else out.push({lv:'ok',t:'年間発達マップと月案のねらいはつながっています。'});
    }
  }
  if(mon&&week&&mon.data.period!==week.data.period)
    out.push({lv:'warn',t:'月案と週案の対象月が違います（'+mon.data.period+' と '+week.data.period+'）。'});
  if(!out.length)out.push({lv:'ok',t:'いまのところ、食い違いは見つかりませんでした。'});
  return out;
}

/* ── EduGrow AI（相談）──────────────────
   自由な文章から、どの生成を呼ぶかを決める。
   分からないときは、分からないと答える（それらしい作り話をしない）。 */
function aiPlanAsk(klass,q){
  var t=String(q||'');
  if(/制作|工作|つくる|作品/.test(t))
    return {kind:'craft', data:aiCraft(klass,{month:(t.match(/(\d+)月/)||[])[0]}), say:'制作物のアイディアを作りました。'};
  if(/年間|年案|一年|見通し/.test(t))
    return {kind:'year', data:aiYearMap(klass), say:'年間発達マップを作りました。'};
  if(/週案|来週|今週/.test(t))
    return {kind:'week', data:aiPlanGen(klass,'week',(t.match(/(\d+)月/)||[])[0]), say:'週案の下書きを作りました。'};
  if(/日案|明日|今日/.test(t))
    return {kind:'day', data:aiPlanGen(klass,'day',(t.match(/(\d+)月/)||[])[0]), say:'日案の下書きを作りました。'};
  if(/月案|今月|来月/.test(t))
    return {kind:'month', data:aiPlanGen(klass,'month',(t.match(/(\d+)月/)||[])[0]), say:'月案の下書きを作りました。'};
  if(/つながり|整合|確認|見直/.test(t))
    return {kind:'check', data:aiConsistency(klass), say:'計画のつながりを確かめました。'};
  if(/雨|室内/.test(t))
    return {kind:'text', data:'雨のときは、室内でリズムあそび・新聞紙あそび・ふれあいあそびに替えます。'
      +'体を動かす時間が減るぶん、午後にもう一度動く時間をとります。', say:''};
  if(/グループ|分け|配置/.test(t)){
    var f=aiFacts(klass);
    return {kind:'text', data:'先生 '+f.staff+'名、在籍 '+f.count+'名なので、'
      +'1グループ '+f.perStaff+'名ほどに分けると目が届きます。'
      +'はさみを使う工程は、使う子だけを1グループにまとめると安全です。', say:''};
  }
  return {kind:'none', say:'', data:'その内容は、いまのAIサポートでは作れません。'
    +'「制作」「年間」「月案」「週案」「日案」「つながりの確認」「雨のとき」「グループ分け」'
    +'のいずれかを含めてお書きください。'};
}

  var c=aiClassOf(k), p=aiProfile(k), f=p.facts, lg=stGet('ai_log',[])||[];
  var ps=aiPlans().filter(function(x){return x.klass===k;});
  return '<div class="card"><h3 style="margin-top:0;">スクールとクラスの設定</h3>'
    +'<div class="field"><label>スクール理念</label>'
    +'<textarea id="mPh" rows="2">'+esc(aiSetup().philosophy)+'</textarea></div>'
    +'<div class="grid" style="grid-template-columns:2fr 1fr;gap:12px;">'
    +'<div class="field"><label>クラス方針（'+esc(k)+'）</label>'
    +'<input id="mPo" value="'+esc(c.policy)+'" placeholder="自分で選び、試す経験を大切にする"></div>'
    +'<div class="field"><label>先生の人数</label>'
    +'<input id="mSt" value="'+esc(c.staff)+'" inputmode="numeric"></div></div>'
    +'<button class="btn btn-primary btn-sm" id="mSave">保存する</button></div>'

    +'<div class="card"><h3 style="margin-top:0;">AIが読み取ったクラス像</h3>'
    +'<div style="font-size:13px;line-height:1.95;white-space:pre-wrap;">'
    +esc((c.profile||p.lines.join('\n')))+'</div>'
    +'<div class="muted" style="margin-top:9px;font-size:11.5px;">'
    +(c.approved?'承認済み（'+esc(c.profileAt||'')+'）':'まだ承認されていません')+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;">'
    +'<button class="btn btn-sm" id="mRe">ヒアリングをやり直す</button>'
    +'<button class="btn btn-sm" id="mUpd">最新の記録で作り直す</button></div></div>'

    +'<div class="card"><h3 style="margin-top:0;">AIが参照した記録</h3>'
    +'<table style="width:100%;font-size:12.5px;"><tbody>'
    +[['在籍している園児',f.count+'名'],
      ['年齢',(f.minAge!=null?f.minAge+'歳〜'+f.maxAge+'歳':'記録が不足')],
      ['生徒個人発達記録',f.hattatsu.n+'件'+(f.hattatsu.last?'（直近 '+f.hattatsu.last+'）':'')],
      ['ヒヤリハット・怪我',f.hiyari.n+'件'],
      ['身体測定',f.shintai.n+'件'],
      ['先生の人数',f.staff+'名']].map(function(r){
      return '<tr><td style="padding:7px 0;color:var(--tx3);width:44%;">'+esc(r[0])+'</td>'
        +'<td style="padding:7px 0;font-weight:700;">'+esc(r[1])+'</td></tr>';}).join('')
    +'</tbody></table>'
    +'<div class="muted" style="margin-top:9px;font-size:11.5px;line-height:1.75;">'
    +'ここに出ているのは、EduGrow に記録されている事実です。'
    +'上の「クラス像」は、これをもとにAIが読み取ったものです。分けて見てください。</div></div>'

    +'<div class="card"><h3 style="margin-top:0;">つくった計画（'+ps.length+'件）</h3>'
    +(ps.length?'<table style="width:100%;font-size:12.5px;"><tbody>'
      +ps.slice().reverse().map(function(x){
        return '<tr><td style="padding:8px 0;">'+esc({year:'年間発達マップ',month:'月案',week:'週案',day:'日案',craft:'制作物'}[x.kind]||x.kind)
          +'　<span class="muted">'+esc(x.title||'')+'</span></td>'
          +'<td style="padding:8px 0;width:88px;"><span class="badge" style="background:'
          +(x.status==='承認済み'?'#EAF3DE;color:#27500A':'#FAEEDA;color:#854F0B')+';">'+esc(x.status)+'</span></td>'
          +'<td style="padding:8px 0;width:96px;text-align:right;">'
          +(x.status==='承認済み'?'':'<button class="btn btn-sm" data-apv="'+esc(x.id)+'">承認する</button>')+'</td></tr>';
      }).join('')+'</tbody></table>'
      :'<div class="muted" style="text-align:center;padding:22px 0;">まだありません</div>')+'</div>'

    +'<div class="card"><h3 style="margin-top:0;">あしあと</h3>'
    +(lg.length?'<table style="width:100%;font-size:12px;"><tbody>'
      +lg.slice(-15).reverse().map(function(x){
        return '<tr><td class="muted" style="padding:6px 0;white-space:nowrap;">'+esc(x.at)+'</td>'
          +'<td style="padding:6px 8px;">'+esc(x.act)+'</td>'
          +'<td class="muted" style="padding:6px 0;">'+esc(x.who)+'</td></tr>';}).join('')
      +'</tbody></table>':'<div class="muted" style="text-align:center;padding:18px 0;">まだありません</div>')
    +'</div>';
}


/* ── 画面の配線 ─────────────────────────── */
function aipWire(k){
  var s=$('section[data-page="aiplan"]');
  var $$=function(sel){return s.querySelector(sel);};

  var ks=$$('#aipK'); if(ks)ks.onchange=function(){AIP.klass=ks.value;AIP.res=null;AIP.hq=0;renderAIPlan();};
  s.querySelectorAll('[data-aitab]').forEach(function(b){b.onclick=function(){
    AIP.tab=b.getAttribute('data-aitab');renderAIPlan();};});
  s.querySelectorAll('[data-aisub]').forEach(function(b){b.onclick=function(){
    AIP.sub=b.getAttribute('data-aisub');AIP.res=null;renderAIPlan();};});

  /* ヒアリング */
  s.querySelectorAll('[data-hq]').forEach(function(b){b.onclick=function(){
    var v=b.getAttribute('data-hq');
    if(v==='skip'){ aiClassSave(k,{approved:true,profile:aiProfile(k).lines.join('\n'),profileAt:aiNow()});
      aiLog('ヒアリングを省略してクラス像を承認',k); AIP.hq=0; renderAIPlan(); return; }
    /* いまの回答を残してから移動する */
    var cur=AIP.hq;
    if(cur>=1&&cur<=AI_HQ.length&&!b.getAttribute('data-skip')){
      var q=AI_HQ[cur-1],sel=[];
      s.querySelectorAll('[data-ho]').forEach(function(c){ if(c.checked)sel.push(q.o[+c.getAttribute('data-ho')]); });
      AIP.hans[q.k]=sel;
      var fr=$$('#hfree'); if(fr)AIP.hans[q.k+'_free']=fr.value.trim();
    }
    AIP.hq=+v;
    if(AIP.hq>AI_HQ.length){
      aiClassSave(k,{hearing:{mood:AIP.hans.mood||[],growth:AIP.hans.growth||[],support:AIP.hans.support||[],
        free:[AIP.hans.mood_free,AIP.hans.growth_free,AIP.hans.support_free].filter(Boolean).join(' / ')}});
      aiLog('ヒアリングに回答',k);
    }
    renderAIPlan();
  };});
  var po=$$('#profOK');
  if(po)po.onclick=function(){
    var t=$$('#profTxt');
    aiClassSave(k,{approved:true,profile:t?t.value:'',profileAt:aiNow()});
    aiLog('クラス像を承認',k); AIP.hq=0; AIP.tab='idea'; renderAIPlan();
    aiToast('クラス像を承認しました。計画づくりに使われます');
  };

  /* 制作物 */
  var cg=$$('#cGo');
  if(cg)cg.onclick=function(){
    var m=$$('#cM').value, mins=+($$('#cMin').value||20);
    var base=aiCraft(k,{month:m,minutes:mins});
    if(!aiCanServer()){
      AIP.res={kind:'craft',data:base}; AI_NET.note='';
      aiLog('制作物アイディアをつくった',k+' '+m); renderAIPlan(); return;
    }
    AI_NET.busy=true; AI_NET.what='制作物アイディア'; AI_NET.note='';
    renderAIPlan();
    aiAskServer('craft',k,m).then(function(got){
      AI_NET.busy=false;
      /* 参加のしかた（はさみの段階と人数）・先生の配置・必要な確認は
         記録から出しているので、AIの文章では上書きしない。 */
      var d=aiMerge(base,got,['name','aim','prep','steps','help','safe','display','letter']);
      /* 材料だけは、人数ぶんの表記をこちらで足す */
      if(got&&got.materials&&got.materials.length){
        d.materials=got.materials.map(function(x){return String(x)+'（'+base.count+'名分）';});
      }
      AIP.res={kind:'craft',data:d,byAI:!!got};
      aiLog('制作物アイディアをつくった'+(got?'（AI）':'（下書き）'),k+' '+m); renderAIPlan();
    });
  };
  var ca=$$('#cAgain'); if(ca)ca.onclick=function(){ if(cg)cg.onclick(); };
  var cs=$$('#cSave');
  if(cs)cs.onclick=function(){
    var d=AIP.res.data;
    aiPlanAdd({kind:'craft',klass:k,title:d.month+'　'+d.name,data:d});
    aiLog('制作物を下書き保存',d.name); renderAIPlan(); aiToast('下書きとして保存しました');
  };
  var cp=$$('#cPrint'); if(cp)cp.onclick=function(){ aipPrint('craft',AIP.res.data,k); };

  /* 年間発達マップ */
  var yg=$$('#yGo');
  if(yg)yg.onclick=function(){ AIP.res={kind:'year',data:aiYearMap(k)};
    aiLog('年間発達マップをつくった',k); renderAIPlan(); };
  var ys=$$('#ySave');
  if(ys)ys.onclick=function(){
    aiPlanAdd({kind:'year',klass:k,title:'4月〜3月',data:AIP.res.data});
    aiLog('年間発達マップを下書き保存',k); renderAIPlan(); aiToast('下書きとして保存しました');
  };
  var yp=$$('#yPrint'); if(yp)yp.onclick=function(){ aipPrint('year',AIP.res.data,k); };

  /* 活動計画 */
  s.querySelectorAll('[data-aikind]').forEach(function(b){b.onclick=function(){
    var kind=b.getAttribute('data-aikind');
    var nm={month:'月案',week:'週案',day:'日案'}[kind];
    /* まず記録から下書きを組み立てる。AIが使えないときは、これがそのまま出る。 */
    var base=aiPlanGen(k,kind);
    if(!aiCanServer()){
      AIP.res={kind:kind,data:base}; AI_NET.note='';
      aiLog(nm+'をつくった',k); renderAIPlan(); return;
    }
    AI_NET.busy=true; AI_NET.what=nm; AI_NET.note='';
    renderAIPlan();
    aiAskServer(kind,k).then(function(got){
      AI_NET.busy=false;
      /* AIが書くのは文章だけ。先生の配置・参加のしかた・個別の配慮は
         記録から出しているので、重ねずにそのまま残す。 */
      var keys=['aim','expect','env','prep','help','safe','review'];
      if(kind==='week')keys=keys.concat(['days','rain']);
      if(kind==='day') keys=keys.concat(['times']);
      AIP.res={kind:kind,data:aiMerge(base,got,keys),byAI:!!got};
      aiLog(nm+'をつくった'+(got?'（AI）':'（下書き）'),k); renderAIPlan();
    });
  };});
  var ps2=$$('#pSave');
  if(ps2)ps2.onclick=function(){
    var d=AIP.res.data;
    aiPlanAdd({kind:AIP.res.kind,klass:k,title:d.period,data:d});
    aiLog('計画を下書き保存',k+' '+d.period); renderAIPlan(); aiToast('下書きとして保存しました');
  };
  var pp=$$('#pPrint'); if(pp)pp.onclick=function(){ aipPrint(AIP.res.kind,AIP.res.data,k); };

  /* 相談 */
  s.querySelectorAll('[data-aipre]').forEach(function(b){b.onclick=function(){
    var q=$$('#aiQ'); if(q){q.value=b.getAttribute('data-aipre');}
  };});
  var snd=$$('#aiSend');
  if(snd)snd.onclick=function(){
    var q=$$('#aiQ'), t=(q&&q.value||'').trim();
    if(!t){aiToast('相談したいことを書いてください');return;}
    var r=aiPlanAsk(k,t);
    var a=(typeof r.data==='string')?r.data:(r.say||'下書きを作りました。');
    AIP.chat.push({at:aiNow(),q:t,a:a,kind:r.kind});
    if(r.kind&&r.kind!=='none'&&r.kind!=='text'&&r.kind!=='check'){
      AIP.res={kind:r.kind,data:r.data};
      AIP.sub=(r.kind==='craft'?'craft':r.kind==='year'?'year':'plan');
    }
    aiLog('AIサポートに相談',t.slice(0,40));
    if(q)q.value=''; renderAIPlan();
  };
  s.querySelectorAll('[data-aiopen]').forEach(function(b){b.onclick=function(){
    var kd=b.getAttribute('data-aiopen');
    AIP.tab='idea'; AIP.sub=(kd==='craft'?'craft':kd==='year'?'year':'plan'); renderAIPlan();
  };});

  /* 記録管理 */
  var ms=$$('#mSave');
  if(ms)ms.onclick=function(){
    aiSetupSave({philosophy:$$('#mPh').value.trim()});
    aiClassSave(k,{policy:$$('#mPo').value.trim(),staff:+($$('#mSt').value||2)});
    aiLog('設定を保存',k); renderAIPlan(); aiToast('保存しました');
  };
  var mr=$$('#mRe'); if(mr)mr.onclick=function(){
    aiClassSave(k,{approved:false}); AIP.hq=1; AIP.tab='idea'; renderAIPlan(); };
  var mu=$$('#mUpd'); if(mu)mu.onclick=function(){
    aiClassSave(k,{profile:aiProfile(k).lines.join('\n'),profileAt:aiNow()});
    aiLog('最新の記録でクラス像を作り直した',k); renderAIPlan(); aiToast('作り直しました'); };
  s.querySelectorAll('[data-apv]').forEach(function(b){b.onclick=function(){
    if(!confirm('この計画を承認します。承認すると正式なものとして扱われます。よろしいですか？'))return;
    var st=(typeof currentStaff==='function')?currentStaff():null;
    aiPlanUpd(b.getAttribute('data-apv'),{status:'承認済み',approvedBy:(st&&st.name)||'—',approvedAt:aiNow()});
    aiLog('計画を承認',b.getAttribute('data-apv')); renderAIPlan(); aiToast('承認しました');
  };});
}

/* ── 印刷 ────────────────────────────────
   日案はA4縦、週案はA4横。名前は出さず、クラス全体の計画として出す。 */
function aipPrint(kind,d,k){
  var land=(kind==='week'||kind==='year');
  var st=(typeof currentStaff==='function')?currentStaff():null;
  var head='<div style="display:flex;align-items:baseline;border-bottom:2px solid #000;padding-bottom:6px;">'
    +'<div style="font-size:16px;font-weight:800;">'+esc(SET.school||'')+'</div>'
    +'<div style="margin-left:14px;font-size:13px;">'+esc(k)+'　'
    +esc({craft:'制作活動案',year:'年間発達マップ',month:'月案',week:'週案',day:'日案'}[kind]||'')+'</div>'
    +'<div style="margin-left:auto;font-size:11px;">'+esc(d.period||d.month||'')+'</div></div>'
    +'<div style="font-size:10px;color:#555;margin-top:4px;">作成 '+esc(aiNow())
    +'　作成者 '+esc((st&&st.name)||'—')+'　確認者 ______　承認者 ______　'
    +'<b>この計画は下書きです。承認欄に記入のうえお使いください。</b></div>';
  var body='';
  if(kind==='craft'){
    body='<h2 style="font-size:15px;margin:12px 0 6px;">'+esc(d.name)+'</h2>'
      +'<p style="font-size:12px;"><b>ねらい</b>　'+esc(d.aim)+'（'+d.minutes+'分・'+d.count+'名）</p>'
      +pr('材料',d.materials)+pr('事前の準備',d.prep)+pr('すすめかた',d.steps)
      +'<div style="font-size:12px;margin-top:8px;"><b>発達に合わせた参加のしかた</b></div>'
      +'<table style="width:100%;font-size:11px;border-collapse:collapse;">'
      +d.joins.map(function(j){
        return '<tr><td style="border:1px solid #999;padding:4px 6px;width:38%;">'+esc(j.level)+'</td>'
          +'<td style="border:1px solid #999;padding:4px 6px;">'+j.n+'名</td></tr>';}).join('')
      +'</table>'
      +pr('先生の配置',d.staffPlan)+pr('保育者の援助',d.help)+pr('安全上の注意',d.safe)
      +'<p style="font-size:12px;"><b>展示・持ち帰り</b>　'+esc(d.display)+'</p>'
      +'<div style="margin-top:14px;border:1px solid #999;padding:8px;min-height:60px;font-size:11px;">ふり返り</div>';
  } else if(kind==='year'){
    body='<table style="width:100%;font-size:9.5px;border-collapse:collapse;margin-top:8px;">'
      +'<tr><th style="border:1px solid #999;padding:3px;">月</th>'
      +'<th style="border:1px solid #999;padding:3px;">発達の見通し</th>'
      +'<th style="border:1px solid #999;padding:3px;">月のねらい</th>'
      +'<th style="border:1px solid #999;padding:3px;">保育者の援助</th>'
      +'<th style="border:1px solid #999;padding:3px;">安全上の配慮</th></tr>'
      +d.months.map(function(m){
        return '<tr><td style="border:1px solid #999;padding:3px;white-space:nowrap;">'+esc(m.month)+'</td>'
          +'<td style="border:1px solid #999;padding:3px;">'+esc(m.outlook)+'</td>'
          +'<td style="border:1px solid #999;padding:3px;">'+esc(m.aim)+'</td>'
          +'<td style="border:1px solid #999;padding:3px;">'+esc(m.help)+'</td>'
          +'<td style="border:1px solid #999;padding:3px;">'+esc(m.safe)+'</td></tr>';}).join('')
      +'</table>';
  } else {
    body='<p style="font-size:12px;"><b>ねらい</b>　'+esc(d.aim)+'</p>'
      +(d.times?'<table style="width:100%;font-size:11px;border-collapse:collapse;">'
        +'<tr><th style="border:1px solid #999;padding:4px;width:52px;">時刻</th>'
        +'<th style="border:1px solid #999;padding:4px;">活動</th>'
        +'<th style="border:1px solid #999;padding:4px;">環境構成・保育者の動き</th></tr>'
        +d.times.map(function(t){
          return '<tr><td style="border:1px solid #999;padding:4px;">'+esc(t.t)+'</td>'
            +'<td style="border:1px solid #999;padding:4px;">'+esc(t.a)+'</td>'
            +'<td style="border:1px solid #999;padding:4px;">'+esc(t.e)+'</td></tr>';}).join('')
        +'</table>':'')
      +(d.days?'<table style="width:100%;font-size:11px;border-collapse:collapse;">'
        +'<tr>'+d.days.map(function(x){return '<th style="border:1px solid #999;padding:4px;">'+esc(x.d)+'</th>';}).join('')+'</tr>'
        +'<tr>'+d.days.map(function(x){return '<td style="border:1px solid #999;padding:6px;vertical-align:top;height:120px;">'+esc(x.main)+'</td>';}).join('')+'</tr>'
        +'</table><p style="font-size:11px;">'+esc(d.rain||'')+'</p>':'')
      +pr('準備物',d.prep)+pr('保育者の援助',d.help)+pr('先生の配置',d.staff)+pr('安全上の注意',d.safe)
      +'<div style="margin-top:12px;border:1px solid #999;padding:8px;min-height:70px;font-size:11px;">ふり返り</div>';
  }
  function pr(t,a){
    if(!a||!a.length)return '';
    return '<div style="font-size:12px;margin-top:7px;"><b>'+esc(t)+'</b>　'+a.map(esc).join('／')+'</div>';
  }
  var w=window.open('','_blank');
  if(!w){alert('印刷用の画面をひらけませんでした。ブラウザの設定をご確認ください。');return;}
  w.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8">'
    +'<title>'+esc(k)+'</title><style>'
    +'@page{size:A4 '+(land?'landscape':'portrait')+';margin:12mm;}'
    +'body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#000;margin:0;}'
    +'p{margin:5px 0;} h2{margin:10px 0 4px;}'
    +'</style></head><body>'+head+body+'</body></html>');
  w.document.close();
  setTimeout(function(){try{w.print();}catch(e){}},350);
  aiLog('印刷した',kind+' '+k);
}

function waImgPick(id){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var MX=600,sc=Math.min(1,MX/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        var ps=waProd();
        ps.forEach(function(x){if(String(x.id)===String(id))x.img=cv.toDataURL('image/jpeg',0.78);});
        try{stSet('wa_products',ps);}catch(e){alert('保存できませんでした。写真の枚数が多い可能性があります。');return;}
        renderWaStore();
      };
      im.onerror=function(){alert('画像を読み込めませんでした。');};
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

function fmtBytes(n){

}
function guidePick(id){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='application/pdf,image/png,image/jpeg';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>4*1024*1024){alert('ファイルが大きすぎます（4MBまで）。\nPDFを軽くしてからお試しください。');return;}
    var rd=new FileReader();
    rd.onload=function(){
      var d=String(rd.result||'');
      if(!/^data:(application\/pdf|image\/(png|jpe?g));base64,/i.test(d)){
        alert('PDF・PNG・JPEG のみ登録できます。');return;}
      var all=guideFiles();
      all[id]={data:d,name:f.name,type:f.type,at:todayISO(),size:f.size};
      try{stSet('guide_files',all);}
      catch(e){alert('保存できませんでした。ブラウザの保存容量がいっぱいです。\n不要な資料を削除してからお試しください。');return;}
      renderGuide();
    };
    rd.onerror=function(){alert('ファイルを読み込めませんでした。');};
    rd.readAsDataURL(f);
  };
  inp.click();
}

/* ---------- dashboard ---------- */
var dashPeriod='all',dashFY=null,dashMonth=null;
function fyOf(s){var p=s.split('-');var y=+p[0],mm=+p[1];return mm>=4?y:y-1;}
function curFY(){return fyOf(todayISO());}
function leadInPeriod(c){
  if(dashPeriod==='all')return true;
  var dt=c.receivedDate;if(!dt)return false;
  if(dashPeriod==='month')return dt.slice(0,7)===dashMonth;
  return fyOf(dt)===dashFY;
}
function renderDash(){
  if(typeof spSeed==='function')spSeed();
  var cs=DB.contacts,hist=DB.history,en=enrolled();
  var thanksDue=cs.filter(function(c){return c.kind==='lead'&&c.date===todayISO();});
  var remindDue=cs.filter(function(c){return c.kind==='lead'&&c.date===iso(addDays(1));});
  if(dashFY==null)dashFY=curFY();
  if(dashMonth==null)dashMonth=todayISO().slice(0,7);
  var leads=cs.filter(function(c){return c.kind==='lead';});
  var pleads=leads.filter(leadInPeriod);
  var byStatus={};LEAD_STATUSES.forEach(function(s){byStatus[s]=pleads.filter(function(c){return c.status===s;}).length;});
  var maxF=Math.max(1,Math.max.apply(null,Object.keys(byStatus).map(function(k){return byStatus[k];})));
  var fyList=[curFY()-2,curFY()-1,curFY()];
  var perLabel=dashPeriod==='all'?'累計（全期間）':dashPeriod==='fy'?(dashFY+'年度（'+dashFY+'/4〜'+(dashFY+1)+'/3）'):(dashMonth.split('-')[0]+'年'+(+dashMonth.split('-')[1])+'月');
  var perPicker=dashPeriod==='fy'?('<select id="perFY" style="width:130px;">'+fyList.map(function(f){return '<option value="'+esc(f)+'"'+(f===dashFY?' selected':'')+'>'+f+'年度</option>';}).join('')+'</select>'):dashPeriod==='month'?('<input type="month" id="perMonth" value="'+esc(dashMonth)+'" style="width:160px;">'):'';
  var perToggle=[['all','全期間'],['fy','年度'],['month','月']].map(function(p){return '<span class="chip'+(p[0]===dashPeriod?' on':'')+'" data-per="'+esc(p[0])+'">'+p[1]+'</span>';}).join('');
  // ---- 今月の指標 ----
  var mkNow=todayISO().slice(0,7),fyNow=curFY();
  function inMonth(d){return d&&d.slice(0,7)===mkNow;}
  function inFYd(d){if(!d)return false;var y=+d.slice(0,4),m=+d.slice(5,7);return ((m>=4)?y:y-1)===fyNow;}
  function inqBucket(sc){sc=sc||'';if(/フォーム|HP/.test(sc))return 'HP';if(sc==='LINE')return 'LINE';if(sc==='電話')return '電話';return 'その他';}
  var inqMonth=leads.filter(function(c){return inMonth(c.receivedDate);});
  var iqM={HP:0,LINE:0,'電話':0,'その他':0};inqMonth.forEach(function(c){iqM[inqBucket(c.source)]++;});
  var trialMonth=leads.filter(function(c){return inMonth(c.date);});
  var trFace=trialMonth.filter(function(c){return c.format!=='オンライン';}).length,trOnline=trialMonth.filter(function(c){return c.format==='オンライン';}).length;
  var joinMonth=cs.filter(function(c){return c.kind==='enrolled'&&inMonth(c.admissionDate);}).length;
  var leaveMonth=cs.filter(function(c){return c.kind==='withdrawn'&&inMonth(c.withdrawDate);}).length;
  var enClass={};CLASSES.forEach(function(k){enClass[k]=en.filter(function(c){return c.klass===k;});});
  function genderOf(c){var p=(typeof spStore==='function')?spStore()[c.id]:null;return (p&&p.sex)||'';}
  function classGender(k){var b=0,g=0,u=0;enClass[k].forEach(function(c){var s=genderOf(c);if(s==='男の子')b++;else if(s==='女の子')g++;else u++;});return {b:b,g:g,u:u};}
  var iqFY={};LEAD_SOURCES.forEach(function(sc){iqFY[sc]=leads.filter(function(c){return c.source===sc&&inFYd(c.receivedDate);}).length;});
  var iqFYtot=leads.filter(function(c){return inFYd(c.receivedDate);}).length;
  var maxFY=Math.max(1,Math.max.apply(null,LEAD_SOURCES.map(function(sc){return iqFY[sc];})));
  var activeLeads=leads.filter(function(c){return ['長期見込み','連絡不通','入園 確定','NG'].indexOf(c.status)<0;}).sort(function(a,b){var x=a.nextAction||'9999-99-99',y=b.nextAction||'9999-99-99';return x<y?-1:x>y?1:0;});
  // ---- 上部カード ----

function routeTo(p){
  if(p[0]==='compose'){composePreset=p[1]||null;composeSelectId=p[2]?+p[2]:null;go('compose');}
  else if(p[0]==='broadcast'){broadcastPreset=p[1]||null;go('broadcast');}
  else if((p[0]==='records'||p[0]==='carerec')&&p[1]){recType=p[1];go(recPageOf(p[1]));}
  else go(p[0]);
}
