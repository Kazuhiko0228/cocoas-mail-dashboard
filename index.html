/* ══ 園児名簿の一括取り込み ═══════════════════
   導入の初日に、60〜90名を1人ずつ手で入れるのは現実的でないため、
   ExcelやGoogleスプレッドシートから貼り付けられるようにする。

   実在の園児の名簿を扱うので、次の3つを守る。
   ・いきなり登録せず、必ず「これから入る内容」を見せてから確認をもらう
   ・すでにいる園児は上書きしない（飛ばして、理由を出す）
   ・おかしい行は、何行目がどう おかしいかを出す

   この端末の中にだけ保存される。サーバにつないでいる場合は、
   ふだんの保存と同じ流れでサーバへ送られる。 */

var ROSTER_COLS=[
  {k:'name',   l:'保護者名',   need:true,  alt:['保護者','保護者氏名','氏名','親']},
  {k:'child',  l:'お子様名',   need:true,  alt:['園児名','児童名','お子さま','子ども']},
  {k:'klass',  l:'クラス',     need:false, alt:['組']},
  {k:'dob',    l:'生年月日',   need:false, alt:['誕生日','生年月日(西暦)']},
  {k:'email',  l:'メールアドレス', need:true, alt:['メール','Email','E-mail','mail']},
  {k:'phone',  l:'電話番号',   need:false, alt:['電話','TEL','tel','携帯']},
  {k:'days',   l:'通園曜日',   need:false, alt:['曜日','登園曜日']}
];

function rosterSplit(line){
  /* タブ区切り（Excelからの貼り付け）と、カンマ区切りの両方を受ける。
     「"あ,い",う」のように引用符でくくられていても壊さない。 */
  if(line.indexOf('\t')>-1)return line.split('\t').map(function(x){return x.trim();});
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===','&&!q){ out.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  out.push(cur.trim());
  return out;
}

/** 1行目が見出しなら、その並びに合わせる。無ければ決まった並びとみなす。 */
function rosterHeader(cells){
  var map={}, hit=0;
  cells.forEach(function(c,i){
    var t=String(c).replace(/\s/g,'');
    ROSTER_COLS.forEach(function(col){
      if(map[col.k]!=null)return;
      if(t===col.l.replace(/\s/g,'')||col.alt.indexOf(t)>-1){ map[col.k]=i; hit++; }
    });
  });
  return hit>=2 ? map : null;
}

function rosterNormDate(v){
  var t=String(v||'').trim();
  if(!t)return '';
  /* Excel や Google スプレッドシートは 2022/6/18 の形で出すことが多い。
     半角スラッシュを入れ忘れると、ほとんどの行が弾かれてしまう。 */
  t=t.replace(/[\/／．.]/g,'-').replace(/年|月/g,'-').replace(/日/g,'')
     .replace(/-+$/,'').replace(/-+/g,'-');
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if(!m)return null;                       /* 読めない書き方 */
  var y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function rosterNormDays(v){
  var t=String(v||'').replace(/[\s,、]/g,'');
  if(!t)return '';
  var out=WEEK5.filter(function(d){return t.indexOf(d)>-1;});
  if(!out.length&&/毎日|全部|週5/.test(t))return WEEK5.join('・');
  return out.join('・');
}

/** 貼り付けた文字列を読んで、入れるもの・飛ばすものに分ける。 */
function rosterParse(text){
  var lines=String(text||'').split(/\r?\n/).filter(function(l){return l.trim();});
  if(!lines.length)return {ok:[],ng:[],dup:[]};

  var first=rosterSplit(lines[0]);
  var map=rosterHeader(first);
  var body=map?lines.slice(1):lines;
  if(!map){ map={}; ROSTER_COLS.forEach(function(c,i){map[c.k]=i;}); }

  var ok=[],ng=[],dup=[];
  var have={}, haveName={};
  DB.contacts.forEach(function(c){
    if(c.email)have[String(c.email).toLowerCase()]=c;
    haveName[(String(c.name||'')+'|'+String(c.child||'')).replace(/\s/g,'')]=c;
  });
  var seen={};

  body.forEach(function(ln,i){
    var no=(map?i+2:i+1);
    var cell=rosterSplit(ln);
    var get=function(k){ var idx=map[k]; return (idx==null||cell[idx]==null)?'':String(cell[idx]).trim(); };
    var row={name:get('name'),child:get('child'),klass:get('klass'),
             dob:get('dob'),email:get('email'),phone:get('phone'),days:get('days')};

    if(!row.name&&!row.child&&!row.email)return;          /* 空行 */

    var bad=[];
    if(!row.name) bad.push('保護者名がありません');
    if(!row.child)bad.push('お子様名がありません');
    if(!row.email)bad.push('メールアドレスがありません（保護者アカウントの発行に必要です）');
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(row.email))bad.push('メールアドレスの形が違います');

    if(row.dob){
      var d=rosterNormDate(row.dob);
      if(d===null)bad.push('生年月日を読み取れません（2022-06-18 の形でお願いします）');
      else row.dob=d;
    }
    if(row.klass&&CLASSES.indexOf(row.klass)<0)
      bad.push('「'+row.klass+'」というクラスがありません（'+CLASSES.join('・')+'）');
    if(row.days)row.days=rosterNormDays(row.days);

    if(bad.length){ ng.push({no:no,row:row,why:bad.join(' ／ ')}); return; }

    var key=row.email.toLowerCase();
    var nk=(row.name+'|'+row.child).replace(/\s/g,'');
    if(have[key]){ dup.push({no:no,row:row,why:'このメールアドレスは、すでに登録されています'}); return; }
    if(haveName[nk]){ dup.push({no:no,row:row,why:'同じ保護者・お子様の組み合わせが、すでに登録されています'}); return; }
    if(seen[key]||seen[nk]){ dup.push({no:no,row:row,why:'貼り付けた中で重複しています'}); return; }
    seen[key]=1; seen[nk]=1;
    ok.push({no:no,row:row});
  });
  return {ok:ok,ng:ng,dup:dup,hadHeader:!!map};
}

/* shared sequential sender */
function sendSeq(list,tplLabel,subjectTpl,bodyTpl,ctx,btn,log,bar,perPerson){
  if(!list.length){log.innerHTML='<div class="li" style="color:#A32D2D;">送信先が選択されていません。</div>';return;}
  btn.disabled=true;log.innerHTML='';bar.style.width='0%';
  var i=0,now=new Date(),stamp=pad(now.getHours())+':'+pad(now.getMinutes());
  function step(){
    if(i>=list.length){
      btn.disabled=false;
      var done=el('div',{class:'li'},ic('check')+'<span style="color:#0B5F8F;font-weight:600;">'+list.length+'件の送信が完了しました（BCC: '+SET.bcc+'）</span>');done.querySelector('svg').style.cssText='width:16px;height:16px;color:#0C84B4;';log.appendChild(done);
      var h=DB.history;list.forEach(function(c){h.push({date:todayISO(),time:todayISO().slice(5).replace('-','/')+' '+stamp,tpl:tplLabel,to:c.name+' 様',email:c.email,from:SET.sender,subject:perPerson?fillTokens(subjectTpl,c,ctx):subjectTpl,body:perPerson?fillTokens(bodyTpl,c,ctx):bodyTpl});});DB.history=h;
      return;
    }
    var c=list[i];
    var row=el('div',{class:'li'},spinSvg()+'送信中：'+c.name+' 様 ('+c.email+')');log.appendChild(row);
    setTimeout(function(){row.innerHTML=ic('check')+'<span>'+c.name+' 様 へ送信完了</span>';row.querySelector('svg').style.cssText='width:15px;height:15px;color:#0C84B4;';i++;bar.style.width=Math.round(i/list.length*100)+'%';setTimeout(step,240);},560);
  }
  step();
}

/* ---------- deliveries (annual calendar) ---------- */
/* ===== 予定をカレンダー用ファイル（.ics）で書き出し =====
   Googleカレンダーとの直接連携（自動同期）はGoogle側のOAuth設定が必要なため次フェーズ。
   現時点でも、ここから書き出したファイルをGoogleカレンダーに取り込めば予定を反映できる。 */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsDate(d){return String(d||'').replace(/-/g,'');}
function calEvents(){
  var ev=[],cs=DB.contacts;
  cs.filter(function(c){return c.kind==='lead'&&c.date;}).forEach(function(c){
    ev.push({date:c.date,time:c.trialTime||'10:00',mins:60,title:'体験 '+(c.child||c.name),desc:[c.name+' 様',c.wishKlass?c.wishKlass+'希望':'',c.trialBy?'担当 '+c.trialBy:'',c.trialTime?'時間 '+c.trialTime:''].filter(Boolean).join('\n')});
  });
  cs.filter(function(c){return c.kind==='lead'&&c.briefingDate;}).forEach(function(c){
    ev.push({date:c.briefingDate,time:c.briefingTime||'10:00',mins:60,title:'入園説明会 '+(c.child||c.name),desc:c.name+' 様'});
  });
  cs.filter(function(c){return c.kind==='lead'&&c.nextAction;}).forEach(function(c){
    ev.push({date:c.nextAction,title:'フォロー '+(c.child||c.name)+(c.nextMethod?'（'+c.nextMethod+'）':''),desc:[c.name+' 様',c.status||''].filter(Boolean).join('\n')});
  });
  try{
    var D=drillData();(D.rows||[]).forEach(function(r){
      var d=(r.record&&r.record.date)||(r.plan&&r.plan.planDate);
      if(d)ev.push({date:d,time:(r.plan&&/^\d{1,2}:\d{2}$/.test(r.plan.scenTime||'')?r.plan.scenTime:''),mins:60,title:'避難訓練（'+r.kind+'）',desc:[r.plan&&r.plan.scenTime?'想定時刻 '+r.plan.scenTime:'',r.plan&&r.plan.place?'避難場所 '+r.plan.place:''].filter(Boolean).join('\n')});
    });
  }catch(e){}
  try{
    var mk=(typeof invMonthCur==='function')?invMonthCur():todayISO().slice(0,7),all=invAll()[mk]||{};
    Object.keys(all).forEach(function(id){var r=all[id];if(r.due){var c=DB.contacts.filter(function(x){return String(x.id)===String(id);})[0];ev.push({date:r.due,title:'請求 お支払期日 '+(c?childName(c):''),desc:'請求額 '+yen(invTotal(r))});}});
  }catch(e){}
  DELIVERIES.forEach(function(d){var t=nextDelivery(d);if(t){var hm=(d.when||'').match(/(\d{1,2}):(\d{2})/);ev.push({date:iso(t),time:hm?hm[0]:'',mins:30,title:'配信：'+d.label,desc:d.when+' ／ '+d.to});}});
  /* 予約済みの配信は、予約した日時そのままで登録する */
  try{stGet('scheduled',[]).forEach(function(q){var p=String(q.when||'').split('T');if(!p[0])return;
    ev.push({date:p[0],time:p[1]||'',mins:30,title:'配信予約：'+(q.label||q.kind||''),desc:schNames(q).join('\n')||(q.to||'')});});}catch(e){}
  return ev.filter(function(e){return /^\d{4}-\d{2}-\d{2}$/.test(e.date);}).sort(function(a,b){return (a.date+(a.time||''))<(b.date+(b.time||''))?-1:1;});
}
/* 日本時間の「日付＋時刻」を、カレンダー用のUTC表記にする */
function icsUTC(date,time,addMins){
  var hm=String(time||'').match(/(\d{1,2}):(\d{2})/);if(!hm)return icsDate(date)+'T000000Z';
  var dt=Date.UTC(+date.slice(0,4),+date.slice(5,7)-1,+date.slice(8,10),+hm[1],+hm[2])-9*3600000+(addMins||0)*60000;
  var u=new Date(dt);
  return u.getUTCFullYear()+pad(u.getUTCMonth()+1)+pad(u.getUTCDate())+'T'+pad(u.getUTCHours())+pad(u.getUTCMinutes())+'00Z';
}
function icsExport(){
  var ev=calEvents();
  if(!ev.length){alert('書き出せる予定がありません。');return 0;}
  var stamp=todayISO().replace(/-/g,'')+'T000000Z';
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EduGrow//園務管理システム//JA','CALSCALE:GREGORIAN'];
  ev.forEach(function(e,i){
    var d=icsDate(e.date),st,en;
    if(/^\d{1,2}:\d{2}/.test(e.time||'')){
      /* 日本時間をUTCに直して書き出す。Googleカレンダーに「時間つき」で入る */
      st='DTSTART:'+icsUTC(e.date,e.time,0);
      en='DTEND:'+icsUTC(e.date,e.time,e.mins||60);
    }else{
      var nx=new Date(+e.date.slice(0,4),+e.date.slice(5,7)-1,+e.date.slice(8,10)+1);
      st='DTSTART;VALUE=DATE:'+d;
      en='DTEND;VALUE=DATE:'+(nx.getFullYear()+pad(nx.getMonth()+1)+pad(nx.getDate()));
    }
    lines.push('BEGIN:VEVENT','UID:cocoas-'+d+'-'+i+'@cocoas','DTSTAMP:'+stamp,st,en,

function schNames(q){
  if(q.names&&q.names.length)return q.names;
  var t=String(q.to||'');
  if(!t||/^\d+名/.test(t))return [];
  return t.split('・').filter(Boolean).map(function(n){return /様$/.test(n)?n:n+' 様';});
}

/* 勤続年数・年齢の自動算出 */
function yearsBetween(from,to){
  if(!from)return null;
  var a=new Date(from),b=to?new Date(to):new Date();
  var y=b.getFullYear()-a.getFullYear(),mo=b.getMonth()-a.getMonth();
  if(mo<0||(mo===0&&b.getDate()<a.getDate())){y--;mo+=12;}
  if(b.getDate()<a.getDate())mo--;
  if(mo<0)mo+=12;
  return {y:Math.max(0,y),m:Math.max(0,mo)};
}
function tenureText(joinDate,leaveDate){
  var r=yearsBetween(joinDate,leaveDate);
  if(!r)return '—';
  return r.y+'年'+r.m+'ヶ月';
}
function ageOf(dob){var r=yearsBetween(dob);return r?r.y+'歳':'';}

var recType='登園（出席）',recDate=null,recMonth=null,recQuarter=null,bmKlass='すべて';
function curQuarter(){var m=addDays(0).getMonth()+1;return addDays(0).getFullYear()+'-Q'+Math.ceil(m/3);}
function napSlots(){var a=[],t;for(t=11*60+30;t<=13*60+30;t+=10)a.push(pad(Math.floor(t/60))+':'+pad(t%60));return a;}
function ageClassOf(c){
  if(!c||!c.dob)return (c&&c.klass)||'';
  var p=c.dob.split('-'),by=+p[0],bm=+p[1],bd=+p[2];
  var now=addDays(0),fy=(now.getMonth()+1)>=4?now.getFullYear():now.getFullYear()-1;
  var age=fy-by;if(bm>4||(bm===4&&bd>1))age--;
  if(age<0)age=0;if(age>5)age=5;
  return age+'歳児';
}
function childName(c){return c.child.replace(/ちゃん|くん/g,'');}
/* 同名の園児がいるため、一覧や印刷では「姓＋名」のフルネームで出す。
   生徒台帳（studentProfiles）の姓名を優先し、無い場合は保護者名の姓＋お子様名で組み立てる。 */
function childFullName(c){
  if(!c)return '';
  var p={};
  try{p=(typeof spStore==='function'?spStore():{})[c.id]||{};}catch(e){p={};}
  var ln=String(p.lastName||'').trim(),fn=String(p.firstName||'').trim();
  if(!ln){var nm=String(c.name||'').replace(/　/g,' ').trim().split(/\s+/);ln=nm[0]||'';}
  if(!fn)fn=c.child?childName(c):'';
  var full=((ln?ln+' ':'')+fn).trim();
  return full||(c.child?childName(c):(c.name||''));
}
/* 歳児ごとの色。登園シート・名簿シートなどで使い回すためグローバルに置く。
   0・1・2歳児は淡い色、3・4・5歳児は蛍光色。印刷しても文字が読める濃さにしている。 */
var AGE_COLORS={
  '0歳児':{bg:'#FCE4EF',fg:'#8A1D52',bd:'#F2AECC'},
  '1歳児':{bg:'#FDE7CE',fg:'#8A4A06',bd:'#F4C68C'},
  '2歳児':{bg:'#E3F3D9',fg:'#2F5D14',bd:'#B7DDA1'},

  '5歳児':{bg:'#48D13A',fg:'#10380C',bd:'#2FA824'}
};
function ageColor(label){
  var c=AGE_COLORS[String(label==null?'':label).trim()];
  return c?{bg:c.bg,fg:c.fg,bd:c.bd}:{bg:'#F1EFE8',fg:'#5A5750',bd:'#DAD6CC'};
}
/* ランチ・ロングステイは通園曜日の設定から自動で決まるので、登園シートでは切替不可。
   どのオプションを自動にするかは SET.attendAutoMap（設定→登園記録のオプションで変更可）で
   明示的に決める。表に無い名前は、下の既定名と「完全一致」したときだけ自動として扱う。
   以前は部分一致で判定していたため「ハロウィンランチ会」「ロングコート預かり」「belong」まで
   自動扱いになり、先生が記録した値を消してしまっていた。部分一致は使わない。
   名前は NFKC で正規化するので、全角英数（Ｌｏｎｇ Ｓｔａｙ）や半角カナ（ﾗﾝﾁ）でも同じ名前とみなす。
   戻り値は通園曜日データ（dayOptsOf）のキー名。判定と参照先をこの1か所にまとめて、
   登園シート側（rowOf・表示・列見出し）はすべてこの関数を通す。 */
function nrmAttendOpt(s){
  s=String(s==null?'':s);
  if(s.normalize)s=s.normalize('NFKC');
  return s.replace(/[\s　]+/g,'').toLowerCase();
}
/* 対応表に無いときの既定名。すべて正規化後の完全一致で見る */
var ATTEND_AUTO_ALIAS={'ランチ':'lunch','lunch':'lunch','ロングステイ':'long','ロングスティ':'long','ロング':'long','longstay':'long','long':'long'};
function autoAttendKey(op){
  var n=nrmAttendOpt(op);
  if(!n)return '';
  var m=(typeof SET!=='undefined'&&SET.attendAutoMap)||{},k;
  for(k in m){if(Object.prototype.hasOwnProperty.call(m,k)&&nrmAttendOpt(k)===n){var v=nrmAttendOpt(m[k]);return (v==='lunch'||v==='long')?v:'';}}
  return Object.prototype.hasOwnProperty.call(ATTEND_AUTO_ALIAS,n)?ATTEND_AUTO_ALIAS[n]:'';
}
function isAutoAttendOpt(op){return !!autoAttendKey(op);}

function renderCareRec(){renderRecGroup('carerec',REC_CARE,'月ごと・都度・3ヶ月ごとに記録する項目です。');}
/* ========== 紙の記録のスキャン保存 ==========
   現場で紙に書いた記録を撮影／スキャンして、その記録・日付に紐づけて保管する。
   対象：毎日使い、紙のほうが早い記録（登園・安全点検・午睡・健康・業務日報・ヒヤリハット）
   データ: recScans = { 'rec_キー|日付': [{img, at, by, note, ocr}] } */
var SCAN_TARGETS={'登園（出席）':'rec_登園シート','安全点検':'rec_安全点検','午睡チェック':'rec_午睡チェック','健康チェック':'rec_健康チェック','業務日報・保育日誌':'rec_日報'};
/* ヒヤリハット・怪我は落ち着いてから書く記録で文字量が多く、読み取りに失敗しやすいので取り込みの対象外。
   ただし紙で書きたい現場もあるため、記入用紙の印刷だけは残す */
var BLANK_ONLY_TARGETS={'ヒヤリハット・怪我':1};
function scanKey(type,date){return (SCAN_TARGETS[type]||type)+'|'+date;}
function scansAll(){return stGet('recScans',{});}
function scansOf(type,date){return scansAll()[scanKey(type,date)]||[];}
function scansSet(type,date,list){var a=scansAll(),k=scanKey(type,date);if(list&&list.length)a[k]=list;else delete a[k];stSet('recScans',a);}
/* 安全点検は毎日印刷すると紙がかさばるため、月間表を1枚印刷して1ヶ月分まとめて取り込む。
   取り込み先の月は、画面の日付ピッカー（安全点検の日付）で選んでいる日の月にする。
   月が終わってから前月分をまとめて取り込むときは、日付をその月に戻すだけでよい。
   身体測定の月（recMonth）とは切り離してあるので、身体測定の月を変えても取り込み先は変わらない。
   日付単位で保存済みの古い取り込みは消さない（設定の「以前に取り込んだ紙の一覧」から確認・削除できる） */
function weekMonISO(d){
  var p=String(d==null?'':d).split('-'),b=null;
  if(p.length>=3)b=new Date(+p[0],+p[1]-1,+p[2]);
  if(!b||isNaN(b.getTime()))b=new Date();
  var w=b.getDay(),off=(w===0?-6:1-w);
  return iso(new Date(b.getFullYear(),b.getMonth(),b.getDate()+off));
}
function scanDateOf(type){
  if(type==='身体測定')return recMonth;
  if(type==='生徒個人発達記録')return recQuarter;
  if(type==='安全点検')return String(recDate||todayISO()).slice(0,7);
  /* 業務日報・保育日誌の紙は1週間まとめの様式。週1枚の紙が曜日ごとに散らばらないよう、その週の月曜日をキーにする */
  if(type==='業務日報・保育日誌')return weekMonISO(recDate||todayISO());
  return recDate;
}
/* 画面に出す日付の見出し（月キーは「2026年7月」、週キーは「7月27日の週」と読みやすく） */
function scanDateLabel(d,type){
  if(/^\d{4}-\d{2}$/.test(d||''))return (+d.slice(0,4))+'年'+(+d.slice(5,7))+'月';
  if(type==='業務日報・保育日誌'&&/^\d{4}-\d{2}-\d{2}$/.test(d||''))return (+d.slice(5,7))+'月'+(+d.slice(8,10))+'日の週（月〜金）';
  return d||'';
}
/* 画像を保存用に縮小（紙の文字が読める程度に長辺1400px） */
function scanResize(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MX=1400,sc=Math.min(1,MX/Math.max(img.width,img.height));
      var w=Math.round(img.width*sc),hh=Math.round(img.height*sc);
      var cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      cb(null,cv.toDataURL('image/jpeg',0.75));
    };
    img.onerror=function(){cb(new Error('画像を読み込めませんでした'));};
    img.src=rd.result;
  };
  rd.onerror=function(){cb(new Error('ファイルを読み込めませんでした'));};
  rd.readAsDataURL(file);
}
/* 文字の自動読み取り（OCR）。接続先が未設定のときは案内のみ */
function ocrExtract(dataUri,cb){
  var ep=(SET.ocrEndpoint||'').trim();
  if(!ep){cb(new Error('未設定'));return;}
  try{
    fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUri})})
      .then(function(r){return r.json();})
      .then(function(j){cb(null,(j&&(j.text||j.result))||'');})
      .catch(function(e){cb(e);});
  }catch(e){cb(e);}
}

function qrDataUri(text,cb){
  if(typeof QRCode==='undefined'){cb(null);return;}
  try{
    var box=document.createElement('div');box.style.cssText='position:absolute;left:-9999px;top:0;';
    document.body.appendChild(box);
    new QRCode(box,{text:text,width:120,height:120,correctLevel:QRCode.CorrectLevel.M});
    setTimeout(function(){
      var img=box.querySelector('img'),cv=box.querySelector('canvas');
      var uri=img?img.src:(cv?cv.toDataURL('image/png'):null);
      box.remove();cb(uri);
    },120);
  }catch(e){cb(null);}
}

   画像は1枚あたり数百KBあるので、中身を確認したうえで不要なものだけ削除できる（自動では消さない） */
function scanTypeOfStoreKey(k){
  var pre=String(k).split('|')[0],t;
  for(t in RKEY){if(RKEY[t]===pre)return t;}
  return pre;
}
function scanArchiveList(){
  var all=scansAll(),out=[],k;
  for(k in all){
    if(!all[k]||!all[k].length)continue;
    out.push({key:k,type:scanTypeOfStoreKey(k),date:String(k).split('|')[1]||'',n:all[k].length});
  }
  out.sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
  return out;
}
function scanArchiveSet(key,list){
  var a=scansAll();
  if(list&&list.length)a[key]=list;else delete a[key];
  stSet('recScans',a);
}

/* forPrint=true は印刷用。用紙に画面用の操作案内が出ないよう、人数と内訳だけを返す */
function drillExpectHtml(p,forPrint){
  var cls=(p.classes&&p.classes.length)?p.classes:CLASSES.slice();
  if(!p.planDate)return forPrint?'':'<span class="muted">実施予定日を入力すると、その日の出席から自動で反映されます。</span>';
  var sh=stGet('rec_登園シート',{})[p.planDate];
  var kids=enrolled().filter(function(c){return cls.indexOf(c.klass)>-1;});
  if(!sh||!sh.rows){
    var wd=WD[new Date(+p.planDate.slice(0,4),+p.planDate.slice(5,7)-1,+p.planDate.slice(8,10)).getDay()];
    var plan=kids.filter(function(c){return !c.days||c.days.indexOf(wd)>-1;});
    var base='<b>'+plan.length+'名</b>（通園予定ベース：'+cls.join('・')+'）';
    return forPrint?base:base+'<span class="muted" style="margin-left:6px;">当日の登園シート記録後、出席実績に自動更新されます</span>';
  }
  var att=kids.filter(function(c){var r=sh.rows[c.id];return r&&['●','早','遅'].indexOf(r.att)>-1;});
  var byCls=cls.map(function(k){return k+' '+att.filter(function(c){return c.klass===k;}).length+'名';}).join('・');
  var base2='<b>'+att.length+'名</b>（'+byCls+'）';
  return forPrint?base2:base2+'<span class="muted" style="margin-left:6px;">'+fmt(p.planDate)+' の出席実績から自動反映</span>';
}

var shiftMonth=null;
var shiftTab='plan';
/* ===== 出勤簿（タイムカード）：このシステム内で実績を記録 =====
   データ: timecards = { 'YYYY-MM': { staffId: { day: {in:'8:45',out:'17:45',brk:60,note:''} } } } */
function tcAll(){return stGet('timecards',{});}
function tcMonth(mk){return tcAll()[mk]||{};}
/* 時刻は必ず「08:00」の2桁時に整える。ブラウザの時刻入力欄は「8:00」のような
   1桁時を無効な値として捨ててしまい、出勤時間だけ空欄に見えてしまうため */
function tcTime(t){
  if(t==null)return '';
  var s=String(t).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/：/g,':').replace(/\s/g,'');
  /* 勤務表に「9-17」のように時だけで書かれることがあるので「9:00」として読む */
  if(/^\d{1,2}$/.test(s))s=s+':00';
  var m=s.match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
  if(!m)return '';
  var hh=+m[1],mi=+m[2];
  if(hh>23||mi>59)return '';
  return pad(hh)+':'+pad(mi);
}
function tcGet(mk,sid,day){
  var v=((tcMonth(mk)[sid]||{})[day])||{in:'',out:'',brk:60,note:''};
  /* 以前に1桁時で保存されたデータも表示のたびに整える。
     どうしても読み取れない値は、記録が消えてしまわないようそのまま残す */
  var ti=tcTime(v.in);if(ti)v.in=ti;
  var to=tcTime(v.out);if(to)v.out=to;
  return v;
}
/* 所定労働時間（分）を超えた分を時間外として算出 */
function tcStdMin(){return (+SET.stdWorkMin||480);}
function tcOverMin(v){var m=tcMinutes(v);return Math.max(0,m-tcStdMin());}
function tcHM(min){var hh=Math.floor(min/60),mm=min%60;return hh+':'+String(mm).padStart(2,'0');}
function tcSet(mk,sid,day,v){var a=tcAll();a[mk]=a[mk]||{};a[mk][sid]=a[mk][sid]||{};
  /* 「08:00」の形に整えて保存する。読み取れない値は書き換えず元のまま残す
     （ここで空にしてしまうと、下の判定でその日の記録ごと消えてしまうため） */
  if(v){var ti=tcTime(v.in);if(ti)v.in=ti;var to=tcTime(v.out);if(to)v.out=to;}
  if(v&&(v.in||v.out||v.note))a[mk][sid][day]=v;else delete a[mk][sid][day];
  stSet('timecards',a);}
function tcMinutes(v){
  if(!v)return 0;
  /* 出勤・退勤欄に表示するのと同じ読み方をする。読み取れない値は0分として扱い、
     「出退勤は空欄なのに勤務時間だけ出る」という食い違いを起こさない
     （記録そのものは消さず、そのまま保存されたままです） */
  var i=tcTime(v.in),o=tcTime(v.out);
  if(!i||!o)return 0;
  function mins(t){var p=String(t).split(':');return (+p[0]||0)*60+(+p[1]||0);}
  var d=mins(o)-mins(i);if(d<0)d+=24*60;
  d-=(+v.brk||0);return Math.max(0,d);
}
function tcHours(min){return (min/60).toFixed(1);}

function shiftImportModal(m,save,rerender){
  var mo=shiftMonth,mm=el('div',{class:'modal-bg'});
  mm.innerHTML='<div class="modal" style="width:580px;"><h2>シフトCSV取込（Freee等）</h2>'+
    '<div class="muted" style="margin-bottom:10px;">1行＝「氏名, 日付, シフト」。日付は「'+mo+'-05」または「5」。シフトは 早／日／遅／休（早番・日勤・遅番・公休 も可）。<br>FreeeなどからエクスポートしたCSVを貼り付けてください。列順が違う場合は並べ替えてから貼り付けます。職員名は連絡先の職員名と照合します。</div>'+
    '<textarea id="csvIn" rows="8" placeholder="白神 美咲, '+mo+'-01, 早番\n田村 さやか, '+mo+'-01, 日勤\n白神 美咲, 2, 遅"></textarea>'+
    '<div id="csvMsg" class="muted" style="margin-top:8px;"></div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;"><button class="btn" id="csvCancel">キャンセル</button><button class="btn btn-primary" id="csvRun">取込む</button></div></div>';
  $('#modalRoot').appendChild(mm);
  mm.addEventListener('click',function(e){if(e.target===mm)mm.remove();});
  $('#csvCancel').onclick=function(){mm.remove();};
  $('#csvRun').onclick=function(){
    var txt=$('#csvIn').value.trim();if(!txt){mm.remove();return;}
    var map={'早':'早','早番':'早','日':'日','日勤':'日','通常':'日','遅':'遅','遅番':'遅','休':'休','公休':'休','有休':'休','有給':'休','休み':'休'};
    var lines=txt.split(/\r?\n/),applied=0,skipped=0;
    lines.forEach(function(ln){
      if(!ln.trim())return;
      var c=ln.split(/[,\t]/).map(function(x){return x.trim();});
      if(c.length<3||/氏名|名前|職員|従業員/.test(c[0]))return;
      var name=c[0].replace(/\s/g,''),dcol=c[1],scol=c[2];
      var st=DB.staff.filter(function(x){var xn=x.name.replace(/\s/g,'');return xn===name||xn.indexOf(name)>-1||name.indexOf(xn)>-1;})[0];
      if(!st){skipped++;return;}
      var day=null;
      if(/^\d{4}-\d{2}-\d{2}$/.test(dcol)){if(dcol.slice(0,7)===mo)day=+dcol.slice(8);}
      else if(/^\d{1,2}$/.test(dcol))day=+dcol;
      if(!day){skipped++;return;}
      var code=map[scol]||(scol==='×'||scol===''?'休':'日');
      if(!m.cells[st.id])m.cells[st.id]={};
      m.cells[st.id][day]=code;applied++;
    });
    if(!applied){$('#csvMsg').innerHTML='<span style="color:#A32D2D;">取込できた行がありません。職員名・日付の形式をご確認ください。</span>';return;}
    save();mm.remove();rerender();
  };
}

var KIKI_DATA={"units": [{"id": "u1", "title": "冒頭・指揮権", "sections": [{"id": "u1_s1", "title": "はじめに", "type": "prose", "body": "■ はじめに\nこのマニュアルは、{{園名}}におけるすべてのスタッフが、火災・災害・事故・事件などあらゆる危機に対して適切かつ迅速に対応・予防するために必要な事項を定め、園児・保護者・スタッフの生命及び健康を守ることを目的とする。", "varsUsed": ["{{園名}}"]}, {"id": "u1_s2", "title": "危機管理の定義と要項", "type": "prose", "body": "■ 危機管理の定義と要項\nスクールにおける危機とは、火災・地震（津波）・風水害・その他の災害・食中毒・感染症・大気汚染・交通事故・その他の事故・事件など、園児及びスタッフの安全を脅かすすべての事象を対象とする。\nその範囲は、{{園名}}のすべてのスタッフに対し、施設及び敷地の内外・管理の有無・時間帯を問わず適用する。危機的状況が発生した場合は、すべての園児を保護者に引き渡すまで、本マニュアルを最大限に優先して適用する。", "varsUsed": ["{{園名}}"]}, {"id": "u1_s3", "title": "危機管理における指揮権", "type": "prose", "body": "■ 危機管理における指揮権\n危機発生時において的確な命令・指示を行う指揮権者の存在は絶対に必要であり、指揮権者が不在の場合の代行者を平常時から選任しておく必要がある。選任された者は、本マニュアルの対応を基準に、園児・スタッフの生命の保全を最大の目的として指揮しなければならない。", "varsUsed": []}, {"id": "u1_s4", "title": "基本的指揮権の順位", "type": "table", "body": "■ 基本的指揮権\n基本的指揮権とは、日常の保育業務において命令・指示権をもつ者をいい、その順位は下記のとおりとする。\n① {{運営会社}} {{代表取締役}}\n② {{マネージャー}}\n③ クラスリーダー（{{クラス構成}}の各クラス）", "varsUsed": ["{{運営会社}}", "{{代表取締役}}", "{{マネージャー}}", "{{クラス構成}}"]}, {"id": "u1_s5", "title": "園内で危機発生時の指揮権順位", "type": "prose", "body": "■ 園内で危機的状況が発生した時の指揮権順位\n通常の保育時間中に危機的状況が発生した場合は、基本的指揮権に基づき指揮命令を受けること。指揮権者が不在、または指揮を執ることができない場合は、次位者が指揮権者となる。", "varsUsed": []}, {"id": "u1_s6", "title": "園外保育・イベント時の指揮権順位", "type": "table", "body": "■ 園外保育その他イベントにおける指揮権順位\n対象となる活動（例）：①散歩・公園　②遠足　③運動会　④課外イベント　等\n上記の園外活動における指揮権順位は下記のとおりとする。\n① {{代表取締役}}\n② {{マネージャー}}\n③ クラスリーダー（{{クラス構成}}の各クラス）", "varsUsed": ["{{代表取締役}}", "{{マネージャー}}", "{{クラス構成}}"]}]}, {"id": "u2", "title": "火災対策（本文・防火体制）", "sections": [{"id": "u2_s1", "title": "目的", "type": "prose", "body": "{{園名}}における園児の安全確保を図るため、あらかじめ火災対策について基本的事項を定める。\n一人ひとりのスタッフが火災発生時の行動原則を共通理解することにより、万一の緊急事態に備えておくことを目的とする。", "varsUsed": ["{{園名}}"]}, {"id": "u2_s2", "title": "事前対策：日常時の確認事項", "type": "checklist", "body": "■ 日常時の確認事項\n□ {{園名}}周辺に燃えやすいものを置かない。\n□ 消火器・誘導灯の位置を確認しておく。\n□ 消火器・火災報知器は定期的に業者の点検を受ける。\n□ 非常持ち出し品を点検し、いつでも持ち出せるようにしておく。\n□ 災害時の救急薬品等をあらかじめ点検する。\n□ カーテン・敷物・建具等の可燃性のものに防火処理を施す。", "varsUsed": ["{{園名}}"]}, {"id": "u2_s3", "title": "事前対策：火災発生時の対応策の作成", "type": "prose", "body": "■ 火災発生時の対応策の作成\n・あらかじめ火災発生時におけるスタッフの役割分担（別紙：防火体制）を定め、周知徹底する。\n・一次避難場所（園外）を定める。\n・各クラス等から一次避難場所への経路を確認し、経路図を作成する。\n・二次避難場所（園外）を定め、保護者にも周知する。\n・二次避難場所（園外）までの安全な経路を定める。\n・避難および消火に対する訓練を、少なくとも毎月1回実施する。", "varsUsed": []}, {"id": "u2_s4", "title": "出火時の対応：園から出火した場合", "type": "chart", "body": "■ 基本原則\n園児の安全を第一に考え、慌てずに行動する。\n\n■ {{園名}}から出火した場合\n①火災報知器が鳴った場合、火災発生場所を確認する。\n②火災を発見したスタッフは「（火元の場所）が火事」と連呼して周囲に知らせる。\n③119番通報をする。\n④火災発生場所に急行し、初期消火を行う。\n⑤必要に応じ、防火扉を閉める。\n⑥各スタッフは、消火・園児の避難誘導等、定められた役割分担を実行する。", "varsUsed": ["{{園名}}"]}, {"id": "u2_s5", "title": "出火時の対応：近隣で出火した場合", "type": "chart", "body": "■ 近隣で出火した場合\n①火災を発見した場合、状況を確認する（火災発生場所はどこか）。\n②119番通報をする。\n③必要に応じ、各担当者に消火または避難誘導等を指示する。\n④火災が鎮火し、{{園名}}に類焼がなく、安全が確認された場合は通常の保育業務に戻る。", "varsUsed": ["{{園名}}"]}, {"id": "u2_s6", "title": "避難：避難誘導", "type": "chart", "body": "■ 避難誘導\n①すべての保育を中止し、あらかじめ定められた対応により、園児がパニックにならないよう一次避難場所へ誘導する。\n②室内に残っている子どもがいないか確認する。特に幼児トイレは注意する。\n③避難場所に誘導したら速やかに整列させ、人員点呼を行い、負傷者の有無を確認する。\n④一次避難場所（園外）に避難したら、状況により二次避難場所（園外）へ誘導する。その際、{{園名}}内に園児が残っていないか確認する。", "varsUsed": ["{{園名}}"]}, {"id": "u2_s7", "title": "避難：応急手当", "type": "prose", "body": "■ 応急手当\n・けが人の人数・状況を把握し、けが人の応急手当に着手する。\n・その際、火災状況や施設の破損状況などに応じて、園医や地域の医師と連携して対応を図る。", "varsUsed": []}, {"id": "u2_s8", "title": "避難：非常持ち出し品", "type": "table", "body": "■ 非常持ち出し品\n避難の際は、以下の非常持ち出し品を持って避難する。\n\n・{{マネージャー}}（不在の場合は各クラス担任）：健康手帳、筆記用具、公印 など\n・クラス担任（日本人）：クラス名簿\n・クラス担任（外国人）：薬品などをまとめたリュック、緊急情報メール配信用携帯電話（{{緊急携帯}}）", "varsUsed": ["{{マネージャー}}", "{{緊急携帯}}"]}, {"id": "u2_s9", "title": "事後の対応：開園時間内に発生した場合", "type": "prose", "body": "■ 開園時間内に発生した場合\n・避難後、被害状況を本部幹部に報告し、保育の継続・中止の指示を受ける。\n・園児の状況を常時把握しておき、外部からの緊急連絡にすぐ対応できるようにする。", "varsUsed": []}, {"id": "u2_s10", "title": "事後の対応：保護者への引き渡し", "type": "prose", "body": "■ 保護者への引き渡し\n・保育を中止する場合は、保護者等に「どこで引き渡すか」を連絡する。\n・保護者等が園児を引き取りに来るまでの間、園児を安全な場所に保護し、複数のスタッフで園児の動向を把握する。\n・保護者等が引き取りに来た場合、スタッフが相手を確認し、引き渡し記録簿に時刻と引き渡した相手（お迎えに来た方）の名前を記入する。\n・園児の引き渡しが全員完了したら、速やかに本部幹部に報告する。", "varsUsed": []}, {"id": "u2_s11", "title": "事後の対応：休日・開園時間外に発生した場合", "type": "prose", "body": "■ 休日・開園時間外に発生した場合\n・{{マネージャー}}が火災を知った場合、園舎等の状況（建物の破損等）を把握するとともに、直ちに{{園名}}へ向かう。\n・あわせて保育施設支援課（{{保育施設支援課TEL}}）に火災発生の連絡をする。\n・{{園名}}に到着したら施設の状況を確認したうえで、必要な応急処置をとり、保育の実施体制の確保に努める。\n・被害状況を保育施設支援課に報告し、指示を受ける。", "varsUsed": ["{{マネージャー}}", "{{園名}}", "{{保育施設支援課TEL}}"]}, {"id": "u2_s12", "title": "防火体制：役割分担", "type": "table", "body": "■ 役割分担（別紙：防火体制）\n・通報経路：{{通報連絡担当}}\n・初期消火：{{初期消火担当}}\n・避難誘導：{{避難誘導担当}}\n・乳母車の用意：担当者を定める\n・責任者：{{責任者}}\n・非常持ち出し：{{非常持出担当}}\n・救護班：{{救護担当}}\n\n※スタッフ体制（月〜金）や火災発生時の状況により、柔軟に対応できるようにしておく。", "varsUsed": ["{{通報連絡担当}}", "{{初期消火担当}}", "{{避難誘導担当}}", "{{責任者}}", "{{非常持出担当}}", "{{救護担当}}"]}, {"id": "u2_s13", "title": "緊急連絡先・消火通報装置の設置場所", "type": "table", "body": "■ 緊急連絡先\n・消防署：119\n・保育施設支援課：{{保育施設支援課TEL}}\n\n■ 消火・通報装置の設置場所\n・火災報知器：{{火災報知器設置場所}}\n・消火器：{{消火器設置場所}}\n・防火扉：{{防火扉}}", "varsUsed": ["{{保育施設支援課TEL}}", "{{火災報知器設置場所}}", "{{消火器設置場所}}", "{{防火扉}}"]}]}, {"id": "u3", "title": "火災チャート", "sections": [{"id": "u3_s1", "title": "火災に備えた日常チェックポイント", "type": "checklist", "body": "日頃から次の項目を点検し、火災の予防と迅速な避難に備える。\n\n□ 防火設備の点検をする\n□ 防火体制の確認をする\n□ 定期的に避難訓練を実施する\n□ 役割分担の確認をする\n□ 廊下に燃えやすい物を置かない\n□ 園周辺に燃えやすいものを置かない\n□ 園外の一次避難場所を確認する\n□ 園外の二次避難場所への経路を確認する\n□ 保育室から一次避難場所への経路を確認する\n□ 避難経路に危険な場所はないか確認する\n□ 避難経路を確保する\n□ 防火扉の周りには物を置かず、緊急時に作動するようにしておく", "varsUsed": []}, {"id": "u3_s2", "title": "園内で火災発生時の対応フロー（火事を発見した場合）", "type": "chart", "body": "■ 初動\n①発生場所を確認する\n②慌てず大声で知らせる\n③{{マネージャー}}はスタッフに指示を出す\n④日頃の役割分担に従い行動する\n\n■ 消火・通報（役割分担に従い並行して行う）\n・消火器を集め初期消火をする\n・119番通報をする\n・防火扉を閉める\n・窓を閉める\n・避難経路を確保する\n\n■ 避難・安全確認\n⑤園児の安全確保のため、一次避難場所に集合する\n⑥人数を確認し、トイレなどに残っていないかを確認する\n⑦火災状況により、園舎外の二次避難場所へ避難する\n⑧再度人数を確認し、健康状態を把握する\n⑨保護者に連絡する", "varsUsed": ["{{マネージャー}}"]}, {"id": "u3_s3", "title": "119番通報の文例と保育継続の判断", "type": "prose", "body": "■ 通報時に伝える内容（文例）\n「{{園名}}です。火事です。住所は{{住所}}。TEL：{{電話}}。目標は{{目標物}}です。」\n\n■ 消火後・鎮火後の判断\n・園舎の状況から保育が可能であれば、受け入れ体制や環境を整える。\n・難しい場合や判断に困った場合は、本部幹部に相談する。それでもわからない場合は、保育施設支援課（{{保育施設支援課TEL}}）と相談する。", "varsUsed": ["{{園名}}", "{{住所}}", "{{電話}}", "{{目標物}}", "{{保育施設支援課TEL}}"]}, {"id": "u3_s4", "title": "営業時間外に園舎で火災が発生した場合の対応フロー", "type": "chart", "body": "■ 状況把握\n・連絡を外部から受ける場合がある（近隣、警察・消防署、保育施設支援課など）\n・本部幹部・{{マネージャー}}が状況を把握する\n・（発生直後なら）119に通報する\n\n■ 現地対応\n・園にかけつける\n・保育施設支援課（{{保育施設支援課TEL}}）に連絡する\n・園舎、設備の被害状況を点検する\n\n■ 翌日の保育に向けた整備\n翌日に安全に通常保育ができるよう、スタッフを確保し環境を整備する。\n・保育体制の点検・確保（スタッフ、給食食材等 ※自園調理の場合）\n・園舎設備の被害状況の点検\n・応急処置\n・保育上の安全確保等\n\n■ 支障がある場合\n・翌日の通所保育の受け入れに支障がある場合は、本部幹部・保育施設支援課の指示を受ける\n・翌日通常保育を行う場合は保護者に連絡する\n・今後の対応を本部幹部・保育施設支援課と検討し、早急な保育受け入れを目指す", "varsUsed": ["{{マネージャー}}", "{{保育施設支援課TEL}}"]}, {"id": "u3_s5", "title": "近隣で火災が発生した場合の対応フロー（開園時間内／休日・開園時間外）", "type": "chart", "body": "■ 本部幹部・{{マネージャー}}が現状を把握し、園舎に被害が及ぶ場合\n・園児の安全を確保し、スタッフに状況を伝えて保育体制を整える\n・本部幹部・{{マネージャー}}が外部から連絡を受ける（警察・消防等）\n・園舎・施設の被害状況を把握するため、状況により園に行き、被害状況を確認する\n・避難場所を決定し、被害の有無を保育施設支援課（{{保育施設支援課TEL}}）に連絡する\n・時間帯・火災状況により、必要に応じて園児の安全な避難を指示する\n・近隣の園へ受け入れを要請する\n・園児の人数を確認する。園児を慌てさせず、不安にさせないよう注意する\n\n■ 保護者への対応\n・避難場所をわかりやすい場所に掲示する\n・可能ならお迎えを依頼する（確認し、引き渡す）\n・翌日の保育受け入れに全力を尽くす（受け入れが可能な場合は保育所火災対策マニュアルに準ずる）\n・翌日の通常保育受け入れに支障がある場合は、スタッフ体制を確保し環境を整え、保護者に連絡する\n\n■ 今後の対応\n・今後の対応を本部幹部と検討し、早急な保育受け入れを目指す", "varsUsed": ["{{マネージャー}}", "{{保育施設支援課TEL}}"]}]}, {"id": "u4", "title": "暴風・台風・大雨水害", "sections": [{"id": "u4_s1", "title": "事前の周知（園児の安全確保対策）", "type": "prose", "body": "■ 大雨・洪水警報発令時の登降園\n{{市区町村}}域において大雨により浸水・氾濫の恐れがある場合、または大雨・洪水警報が発令され地域的に危険があると予測される場合は、園児の危険を予防し不測の事態を未然に避けるため、登降園時の安全確保に努める。園児の引渡しや登園見合わせなどの措置に際しては、保護者の理解を得ること。\n\n■ 情報の収集\n河川洪水（外水氾濫）・内水氾濫・土砂災害などの発生を予測し、発表される情報を収集する。\n・避難準備情報は、災害を予測して「避難勧告」を発令する準備段階に入ったことを表すもので、避難の事前準備をするなどの心構えをするための発表である。\n・避難勧告は、災害が発生するおそれがあるため避難をすすめるために発令するものである。災害の状況に応じて適切に避難すること。\n\n■ 翌日保育の周知\n台風等の接近に伴い、大雨・洪水警報や暴風警報が発令されることが予測される場合は、翌日の保育について保護者へ掲示や口頭等で知らせること。", "varsUsed": ["{{市区町村}}"]}, {"id": "u4_s2", "title": "避難準備情報の発表基準（参考）", "type": "prose", "body": "避難準備情報は、以下のような基準に該当した場合に発表される（自治体の基準に準拠。数値・河川名は一例であり、各園の地域の基準に読み替える）。\n・地域の主要河川において、氾濫注意情報が発表された場合。\n・地域の主要河川において、氾濫注意水位に達し、以降60分の予想降雨量が30mmを超える場合。\n・地域の主要河川において、基準水位・予想雨量・樋門の閉鎖などの発令基準を定め、その基準に該当した場合。\n・60分間降雨量が50mmを超え、かつ以後120分間の予想雨量が100mmを超える場合。または{{市区町村}}に大雨警報（浸水害）が発表され、災害対策（警戒）本部で必要と認めた場合。\n・{{市区町村}}に土砂災害警戒情報が発表され、都道府県の防災情報システムによる土砂災害危険度情報が危険度レベル2に達した場合。\n・台風の接近に伴い、{{市区町村}}に高潮警報が発表された場合。", "varsUsed": ["{{市区町村}}"]}, {"id": "u4_s3", "title": "暴風（大雪）警報・直下地震注意情報発令時の休園判断", "type": "table", "body": "■ 対象：暴風（大雪）警報および{{市区町村}}直下地震注意情報（予知情報）が発令した場合\n\n※以下は基本保育時間開始時間の2時間前を基準とする（{{天災休園基準}}に準拠。朝の延長保育申込者は延長保育開始の2時間前）。\n\n・開始時間の2時間前に発令された場合：休園\n・開始時間の2時間前に解除された場合：通常通り\n・開始時間の2時間前を過ぎてからの発令の場合：休園\n・開始時間になってから解除された場合：一旦休園が決定した場合は休園\n・保育時間中に発令された場合：保育を中止しお子様の安全確保をし、保護者にお迎えの連絡をする\n\n※大雨・洪水警報は該当しません。\n※天災等で休園した場合、レッスンの振替はありませんのでご了承ください。", "varsUsed": ["{{市区町村}}", "{{天災休園基準}}"]}, {"id": "u4_s4", "title": "大雨・洪水警報発令時の対応", "type": "prose", "body": "保育時間中・保育時間外の発令を問わず、原則として保育を実施する。\nただし、浸水・土砂崩れ・洪水等、地域的に危険があると予測される場合は、暴風警報発令時と同様の対応をとること。", "varsUsed": []}, {"id": "u4_s5", "title": "避難勧告・避難指示・特別警報発令時の対応", "type": "prose", "body": "■ 保育時間中に発令された場合\n解除されるまでは休園とする。保護者にお迎えを依頼する。園児は引き取りが完了するまで保育を実施し、必要に応じて園児と避難所へ避難する。\n\n■ 保育時間外に発令された場合\n解除されるまでは休園とする。\n\n※やむを得ない事情により保育が必要な児童については保育を実施する。ただし、避難指示が発令されている保育所については受け入れを行わない。", "varsUsed": []}, {"id": "u4_s6", "title": "園舎の保全対策等", "type": "prose", "body": "(1) 危険防止・衛生確保に留意するとともに、園舎の保全等、臨機の措置をとること。\n(2) 保育所において被害が発生した場合は、速やかに被害の状況を保育施設支援課（{{保育施設支援課TEL}}）に連絡し、万全の措置をとるための協議及び執行に努めること。\n(3) 給食について献立どおりの実施が困難な場合は、献立の変更など臨機の措置をとること。\n(4) 職員体制については、施設の保全や不測の事態に対処するためその確保に努めるとともに、平常から職員への連絡方法等必要な体制を確立しておくこと。なお、保護者との連絡方法も併せて整備しておくこと。", "varsUsed": ["{{保育施設支援課TEL}}"]}, {"id": "u4_s7", "title": "避難の心得", "type": "prose", "body": "(1) 避難所への避難の際には、保育施設支援課及び{{市区町村}}の災害対策本部などと連絡をとり、避難所を決定する。\n(2) 浸水50cm以上になると避難に際して危険を伴うことがあるため、1階に下りないように注意する。\n(3) 非常持出品等は背負って、手はなるべく自由にする。\n(4) 自動車・自転車は使用しない。\n(5) 地域や近隣住民等で連携し、情報を共有化する。", "varsUsed": ["{{市区町村}}"]}, {"id": "u4_s8", "title": "災害時連絡先・情報入手先", "type": "table", "body": "※情報入手先として、各自治体のハザードマップも併せて参照する。\n\n・保育施設支援課（危機対策室／危機対策係）：{{保育施設支援課TEL}}\n・消防署（{{消防署}}）：{{中央消防署TEL}}\n・建設事務所（河川・道路等）：{{建設事務所TEL}}\n・水道営業所（水道）：{{水道営業所TEL}}", "varsUsed": ["{{保育施設支援課TEL}}", "{{消防署}}", "{{中央消防署TEL}}", "{{建設事務所TEL}}", "{{水道営業所TEL}}"]}, {"id": "u4_s9", "title": "台風 事前チェックポイント", "type": "checklist", "body": "□ 園舎の安全点検をする\n□ スタッフの通勤方法を確認し、通勤体制を把握する\n□ 遮光ネットなど、風で飛ばないようにする\n□ 献立の変更・中止を検討する（委託会社と相談）\n□ 花壇や外に、風で飛ぶようなものを置かない\n□ 非常持ち出し用品・ラジオ・懐中電灯など災害用品を点検する\n□ 園舎の周りの排水を確認する\n□ 保護者への周知ができているか確認する\n□ 各自治体の洪水・内水ハザードマップを見て園舎周辺の災害リスクを確認する\n□ 保育所の対応をスタッフ間で共有し、状況を把握する\n□ {{開園時間}}前の発令が予想される場合は、登園について掲示または連絡をする\n□ 情報収集をする\n□ 自分の地域（{{市区町村}}）のハザードマップを確認する\n\n◯天気予報区分：{{市区町村}}", "varsUsed": ["{{開園時間}}", "{{市区町村}}"]}, {"id": "u4_s10", "title": "台風 対応の流れ（登園前・登園後・通常保育）", "type": "chart", "body": "■ 登園前\nお知らせを掲示またはアプリ等で保護者に連絡し周知する。全スタッフが対応できるようにする。\n\n■ 登園後\n警報が解除された時間帯によって保育受け入れ態勢を整え、通常保育開始または休園を保護者へ周知する。\n\n■ 通常保育になったら\n・給食の確認（委託会社）\n・園舎の周りの危険物を点検\n・スタッフの確保\n・暴風警報・避難勧告などの情報を収集\n・保護者に周知する\n・お迎えの連絡（電話）\n・園舎の安全点検\n・非常時の要保育児を確認し保育体制を整える\n・避難勧告が出た場合は安全な場所へ避難する\n・保護者へ避難先を連絡する（保育施設支援課へ連絡）", "varsUsed": []}, {"id": "u4_s11", "title": "大雨・水害 日常チェックポイント", "type": "checklist", "body": "□ 雨漏り・水はけなど園舎全体を点検する\n□ 持ち出し用品・避難用品などの点検をする\n□ 地域情報が入手しやすいように、日頃から地域の連携に心がける\n□ 土嚢袋を作るようにする（ビニール袋・牛乳パック等で代用）\n□ ハザードマップで自分の園がどういう状況下にあるか把握する\n□ スタッフ用・園児用のカッパを用意しておく\n□ 園舎内や地域の中で高い場所を選定する\n□ 水害等を想定した避難訓練を行う（5分以内で避難できる場所）\n□ 園舎内の通信機器・放送機器の点検をする\n□ 緊急連絡の連絡先などの変更がないかチェックする\n□ 非常食・備蓄品（{{備蓄品}}）は適正な場所に保管する（注1）", "varsUsed": ["{{備蓄品}}"]}, {"id": "u4_s12", "title": "大雨・水害 避難勧告等発令時の対応と留意事項", "type": "chart", "body": "■ 避難勧告・避難指示・特別警報発令時\n・保育施設支援課（{{保育施設支援課TEL}}）に連絡し、指示を待つ\n・保護者に迎えを依頼する（注3）\n・お迎え記録簿に記入し、人数把握をする\n・園児引き渡し終了の連絡を運営本部（{{運営会社}}）幹部及び保育施設支援課にする\n\n■ 留意事項\n（注1）窓がすべて、雨漏りしないように完全に閉まるか確認しておく\n（注2）行政文書・個人情報・児童票・保育記録・PC等を、水につからないように移動する\n（注3）保育園の周辺に避難勧告が出されていることを保護者に伝え、周辺の交通状態なども情報として把握しておく\n（注4）非常食は少量に分けて、スタッフや園児の荷物に入れられるような物を用意するとよい", "varsUsed": ["{{保育施設支援課TEL}}", "{{運営会社}}"]}]}, {"id": "u5", "title": "地震防災（予知型）", "sections": [{"id": "u5_s1", "title": "予知型地震対応の基本方針", "type": "prose", "body": "■基本方針\n・本章は{{市区町村}}直下地震等の「注意情報」・「予知情報」（警戒宣言）に備える予知型（事前警戒型）地震への対応を定める。\n・「注意情報」・「予知情報」（警戒宣言）が発令されると保育所は休園（閉園）となり、通常業務は行わない。園児の安全確保を第一に、保護者への確実な引き渡しを最優先する。\n・情報はテレビ・ラジオ等で確実に確認し、うわさ等に惑わされないよう、正確な情報収集に努める。", "varsUsed": ["{{市区町村}}"]}, {"id": "u5_s2", "title": "発令前｜開園時間内の情報収集と準備", "type": "prose", "body": "■情報の収集及び伝達\n・{{マネージャー}}はテレビ・ラジオ等で正確な情報収集を行い、{{市区町村}}直下地震等に関連する調査情報（臨時）が発表されたことが判明した場合は、速やかに職場内へ伝達する。\n・「注意情報」・「予知情報」（警戒宣言）の発令に備え、テレビ・ラジオ等での情報収集を継続するとともに、{{運営会社}}本部または保育施設支援課からの指示に注意を払う。\n・うわさ等に惑わされないよう、正確な情報収集に努める。\n\n■発令に備えた準備\n・{{マネージャー}}は園児の出席状況・スタッフの出勤状況を確認し、各スタッフの役割分担を点検するとともに、発令された場合に必要となる処置の準備を各スタッフに指示する。\n・園児の緊急連絡票・出席簿・引き渡し記録を用意する。\n・スタッフの緊急連絡網を用意する。\n・非常時保育体制の準備を行い、散歩などの外出は控える。\n・保護者からの自主的な降園の申出が予測されるため、お迎えがあれば引き渡し記録簿に時刻とお迎えに来た方の名前を記入する。", "varsUsed": ["{{市区町村}}", "{{マネージャー}}", "{{運営会社}}"]}, {"id": "u5_s3", "title": "発令前｜休日・時間外／早朝・夕刻・延長保育", "type": "prose", "body": "■休日・開園時間外\n・{{マネージャー}}及びスタッフは、時間外に「注意情報」・「予知情報」（警戒宣言）の情報を入手した場合は、原則として自宅待機し、正確な情報収集に努める。\n・発令に備えテレビ・ラジオ等で情報収集を継続する。{{運営会社}}本部または保育施設支援課からの指示が緊急連絡網により伝達されることがあり得るので注意を払う。\n\n■早朝・夕刻及び延長保育の時間帯\n・{{マネージャー}}不在で少人数体制の時間帯でも、勤務しているスタッフ間で連携し、開園時間内と同様に正確な情報収集と準備を行う。\n・早朝の場合、{{マネージャー}}が勤務し次第、園児の出席状況を把握できるよう、早朝スタッフは常に出席状況（欠席連絡を含む）を確実に把握しておく。\n・早朝は保護者からの問い合わせが増えることが想定される。預かる場合は「（警戒宣言）が発令されると休園になりますので、すぐにお迎えできるようご協力ください」と依頼する。掲示板・張り紙・連絡アプリでも発表と依頼を掲示し、登園を見合わせられる方には今後の予知情報に注意してもらい登園を控えてもらう。\n・夕刻・延長保育の場合は常に在園児を把握してお迎えを待つ。保護者がお迎え予定時間に遅れることも予想されるため、緊急連絡票を利用し確実な引き渡しに努めるとともに、非常食品や毛布等を提供できるよう準備する。", "varsUsed": ["{{マネージャー}}", "{{運営会社}}"]}, {"id": "u5_s4", "title": "発令時｜責任者と休園の周知", "type": "prose", "body": "■責任者\n・{{マネージャー}}は保育所の防災対策の責任者として指揮監督を行う。{{マネージャー}}が不在の場合は各クラスのリーダーがその職務を代行する。\n・発令についてはテレビ・ラジオ等で確実に確認し、うわさ等に惑わされないよう正確な情報収集に努める。\n\n■スタッフへの伝達及び保護者への連絡\n・{{マネージャー}}はスタッフ全員に確実に伝達し、以後は通常業務を行わないことを周知するとともに、次の行動を指示する。\n・発令された場合は保育所は休園（閉園）となるため、直ちに園児を保護者へ引き渡す。", "varsUsed": ["{{マネージャー}}"]}, {"id": "u5_s5", "title": "発令時｜非常時保育移行の任務分担", "type": "table", "body": "■非常時保育に移行するときの任務分担\n※次のとおりの分担とするが、スタッフの勤務状況等に応じて{{マネージャー}}が補正のうえ指示する。\n\n・{{マネージャー}}：休園のお知らせを連絡アプリまたは電話で連絡・掲示する／非常持ち出し品（緊急連絡票・出席簿・公印等）を点検し、いつでも持ち出せるよう準備する\n・避難・安全担当スタッフ：避難経路を整備する／出席人員（園児・スタッフ）を把握する／危険物（油・灯油等があれば）の安全処置を行う\n・クラス担当スタッフ：園児の人数を把握し報告する／引き渡し簿を準備する／非常用薬品を点検する／保育室の落下・転倒しそうな物を排除・撤去する／園児にカラー帽子（名前が見える方を外側にして）を着用させ非常口のある部屋へ移動する／園児の持ち物は担任が非常口のある部屋まで持参する／非常持ち出し品を点検し、いつでも持ち出せるようにしておく\n・その他のスタッフ：緊急貯水する（鍋・ポリタンク・バケツ・プール等）／非常用食品を点検する／上記業務の補佐をする", "varsUsed": ["{{マネージャー}}"]}, {"id": "u5_s6", "title": "発令時｜安全な場所への誘導と引き渡し", "type": "prose", "body": "■安全な場所への誘導及び引き渡し\n・園で一番安全と思われる場所を避難室とし、園児を誘導・待機させて保護者への引き渡しを行う。\n・園児は座らせて人数を確認し、お迎えを待つ。\n・お迎えがあれば引き渡し記録簿に時刻とお迎えに来た方の名前を記入する。\n・トイレに行かせるときは、必ずスタッフが付き添う。\n・避難室では常に園児の動向を把握できるよう、複数のスタッフで対応する。", "varsUsed": []}, {"id": "u5_s7", "title": "非常用薬品（点検リスト）", "type": "checklist", "body": "■非常用薬品\n□ アルコール入りウェットティッシュ\n□ 厚紙（骨折等の固定用）\n□ 消毒液\n□ 安全ピン\n□ 貼布剤\n□ マッチ\n□ 三角巾\n□ ガーゼ\n□ 包帯\n□ 絆創膏\n□ 虫刺され薬\n□ 脱脂綿\n□ ハサミ\n□ トイレットペーパー\n□ ピンセット\n□ 毛抜き", "varsUsed": []}, {"id": "u5_s8", "title": "非常持ち出し品（点検リスト）", "type": "checklist", "body": "■非常持ち出し品\n□ 鍵、携帯電話\n□ おんぶ紐\n□ ロープ\n□ ヘルメット\n□ 懐中電灯\n□ 電池\n□ 筆記用具\n□ ライター\n□ 小銭（テレホンカード）\n□ ろうそく\n□ ビニール袋\n□ 着替え\n□ 紙おむつ\n□ トイレットペーパー\n□ ガーゼ\n□ ラジオ\n□ タオル\n□ 軍手\n□ 子ども予備靴・靴下", "varsUsed": []}, {"id": "u5_s9", "title": "発令時｜火気制限・関係機関連絡・園児保護・園舎管理", "type": "prose", "body": "■火気の制限\n・警戒宣言の発令後は、原則として火気の使用を厳禁する。\n・ヒーターや暖房器具などがある場合は直ちに使用を中止する。\n\n■保育施設支援課への連絡\n・園児の引き渡しが全員完了した場合は、速やかに保育施設支援課へ報告する。\n・在園児の状況は常時把握し、保育施設支援課からの緊急連絡にすぐ報告できるようにする。\n\n■お迎えを待つ園児の保護\n・保護者がお迎えに来られず、引き続き保育所で保護する必要がある場合は、原則として保育所内で保護する。\n・保育施設支援課または自治体の災害対策本部から指示等があった場合は、保護している園児とともに近隣の指定避難所（{{広域避難場所}}）あるいは広域避難場所へ避難する。この場合、保育所にスタッフを残留させて連携を図る、あるいはスタッフを残留させず行先を張り紙した上で園舎を施錠して避難することが想定されるが、いずれの場合も保育施設支援課へ避難先を連絡する。\n\n■園舎管理\n・「注意情報」が発令された場合、スタッフは翌日以降、平常の勤務時間帯は出勤し、情報収集を行うとともに園舎の安全管理対策の業務を行う。\n・「予知情報」（警戒宣言）が発令された場合、スタッフは保育所に待機し、情報収集を行うとともに園舎の安全管理対策を行う。", "varsUsed": ["{{広域避難場所}}"]}, {"id": "u5_s10", "title": "発令時｜休日・時間外／早朝・夕刻・延長保育", "type": "prose", "body": "■休日・開園時間外\n・{{マネージャー}}及びスタッフは、時間外に「注意情報」発表の情報を入手した場合は、原則として自宅待機し、正確な情報収集に努める。\n・時間外に警戒宣言発令の情報を入手した場合は、保育所へ自主参集し、情報収集を行うとともに園舎の安全管理対策の業務を行う。\n・{{マネージャー}}はテレビ・ラジオ等で情報収集を継続する。保育施設支援課からの指示が緊急連絡網により伝達されることがあり得るので注意を払う。\n・「注意情報」・「予知情報」（警戒宣言）の発令により保育園は休園となる。以後、通常保育は行わない。業務再開は保育施設支援課または{{運営会社}}本部の指示に従う。\n\n■早朝・夕刻及び延長保育の時間帯\n・{{マネージャー}}不在で少人数体制の時間帯に発令を知った場合でも、勤務しているスタッフ間で連携し、開園時間内と同様に正確な情報収集に努める。\n・{{マネージャー}}はテレビ・ラジオ等で情報収集を継続する。保育施設支援課からの指示が緊急連絡網により伝達されることがあり得るので注意を払う。\n・少人数のスタッフで対応することになるが、落ち着いて人命の安全確保を最優先して行動する。\n・園児を安全に保護しながら、開園時間内に掲げる対策をできる範囲で実行する。\n・スタッフの勝手な判断で行動することは控え、非常時保育に移行して安全な園児の引き渡しに努める。\n・早朝であっても公共交通機関の運行中止でスタッフが出勤できないことが予測されるため、その時点で出勤しているスタッフで速やかに応急対策を実行する。", "varsUsed": ["{{マネージャー}}", "{{運営会社}}"]}]}, {"id": "u6", "title": "地震防災（突発型）", "sections": [{"id": "u6_s1", "title": "地震発生時の初動対応（園内・園外）", "type": "prose", "body": "■ 揺れが収まったら\n・揺れが収まったら避難の準備をする（帽子、靴）。\n\n■ 園外保育中の場合\n・安全な場所に集合して座り、振動が収まるのを待つ。\n・スタッフはただちに{{マネージャー}}に連絡し、園児の安否を報告する。\n・スタッフは様々な方法で情報を収集する。\n\n■ 危険な場所に近づかない\n・建築物の窓ガラス、外壁、ブロック塀などに近寄らない。\n・電柱の転倒、看板、電柱のトランスやエアコンの室外機などの落下の恐れがある場所を避ける。\n・切れた電線には触らないよう、園児を近づけない。", "varsUsed": ["{{マネージャー}}"]}, {"id": "u6_s2", "title": "出火防止の措置", "type": "prose", "body": "■ 各クラス担任\n・地震と同時にスタッフに指示して火気の使用を止めさせる。\n・揺れが収まり次第、電化製品のコンセントを抜く。", "varsUsed": []}, {"id": "u6_s3", "title": "地震後の安全確認（役割別）", "type": "table", "body": "■ {{マネージャー}}\n・ラジオで余震情報等の正確な情報収集に努めるとともに、各スタッフを指揮して情報収集と応急処置を行う。\n\n■ 各クラスリーダー\n・園児の安全を確保するため、人員の点呼、けがの有無などを確認する。\n・火の始末、施設の破損（ガラス破損、ドアの開閉など）についても確認し報告する。\n\n■ その他スタッフ\n・園児や職員の安否、施設の安全状態を把握するために園内を巡視し、その状況を{{マネージャー}}に報告する。\n・ガスの元栓が閉まっているのを確認したら、飲料水・非常用食品の点検を行い、その状況を報告する。\n・ガスは業者により安全が確認されるまで使用しない。\n・{{マネージャー}}の指示に従い、上記業務の補佐を行う。\n\n■ 早朝・夕刻および延長保育時間帯の対応\n・少人数のスタッフで対応することとなるが、落ち着いて人命の安全確保を最優先して行動する。\n・園児の保護に全力を挙げ、危険の排除と火災の予防に注意する。", "varsUsed": ["{{マネージャー}}"]}, {"id": "u6_s4", "title": "応急対策（状況別）", "type": "chart", "body": "■ けが人が発生した場合\n・{{マネージャー}}はスタッフの報告を受けて、けが人の人数・状態を把握し、応急手当を指示する。火災発生の有無や施設の破損状況などに応じて、臨機応変に場所を変えて応急手当を指示する。\n・必要に応じて、{{かかりつけ医}}や地域の医師と連携して対応を図る。\n\n■ 火災が発生した場合\n・{{マネージャー}}は火災を知った場合、直ちに火災発生場所を園内に周知するとともに、避難場所を指定して避難を指示する。\n・{{マネージャー}}は冷静に状況を判断し、必要な指示を行う。各スタッフは担当職務に従って避難誘導を行う。\n・避難する際は安全に注意し、非常持ち出し品を持っていく。\n・避難したら人員点呼を行う。地震後の火災が近隣にも発生しているか確認し、{{マネージャー}}は避難場所を移動するかどうかを判断する。\n・備え付けの消火器により初期消火を行う。\n\n■ 建物等の倒壊のおそれがある場合\n・園舎建物の倒壊、ガラスの飛散、物の落下のおそれ、ドアの開閉不能等の危険個所をスタッフからの報告により把握した{{マネージャー}}は、園児を安全な場所に避難させ、また近づけない処置を行う。\n・片づけは落ち着いた時点で行う。", "varsUsed": ["{{マネージャー}}", "{{かかりつけ医}}"]}, {"id": "u6_s5", "title": "保護者への連絡および園児の引渡し", "type": "prose", "body": "■ 連絡\n・建物の破損または火災の発生により保育が継続できないと{{マネージャー}}が判断した場合は、保護者へ連絡し、お迎えをお願いする。\n\n■ 園児の引渡し\n・スタッフは保護者がお迎えに来るまでの間、園児を安全な場所で保護し、常に園児の動向を把握する。\n・お迎えがあれば引渡し記録簿に、時刻と引き渡した相手方（お迎えに来た方）の名前を記入する。", "varsUsed": ["{{マネージャー}}"]}, {"id": "u6_s6", "title": "津波への対応", "type": "prose", "body": "■ 高所への避難\n・地震後すぐに津波の襲来が警戒されるときは、4階以上の建物に避難する。\n\n■ 津波に対する避難場所\n・大津波警報が発表された場合は、原則として海抜10m以上の高台、もしくは「津波避難ビル」へ避難する。", "varsUsed": []}, {"id": "u6_s7", "title": "保育施設支援課への連絡", "type": "prose", "body": "■ 状況報告\n・地震による建物の損壊あるいは火災の発生等で保育の継続が不可能と{{マネージャー}}が判断した場合は、運営本部の幹部に連絡し、保護者への連絡・園児の引渡しを行う。その際、保育施設支援課（{{保育施設支援課TEL}}）へ次の事項を連絡する。\n　① 在籍児数\n　② けが人の有無\n　③ 園児の引渡し場所\n　④ 園舎建物の状況\n・相当強い地震が発生した場合、保育を中止するに至らないときも、異常の有無を保育施設支援課へ連絡する。\n・在園児の状況については常時把握しておき、保育施設支援課からの緊急連絡にすぐに報告できるようにする。", "varsUsed": ["{{マネージャー}}", "{{保育施設支援課TEL}}"]}, {"id": "u6_s8", "title": "休日・開園時間外に発生した場合", "type": "prose", "body": "・{{市区町村}}域で震度5強以上の地震が発生したら、スタッフは自宅待機とする。\n・{{マネージャー}}もしくは駆けつけられたスタッフ・関係者は、登園したら施設の状況を確認し、その被害状況を保育施設支援課へ報告する。その際、保育が実施できるかどうかを確認して報告する。", "varsUsed": ["{{市区町村}}", "{{マネージャー}}"]}, {"id": "u6_s9", "title": "地震防災 日常チェックポイント", "type": "checklist", "body": "□ スタッフに、緊急時の対応と役割分担を周知する\n□ 非常用持ち出し袋の点検と確認をする\n□ 備蓄品の点検をする\n□ 保護者に非常時の対応について説明をする\n□ 園舎内の避難室の点検をする\n□ 避難場所の確認と保護者への周知をする\n□ 避難経路の安全確認をする\n□ 定期的に避難訓練を実施する\n□ 園児の引渡し記録簿を準備する\n□ 転倒防止対策、落下防止対策、飛散防止対策を行う\n□ 園児の緊急連絡簿を確認する\n□ スタッフの緊急連絡網を確認する\n□ 施設・設備の安全点検をする", "varsUsed": []}, {"id": "u6_s10", "title": "非常持ち出し袋・災害時の救急薬品", "type": "checklist", "body": "■ 災害時の救急薬品\n□ アルコール入りウェットティッシュ\n□ 消毒液\n□ 湿布剤\n□ 三角巾\n□ 包帯\n□ 絆創膏\n□ ガーゼ\n□ 脱脂綿\n□ 虫刺され薬\n□ ピンセット\n□ 毛抜き\n□ 体温計\n□ 段ボール・厚紙（骨折等の固定用）\n□ 安全ピン\n□ ハサミ\n\n■ 非常持ち出し品\n□ マッチ／ライター／ろうそく\n□ 懐中電灯／電池\n□ ラジオ\n□ トイレットペーパー\n□ 油紙\n□ タオル\n□ おんぶ紐\n□ ロープ\n□ ヘルメット\n□ 軍手\n□ ビニール袋\n□ 着替え・紙おむつ\n□ 子ども用予備靴・靴下\n□ 筆記用具\n□ {{緊急携帯}}（緊急情報メール配信用携帯電話）", "varsUsed": ["{{緊急携帯}}"]}, {"id": "u6_s11", "title": "注意情報発令時の対応フロー", "type": "chart", "body": "【{{市区町村}}直下地震等「注意情報」発令】\n\n■ 対応（開園時間内／休日・開園時間外 共通）\n・情報の収集及び伝達、避難室の確保をする。\n・園児に不安を与えないよう落ち着かせ、避難室に誘導・待機させる。\n・通常保育は中止し、園児の人数確認、保護者への引渡しを実施する。\n・「注意情報」・「予知情報」発令中のお知らせを出す。\n・在園児の状況を常時把握し、園児の引渡しが完了したときは運営本部の幹部及び保育施設支援課に報告する。\n\n■ 役割分担\n・{{マネージャー}}は、保育施設支援課からの指示が緊急連絡網で伝達されることがあるので注意を払う。\n・担任は出席簿、引渡記録簿、非常時持ち出し品を持参する。\n・保護者に休園の連絡をし、引渡し記録簿に記入する。\n・{{マネージャー}}・スタッフは原則として自宅待機とし、翌日の保育に支障がないよう配慮・手配をする。\n\n★ {{マネージャー}}（不在時はクラスリーダー）\n・指揮監督、情報収集\n・スタッフの緊急連絡網を用意\n・休園のお知らせを掲示\n\n★ 各クラスリーダー\n・保護者への連絡\n・緊急連絡票、出席簿、持ち出し品の点検・準備\n・落下・転倒物の排除、撤去等の安全措置を講じる\n・緊急貯水\n・非常用食品の点検\n\n★ クラス担当\n・クラスリーダーの指示に従い、クラスリーダーの役割分担の中から対応できるものを行う。", "varsUsed": ["{{市区町村}}", "{{マネージャー}}"]}, {"id": "u6_s12", "title": "警戒宣言発令時の対応フロー", "type": "chart", "body": "【{{市区町村}}直下地震等「予知情報」（警戒宣言）発令】\n\n■ 地震発生時（スタッフ参集は第4非常配備／防災任務カード参照）\n・参集したスタッフは身の安全を確保する。{{マネージャー}}は情報を把握し、スタッフに的確な指示を出す。\n・火災発生、倒壊の危険等、状況によってはヘルメット・帽子・靴を着用し、園舎横の駐車場へ避難する。\n・出入口を開け、避難経路を確保する。\n・火災発生時は、すぐに初期消火を行う。\n\n■ 地震発災後 ― {{マネージャー}}（不在時は次席）\n・参集スタッフの安全を確認する。\n・災害状況、余震情報等をラジオ等で正しく収集する。\n・被害状況を把握し、保育施設支援課に報告、保育再開等の指示を得る。被害状況によっては地域の避難所に避難するよう指示を出す。\n・スタッフ、園児の安否確認を行う。\n・業務再開に向けてスタッフの確保、保育室整備等、的確な指示を出す。\n・保育再開情報等について「災害用伝言ダイヤル171」を必要に応じて活用する。\n・避難所に指定されている園は、災害対策本部と連携し、避難所の開設に協力する。\n\n■ 地震発災後 ― スタッフ\n・園内外の被害状況を確認する。\n＜被害状況確認場所＞\n・外壁、壁、屋根の亀裂や落下、正面玄関塀の転倒\n・園舎周辺の建物に危険と思われる状況\n・内装、床面、照明器具、ガラスの破損\n・備品、遊具の転倒破損\n・ブレーカー、配電盤等の破損\n・火器設備の変形破損\n・水道、ガス漏れ\n・OA機器の破損\n・重要書類の点検\n・保育再開に向け、保育室の整備等、環境整備をする。\n・地域避難所に出向き、園児の安否確認をする。\n・園外に避難するときは、ブレーカーを切る。", "varsUsed": ["{{市区町村}}", "{{マネージャー}}"]}, {"id": "u6_s13", "title": "突発型地震発生時の対応フロー", "type": "chart", "body": "【突発型地震発生】\n\n■ 地震発生時（室外で保育中）\n・園児を安全な場所に誘導し、人数確認をする。\n・消火し、ガス栓を閉める。\n・出入口を開ける（避難経路の確保）。\n・{{マネージャー}}は情報を把握し、スタッフに明確な指示を伝える。\n・火災発生、倒壊の危険等、状況によっては帽子・靴を着用し、園舎横の駐車場に避難する（状況によって園外避難場所に避難する）。\n\n■ 地震発災後\n・園児を安全な場所に誘導し、人数確認をする。\n・しゃがんで頭を抱え、揺れが収まるのを待つ。\n・園外にいる場合は、収まったら園へ電話で状況を報告し、安全に帰園する（状況によって園外避難場所に避難する。園外避難の場合はブレーカーを切る）。\n\n■ 保育時間内の対応（発災後）\n・園児の人数・安全の確認をする。けがの状況を把握し、応急手当をする。必要なら園医・医療機関に連絡し治療してもらう。保護者に連絡する。\n・{{マネージャー}}は、災害状況、復旧状況、余震情報を正確に把握し、落ち着いて行動するよう指示する。\n・状況により、地域の防災応急体制と連携する。\n・保育施設支援課と連絡をとり、災害後の処置を検討する。\n・保護者と連絡をとり、安全に園児を帰宅させる。\n・保育が必要な園児は、保育を続行する。\n・安全に通常保育が再開できるよう、職員を確保し、環境整備する。\n・状況に応じて、他園の保育や地域の救援活動への参加をする。\n\n■ 開園時間外の対応\n・状況を確かめる。\n・園舎、設備の被害状況の点検をし、保育施設支援課に連絡する。\n・翌日に安全に通常保育ができるよう、スタッフを確保し、環境を整備する。", "varsUsed": ["{{マネージャー}}"]}]}, {"id": "u7", "title": "消防計画（防火管理規程）", "sections": [{"id": "u7_s1", "title": "目的と適用範囲（第1条・第2条）", "type": "prose", "body": "■ 目的（第1条）\nこの計画は、消防法第8条第1項の規定に基づき、{{園名}}における防火管理業務について必要な事項を定め、火災・地震その他の災害の予防及び人命の安全並びに災害の防止を図ることを目的とする。\n\n■ 適用範囲（第2条）\nこの計画は、{{園名}}に勤務し、又は出入りするすべての者に適用する。", "varsUsed": ["{{園名}}"]}, {"id": "u7_s2", "title": "予防管理組織（第3条）", "type": "table", "body": "第3条 防火管理者、防火担当責任者、火元責任者が行う日常の任務は、次のとおりとする。\n\n■ 予防管理組織\n・防火管理責任者：{{防火管理責任者}}（運営本部）\n・防火担当責任者：{{マネージャー}}\n・火元管理責任者：{{マネージャー}}\n\n■ 担当区域と火元責任者\n・職員室：{{マネージャー}}\n・給湯室：{{マネージャー}}\n・各クラスルーム（{{クラス構成}}）：各クラス担任", "varsUsed": ["{{防火管理責任者}}", "{{マネージャー}}", "{{クラス構成}}"]}, {"id": "u7_s3", "title": "建物等の自主検査（第4条）", "type": "table", "body": "第4条 火元責任者は、自主検査票に基づき次の区分により自主検査を実施する。\n\n■ 自主検査の対象と頻度\n・建築物、通路・階段等：1日2回\n・火気使用設備：毎日終業時\n・防火区画：1日1回\n・消防用設備等：1日1回\n\n■ 報告の流れ\n(1) 火元責任者が自主検査を実施する。\n(2) 防火担当責任者は、火元責任者が実施した自主検査の結果を確認し、防火管理者に報告する。\n(3) 防火管理者は、報告された内容を防火管理台帳に記録するとともに、不備・欠陥があるものについては{{代表取締役}}に報告し、改修を図る。", "varsUsed": ["{{代表取締役}}"]}, {"id": "u7_s4", "title": "職員の遵守事項（第5条）", "type": "prose", "body": "第5条 全職員は、火災予防及び火災発生時の避難確保のために、次の事項を遵守しなければならない。\n\n■ (1) 火気管理に関する事項\n・園児等の手の届くところにマッチ、ライターを置かない。\n・火気使用器具は、使用前後に点検を行い、安全を確認する。\n・工事を行うときは、防火管理者を通じて、工事中の防火安全対策を樹立する。\n\n■ (2) 防火（出火防止）に関する事項\n・建物の周囲に可燃物を置かない。\n・死角となる廊下、階段室、トイレ等に可燃物を置かない。\n・物置、空室等の施錠を行う。\n・トイレ、洗面所等の巡視を行う。\n\n■ (3) 避難管理に関する事項\n・廊下、階段、通路には、物品（玩具、椅子、自動販売機等）を置かない。\n・廊下、非常口等に設けられた扉の開閉を妨げる物品がある場合は、直ちに除去する。\n・防火シャッターの降下位置に物品がある場合は、直ちに除去する。\n・上記において物品を容易に除去できない場合は、防火管理者又は防火担当責任者に報告する。", "varsUsed": []}, {"id": "u7_s5", "title": "消防用設備等の法定点検（第6条）", "type": "table", "body": "第6条 消防用設備等の機能を維持管理するため、「業務委託」により下記の法定点検を実施する。点検は{{法定点検月}}に実施する。\n\n■ 法定点検の対象設備\n・消火器：外観点検・機能点検\n・自動火災報知設備：外観点検・機能点検・総合点検\n・誘導灯：外観点検・機能点検\n・避難器具：外観点検・機能点検・総合点検\n\n■ 報告\n(1) 防火管理者は、法定点検の結果を防火管理台帳に記録する。\n(2) 不備・欠陥があるものについては{{代表取締役}}に報告し、改修を図る。\n(3) 法定点検の結果は、1年（又は3年）に1回、消防署長に報告する。", "varsUsed": ["{{法定点検月}}", "{{代表取締役}}"]}, {"id": "u7_s6", "title": "自衛消防隊の組織と任務分担（第7条）", "type": "table", "body": "第7条 火災その他の災害が発生した場合は、被害を最小限にとどめるため自衛消防隊を置く。自衛消防隊の組織及び任務分担は次のとおりとする。\n\n■ 組織と班長\n・自衛消防隊長：{{初期消火担当}}（消火班長を兼務）\n・通報連絡班長：{{通報連絡担当}}\n・消火班長：{{初期消火担当}}\n・避難誘導班長：{{避難誘導担当}}\n※必要に応じ、応急救護班・安全防護班を組織する（救護担当：{{救護担当}}）。\n\n■ 任務分担\n・通報連絡班：119番で消防機関へ通報する／園内への非常放送を行う／関係者への連絡を行う。\n・消火班：消火器等による初期消火を行う。\n・避難誘導班：出火時における避難者の誘導を行う／逃げ遅れた者の確認を行う。\n・応急救護班：負傷者等の搬送を行う。", "varsUsed": ["{{初期消火担当}}", "{{通報連絡担当}}", "{{避難誘導担当}}", "{{救護担当}}"]}, {"id": "u7_s7", "title": "日常の地震対策（第8条）", "type": "prose", "body": "第8条 震災時の災害を予防するため、次の事項を実施する。\n\n■ (1) 日常の地震対策\n・ロッカー、棚、靴箱等の転倒防止措置を行う。\n・窓ガラス、看板、広告塔等の落下・飛散防止措置を行う。\n・火気使用設備・器具からの出火防止措置を行う。\n・危険物等の流出、漏えい防止措置を行う。\n・高所に置かれた重量物は低所に移動する。\n・震災用の備蓄品を確保するとともに、定期的に点検する。\n・救助、救出用資機材を確保するとともに、定期的に点検する。", "varsUsed": []}, {"id": "u7_s8", "title": "備蓄品・救助救出用資機材", "type": "table", "body": "■ 備蓄品（例）\n・飲料水（500mlペットボトル）\n・非常用食料（缶詰、乾パン等）\n・応急手当セット（三角巾、包帯、医薬品、絆創膏、ガーゼ、ハサミ等）\n・懐中電灯、乾電池\n・携帯用ラジオ\n\n■ 救助・救出用資機材（例）\n・ヘルメット\n・スコップ\n・ハンマー\n・軍手\n\n※具体的な品目・数量・保管場所は{{備蓄品}}として管理し、定期的に点検する。\n※飲料水及び非常食は、帰宅困難者等により園内に滞留が予想される職員及び園児数等を満たす数量を確保する。救助・救出用資機材は、保安要員数を満たす数量を確保する。", "varsUsed": ["{{備蓄品}}"]}, {"id": "u7_s9", "title": "地震発生時・発生後の自衛消防活動（第8条）", "type": "chart", "body": "■ (2) 地震発生時の安全措置\n① 火気使用設備・器具の直近にいる職員は、元栓・器具栓の閉止及び電源遮断を行い、各火元責任者はその状況を確認する。\n② 地震発生直後は、それぞれが身の安全を守ることを第一とする。\n③ 防火担当責任者は、二次災害の発生を防止するため、建物・火気使用設備・器具・危険物施設等を点検・検査し、防火管理者に報告するとともに、異常が認められた場合は応急措置を行う。\n\n■ (3) 地震発生後の自衛消防活動\n【情報収集・伝達】通報連絡班\n・テレビ、ラジオ等により情報の収集を行う。\n・混乱防止を図るため、必要な情報は園児等に知らせる。\n\n【警戒巡視】消火班\n・火災発生の警戒及び被害状況の把握のため、建物内を巡視する。\n・落下、倒壊した物品で避難上障害となるものを除去する。\n・建物内の被害状況等を防火管理者に報告する。\n\n【避難誘導】避難誘導班\n・園児等を落ち着かせ、原則、自衛消防隊長から指示があるまで待機させる。\n・避難誘導を行う場合は、落下物からの頭部保護、倒壊物等による転倒防止等、必要な指示を行う。\n・広域避難場所（{{広域避難場所}}）まで誘導する場合は、先頭と最後尾に職員を配置する。\n・避難にあたっては、車両等を使用せず全員徒歩とする。", "varsUsed": ["{{広域避難場所}}"]}, {"id": "u7_s10", "title": "注意情報・予知情報発表時の処置（第9条）", "type": "prose", "body": "第9条 {{市区町村}}直下地震等に関する「注意情報」・「予知情報」から警戒宣言が発令されるまでの処置は、次のとおりとする。\n\n① 「注意情報」・「予知情報」の発表を知った職員は、直ちに防火管理者等に報告する。\n② 報告を受けた防火管理者等は、テレビ、ラジオ等を通じて情報を確認のうえ、各自衛消防隊員等に対し、警戒宣言が発令された場合の措置・任務分担等、必要な事項を伝達・指示する。\n③ 職員及び園児等に対し、放送設備により当該情報及び交通機関停止等その他の情報を伝達し、帰宅を促す。\n④ 自衛消防活動に係る人員は、必要最低限の人員確保を図った後、定めた計画に基づき職員の時差退社を行う。", "varsUsed": ["{{市区町村}}"]}, {"id": "u7_s11", "title": "警戒宣言発令時の対応策（第10条）", "type": "prose", "body": "第10条 大規模地震対策特別措置法に基づく{{市区町村}}直下地震等に関する警戒宣言が発令された場合、次のとおり対応する。\n\n■ 基本対応\n(1) 通常の保育活動を打ち切る。\n(2) 園児は保護者への引渡しを原則とする。ただし、引渡しまでの間は、スクール（保育園）で保護する。\n(3) 警戒宣言発令中は、休園する。\n\n■ 自衛消防隊の活動\n【情報収集・伝達】通報連絡班\n・テレビ、ラジオ等により情報を収集する。\n・職員等に対し、警戒宣言が発令された旨の情報を伝達する。\n\n【応急対策】消火班\n・火気を使用する設備・器具の使用は原則禁止とし、やむを得ない場合は最小限とするとともに、監視人を置く等の措置を行う。\n・窓ガラス等の破損、散乱防止措置を行う。\n・照明器具、ロッカー、書類棚、OA機器、物品等の転倒・落下防止措置を行う。\n・非常持出品の準備を行う。\n\n【安全誘導】避難誘導班\n・避難通路の確保、非常口の開放等を行う。\n・園児等が混乱しないで降園できるように誘導する。\n\n■ 保育時間外・帰宅後の対応\n・保育時間外に警戒宣言が発令された場合は、建物に残っている者が本条第2項第2号（応急対策）に定める措置を行う。\n・職員等が休業日、休暇、帰宅後に警戒宣言の発令を知ったときは、原則として自宅待機をする。", "varsUsed": ["{{市区町村}}"]}, {"id": "u7_s12", "title": "教育及び訓練（第11条）", "type": "table", "body": "第11条 防火管理者等は、職員等の防火知識並びに消防技術及び震災対応措置の向上を図るため、防火・防災に関する教育及び訓練を行う。\n\n■ 教育の実施時期・区分\n・新規職員：採用時に1回\n・全職員：4月・9月の年2回\n・朝礼時：必要の都度\n\n■ 教育の内容\n・火災予防上、職員が遵守すべき事項について\n・火災発生時の対応（役割、実施事項等）について\n・地震発生時の対応（役割、実施事項等）について\n・警戒宣言発令時の対応（役割、実施事項等）について\n・その他必要な事項について\n\n■ 訓練の種別・実施時期\n・消火訓練：毎月\n・避難訓練：毎月\n・通報訓練：6月・12月\n・震災訓練：6月\n・総合訓練：12月", "varsUsed": []}, {"id": "u7_s13", "title": "消防機関への報告・連絡（第12条）・附則", "type": "prose", "body": "第12条 防火管理者は、防火管理の適正を図るため、常に消防機関との連絡を密にし、次の事務を行う。\n(1) 消防計画の作成（変更）届出\n(2) 防火指導の要請\n(3) 教育訓練指導の要請\n(4) 消防訓練実施の連絡\n(5) 消防用設備等の点検結果の報告\n(6) その他防火管理上必要な事項\n\n■ 附則\nこの計画は、定めた施行日から施行する。", "varsUsed": []}]}, {"id": "u8", "title": "防犯対策（本文）", "sections": [{"id": "u8_s1", "title": "防犯対策の目的", "type": "prose", "body": "■目的\n{{園名}}における園児の安全確保を図るため、あらかじめ不審者対策について基本的事項を定める。一人ひとりのスタッフが緊急時の行動原則を共通理解することにより、万一の緊急事態に備えておくことを目的とする。", "varsUsed": ["{{園名}}"]}, {"id": "u8_s2", "title": "防犯対策の流れ", "type": "chart", "body": "■防犯対策の5つの流れ\n①事前対策（定期）\n②日常対策（毎日）\n　→＜未然に事件を防止する＞\n③不審者の対応\n　→＜園児の安全を守る＞\n④応急手当\n⑤事後の対応\n　→＜再発を防止する＞", "varsUsed": []}, {"id": "u8_s3", "title": "事前対策（定期）", "type": "prose", "body": "■(1) 施設・設備等の点検\n・視界をさえぎるものを撤去するなど、見通しをよくするための環境整備に努める。\n・あらかじめ園内の注意を払う箇所を点検しておく。\n・出入口の施錠が可能か点検する。\n・火災報知器（火災以外の緊急時にも使用可能）は、定期的に業者の点検を受ける。それ以外にも園で異常がないか注意を払い、異常が見つかったらすぐに保育施設支援課へ連絡する。\n\n■(2) 危機管理体制の整備・園内研修（別紙「防犯体制」）\n・あらかじめ緊急時におけるスタッフの役割分担を定め、スタッフ会議等で周知徹底する。\n・緊急時の連絡・通報方法を定め、掲示しておく。\n・職員は園児や自分自身を守るため、とっさの場合に何を手にするかを具体的に想定しておく。\n・緊急時に慌てないよう、情報の伝達方法や、警察非常通報装置（{{警察非常通報装置}}）・火災報知器（{{火災報知器設置場所}}）・非常ベル（{{防犯ベル}}）の設置場所・操作方法、個々の役割を、園内研修等で身に着けておく。\n\n■(3) 防犯シミュレーション訓練の実施\n・少なくとも毎年1回は必ず防犯シミュレーション訓練を実施する。\n・幼児には必要に応じて紙芝居等を活用した防犯指導を行う。\n\n■(4) 保護者・地域・警察等関係機関との連携\n・日頃から保護者、地域、巡回パトロール、警察等関係機関との連絡を密にし、不審者の情報提供や緊急時の協力依頼を行う。", "varsUsed": ["{{警察非常通報装置}}", "{{火災報知器設置場所}}", "{{防犯ベル}}"]}, {"id": "u8_s4", "title": "日常対策（毎日）", "type": "prose", "body": "■(1) 出入口の限定\n・出入口を限定するように努める。\n・特に早朝・夕刻は、保護者の理解を得て出入口を限定する。\n・来園者には、出入口がどこかわかるように案内しておく。\n・使用しない出入口は施錠に努める。\n\n■(2) 訪問者の確認\n・日頃から来園者を見かけたら挨拶をし、普段見かけない人には用件を確認する。\n・園に出入りする業者には、必要に応じて名札や腕章等の着用を求め、突然の訪問者には身分を証明するものの提示を求める。\n・保護者には送迎時の確認をし、普段と違う人が送迎する場合は、事前に園と調整してもらう。\n\n■(3) 園内の巡回\n・必要に応じて園内を巡回し、異常がないか、不審者がいないかを確認する。", "varsUsed": []}, {"id": "u8_s5", "title": "不審者への対応", "type": "chart", "body": "■(1) 不審者情報が寄せられた場合\n①保護者等から情報が寄せられたとき\n・情報を確認（いつ・だれが・どのようにして・どういう状況か）し、正確な情報収集に努める。\n・寄せられた情報を保育施設支援課と運営本部（{{運営会社}}）の幹部へ連絡する。\n・保育施設支援課と調整してスタッフ・保護者へ周知する。\n・園の近くに不審者がいないか注意を払う。\n・園児を確実に保護者に引き渡すようにする。\n②保育施設支援課からFAXまたはメールで情報が寄せられたとき\n・情報を直ちにスタッフ・保護者へ周知する。\n・近くに不審者がいないか注意を払う。\n・園児を確実に保護者に引き渡すようにする。\n\n■(2) 園の付近で不審者らしき人を発見した場合\n・長時間にわたり園付近に居座り、不審な行動をとる者がいる場合は、しばらく様子をうかがい、必要に応じて保育施設支援課に連絡する。ただし、緊急の場合は「110番」通報する。\n\n■(3) 園内に不審者の侵入があった場合\n①緊急性が感じられない場合（凶器を携帯していない等）\n・園児の安全を第一に考えて行動する。\n・正当な理由なく園の敷地内に入った者がいる場合は、刺激を与えず丁寧に園外への退去を求める。\n・退去に応じない場合は、不審者の侵入を全スタッフに知らせ、緊急時の役割分担に従い、他のスタッフに協力を依頼する（複数対応）。状況に応じて「110番」通報し、火災報知器・防犯ベル及び警察非常通報装置を使う。\n②緊急性が感じられる場合（凶器を携帯している等）\n・園児の安全を第一に考えて行動する。\n・不審者が凶器を携帯している場合は、直ちに緊急事態を全スタッフに知らせる。\n・緊急時の役割分担に応じて行動し、直ちに警察非常通報装置を使って警察へ通報するとともに、火災報知器・非常ベルで近隣へも緊急事態を知らせる。\n・不審者から園児を防御する際（複数対応）は、園児から不審者の注意をそらせ、園児に近づけないようにする。また、園児を避難させることで被害を防止しながら、警察の到着を待つ。\n・この際、身近な物（机・イス・掃除道具等）やさすまた、護身用防犯スプレー等で、不審者との距離をとり、移動を阻止する。", "varsUsed": ["{{運営会社}}"]}, {"id": "u8_s6", "title": "応急手当", "type": "prose", "body": "■応急手当\n・負傷者がいたら、まず容態を観察し、同時に応援を依頼する。\n・応急手当に着手するとともに、他の者に依頼して「119番」通報する。\n・大出血している場合は、心肺蘇生法の前に、圧迫したり、負傷部分より心臓に近いところを縛ったりして止血する。\n・呼吸をしていない場合は、心肺蘇生法（胸骨圧迫30回・人工呼吸2回。乳幼児も人工呼吸が必要）やAEDを使用する。", "varsUsed": []}, {"id": "u8_s7", "title": "事後の対応", "type": "prose", "body": "■(1) 事件発生直後\n・情報を収集し、事件の概要等について把握・整理する。\n・保育施設支援課と連絡をとり、情報交換をする。\n・できるだけ速やかに保護者に連絡・説明を行う。\n\n■(2) 再発防止\n・スタッフ会議を開催し、事件の発生状況や対応の経過を検証する。これまでの取り組みや安全対策を見直し、問題点を整理して、事件の再発防止に向けた対策を講じる。\n・保育施設支援課及び保護者、地域、警察等関係機関と再発防止について協議する。", "varsUsed": []}, {"id": "u8_s8", "title": "補足事項", "type": "prose", "body": "■補足事項（補足資料の添付）\n・防犯フローチャート", "varsUsed": []}]}, {"id": "u9", "title": "防犯・誘拐・迷子チャート", "sections": [{"id": "u9_s1", "title": "訪問者への対応", "type": "chart", "body": "■ スクールに訪問者があった時\n対象：保護者／出入り業者／見知らぬ人\n・普段見かけない人には、身元や用件を確認する\n・まず挨拶する：「こんにちは」\n①身元確認：「どちら様でしょうか？」\n②用件確認：「ご用件は何でしょうか？」\n・用件がある場合 → 対応する → 用件終了後は退去を誘導する「失礼いたします」\n・挨拶や応答がなく、不審と感じた場合 → 「不審者への対応」へ移行する\n■ 日常の心がけ\n・保護者や園児が帰るときにも必ず挨拶する（例：「See you! さようなら！」）\n・日頃からの声かけが防犯につながる", "varsUsed": []}, {"id": "u9_s2", "title": "不審者への対応", "type": "chart", "body": "■ 事前の備え\n・不審者侵入時の連絡方法を事前に決めておく（大声、笛、カード等）\n・不審者には必ず複数で対応する\n・全スタッフへ周知し、協力を依頼しておく\n■ 緊急性が感じられない場合（凶器不携帯等）\n・刺激を与えないよう丁寧に、園外への退去を求める\n　退去依頼：「用のない場合は立ち入りをご遠慮ください」\n　退去誘導：「こちらからお帰りください」\n①退去要請に応じる → 退去（その後の再侵入に注意する）\n②退去要請に応じない → 退去勧告「退去いただけない場合は警察を呼びます」→ 全スタッフへ周知し、防犯体制をとる\n■ 緊急の場合（凶器携帯・危害を加える恐れがある場合）\n・状況に応じて次の手段を使い分ける\n　- 警察非常通報装置\n　- 110番通報\n　- 火災報知機・防犯ベル\n・不審者の注意を園児からそらせ、園児に近づけないようにする\n・身近なもの（机、いす、掃除道具等）で不審者との距離をとり、防護する", "varsUsed": []}, {"id": "u9_s3", "title": "防犯体制（役割分担）", "type": "table", "body": "■ 役割分担\n・責任者：{{責任者}}（{{マネージャー}}が兼務）\n・通報連絡係：{{通報連絡担当}}（{{マネージャー}}）\n　- 園内への周知\n　- 警察（110番）への通報\n　- 地域・近隣への連絡\n　- 保育施設支援課への連絡\n・園児安全確保係：各クラス（{{クラス構成}}）の担任\n・不審者応答係（複数対応）：全スタッフ\n・救護係：{{救護担当}}（保育士）\n※ スタッフ体制や不審者の発見状況により、柔軟に対応できるようにしておく。", "varsUsed": ["{{責任者}}", "{{マネージャー}}", "{{通報連絡担当}}", "{{クラス構成}}", "{{救護担当}}"]}, {"id": "u9_s4", "title": "緊急連絡先・防犯設備の設置場所", "type": "prose", "body": "■ 緊急連絡先\n・警察　電話：110\n・保育施設支援課　電話：{{保育施設支援課TEL}}\n■ 非常通報装置・防犯設備の設置場所\n・警察非常通報装置：{{警察非常通報装置}}\n・火災報知機：{{火災報知器設置場所}}\n・防犯ベル：{{防犯ベル}}", "varsUsed": ["{{保育施設支援課TEL}}", "{{警察非常通報装置}}", "{{火災報知器設置場所}}", "{{防犯ベル}}"]}, {"id": "u9_s5", "title": "110番通報の伝え方（例）", "type": "prose", "body": "■ 110番通報時に伝える内容\n①場所：{{園名}}\n②住所：{{住所}}（目標物：{{目標物}}）\n③状況：凶器携帯の有無、負傷者の有無、不審者の性別・特徴など\n・通報とあわせて、出入口やその他の窓も含めて施錠する", "varsUsed": ["{{園名}}", "{{住所}}", "{{目標物}}"]}, {"id": "u9_s6", "title": "不法侵入 日常チェックポイント", "type": "checklist", "body": "□ 日常的に複数で対応できるような方法をとる\n□ 外部の人の出入り口が確認できるようにする\n□ 非常ベルの点検をする\n□ 正面玄関や周辺に見慣れない人がいたら、用件を尋ねる\n□ 不審者が来た場合の周知方法を、スタッフ全員で確認しておく（合言葉や音・音楽等）\n□ 非常ベル・警察非常通報装置の操作方法を全員に周知する\n□ 防犯シミュレーション訓練を実施する\n□ 関係者以外の人が安易に園内に入ることがないようにする", "varsUsed": []}, {"id": "u9_s7", "title": "不法侵入 対応フロー", "type": "chart", "body": "①不審者が来たら、用件を聞いて身元を確認する\n②不審者と判断したら、全スタッフに不法侵入を知らせる（合言葉などで周知）\n③警察非常通報装置を押す。無い場合は、他スタッフまたは近隣の店舗・施設へ応援を要請し、警察へ通報を依頼して緊急体制をとる\n④園児の安全を確保する（不審者から離れた部屋に避難、保育室を施錠、必要な場合は園の外へ避難）\n⑤近隣の援助を求めるとともに、保育施設支援課に連絡する\n⑥複数の応援スタッフで不審者の侵入を防ぎ、警察の到着を待つ\n⑦事後対応：保護者・地域に連絡し、登降園時の安全確認をする／防犯体制を再確認し、スタッフ会議を行う", "varsUsed": []}, {"id": "u9_s8", "title": "誘拐 日常チェックポイントと安全教育", "type": "checklist", "body": "■ 日常チェックポイント\n□ 園児送迎用の玄関扉（ドア）は開放しない\n□ 早朝・夕刻の時間帯には、可能な限り非常ベルの近くで保育をする\n□ 緊急連絡票は整理して、わかる場所に置く\n□ 保護者から連絡を受けた人以外には、園児を渡さない\n□ 園児には理解しやすい方法で安全教育をする\n□ 常時、園児の人数を把握しておく\n□ 園児の性格・行動・特徴などを把握しておく\n□ 誘拐事件の事例を認識しておく\n□ 保護者の家庭環境や園周辺の環境を把握しておく\n□ 降園時には、園児を確実に保護者に渡す\n■ 園児への安全教育「つみきおに」\nつ：ついていかない\nみ：みんなと一緒\nき：きちんと知らせる\nお：大声で叫ぶ\nに：にげる", "varsUsed": []}, {"id": "u9_s9", "title": "誘拐発生時の対応フロー", "type": "chart", "body": "■ 誘拐が発生したら（園内・園外共通）\n・目撃者は、園児を確認しながら追いかける\n・警察非常通報装置を押す。無ければ110番通報する\n・保育施設支援課に連絡する\n■ 園外で発生した場合\n・園に連絡する。{{マネージャー}}は警察に連絡する（園児氏名、性別、場所、時間、状況などを正確に説明する）\n・他児の安全確保のため、園から応援スタッフを派遣し、安全に帰園する\n■ その後の対応\n・保護者に知らせる\n・スタッフは連絡を取り合いながら、近隣を手分けして捜す\n・残った園児の保育体制をとる\n・緊急会議を開き、事後対策を協議する\n・対応方針が明確になるまでは、外部に情報を漏らさない", "varsUsed": ["{{マネージャー}}"]}, {"id": "u9_s10", "title": "子どもがいなくなったら（園内）日常チェックポイント", "type": "checklist", "body": "□ 玄関扉（ドア）の鍵が壊れたり破損したりしていないか確認する\n□ 玄関扉（ドア）の鍵を園児が触らないよう指導する\n□ 玄関扉（ドア）の大人による施錠を、日頃から周知徹底しておく\n□ 緊急用ドア（手動）の鍵が壊れたり破損したりしていないか確認する\n□ 緊急用ドア（手動）の鍵を園児が触らないよう指導する\n□ 園児の引渡し以後は保護者の責任であることを、日頃から伝えておく\n□ 登降園時は、玄関扉（ドア）付近に保育従事者がいて、出入りに気を配る\n□ 新入園児・配慮の必要な園児については、特に気を付ける\n□ 日中の保育中でも、こまめに人数チェックをする\n□ 子どもが入り込めるような場所や、死角になるスペースがないか点検する", "varsUsed": []}, {"id": "u9_s11", "title": "子どもがいなくなったら（園内）対応フロー", "type": "chart", "body": "①子どもがいなくなったら、すぐに{{マネージャー}}に連絡する\n②{{マネージャー}}は、保育・連絡・捜索の役割分担を指示する\n・園児を全員集め、人数を確認して安全に保育する\n・可能な限りのスタッフを手配する\n・保護者に連絡をとり、自宅に帰っていないか確認する\n・安全保育をしつつ、手が空いたスタッフは捜索を手伝う\n・携帯を持ち、行先を分担して捜索にあたる\n・随時連絡を取り合いながら、園舎内外をくまなく捜す\n・保育施設支援課に連絡し、状況を報告して警察要請の判断をする\n③無事に解決したら、保護者に状況を説明し、謝罪と今後の対応策等を十分に伝えて、信頼を損なわないようにする", "varsUsed": ["{{マネージャー}}"]}, {"id": "u9_s12", "title": "子どもがいなくなった（園外）日常チェックポイント", "type": "checklist", "body": "□ 行先に関する安全チェックを事前に行う\n□ 経路や行先での危険箇所等を、スタッフ同士で確認しあっておく\n□ 常に子どもの人数を確認する\n□ 緊急時の役割分担・動きの確認を行っておく\n□ 何かあったらすぐ対応できるよう、保育従事者の配置を確認する\n□ 園児の出欠を確認する\n□ 決められた安全なコースを通るようにする\n□ 人数・欠席児・目的地・経路・帰園時間等を記入する\n□ トイレに行く時など保育が手薄になる時は、声を掛け合い安全保育に留意する\n□ 帽子の名札を確認する\n□ 防犯ベル・笛・携帯電話等を持っていく", "varsUsed": []}, {"id": "u9_s13", "title": "子どもがいなくなった（園外）対応フロー", "type": "chart", "body": "①子どもがいなくなったら、すぐに園（スクール）に連絡し、状況を伝えて園からの指示を仰ぐ\n②園児を全員集め、人数を確認する\n③責任者を決め、役割分担をして、いなくなった園児を捜す\n・その場に残る園児は安全に待機させ、園からの迎えを待つ\n・近くにいる人にも協力を求め、園からの応援者も含めて、常に園と連絡を取り合いながら、指示に従って散歩先周辺まで捜索する\n・応援が来たら、園児を引率して園にもどる\n④状況に応じ、警察・保護者・保育施設支援課に連絡する", "varsUsed": []}]}, {"id": "u10", "title": "事故防止・事故対応", "sections": [{"id": "u10_s1", "title": "事故防止の基本方針", "type": "prose", "body": "保育中の事故防止のため、以下の基本方針に沿って施設全体で安全管理に取り組む。\n\n① 保育中の事故防止のために、子どもの心身の状態等を踏まえつつ、施設内の安全点検に努め、安全対策のために全スタッフの共通理解や体制づくりを図るとともに、家庭や地域の関係機関の協力の下に安全指導を行う。\n\n② 事故防止の取組を行う際には、特に睡眠中、プール活動、水遊び中、食事中等の場面では重大事故が発生しやすいことを踏まえ、子どもの主体的な活動を大切にしつつ、施設内外の環境への配慮や指導の工夫を行う等、必要な対策を講じる。\n\n③ 保育中の事故の発生に備え、施設内外の危険箇所の点検や訓練など、不測の事態に備えて必要な対応を行う。また、子どもの精神保健面における対応にも留意する。", "varsUsed": []}, {"id": "u10_s2", "title": "事故対策の全体の流れ", "type": "chart", "body": "事故対策は「日常のチェック」→「緊急時の対応」→「事後の対応」の3段階で捉える。\n\n① 日常のチェック（未然に事故を防止する）\n  ・施設内外の安全点検、危険箇所の把握、訓練の実施\n\n② 緊急時の対応（園児の安全を守る）\n  ・応急処置を行い、被害を最小限に食い止める\n\n③ 事後の対応（再発防止）\n  ・原因分析と再発防止策の検討・周知", "varsUsed": []}, {"id": "u10_s3", "title": "事故発生時の対応チャート", "type": "chart", "body": "■ 事故発生時の手順\n① 事故発生\n② 必要に応じた応急処置を行う。\n③ 事故の状況（子どもの状態、現場の状況等）を正確に把握する。\n  ※症状の見落としや判断ミスのないよう、子どもの状態については複数のスタッフで確認する。\n④ 受診が必要と判断した場合は、保護者に連絡 → 受診する。\n  ・保護者に対しては事故発生について連絡する。\n  ・把握している事実を正確に伝える。\n⑤ 事故の状況は時系列で書き出し整理する。\n  ※可能な限り事故発生直後からの当時の状況を、適切に記録に残す。\n\n■ 記録する内容\n・どのように事故が発生したか\n・どのように対応したか\n・保護者への連絡内容 等\n\n■ 記録書類\n・ヒヤリハット\n・事件・事故等発生状況報告書 → {{市区町村}}に提出", "varsUsed": ["{{市区町村}}"]}, {"id": "u10_s4", "title": "事故発生後の対応", "type": "prose", "body": "万が一事故が起こった場合には、あわてず冷静に{{マネージャー}}の指揮の下、その被害を最小限に食い止めるよう、正確に状況を把握する必要がある。そのうえで、適切かつ迅速な応急処置と、関係者（保護者や保育施設支援課等）への連絡を行う。\n\n■ 事故発生後にとるべき対応\n・保育施設支援課に事故発生の報告を行う。\n・事故後の記録に加え、どのように振り返り、改善策を講じたのかなどを記録する。事故発生の状況を振り返り、事故原因の分析と再発防止策の検討を行い、スタッフに周知する。\n・必要に応じてマニュアルや定められている基本的な事項を見直す。\n・重篤な事故に関しては、{{市区町村}}において発生後速やかに外部有識者を交えた事故検証委員会を設置し、事故原因の解明と再発防止策の協議を行う場合もある。\n・死亡事故、治療に要する期間が30日以上の負傷や疾患を伴う重篤な事故等に該当する場合は、保育施設支援課を通じて国等にも報告する。", "varsUsed": ["{{マネージャー}}", "{{市区町村}}"]}, {"id": "u10_s5", "title": "事故で法的責任を問われる際の観点", "type": "prose", "body": "事故が起き、裁判になった時などに保育所側に問われる内容は次のとおり。日常の保育において、これらが適切になされていたかを常に意識する。\n\n① 用具を使って指導した場合\n・指導計画、事故防止対策、安全指導、スタッフの動きや配慮、用具の安全点検がなされていたか。\n\n② いろいろな保育場面（自由遊び、園外保育、水遊び等）\n・指導計画、安全指導、園児数とスタッフ配置、スタッフの動きや配慮、日常の安全管理の配慮がなされていたか。", "varsUsed": []}, {"id": "u10_s6", "title": "事故後の対処チェックポイント", "type": "checklist", "body": "事故後の対処が適切であったかを、以下の項目で振り返る。\n\n□ 応急処置は適切であったか。\n□ 医者にかかるべきか否かの判断は正しかったか。\n□ 保護者に事故の内容をきちんと伝えたか。保護者に誠意をもって対処したか。\n  （把握できた事実のみを正確に伝えることとし、個人の憶測や感想は慎む）\n□ 怪我の起きた原因が他の園児にかかわっている場合、相手の保護者との関係が悪くならないように配慮したか。\n□ 今後、事故が起きないよう、原因分析と再発防止策について検討・周知がなされたか。\n□ 文書・記録等の保存を行ったか。けがの場合も含み、医療受診記録（傷の深さ、完治までの時間等）・保護者対応内容などを、事故報告書のみならず児童記録表にも残しておく。\n  ※特に、骨折や顔へのひっかき傷など、年数を経てからの問い合わせの可能性がある。\n\n■ 記録書類\n・ヒヤリハット\n・事件・事故等発生状況報告書 → {{市区町村}}に提出\n・事故報告様式（国報告用）", "varsUsed": ["{{市区町村}}"]}]}, {"id": "u11", "title": "食事（アレルギー・異物・誤嚥窒息）", "sections": [{"id": "u11_s1", "title": "アレルギー疾患とは", "type": "prose", "body": "■アレルギー疾患とは\nアレルギーという言葉は一般用語として広まっているが、その理解は十分ではない。アレルギー疾患を分かりやすい言葉に置き換えれば、本来なら反応しなくてもよい無害なものに対する過剰な免疫反応と捉えることができる。\n免疫反応は、本来、体を外敵から守る働きである。体の外には細菌・カビ・ウイルスなどの「敵」が多く存在し、放っておくと体内に入って病気を起こしてしまうが、それに対して体を守る重要な働きが免疫反応である。相手が本物の「悪者」であればそれを攻撃するのは正しい反応となるが、無害な相手に対してまで過剰に免疫反応を起こしてしまうことがある。それがアレルギー疾患の本質と言える。", "varsUsed": []}, {"id": "u11_s2", "title": "乳幼児期のアレルギー疾患と基本対応の原則", "type": "prose", "body": "■乳幼児期の代表的なアレルギー疾患\n保育所において対応が求められる、乳幼児がかかりやすい代表的なアレルギー疾患には、食物アレルギー、アナフィラキシー、気管支喘息、アトピー性皮膚炎、アレルギー性結膜炎、アレルギー性鼻炎などがある。アレルギー疾患は全身疾患であることが特徴で、小児の場合はどれか一つだけを発症するケースは少なく、複数の疾患を合併していることが多い。特に配慮や管理が求められる生活の場面には各疾患に共通した特徴があり、これらはアレルギー症状を引き起こしやすい原因と密接に関係するため、注意が必要である。\n\n■保育所における基本原則\n・保育所は、アレルギー疾患を有する子どもに対して、その子どもの最善の利益を考慮し、教育的および福祉的な配慮を十分に行うよう努める責務がある。その保育に当たっては、医師の診断および指示に基づいて行う必要がある。\n・職員は、その責務と役割に応じて施設内外の研修に定期的に参加し、個々の知識と技術を高めることが重要である。\n・施設長や設置者は、子どもの健康と安全の確保に資するよう対応を進めるとともに、アレルギー疾患対策基本法をはじめとする関係法令等を遵守し、国および自治体が行うアレルギー疾患対策の啓発・知識の普及に協力するよう努める。\n・国や公的機関等が公表するアレルギー疾患対策に関する情報を共有し、活用していくことも重要である。\n（参考：厚生労働省「保育所におけるアレルギー対応ガイドライン（2019年版）」）", "varsUsed": []}, {"id": "u11_s3", "title": "食物アレルギー児の受け入れ方針", "type": "prose", "body": "{{園名}}における食物アレルギー児の対応方針を示す。\n\n■体験時の確認\n・アレルギーアンケート書類を渡し、アレルギーの有無を確認・聞き取りする。\n・呼吸困難やアナフィラキシーショックを起こすほどの強いアレルギー反応があり、エピペンを使用する場合は入園をお断りする。\n・アレルギーがある場合、スクールランチは注文できない。その場合は各自お弁当を持参してもらう。\n\n■当園の基本方針\n・当園では子どもの安全を第一に考え、アレルギーのある子どもに対して個別の特別対応はしていない。アレルギーの程度の大小にかかわらず、クラス内でできること・できないことを明確に伝え、保護者に理解してもらったうえで入園してもらう（ショートコースを含む）。\n・食物アレルギーの場合、ランチは友達と並んでとるため、他児がアレルギー物質を触った手で体に触れることも起こりうる。確実な安全確保が難しいため、個別に離れた席でランチをとることや、クラス内で個別に薬を塗ることなどはできない。この方針を入園前（参加前）に理解・納得してもらう必要がある。", "varsUsed": ["{{園名}}"]}, {"id": "u11_s4", "title": "入園手続き時の提出書類・確認事項", "type": "checklist", "body": "■入園手続き時の対応\n保護者と面談し、下記の書類を提出してもらう。\n\n□ プレスクール入園申込書\n□ 食物アレルギーに関する調査票\n□ 入園前健康診断（結果）\n□ 個人賠償責任保険 加入状況の写し\n□ 健康手帳\n□ 緊急時の投薬依頼書\n□ 緊急時の投薬委任（状）\n\n※上記の書類はスタッフ全員に周知し、確認する。", "varsUsed": []}, {"id": "u11_s5", "title": "食事・クッキング時のアレルギー対応", "type": "prose", "body": "■ランチタイムの対応\n・渡し間違いが起きないよう、アレルギー児のお弁当を最初に提供する。この際、2名以上で確認を行う。\n・他児との接触が起こりうることに注意しながら見守る。\n\n■クッキングクラス・食べ物提供時の対応\n・クッキングクラスやスクールで食べ物を提供する場合は、スクールのルールに基づき事故を防ぐよう対応する。\n・クッキングクラス実施の際は、どの過程まで参加できるのかを事前に保護者と確認する。アレルギー物質のある食材を使用している場合は、自宅から持参した代替品を食べてもらう。\n・アレルギーの程度によっては、保護者の判断でクッキングクラスに参加するか、遠くでの見学と代替品持参にするかを決めてもらう。\n\n■申込時のアレルギーチェックの強化\n・申込書のアレルギー欄を特に注意して確認する。アレルギーがある場合は、別紙の「アレルギー確認票」に次の内容を記入してもらう。\n ①アレルギーの程度\n ②症状\n ③症状が出る目安量\n ④なった場合の対処方法\n・ショートコースでは申込みフォーム確認の際にアレルギーの有無を必ず確認する。ある場合は、当園の方針やクッキングクラスで使用する材料・成分を確認してもらってから参加を検討してもらう。", "varsUsed": []}, {"id": "u11_s6", "title": "アレルギー反応が出た場合の対応と提出書類", "type": "prose", "body": "■食物アレルギー反応が出てしまった場合\n・入園時に保護者および主治医から提出してもらった書類を確認し、その指示に従う。\n・この場合、2名以上で書類を確認して対応する。\n・対応の際も、ほかの子どもたちへの対応を怠ってはならない。\n\n■関連して提出してもらう書類\n・保護者から：「保育所等におけるアレルギー疾患生活管理表」「緊急時個別対応票」\n・主治医から：「緊急時の投薬依頼委任状」「診断書」", "varsUsed": []}, {"id": "u11_s7", "title": "食物アレルギー発生時（対応チャート）", "type": "chart", "body": "■食物アレルギー発生時（対応チャート）\n①食物アレルギー物質を口に入れてしまった\n ※食べた物・量を確認しておく\n②可能な限り、口の中から取り出す\n③主治医の診断書に沿って対応する（薬の投薬など）\n④5分ごとに注意深く観察する\n⑤息苦しそうにしている／呼吸が困難／顔色が悪いときは救急車（119番）を呼ぶ\n ↓\n⑥保護者へ連絡し、病院へ向かってもらう", "varsUsed": []}, {"id": "u11_s8", "title": "給食等への異物混入発見時の対応（チャート）", "type": "chart", "body": "■給食等への異物混入発見時の対応\n（給食等を園児の前に出した後に発見した場合の流れ）\n①異物を発見\n②{{マネージャー}}に報告 → {{マネージャー}}は委託会社へ連絡\n③各クラスの給食等を一時ストップし、委託会社の指示を待つ\n\n■異物の特定（分岐）\n・特定できた場合\n └ 他の給食等への影響なし → 給食再開\n └ 他の給食等への影響あり → 給食ストップ／代替食の提供\n・特定できない場合 → 給食ストップ／代替食の提供\n\n■異物の主な特定方法（確認の視点）\n・野菜等の食材が入った袋の破れている部分ではないか\n・調理器具の破損ではないか\n・食材の一部ではないか（肉のすじ等）\n・調理段階から園児の前に出すまでの過程で混入の可能性のあるものではないか", "varsUsed": ["{{マネージャー}}"]}, {"id": "u11_s9", "title": "誤嚥・窒息・誤飲の基礎知識", "type": "prose", "body": "■食事中の誤嚥\n子どもの年齢・月齢によらず、普段食べている食材が窒息につながる可能性があることを認識して、食事の介助および観察をすることが大切である。\n\n■玩具・小物等による誤嚥\n口に入れると咽頭部や気管が詰まるなど窒息の可能性のある大きさ・形状の玩具や物については、乳幼児のいる室内に置かないことや、手に触れない場所に置くことを徹底する。\n\n■窒息につながることが多いものや事柄\n・気道の異物：直径3.2cm・長さ5.7cm以内のもの（参考：500円硬貨の直径は2.7cm）。玩具、硬貨、スーパーボールなど。\n・異物のない酸素欠乏（低酸素）：袋をかぶって遊ぶ、ぬいぐるみ、柔らかい布団など。\n・首が絞まる：マフラーの巻き込み、ヘルメットの紐、服やよだれかけの紐、フード付きの服、シートベルトなど。\n（参考：日本小児看護学会「子どもの事故防止ノート」）", "varsUsed": []}, {"id": "u11_s10", "title": "誤嚥・窒息につながりやすい食品", "type": "table", "body": "■誤嚥・窒息につながりやすい食品と配慮\n・球形の食材（乾いたナッツや豆類、丸い飴、プチトマト、白玉団子、うずら卵、さくらんぼ、ぶどう、ラムネ）\n → 提供する場合は危険のない大きさ・形状に切る\n・粘着性が高い食材（餅、白玉団子、ごはん）\n → 冷めると硬くなり付着性も高まる。冷凍するとさらに硬くなるので注意する\n・噛み切れない食材（こんにゃくゼリー、イカ、こんにゃく、海苔、ちくわ、たくあん、ソーセージ、せんべい）\n → 噛みやすい厚さや大きさに切る\n・パサパサした食材（パン、カステラ、イモ類）\n → 水分と一緒に提供する\n・過去に窒息事故の原因となった食材（生の人参、棒状のセロリ、肉、魚介類、リンゴ、ポップコーン、ベビー用おやつ）\n → 特に注意して提供の可否・形状を判断する", "varsUsed": []}, {"id": "u11_s11", "title": "誤嚥・窒息防止の日常チェックポイント", "type": "checklist", "body": "■日常チェックポイント（誤嚥・窒息防止）\n□ ゆっくり落ち着いて食べられるよう、子どもの意志に合ったタイミングで与える\n□ 子どもの口に合った量で与える（1回で多くの量を詰めすぎない）\n□ 食べ物を飲み込んだことを確認する（口の中に残っていないか注意する）\n□ 汁物など水分を適切に与える\n□ 食事の提供中に驚かせない\n□ 食事中に眠くなっていないか注意する\n□ 正しく座っているか注意する", "varsUsed": []}, {"id": "u11_s12", "title": "食事中の誤嚥（対応チャート）", "type": "chart", "body": "■食事中の誤嚥（対応チャート）\n①園児が誤嚥をした → 全スタッフに周知する\n②年齢に応じて異物の除去を試みる\n ・0歳〜：背部叩打法\n ・1歳未満：胸部突上げ法\n ・1歳〜：腹部突上げ法\n③異物が出たら、または途中で意識がなくなったら、身体を横向きにし口の中を確認する\n ・異物が出て呼吸がある場合 → 安静にし、身体を横に向けて経過を観察する\n④呼吸停止の場合 → 心肺蘇生 → AEDを使用する\n⑤救急隊が到着したら指示に従う", "varsUsed": []}, {"id": "u11_s13", "title": "誤嚥・窒息・誤飲時のスタッフ役割分担と記録項目", "type": "table", "body": "■スタッフの役割分担（誤嚥・窒息・誤飲発生時）\n(1) 救急要請（119番通報）\n(2) 誤嚥・誤飲をした園児の記録をとる\n(3) 全スタッフに周知\n(4) 救急車誘導\n(5) 他の園児が動揺しないような保育\n(6) 保護者に連絡\n(7) 受診時の持ち物準備\n(8) {{マネージャー}}（本部）・保育施設支援課に報告\n\n■記録をとる項目（観察・記録）\n・顔色：あり／なし\n・呼吸：あり／なし、乱れなど\n・けいれんの有無\n・アレルギー・持病などの有無\n・意識：ある／ない", "varsUsed": ["{{マネージャー}}"]}, {"id": "u11_s14", "title": "救急要請時の伝達事項と受診時の持ち物", "type": "prose", "body": "■救急要請（119番通報）時に伝える内容\n・「{{園名}}です」\n・「住所は{{住所}}です（{{目標物}}）」\n・園児の情報：〇歳、男／女\n・〇時〇分、どこで、何をしたか\n・現在の子どもの様子\n・意識：あり／なし\n・顔色：あり／なし\n\n■受診時の持ち物\n付き添い：原則、園児を保育していたスタッフ\n□ 健康手帳\n□ お金\n□ 園児の着替え一式・衣類\n□ タオル\n□ 誤飲・誤嚥の原因となったもの（誤飲時）\n□ 容器等\n□ 連絡用の携帯電話\n\n※対応後は本部（{{マネージャー}}）および保育施設支援課に報告する。", "varsUsed": ["{{園名}}", "{{住所}}", "{{目標物}}", "{{マネージャー}}"]}, {"id": "u11_s15", "title": "誤飲防止の日常チェックポイント", "type": "checklist", "body": "■日常チェックポイント（誤飲防止）\n□ 誤飲しやすいおもちゃがないか点検する（誤飲チェッカーなどを使う）\n□ ピアス、つけ爪、クリップ、ねじ、画鋲、ボタンやヘアピン等が落ちていないか点検する\n□ 子どもの手の届く場所に危険なもの（口に入るものなど）がないか点検する\n□ 液体ボトルには表示があるか確認する\n□ おもちゃのジュースには定期的に水を替え、漏れないようにする\n□ 菜園活動中や散歩中等に、作物や木の実等を口に入れていないか注意する\n□ ホウ酸団子や消毒液、のり、洗剤等は安全な場所に保管する\n□ 異年齢が一緒に遊ぶ場合は、状況に応じた玩具を選ぶ", "varsUsed": []}, {"id": "u11_s16", "title": "誤飲・窒息・緊急時対応（チャート）", "type": "chart", "body": "■誤飲・窒息・緊急時対応（チャート）\n①誤飲・誤嚥・窒息した → {{マネージャー}}へ報告\n②呼吸の有無を確認する\n\n【呼吸なし／呼吸困難が見られる場合】\n・除去を試みる\n ・0歳〜：背部叩打法\n ・1歳未満：胸部突上げ法\n ・1歳〜：腹部突上げ法\n・反応や呼吸がなくなったら心肺蘇生法を行う\n・異物が除去できても119番通報する\n\n【呼吸ありの場合】\n・誤飲したものに危険があるかを確認する\n ・危険がある場合 → 中毒110番に問い合わせ（{{中毒110番TEL}}）、指示に従う\n ・危険はない場合 → 経過観察（変化があればすぐに病院へ）、指示に従う\n\n■危険な誤飲物（要注意）\n灯油、ベンジン、除光液、農薬、殺虫剤、ネズミ駆除剤、たばこ、ボタン電池、ガラスの破片、画鋲、ピアス、硬貨 など\n → これらは（何もせずに）119番通報し、指示をあおぐ\n\n※病院で処置を受けた後、保護者・保育施設支援課へ報告する。\n（参考：名古屋市消防局「あなたが救える命のために」、応急手当パンフレット）", "varsUsed": ["{{マネージャー}}", "{{中毒110番TEL}}"]}, {"id": "u11_s17", "title": "誤飲時の把握チェックと救急要請の目安", "type": "checklist", "body": "■誤飲した時の把握チェック\n□ 何を誤飲したのか（種類・量）\n□ 口の中に残っているものはないか（あったら出す）\n□ 咳きこみ・呼吸の有無\n□ 飲んだ時刻\n□ 子どもの体重\n□ 誤飲したものを保存しておく\n\n■救急車を呼ぶ・緊急を要する目安\n① 窒息・顔色が青白い\n② 目を白黒させる\n③ ぐったりして呼びかけてもぼんやりしている\n④ 呼吸困難\n⑤ けいれん\n⑥ 意識不明", "varsUsed": []}]}, {"id": "u12", "title": "睡眠SIDS・水遊び", "sections": [{"id": "u12_s1", "title": "睡眠中の事故防止（SIDS対策）", "type": "prose", "body": "■ 基本の2大原則\n睡眠中の死亡事故を防ぐためには、次の2点が大切である。\n①仰向けに寝かせる\n②一人にしない\n\n■ 見守りのポイント\n・乳児だけでなく1歳以上児も、発達の状況に合わせて仰向けに寝かせる。\n・預け始めの時期は、特にきめ細やかで注意深い見守りが重要である（統計的に、預け始めに死亡事故が起こることが多い）。\n・体動センサー等の機器の使用の有無にかかわらず、必ずスタッフの目で見守り、定期的に子どもの呼吸・体位・睡眠状態を確認して記録する（→睡眠チェック表）。\n・睡眠前には口の中に異物がないか必ず確認する（ランチ後の確認に加え、寝かせるスタッフが再度確認するダブルチェックを行う）。\n\n■ 睡眠環境の注意\n・寝ている子どものまわりに何も置かない。\n・柔らかい布団やぬいぐるみ等を使用しない。\n・ヒモ、またはヒモ状の物にも十分注意する（例：よだれかけのヒモ、布団カバー内側のヒモ、布団周りのコード等）。", "varsUsed": []}, {"id": "u12_s2", "title": "水遊び 施設・衛生の管理", "type": "checklist", "body": "■ 施設の管理\n□ 水遊び場・プール内・プールサイドの安全点検をし、危険物を取り除いておく\n□ 衛生管理は、定期点検・日常検査によって適切に行う\n□ 日常の維持管理について、水質・設備の清潔・使用状況をチェックする（消毒、換水、補給水、水温、気温）\n□ 使用後はすぐに排水し、水を溜めておかない\n□ 水遊び場管理日誌に記入する", "varsUsed": []}, {"id": "u12_s3", "title": "水遊び時の安全管理・監視", "type": "prose", "body": "・園児の健康に留意し、健康状態を観察する。\n・監視をする者、遊びの指導を行う者など、役割分担を明確にする。\n・監視者は監視に専念し、全域をくまなく監視する。\n・規則的に目線を動かしながら監視し、動かない子どもや不自然な動きをしている子どもがいないか確認する。\n・安全上の必要事項を園児に指導する。\n・十分な監視体制が確保できない場合は、水遊びの中止も選択肢とする。\n・子どもの様子や動きに十分気をつけて指導する。\n・異常があるときは、直ちに水からあげる（ひどく寒がる、水に入るのを嫌がる、顔色が悪い、唇が紫色になる、皮膚全体に鳥肌がたつ、元気がなくなる、動作が鈍くなる等）。\n・適当に休息・保温しながら遊ぶ。\n・時間的余裕をもって行う。\n・水遊び後も、異常がないか注意する。", "varsUsed": []}, {"id": "u12_s4", "title": "水遊びの安全対策", "type": "prose", "body": "・心肺蘇生法、応急手当及び119番通報を含めた緊急事態への対応について、教育（研修）の場を設ける。\n・緊急時の対応を整理して共有しておくとともに、日常において実践的な訓練を行う。\n・簡易プールの管理（設置、保存等）には十分気をつける。", "varsUsed": []}, {"id": "u12_s5", "title": "水遊び中の事故対応（基本）", "type": "prose", "body": "・緊急事態が起こった時には、直ちに助けを呼び、応急手当を開始する。\n・AEDを使用する場合、体が水で濡れていたら体をふく。床面が濡れていない場所に移動して使用する。\n・チアノーゼが出ていたら、体温が低下しないよう保温する。", "varsUsed": []}, {"id": "u12_s6", "title": "水遊び中の事故対応フロー（チャート）", "type": "chart", "body": "■ 対応フロー（緊急事態が起こったら）\n①{{マネージャー}}・本部・他のスタッフに報告／AED用意\n②119番通報・救急車要請\n③保護者に連絡\n④応急手当\n　・異物の確認\n　・気道確保\n　・呼吸の確認\n　・心肺蘇生法の実施\n　※応援者がいない時は、まず119番通報してから心肺蘇生法を行う\n⑤記録の記入／他児の保育\n⑥救急車の到着\n\n※AEDを使用する場合、水で体が濡れていたら体を拭く。床面が濡れていない場所へ移動して使用する。\n※チアノーゼが出ていたら、体温が低下しないように保温する。\n\n■ 事後対応\n・保育施設支援課に報告する\n・保護者へ説明する\n・マスコミ対応は窓口を一本化する\n\n■ 受診\n・付き添い：原則、園児を保育していたスタッフ\n・持ち物：健康手帳、衣類等、タオル、連絡用携帯電話、お金\n・参照：管轄消防署（{{消防署}}）等が実施する救命講習・応急手当の資料（『あなたが救える命のために』等）", "varsUsed": ["{{マネージャー}}", "{{消防署}}"]}]}, {"id": "u13", "title": "怪我・頭部・発熱けいれん", "sections": [{"id": "u13_s1", "title": "怪我予防 日常チェックポイント", "type": "checklist", "body": "■園外・散歩\n□危険箇所を整備し、安全に遊べるようにする\n□危険な物、壊れた物がないか定期的に点検する\n□園児の服装を適切にする\n□スタッフは子ども全体を把握できる位置に留意し、死角を作らない\n□近隣の医療機関の一覧表を作成する（休診日・診療時間も把握しておく）\n□散歩マップ・コースを作成する\n□年齢に合ったコースを作成する\n□引率の人数は余裕を持つ\n□個々の子どもの人数や状況を把握する\n□救急用品を持っていく\n□防犯ブザーやホイッスルを持つ\n□遊具の使い方を指導する\n□交通ルールを指導する\n□日誌などに記入する\n\n■室内\n□転倒防止・落下防止・飛散防止対策をする\n□棚の上など、落下すると危険な物を置かない\n□物を整理する\n□出入口に物を置かない\n□おもちゃを清潔に保つ\n□おもちゃの定期点検をする\n□子どもの手が届く位置にはコンセントカバーをつける\n□床の濡れや床の小さなゴミにも注意する", "varsUsed": []}, {"id": "u13_s2", "title": "怪我をしたときの対応フロー", "type": "chart", "body": "■初動\n①{{マネージャー}}・他スタッフへ報告\n②応急手当を行う\n③怪我の状態を確認する\n\n■確認結果により3つに分岐\n【受診の必要なし】\n→保護者に口頭で報告\n\n【受診が必要】\n→受診先を決め、保護者へ連絡\n→受診\n→保護者に報告\n\n【救急車要請】\n→救急車を要請\n→保護者に連絡\n→受診\n\n■共通（いずれの場合も）\n・記録をとる\n・{{運営会社}}本部・{{市区町村}}保育施設支援課に報告する", "varsUsed": ["{{マネージャー}}", "{{運営会社}}", "{{市区町村}}"]}, {"id": "u13_s3", "title": "頭を打った後の注意", "type": "prose", "body": "頭を強く打った後は、直後には何もなくとも、時間がたってから頭にさまざまな変化を起こすことがある。特に頭蓋骨の内側に出血が起こった場合には、生命に危険が及ぶこともある。頭蓋骨内出血の症状は打った直後に起こることもあれば、何時間かたって起こってくることもあるため、今何ともなくても注意しなければならない。\n\n■特に、次のような時はすぐに脳神経外科を受診する\n①ぼんやりとして、放っておくとすぐ寝入ってしまい、起こしてもなかなか起きない時（意識障害の始まり）\n②頭痛やめまいがだんだん強くなってくる時\n③吐き気や嘔吐が食事に関係なく続く時\n④けいれん（ひきつけ）を起こした時\n⑤手足がしびれたり、動かしにくくなった時\n⑥ものが二重に見える時\n\n頭を強く打った後、約1日（24時間）は上記の点に注意して観察する必要がある。\n\n■慢性硬膜下血腫\nまれに、頭を打ってから1〜2か月して頭の中に血液がたまってくることがある（慢性硬膜下血腫）。次のような症状がみられたら脳神経外科を受診する。\n①だんだんぼうっとしてくる（認知症状）\n②手・足の脱力\n③だんだん頭痛が強くなる\n\n参考：かかりつけ医（内科・外科・脳神経外科）＝{{かかりつけ医}}", "varsUsed": ["{{かかりつけ医}}"]}, {"id": "u13_s4", "title": "受診のめやす", "type": "prose", "body": "次のような場合は受診を検討する。\n①出血の多い傷\n②動物に噛まれた時\n③ひじが痛くて動かない\n④ねん挫で腫れ・皮膚の変色・痛みがある\n⑤脱臼で、だらりとして動かさない・痛みがある\n⑥骨折で、腫れ・皮膚の変色・痛みがある\n⑦目の外傷、異物、痛みが取れない、白目の出血、物が見えない・見えにくい\n⑧頭部打撲\n⑨顔面などの怪我、ひっかき\n⑩歯が欠ける、強く打ってグラつく、抜ける", "varsUsed": []}, {"id": "u13_s5", "title": "救急要請のめやす", "type": "prose", "body": "次のような場合はためらわず救急車（119番）を要請する。\n①頭部の打撲…意識がない、吐く、けいれんがある、呼吸が乱れる など\n②けいれんが5分以上続く\n③呼吸困難時…アナフィラキシーショック、喘息、異物誤嚥\n④出血の多いけが", "varsUsed": []}, {"id": "u13_s6", "title": "怪我・救急時のスタッフ役割分担", "type": "table", "body": "各役割の担当は各園で割り当てる（既定のロール名を記載）。\n・救急車要請：{{通報連絡担当}}\n・けがをした園児の記録をとる：{{救護担当}}\n・全スタッフに周知：{{責任者}}\n・救急車誘導：{{避難誘導担当}}\n・他の園児が動揺しないように保育する：{{避難誘導担当}}\n・保護者に連絡：{{通報連絡担当}}\n・受診時の持ち物準備：{{非常持出担当}}\n・{{マネージャー}}（本部）・保育施設支援課に報告：{{責任者}}", "varsUsed": ["{{通報連絡担当}}", "{{救護担当}}", "{{責任者}}", "{{避難誘導担当}}", "{{非常持出担当}}", "{{マネージャー}}"]}, {"id": "u13_s7", "title": "救急車要請時（119番通報）の伝え方", "type": "prose", "body": "子機を使用して119番通報する。次の内容を落ち着いて伝える。\n\n●{{園名}}です。住所は{{住所}}です（{{目標物}}）。\n●園児が〇歳、男・女\n●〇時〇分、（どこで）〇〇をしました。\n●現在の子どもの様子は…\n・意識：あり・なし\n・顔色：良・悪\n・呼吸：あり・なし（乱れ など）\n・けいれんの有無\n・行った応急手当\n・アレルギー、持病（かかりつけ）など\n\n参照：消防局作成の救急ガイド（例『あなたが救える命のために』）", "varsUsed": ["{{園名}}", "{{住所}}", "{{目標物}}"]}, {"id": "u13_s8", "title": "発熱 日常チェックポイント", "type": "checklist", "body": "□入園時、保護者に{{体温基準}}でお迎え要請することを伝える\n□登園時に、保護者の前で体温チェックをする\n□連絡帳や登園時の保護者からの伝達事項を全スタッフに周知する\n□保育室の温度・湿度・換気・清潔に留意する\n□園児の平熱を把握する\n□きめ細やかな視診をする\n□{{体温基準}}以上の発熱は家庭と連絡を取り合い、お迎え要請をする", "varsUsed": ["{{体温基準}}"]}, {"id": "u13_s9", "title": "発熱時の対応フロー", "type": "chart", "body": "■園児が{{体温基準}}以上の発熱\n①検温時間と体温を、連絡帳・アテンダンス・業務日誌に記入する\n②保護者へ迎えに来てもらうよう電話する（{{マネージャー}}へ報告）\n・検温時間、体温、症状を保護者へ伝える\n・保護者（誰が）が何時に迎えに来られるかを他スタッフへも周知する\n③保護者へ引渡し\n・症状・体温を再度報告する\n\n※熱性けいれんを持つ園児は、迎えに来てもらう体温基準が個別に異なるため、個人情報を確認して対応する。\n※早退した時間・体温・症状を、アテンダンスシート、当日の業務日誌、ヒヤリハットに記入する。（感染症だった場合は、発覚した時点でヒヤリハット（早退の記録）に感染症名を追記する）", "varsUsed": ["{{体温基準}}", "{{マネージャー}}"]}, {"id": "u13_s10", "title": "熱性けいれん 日常チェックポイント", "type": "checklist", "body": "□入園時、保護者に熱性けいれんの詳細書類を提出してもらう\n□登園時に、保護者の前で体温チェックをする\n□連絡帳や登園時の保護者からの伝達事項を全スタッフに周知する\n□保育室の温度・湿度・換気・清潔に留意する\n□園児の平熱を把握す
