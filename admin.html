<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>未来WA／EduGrow 運営管理</title>
<style>
:root{
  --bg:#F4F5F7; --card:#FFF; --ink:#131A22; --ink2:#3C4654; --mute:#6C7686;
  --line:#E2E5EA; --line2:#EFF1F4;
  --eg:#0B5F8F; --eg-d:#063E5F; --eg-w:#E9F1F7;
  --ok:#1D7A56; --ok-w:#E5F3ED;
  --warn:#A26A12; --warn-w:#FBF1DE;
  --bad:#A3302F; --bad-w:#FAE9E8;
  --accent:#B4541F; --accent-w:#FBEEE6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:13.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ── 骨組み ── */
.top{
  background:linear-gradient(180deg,var(--eg-d),var(--eg));color:#fff;
  padding:0 18px;display:flex;align-items:center;gap:14px;height:52px;
  position:sticky;top:0;z-index:60;box-shadow:0 1px 6px rgba(0,0,0,.14)
}
.top .lg{font-weight:800;font-size:15px;letter-spacing:-.01em}
.top .sub{font-size:11px;opacity:.72;letter-spacing:.04em}
.top .sp{margin-left:auto}
.top button{
  background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:7px;
  padding:6px 13px;font-size:12px;cursor:pointer
}
.top button:hover{background:rgba(255,255,255,.26)}
.nav{
  background:var(--card);border-bottom:1px solid var(--line);padding:0 18px;
  display:flex;gap:2px;position:sticky;top:52px;z-index:55;overflow-x:auto
}
.nav button{
  background:none;border:none;padding:11px 15px;cursor:pointer;font-size:13px;
  color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600
}
.nav button.on{color:var(--eg);border-bottom-color:var(--eg)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
@media(max-width:640px){.wrap{padding:16px 12px 70px}.top{padding:0 12px}.nav{padding:0 12px}}

h2{font-size:17px;font-weight:800;margin:0 0 3px;letter-spacing:-.01em}
.lead{color:var(--mute);font-size:12.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-bottom:13px}
.card h3{font-size:14px;font-weight:800;margin:0 0 11px}

/* ── 数字タイル ── */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
.tile .k{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.03em}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.2}
.tile .u{font-size:12px;font-weight:700;color:var(--mute);margin-left:3px}
.tile .n{font-size:11.5px;color:var(--mute);margin-top:4px}

/* ── 表 ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);
    border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
th{
  text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.05em;color:var(--mute);
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--line2)
}
td{padding:11px 13px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--eg-w)}
td.r,th.r{text-align:right}

.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;white-space:nowrap}
.p-lead{background:var(--line2);color:var(--mute)}
.p-talk{background:var(--warn-w);color:var(--warn)}
.p-mon{background:var(--eg-w);color:var(--eg)}
.p-live{background:var(--ok-w);color:var(--ok)}
.p-end{background:var(--bad-w);color:var(--bad)}
.plan{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:5px;
      background:var(--accent-w);color:var(--accent);white-space:nowrap}

/* ── 入力 ── */
.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
.f input,.f select,.f textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff
}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--eg);outline-offset:-1px;border-color:var(--eg)}
.grid2{display:grid;gap:0 13px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:0 13px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{
  background:var(--eg);color:#fff;border:none;border-radius:8px;padding:9px 17px;
  font-weight:700;cursor:pointer;font-size:13px
}
.btn:hover{background:var(--eg-d)}
.btn.sec{background:#fff;color:var(--eg);border:1px solid var(--eg)}
.btn.sec:hover{background:var(--eg-w)}
.btn.warn{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.warn:hover{background:var(--bad-w)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.msg{font-size:12px;margin-left:4px}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-w);color:var(--warn);
      padding:10px 13px;border-radius:0 8px 8px 0;font-size:12px;line-height:1.75;margin:0 0 12px}
.note.bad{border-left-color:var(--bad);background:var(--bad-w);color:var(--bad)}
.note.ok{border-left-color:var(--ok);background:var(--ok-w);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:34px 10px;font-size:13px}

/* ── ログイン ── */
.login{max-width:390px;margin:9vh auto;padding:0 18px}
.login .card{padding:26px 24px}
.login h1{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.login .s{color:var(--mute);font-size:12.5px;margin:0 0 20px}
.err{background:var(--bad-w);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:13px;display:none}

/* ── 明細 ── */
.lines{border-top:1px solid var(--line);margin-top:10px}
.lines div{display:flex;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lines div:last-child{border-bottom:none}
.lines .l{color:var(--ink2)}
.lines .y{margin-left:auto;font-weight:700}
.lines .tot{border-top:2px solid var(--ink);margin-top:2px;padding-top:9px;font-size:14px;font-weight:800}
.back{background:none;border:none;color:var(--eg);cursor:pointer;font-size:13px;font-weight:700;padding:0;margin-bottom:12px}

/* ── 契約書の表示と印刷 ────────────────── */
#docWrap{position:fixed;inset:0;z-index:900;background:rgba(12,18,26,.5);
  overflow-y:auto;padding:26px 16px;display:none}
#docPaper{max-width:820px;margin:0 auto;background:#fff;color:#111;
  padding:46px 52px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;line-height:1.95;font-size:14px}
#docPaper h1{font-size:20px;text-align:center;margin:0 0 22px;font-weight:600;letter-spacing:.08em}
#docPaper h2{font-size:14.5px;font-weight:700;margin:22px 0 6px}
#docPaper p{margin:0 0 8px}
#docPaper ol{margin:0 0 8px;padding-left:1.6em}
#docPaper li{margin-bottom:5px}
#docPaper table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px}
#docPaper th,#docPaper td{border:1px solid #999;padding:6px 9px;text-align:left}
#docPaper th{background:#eee;font-weight:700}
#docPaper .note{background:#FBEBEB;border:1px solid #E3C0C0;color:#8A2B2B;
  font-size:11.5px;line-height:1.8;padding:8px 11px;border-radius:5px;margin:6px 0 12px}
#docPaper .sign{margin-top:34px;line-height:2.6}
#docPaper .chk{line-height:2.4}
#docBar{max-width:820px;margin:0 auto 12px;display:flex;gap:9px;justify-content:flex-end}
@media print{
  body>*{display:none!important}
  #docWrap{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  #docBar{display:none!important}
  #docPaper{box-shadow:none;border-radius:0;padding:0;max-width:none}
  #docPaper .note{display:none}   /* 注記は社内向けなので印刷しない */
}
</style>
</head>
<body>
<div id="root"></div>
<div id="docWrap"><div id="docBar"><button class="btn sec sm" id="docClose">閉じる</button><button class="btn sm" id="docPrint">印刷する（PDFで保存できます）</button></div><div id="docPaper"></div></div>

<script>
/* ══════════════════════════════════════════
   未来WA／EduGrow 運営管理

   園をまたいで見られる唯一の画面。園の職員も保護者もここには入れない。
   お金の計算はすべてサーバ側（src/admin.js）で行い、ここでは表示だけ。
   画面ごとに違う金額が出ないようにするため。
   ══════════════════════════════════════════ */

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function yen(n){return n==null?'—':'¥'+Math.round(n).toLocaleString('ja-JP');}
function $(id){return document.getElementById(id);}

/* ── 接続 ───────────────────────────── */
var API={
  base:function(){return String(localStorage.getItem('adm_api')||'').replace(/\/$/,'');},
  setBase:function(v){localStorage.setItem('adm_api',String(v||'').replace(/\/$/,''));},
  /* 札はこのタブの中だけ。端末に残さない。 */
  token:function(){try{return sessionStorage.getItem('adm_token')||'';}catch(e){return '';}},
  setToken:function(t){try{t?sessionStorage.setItem('adm_token',t):sessionStorage.removeItem('adm_token');}catch(e){}},
  call:function(m,p,body){
    var h={'Content-Type':'application/json'};
    if(API.token())h.Authorization='Bearer '+API.token();
    return fetch(API.base()+p,{method:m,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401){API.setToken('');throw new Error('ログインの有効期限が切れました。もう一度ログインしてください。');}
        if(!r.ok)throw new Error(j.error||('通信に失敗しました（'+r.status+'）'));
        return j;});});
  }
};
/* ?api=… で接続先を入れられる。入れたらURLから消す。 */
(function(){try{
  var q=new URLSearchParams(location.search),a=q.get('api');
  if(a!==null){API.setBase(a);q.delete('api');
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));}
}catch(e){}})();

var view='home', openId=null, DATA={}, PLANS={}, OPTS={}, UPGRADE={};

/* ── 見た目の部品 ────────────────────── */
function statusPill(s){
  var m={'見込み':'p-lead','商談中':'p-talk','モニター':'p-mon','契約中':'p-live','解約予定':'p-end','解約済':'p-end'};
  return '<span class="pill '+(m[s]||'p-lead')+'">'+esc(s||'見込み')+'</span>';
}
function planTag(p){
  var n=(PLANS[p]&&PLANS[p].name)||p||'—';
  return '<span class="plan">'+esc(n)+'</span>';
}

/* ── ログイン ────────────────────────── */
function loginHTML(){
  return '<div class="login"><div class="card">'
    +'<h1>運営管理</h1><div class="s">未来WA ／ EduGrow</div>'
    +'<div class="err" id="e"></div>'
    +'<div class="f"><label>接続先</label><input id="ap" value="'+esc(API.base())+'" placeholder="https://…"></div>'
    +'<div class="f"><label>メールアドレス</label><input id="em" type="email" autocomplete="username"></div>'
    +'<div class="f"><label>パスワード</label><input id="pw" type="password" autocomplete="current-password"></div>'
    +'<button class="btn" id="go" style="width:100%;margin-top:6px;">ログイン</button>'
    +'<div style="margin-top:15px;font-size:11.5px;color:var(--mute);line-height:1.75;">'
    +'この画面は運営のためのものです。園の職員・保護者のアカウントでは入れません。</div>'
    +'</div></div>';
}
function wireLogin(){
  function go(){
    var b=$('go'),e=$('e');
    API.setBase($('ap').value.trim());
    if(!API.base()){e.textContent='接続先を入れてください。';e.style.display='block';return;}
    e.style.display='none';b.disabled=true;b.textContent='確認中…';
    API.call('POST','/admin/login',{email:$('em').value.trim(),password:$('pw').value})
      .then(function(j){
        API.setToken(j.token);DATA.me=j.admin;view='home';
        /* 料金表を先に読む。読めなくても画面は出す。 */
        return API.call('GET','/admin/plans')
          .then(function(p){PLANS=p.plans;OPTS=p.options||{};UPGRADE=p.upgrade||{};},function(){})
          .then(function(){render();});
      })
      .catch(function(x){b.disabled=false;b.textContent='ログイン';
        e.textContent=x.message;e.style.display='block';});
  }
  $('go').onclick=go;
  $('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')go();});
}

/* ── 全体の骨組み ───────────────────── */
function shell(inner){
  var tabs=[['home','ホーム'],['tenants','園の一覧'],['bill','請求'],['docs','書類'],['me','設定']];
  return '<div class="top"><div><div class="lg">運営管理</div>'
    +'<div class="sub">未来WA ／ EduGrow</div></div>'
    +'<div class="sp"></div><button id="out">ログアウト</button></div>'
    +'<div class="nav">'+tabs.map(function(t){
      return '<button data-v="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('')+'</div>'
    +'<div class="wrap">'+inner+'</div>';
}

/* ── 請求 ─────────────────────────────
   毎月の請求を、運営が月を選んで手で流す。
   元栓が閉じているあいだは、金額を出して記録するだけで決済は頼まない。 */
var billMonth=(function(){var d=new Date(Date.now()+9*3600*1000);
  return d.toISOString().slice(0,7);})();
var billRun=null;

function billStatusCard(){
  var b=DATA.bstat;
  if(!b)return '';
  var on=b.charging;
  return '<div class="card" style="border-color:'+(on?'#E0B4B4':'#C7DFA6')+';background:'+(on?'#FBEBEB':'#EEF5E6')+';">'
    +'<div style="font-weight:800;font-size:14px;color:'+(on?'#9C3535':'#2F6B33')+';">'
    +(on?'⚠ 実際に決済します':'いまは決済しません（練習用）')+'</div>'
    +'<div style="font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.9;">'
    +'鍵：'+(b.keyReady?'設定ずみ（'+esc(b.mode)+'）':'未設定')
    +'　／　通知の合言葉：'+(b.webhookReady?'設定ずみ':'未設定')
    +'<br>元栓 BILLING_ENABLED：'+(b.enabled?'開いている':'閉じている')
    +'　／　練習用 BILLING_DRY_RUN：'+(b.dryRun?'はい':'いいえ')
    +'<br>'+(on
      ? 'この状態で「請求を作る」を押すと、実際にカードへ請求が行きます。'
      : '「請求を作る」を押しても、金額を出して記録するだけです。カードには請求されません。')
    +'</div></div>';
}

function billHTML(){
  var d=DATA.binv||{}, rows=d.invoices||[];
  var h=billStatusCard()
    +'<div class="card"><h2>請求</h2><div class="lead">月を選んで、その月の請求を作ります</div>'
    +'<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;">'
    +'<label style="display:block;"><span style="font-size:11.5px;color:var(--mute);display:block;margin-bottom:4px;">対象の月</span>'
    +'<input type="month" id="bm" value="'+esc(billMonth)+'"></label>'
    +'<button id="bRun" class="btn">この月の請求を作る</button>'
    +'<button id="bRedo" class="btn sec sm">作り直す（未送信のみ）</button>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--mute);margin-top:10px;line-height:1.9;">'
    +'同じ月を二度押しても、請求が二重になることはありません。'
    +'「作り直す」は、まだ送っていないものだけを最新の人数で計算し直します。'
    +'</div></div>';

  if(billRun){
    var r=billRun;
    h+='<div class="card"><h2>'+esc(r.month)+' の結果</h2>'
      +'<div style="font-size:13px;margin-top:8px;line-height:1.9;">'
      +'作った '+r['作った件数']+'件　／　とばした '+r['とばした件数']+'件'
      +'　／　合計の決済額 <b>'+yen(r['合計の決済額'])+'</b></div>'
      +(r['とばしたもの']&&r['とばしたもの'].length
        ? '<div style="margin-top:10px;font-size:12px;color:var(--mute);line-height:1.9;">'
          +r['とばしたもの'].map(function(x){
            return '園 '+esc(x.tenant_id)+'：'+esc(x.skipped);}).join('<br>')+'</div>'
        : '')
      +'</div>';
  }

  h+='<div class="card"><h2>'+esc(d.month||billMonth)+' の請求一覧'
    +'<span style="float:right;font-weight:400;font-size:12.5px;color:var(--mute);">'
    +(d['件数']||0)+'件　合計 '+yen(d['合計の決済額'])+'</span></h2>'
    +(rows.length
      ? '<div class="tw"><table><thead><tr>'
        +'<th>園</th><th>種類</th><th class="r">在籍</th><th class="r">超過</th>'
        +'<th class="r">税別</th><th class="r">消費税</th><th class="r">決済額</th>'
        +'<th>状態</th><th></th></tr></thead><tbody>'
        +rows.map(function(x){
          return '<tr>'
            +'<td><b>'+esc(x.tenant_name)+'</b>'
              +'<div style="font-size:11px;color:var(--mute);">'+esc(x.tenant_code)+'</div></td>'
            +'<td>'+billKind(x.kind)+'</td>'
            +'<td class="r num">'+(x.seats||0)+'</td>'
            +'<td class="r num">'+(x.billable||0)+'</td>'
            +'<td class="r num">'+yen(x.net_yen)+'</td>'
            +'<td class="r num">'+yen(x.tax_yen)+'</td>'
            +'<td class="r num"><b>'+yen(x.gross_yen)+'</b></td>'
            +'<td>'+billState(x.status)+'</td>'
            +'<td class="r">'+(x.status==='planned'
              ? '<button data-bx="'+esc(x.id)+'" class="btn sm warn">取り消す</button>' : '')+'</td>'
            +'</tr>'
            +'<tr><td colspan="9" style="padding-top:0;border-top:0;">'
            +'<div style="font-size:11.5px;color:var(--mute);line-height:1.8;">'
            +(x.lines||[]).map(function(l){
              return esc(l.label)+'　'+yen(l.yen);}).join('　／　')
            +'</div></td></tr>';
        }).join('')+'</tbody></table></div>'
      : '<div class="empty">この月の請求はまだありません</div>')
    +'</div>';
  return h;
}

function billKind(k){
  var m={initial:['初回（日割り）','#EEEDFE','#3C3489'],
         monthly:['毎月','#E6F1FB','#123E6B'],
         cancel:['解約の残債','#FBEBEB','#9C3535']}[k]||[k,'#EEF1F3','#4E5C66'];
  return '<span class="pill" style="background:'+m[1]+';color:'+m[2]+';">'+esc(m[0])+'</span>';
}
function billState(st){
  var m={planned:['作成ずみ','#FBF1DE','#96600A'],
         sent:['送信ずみ','#E6F1FB','#123E6B'],
         paid:['入金ずみ','#E9F2E7','#2F6B33'],
         failed:['決済失敗','#FBEBEB','#9C3535'],
         canceled:['取り消し','#EEF1F3','#4E5C66']}[st]||[st,'#EEF1F3','#4E5C66'];
  return '<span class="pill" style="background:'+m[1]+';color:'+m[2]+';">'+esc(m[0])+'</span>';
}

/* ── ホーム ─────────────────────────── */
function homeHTML(){
  var k=DATA.kpi;
  if(!k)return '<div class="empty">読み込んでいます…</div>';
  var st=k.byStatus||{};

  else h+='<ol>'+a.b.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  if(a.note) h+='<div class="note">【要確認】'+esc(a.note)+'</div>';
  return h;
}

    j.arts.forEach(function(a,i){ h+=docArt(a,i+1); });
    if(j.plans&&j.plans.length){
      h+='<h2>別表　料金</h2>'
        +'<table><thead><tr><th>プラン</th><th>月額（園1施設あたり）</th><th>園児数</th></tr></thead><tbody>'

    if(j.to)h+='<p style="font-size:15px;font-weight:700;margin:0 0 4px;">'+esc(j.to)+'</p>';
    if(j.lead)h+='<p style="margin:0 0 14px;">'+esc(j.lead)+'</p>';
    if(j.info&&j.info.length){
      h+='<table><tbody>'+j.info.map(function(r){
        return '<tr><th style="width:34%;">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';
      }).join('')+'</tbody></table>';
    }
    j.tables.forEach(function(t){
      h+='<h2>'+esc(t.h)+'</h2>'
        +'<table><thead><tr><th>内訳</th><th style="width:30%;text-align:right;">金額（税別）</th></tr></thead><tbody>'
        +t.rows.map(function(r){
          return '<tr><td>'+esc(r.label)+'</td><td style="text-align:right;">'+esc(r.yen)+'</td></tr>';
        }).join('')
        +(t.total?'<tr><th>小計（税別）</th><th style="text-align:right;">'+esc(t.total.net)+'</th></tr>'
          +'<tr><th>消費税</th><th style="text-align:right;">'+esc(t.total.tax)+'</th></tr>'
          +'<tr><th style="background:#DDE9E4;">ご請求額（税込）</th>'
          +'<th style="text-align:right;background:#DDE9E4;font-size:15px;">'+esc(t.total.gross)+'</th></tr>':'')
        +'</tbody></table>';
      if(t.note)h+='<p style="font-size:11.5px;color:#666;margin:-6px 0 12px;">'+esc(t.note)+'</p>';
    });
    (j.tail||[]).forEach(function(x){
      h+='<h2>'+esc(x.h)+'</h2><ol>'+x.b.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ol>';
    });
    h+='<div class="sign"><p>'+esc(j.company.name)+'</p><p>'+esc(j.company.addr)+'</p>'
      +'<p>'+esc(j.company.rep)+'</p><p>'+esc(j.company.mail)+'</p></div>';
  }

  if(j.checks){
    j.checks.forEach(function(c){
      h+='<h2>'+esc(c.h)+'</h2><div class="chk">'
        +c.items.map(function(x){return '<p>　□　'+esc(x)+'</p>';}).join('')+'</div>';
    });
    (j.tail||[]).forEach(function(t){
      h+='<h2>'+esc(t.h)+'</h2>'+t.b.map(function(x){return '<p>'+esc(x)+'</p>';}).join('');
    });
    h+='<div class="sign"><p>　　　　年　　月　　日</p><p>&nbsp;</p>'
      +'<p>施設名　　　　　　　　　　　　　　　　　　　　　</p>'
      +'<p>所在地　　　　　　　　　　　　　　　　　　　　　</p>'
      +'<p>代表者　　　　　　　　　　　　　　　　　　　　印</p>'
      +'<p>担当者　　　　　　　　　　　　　　　　　　　　　</p>'
      +'<p>&nbsp;</p>'
      +'<p style="font-size:12px;">（照会先）'+esc(j.company.name)+'　'+esc(j.company.mail)+'</p></div>';
  }

  h+='<p style="font-size:11px;color:#888;margin-top:26px;">'
    +esc(j.company.name)+'　作成日 '+esc(j.generatedOn)+'</p>';

  $('docPaper').innerHTML=h;
  $('docWrap').style.display='block';
  $('docWrap').scrollTop=0;
}

/* ── 読み込みと描画 ─────────────────── */
function load(){
  if(view==='home')  return API.call('GET','/admin/kpi').then(function(j){DATA.kpi=j;});
  if(view==='tenants')return API.call('GET','/admin/tenants').then(function(j){DATA.tenants=j.tenants;});
  if(view==='one')   return API.call('GET','/admin/tenants/'+openId).then(function(j){DATA.one=j;});
  if(view==='docs')  return API.call('GET','/admin/documents').then(function(j){DATA.docs=j.documents;});
  if(view==='bill')  return Promise.all([
      API.call('GET','/admin/billing/status').then(function(j){DATA.bstat=j;}),
      API.call('GET','/admin/billing/invoices?month='+encodeURIComponent(billMonth))
        .then(function(j){DATA.binv=j;})
    ]);
  return Promise.resolve();
}

/* 契約書の表示は画面の外側にあるので、描き直しの外で1度だけ配線する */
(function(){
  var t=setInterval(function(){
    if(!$('docClose'))return;
    clearInterval(t);
    $('docClose').onclick=function(){ $('docWrap').style.display='none'; };
    $('docPrint').onclick=function(){ window.print(); };
  },120);
})();

function render(){
  var r=$('root');
  if(!API.base()||!API.token()){r.innerHTML=loginHTML();wireLogin();return;}
  var inner={home:homeHTML,tenants:tenantsHTML,one:tenantHTML,bill:billHTML,docs:docsHTML,me:meHTML}[view];
  r.innerHTML=shell(inner());
  wire();
  load().then(function(){
    r.innerHTML=shell(inner());
    wire();
  }).catch(function(e){
    r.innerHTML=shell('<div class="note bad">'+esc(e.message)+'</div>');
    wire();
    if(!API.token()){r.innerHTML=loginHTML();wireLogin();}
  });
}

function say(id,t,ok){var e=$(id);if(!e)return;e.textContent=t;e.className='msg '+(ok?'ok':'ng');}

function wire(){
  /* 契約書 */
  document.querySelectorAll('[data-doc]').forEach(function(b){b.onclick=function(){
    var kind=b.getAttribute('data-doc');
    b.disabled=true;
    API.call('GET','/admin/tenants/'+openId+'/contract-doc?kind='+encodeURIComponent(kind))
      .then(function(j){ showDoc(j); })
      .catch(function(e){ alert(e.message); })
      .then(function(){ b.disabled=false; });
  };});

  /* 請求のタブ */
  var bm=$('bm');
  if(bm)bm.onchange=function(){ billMonth=bm.value; billRun=null; render(); };
  var doRun=function(force){
    if(!billMonth){alert('月を選んでください');return;}
    var msg=(DATA.bstat&&DATA.bstat.charging)
      ? billMonth+' の請求を作り、実際にカードへ請求します。よろしいですか？'
      : billMonth+' の請求を作ります。金額を出して記録するだけで、カードには請求されません。';
    if(!confirm(msg))return;
    API.call('POST','/admin/billing/run',{month:billMonth,force:!!force})
      .then(function(j){ billRun=j; render(); })
      .catch(function(e){ alert(e.message); });
  };
  var br=$('bRun');  if(br)br.onclick=function(){ doRun(false); };
  var bd=$('bRedo'); if(bd)bd.onclick=function(){
    if(!confirm('まだ送っていない請求を、いまの人数で計算し直します。よろしいですか？'))return;
    doRun(true);
  };
  document.querySelectorAll('[data-bx]').forEach(function(b){b.onclick=function(){
    if(!confirm('この請求を取り消しますか？'))return;
    API.call('POST','/admin/billing/invoices/'+b.getAttribute('data-bx')+'/cancel',{})
      .then(function(){ render(); })
      .catch(function(e){ alert(e.message); });
  };});

  document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){
    view=b.getAttribute('data-v');openId=null;render();};});
  if($('out'))$('out').onclick=function(){API.setToken('');render();};

  /* 園の一覧 */
  document.querySelectorAll('[data-t]').forEach(function(tr){tr.onclick=function(){
    openId=tr.getAttribute('data-t');view='one';render();};});
  if($('add'))$('add').onclick=function(){
    var c=$('nc').value.trim(),n=$('nn').value.trim();
    if(!c||!n){say('am','園コードと園名を入れてください');return;}
    say('am','登録中…',true);
    API.call('POST','/admin/tenants',{code:c,name:n})
      .then(function(){render();}).catch(function(e){say('am',e.message);});
  };
  if($('bk'))$('bk').onclick=function(){view='tenants';openId=null;render();};

  /* 契約 */
  if($('save'))$('save').onclick=function(){
    var v=function(id){var e=$(id);return e?e.value.trim():'';};
    say('sm','保存中…',true);
    API.call('PUT','/admin/tenants/'+openId+'/contract',{
      plan:v('c_plan'),status:v('c_status'),started_on:v('c_started'),
      monthly_yen:v('c_monthly')===''?'':+v('c_monthly'),
      seat_included:v('c_inc')===''?'':+v('c_inc'),
      seat_unit_yen:v('c_unit')===''?'':+v('c_unit'),
      campaign_months:+v('c_cm'),campaign_rate:+v('c_cr'),min_months:+v('c_mm'),
      note:v('c_note')
    }).then(function(){render();}).catch(function(e){say('sm',e.message);});
  };
  if($('cnt'))$('cnt').onclick=function(){
    say('cm','記録中…',true);
    API.call('POST','/admin/tenants/'+openId+'/seats',{})
      .then(function(j){render();}).catch(function(e){say('cm',e.message);});
  };

  /* 書類 */
  if($('dadd'))$('dadd').onclick=function(){
    var t=$('d_title').value.trim();
    if(!t){say('dm','表題を入れてください');return;}
    say('dm','登録中…',true);
    API.call('POST','/admin/documents',{
      tenantId:openId,kind:$('d_kind').value,title:t,
      url:$('d_url').value.trim()||null,signedOn:$('d_signed').value||null
    }).then(function(){render();}).catch(function(e){say('dm',e.message);});
  };
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){
    if(!confirm('この書類の登録を削除します。よろしいですか？（リンク先のファイルは消えません）'))return;
    API.call('DELETE','/admin/documents/'+b.getAttribute('data-del'))
      .then(function(){render();}).catch(function(e){alert(e.message);});
  };});

  /* 保護者アカウント */
  if($('padd'))$('padd').onclick=function(){
    var em=$('p_em').value.trim(),pw=$('p_pw').value,cid=$('p_cid').value.trim();
    if(!em||!pw||!cid){say('pm','3つとも入れてください');return;}
    say('pm','発行中…',true);
    API.call('POST','/admin/tenants/'+openId+'/parents',{email:em,password:pw,childId:+cid})
      .then(function(){say('pm','発行しました',true);
        $('p_em').value='';$('p_pw').value='';$('p_cid').value='';})
      .catch(function(e){say('pm',e.message);});
  };

  /* 設定 */
  if($('s_save'))$('s_save').onclick=function(){API.setBase($('s_api').value.trim());render();};
  if($('pw_go'))$('pw_go').onclick=function(){
    say('pw_m','変更中…',true);
    API.call('POST','/admin/password',{current:$('o_pw').value,next:$('n_pw').value})
      .then(function(){say('pw_m','変更しました',true);$('o_pw').value='';$('n_pw').value='';})
      .catch(function(e){say('pw_m',e.message);});
  };
}

/* ── 起動 ───────────────────────────── */
if(API.base()&&API.token()){
  Promise.all([
    API.call('GET','/admin/plans').then(function(j){PLANS=j.plans;}).catch(function(){}),
    API.call('GET','/admin/me').then(function(j){DATA.me=j;}).catch(function(){})
  ]).then(render);
}else{
  render();
}
</script>
</body>
</html>
