<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="img/icon_edugrow.png">
<title>EduGrow 本部</title>
<style>
:root{
  --bg:#F4F5F7; --card:#FFF; --ink:#131A22; --ink2:#3C4654; --mute:#6C7686;
  --line:#E2E5EA; --line2:#EFF1F4;
  --eg:#0B5F8F; --eg-d:#063E5F; --eg-w:#E9F1F7;
  --ok:#1D7A56; --ok-w:#E5F3ED;
  --warn:#A26A12; --warn-w:#FBF1DE;
  --bad:#A3302F; --bad-w:#FAE9E8;
  --accent:#B4541F; --accent-w:#FBEEE6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:13.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ── 骨組み ── */
.top{
  background:linear-gradient(180deg,var(--eg-d),var(--eg));color:#fff;
  padding:0 18px;display:flex;align-items:center;gap:14px;height:52px;
  position:sticky;top:0;z-index:60;box-shadow:0 1px 6px rgba(0,0,0,.14)
}
.top .lg{font-weight:800;font-size:15px;letter-spacing:-.01em}
.top .sub{font-size:11px;opacity:.72;letter-spacing:.04em}
.top .sp{margin-left:auto}
.top button{
  background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:7px;
  padding:6px 13px;font-size:12px;cursor:pointer
}
.top button:hover{background:rgba(255,255,255,.26)}
.nav{
  background:var(--card);border-bottom:1px solid var(--line);padding:0 18px;
  display:flex;gap:2px;position:sticky;top:52px;z-index:55;overflow-x:auto
}
.nav button{
  background:none;border:none;padding:11px 15px;cursor:pointer;font-size:13px;
  color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;font-weight:600
}
.nav button.on{color:var(--eg);border-bottom-color:var(--eg)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
@media(max-width:640px){.wrap{padding:16px 12px 70px}.top{padding:0 12px}.nav{padding:0 12px}}

h2{font-size:17px;font-weight:800;margin:0 0 3px;letter-spacing:-.01em}
.lead{color:var(--mute);font-size:12.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-bottom:13px}
.card h3{font-size:14px;font-weight:800;margin:0 0 11px}

/* ── 数字タイル ── */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 15px}
.tile .k{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.03em}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.2}
.tile .u{font-size:12px;font-weight:700;color:var(--mute);margin-left:3px}
.tile .n{font-size:11.5px;color:var(--mute);margin-top:4px}

/* ── 表 ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);
    border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
th{
  text-align:left;font-weight:700;font-size:10.5px;letter-spacing:.05em;color:var(--mute);
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--line2)
}
td{padding:11px 13px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--eg-w)}
td.r,th.r{text-align:right}

.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:99px;white-space:nowrap}
.p-lead{background:var(--line2);color:var(--mute)}
.p-talk{background:var(--warn-w);color:var(--warn)}
.p-mon{background:var(--eg-w);color:var(--eg)}
.p-live{background:var(--ok-w);color:var(--ok)}
.p-end{background:var(--bad-w);color:var(--bad)}
.plan{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:5px;
      background:var(--accent-w);color:var(--accent);white-space:nowrap}

/* ── 入力 ── */
.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
.f input,.f select,.f textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff
}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--eg);outline-offset:-1px;border-color:var(--eg)}
.grid2{display:grid;gap:0 13px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:0 13px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{
  background:var(--eg);color:#fff;border:none;border-radius:8px;padding:9px 17px;
  font-weight:700;cursor:pointer;font-size:13px
}
.btn:hover{background:var(--eg-d)}
.btn.sec{background:#fff;color:var(--eg);border:1px solid var(--eg)}
.btn.sec:hover{background:var(--eg-w)}
.btn.warn{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.warn:hover{background:var(--bad-w)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.msg{font-size:12px;margin-left:4px}
.msg.ok{color:var(--ok)}.msg.ng{color:var(--bad)}
.note{border-left:3px solid var(--warn);background:var(--warn-w);color:var(--warn);
      padding:10px 13px;border-radius:0 8px 8px 0;font-size:12px;line-height:1.75;margin:0 0 12px}
.note.bad{border-left-color:var(--bad);background:var(--bad-w);color:var(--bad)}
.note.ok{border-left-color:var(--ok);background:var(--ok-w);color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:34px 10px;font-size:13px}

/* ── ログイン ── */
.login{max-width:390px;margin:9vh auto;padding:0 18px}
.login .card{padding:26px 24px}
.login h1{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.login .s{color:var(--mute);font-size:12.5px;margin:0 0 20px}
.err{background:var(--bad-w);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:13px;display:none}

/* ── 明細 ── */
.lines{border-top:1px solid var(--line);margin-top:10px}
.lines div{display:flex;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lines div:last-child{border-bottom:none}
.lines .l{color:var(--ink2)}
.lines .y{margin-left:auto;font-weight:700}
.lines .tot{border-top:2px solid var(--ink);margin-top:2px;padding-top:9px;font-size:14px;font-weight:800}
.back{background:none;border:none;color:var(--eg);cursor:pointer;font-size:13px;font-weight:700;padding:0;margin-bottom:12px}

/* ── 契約書の表示と印刷 ────────────────── */
#docWrap{position:fixed;inset:0;z-index:900;background:rgba(12,18,26,.5);
  overflow-y:auto;padding:26px 16px;display:none}
#docPaper{max-width:820px;margin:0 auto;background:#fff;color:#111;
  padding:46px 52px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;line-height:1.95;font-size:14px}
#docPaper h1{font-size:20px;text-align:center;margin:0 0 22px;font-weight:600;letter-spacing:.08em}
#docPaper h2{font-size:14.5px;font-weight:700;margin:22px 0 6px}
#docPaper p{margin:0 0 8px}
#docPaper ol{margin:0 0 8px;padding-left:1.6em}
#docPaper li{margin-bottom:5px}
#docPaper table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px}
#docPaper th,#docPaper td{border:1px solid #999;padding:6px 9px;text-align:left}
#docPaper th{background:#eee;font-weight:700}
#docPaper .note{background:#FBEBEB;border:1px solid #E3C0C0;color:#8A2B2B;
  font-size:11.5px;line-height:1.8;padding:8px 11px;border-radius:5px;margin:6px 0 12px}
#docPaper .sign{margin-top:34px;line-height:2.6}
#docPaper .chk{line-height:2.4}
#docBar{max-width:820px;margin:0 auto 12px;display:flex;gap:9px;justify-content:flex-end}
@media print{
  body>*{display:none!important}
  #docWrap{display:block!important;position:static;background:#fff;padding:0;overflow:visible}
  #docBar{display:none!important}
  #docPaper{box-shadow:none;border-radius:0;padding:0;max-width:none}
  #docPaper .note{display:none}   /* 注記は社内向けなので印刷しない */
}
</style>
<style>
/* ── 本部の画面だけの追加 ── */
.hq-hero{background:linear-gradient(135deg,var(--eg-d),var(--eg));color:#fff;border-radius:12px;
  padding:18px 20px;margin-bottom:16px}
.hq-hero h2{color:#fff;margin-bottom:2px}
.hq-hero .s{opacity:.8;font-size:12.5px}
.hq-hero .n{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.hq-hero .n b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.hq-hero .n span{font-size:11px;opacity:.78;font-weight:700;letter-spacing:.03em}
.bar{height:6px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.mid i{background:var(--warn)}
.bar.low i{background:var(--bad)}
tbody tr{cursor:default}
tbody tr:hover{background:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ══ EduGrow 本部 ══════════════════════════
   園を何か所か運営する法人が、全園をまとめて見る画面。

   ホームは見るだけ。ここから園の帳簿は書き換えられない。
   （サーバ側も /org/... しか受け付けず、園の帳簿の入口は
     本部のトークンを通さない。src/org.js を参照）

   ただし「控えと変更ログ」の中の《この時点に戻す》だけは、
   園の帳簿を書き換える操作になる。本部からの書き換えはこれ1つだけ。
   受け口（/org/backups/restore）を作るときは、
   ・その法人の園かどうかを毎回みる
   ・戻す前に園の側でも控えをとる
   ・誰がいつ戻したかを残す
   の3つを必ず入れること。

   園の職員のログインとも、運営（BIM JAPAN）の管理画面とも、
   入口・トークン・保存場所をすべて分けている。

   書き方は admin.html（運営管理）に揃えてある。
   view で画面を切り替え、render() が shell() で骨組みを描き、
   load() がその画面ぶんだけサーバへ聞きに行く。 */

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function yen(n){return n==null?'—':'¥'+Number(n).toLocaleString('ja-JP');}
function fmtDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));
  return m?(m[1]+'年'+(+m[2])+'月'+(+m[3])+'日'):String(s||'');}
/* 大きさは KB で出す。園の方が「どれくらい入っているか」を目で見るためのもの */
function kb(n){return (n==null||isNaN(n))?'—':(Math.round(Number(n)/1024)+'KB');}

/* ── 接続 ───────────────────────────── */
var API={
  base:function(){return String(localStorage.getItem('hq_api')||'').replace(/\/$/,'');},
  setBase:function(v){localStorage.setItem('hq_api',String(v||'').replace(/\/$/,''));},
  /* 札はこのタブの中だけ。端末に残さない。 */
  token:function(){try{return sessionStorage.getItem('hq_token')||'';}catch(e){return '';}},
  setToken:function(t){try{t?sessionStorage.setItem('hq_token',t):sessionStorage.removeItem('hq_token');}catch(e){}},
  call:function(m,p,body){
    var h={'Content-Type':'application/json'};
    if(API.token())h.Authorization='Bearer '+API.token();
    return fetch(API.base()+p,{method:m,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){
        /* ログインそのものが 401 のときは「期限切れ」ではない。
           入れ違いの文言を出すと、正しいパスワードを疑って何度も試すことになる。 */
        if(r.status===401&&p!=='/org/login'){API.setToken('');
          var e1=new Error('ログインの有効期限が切れました。もう一度ログインしてください。');e1.status=401;throw e1;}
        if(!r.ok){var e2=new Error(j.error||('通信に失敗しました（'+r.status+'）'));e2.status=r.status;throw e2;}
        return j;});})
      .catch(function(e){
        /* 何番で断られたかを呼び出し元へ渡す。
           「まだ受け口が無い（404）」と「壊れている」を、画面で書き分けるため。 */
        if(e&&e.status!==undefined)throw e;
        var e3=new Error('サーバにつながりませんでした。接続先が正しいか、サーバが動いているかをご確認ください。');
        e3.status=0;throw e3;
      });
  }
};
/* ?api=… で接続先を入れられる。入れたらURLから消す（履歴に残さない）。 */
(function(){try{
  var q=new URLSearchParams(location.search),a=q.get('api');
  if(a!==null){API.setBase(a);q.delete('api');
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));}
}catch(e){}})();

var view='home', ME=null, DATA=null;
/* 控えと変更ログの画面が持つもの。
   bkState … '' まだ選んでいない／'load' 読み込み中／'ok' 届いた／
             'none' サーバに受け口がまだ無い／'err' それ以外の失敗 */
var bkTenant='', BK=null, bkState='', bkMsg='';

/* ── ログイン ────────────────────────── */
function loginHTML(){
  return '<div class="login"><div class="card">'
    +'<h1>EduGrow 本部</h1>'
    +'<p class="s">運営している園を、まとめて見る画面です。</p>'
    +'<div class="err" id="e"></div>'
    +'<div class="f"><label>接続先</label><input id="ap" placeholder="https://…" value="'+esc(API.base())+'"></div>'
    +'<div class="f"><label>法人コード</label><input id="og" placeholder="例：bimgroup" autocapitalize="off"></div>'
    +'<div class="f"><label>ログインID</label><input id="lid" autocapitalize="off"></div>'
    +'<div class="f"><label>パスワード</label><input id="pw" type="password"></div>'
    +'<button class="btn" id="go" style="width:100%;margin-top:6px;">ログイン</button>'
    +'<p class="s" style="margin:16px 0 0;font-size:11.5px;">'
    +'この画面からは園の記録を変更できません。記録の入力や保護者への連絡は、'
    +'各園の画面から行ってください。</p>'
    +'</div></div>';
}
function wireLogin(){
  var go=$('go'),er=$('e');
  function stop(m){er.textContent=m;er.style.display='block';go.textContent='ログイン';go.disabled=false;}
  function run(){
    var ap=$('ap').value.trim();
    if(!ap)return stop('接続先を入れてください');
    API.setBase(ap);
    er.style.display='none';go.textContent='確認中…';go.disabled=true;
    API.call('POST','/org/login',{org:$('og').value.trim(),loginId:$('lid').value.trim(),password:$('pw').value})
      .then(function(j){
        API.setToken(j.token);
        if(j.user&&j.user.mustChange)alert('はじめてのログインです。あとで「パスワードの変更」からご自身のものに変えてください。');
        view='home';render();
      })
      .catch(function(e){stop(e.message);});
  }
  go.onclick=run;
  $('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')run();});
}

/* ── 全体の骨組み ───────────────────── */
function shell(inner){
  var tabs=[['home','ホーム'],['backup','控えと変更ログ']];
  return '<div class="top"><div><div class="lg">EduGrow</div>'
    +'<div class="sub">本部</div></div>'
    +'<div class="sp"></div>'
    +'<button id="rl">最新にする</button>'
    +'<button id="pwbtn">パスワードの変更</button>'
    +'<button id="out">ログアウト</button></div>'
    +'<div class="nav">'+tabs.map(function(t){
      return '<button data-v="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+'</button>';
    }).join('')+'</div>'
    +'<div class="wrap">'+inner+'</div>';
}

/* ── ホーム ─────────────────────────── */
function bar(done,total){
  var p=total?Math.round(done/total*100):0;
  var cls=p>=100?'':(p>=60?' mid':' low');
  return '<div style="display:flex;align-items:center;gap:8px;">'
    +'<div class="bar'+cls+'" style="flex:1;"><i style="width:'+p+'%"></i></div>'
    +'<span class="num" style="font-size:11.5px;color:var(--mute);white-space:nowrap;">'+done+'/'+total+'</span></div>';
}

function homeHTML(){
  var d=DATA;
  if(!d)return '<div class="empty">読み込んでいます…</div>';
  var t=d.total||{};
  var h='<div class="hq-hero"><h2>'+esc((ME&&ME.org&&ME.org.name)||'本部')+'</h2>'
    +'<div class="s">'+esc(fmtDate(d.date))+' 現在　運営している園 '+d.count+'か所</div>'
    +'<div class="n">'
    +'<div><b class="num">'+t.seats+'</b><span>在籍園児</span></div>'
    +'<div><b class="num">'+t.recordsDone+'/'+t.recordsTotal+'</b><span>本日の記録</span></div>'
    +'<div><b class="num">'+t.absence+'</b><span>欠席・遅刻の連絡</span></div>'
    +'<div><b class="num">'+t.waiting+'</b><span>返事を待っている家庭</span></div>'
    +'<div><b class="num">'+yen(t.monthlyGross)+'</b><span>今月のご請求（税込）</span></div>'
    +'</div></div>';

  if(!d.count){
    return h+'<div class="card"><div class="empty">この法人には、まだ園が登録されていません。<br>'
      +'運営（BIM JAPAN）にお問い合わせください。</div></div>';
  }

  /* 手当てが要る園を先に出す。数字を眺めるためではなく、動くための画面にする。 */
  var need=d.schools.filter(function(s){return s.absence||s.waiting||s.records.done<s.records.total;});
  if(need.length){
    h+='<div class="card"><h3>今日、手当てが要る園</h3>'
      +need.map(function(s){
        var w=[];
        if(s.absence)w.push('欠席・遅刻の連絡 '+s.absence+'件');
        if(s.waiting)w.push('返事待ちのご家庭 '+s.waiting+'件');
        if(s.records.done<s.records.total)w.push('本日の記録が '+s.records.done+'/'+s.records.total);
        return '<div style="display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line2);">'
          +'<span style="font-weight:700;min-width:180px;">'+esc(s.name)+'</span>'
          +'<span style="color:var(--mute);">'+esc(w.join('　／　'))+'</span></div>';
      }).join('')
      +'</div>';
  }else{
    h+='<div class="note ok">きょう手当てが要る園はありません。記録も連絡もそろっています。</div>';
  }

  h+='<div class="tw"><table><thead><tr>'
    +'<th>園</th><th class="r">在籍</th><th style="min-width:150px;">本日の記録</th>'
    +'<th class="r">欠席・遅刻</th><th class="r">返事待ち</th><th>プラン</th><th class="r">今月（税込）</th>'
    +'</tr></thead><tbody>'
    +d.schools.map(function(s){
      return '<tr>'
        +'<td><b>'+esc(s.name)+'</b><div style="font-size:11px;color:var(--mute);">'+esc(s.code)+'</div></td>'
        +'<td class="r num">'+s.seats+'</td>'
        +'<td>'+bar(s.records.done,s.records.total)+'</td>'
        +'<td class="r num">'+(s.absence||'—')+'</td>'
        +'<td class="r num">'+(s.waiting||'—')+'</td>'
        +'<td><span class="plan">'+esc(s.plan)+'</span>'
          +(s.noContract?'<div style="font-size:10.5px;color:var(--bad);margin-top:2px;">契約が未設定</div>':'')+'</td>'
        +'<td class="r num">'+yen(s.monthlyGross)+'</td>'
        +'</tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<p class="lead" style="margin-top:12px;">'
    +'「本日の記録」は 登園シート・安全点検・午睡チェック・健康チェック・業務日報 の5つです。'
    +'金額は税込で、契約の内容から出しています。'
    +'契約が未設定の園は、プランの既定で計算しているため実際の請求と異なります。</p>';
  return h;
}

/* ── 控えと変更ログ ───────────────────
   園の画面（設定 → データのバックアップ・変更ログ）にあるものを、
   本部からも見られるようにしたところ。

   ★ いまは、ここに中身は出ない。
     控え（自動保存）と変更ログは、園の端末（ブラウザ）の中にしか無く、
     サーバへ送っていない（index.html の SYNC.mark が
     eventLog・snapshots・lastSnap を送らないようにしてある）。
     受け口（/org/backups）も、まだサーバに無い。
     「集まっているように見える」表示は作らない。空なら空と書く。 */
function schoolOf(id){
  var a=(DATA&&DATA.schools)||[];
  for(var i=0;i<a.length;i++){if(String(a[i].id)===String(id))return a[i];}
  return null;
}
function bkPickerHTML(){
  var a=(DATA&&DATA.schools)||[];
  return '<div class="card"><h3>園を選ぶ</h3>'
    +'<div class="f" style="max-width:360px;margin-bottom:0;">'
    +'<label>園</label><select id="bkSel">'
    +a.map(function(s){
      return '<option value="'+esc(s.id)+'"'+(String(s.id)===String(bkTenant)?' selected':'')+'>'+esc(s.name)+'</option>';
    }).join('')
    +'</select></div></div>';
}
/* サーバから届いていないときに出すことば。
   園の方・本部の方が「壊れている」と思わないよう、理由と次にすることを書く。 */
function bkNotYetHTML(){
  var s=schoolOf(bkTenant);
  return '<div class="note bad">'
    +'<b>まだサーバとつながっていないため、控えは各園の端末の中にあります。</b><br>'
    +'この園の控え（自動保存）と変更ログは、本部にはまだ1件も届いていません。'
    +'何も出ていないのは不具合ではなく、まだ集めていないためです。'
    +'</div>'
    +'<div class="card"><h3>いま控えを見るには</h3>'
    +'<div style="font-size:12.5px;line-height:1.95;">'
    +'1. '+esc(s?s.name:'その園')+' の画面（EduGrow 園務管理システム）を、園の端末で開いてもらいます。<br>'
    +'2. 「設定」→「データのバックアップ・変更ログ」を開きます。<br>'
    +'3. その画面に、自動保存の一覧と変更ログが出ています。戻すこと・書き出すことも、そこからできます。'
    +'</div>'
    +'<div class="note" style="margin:12px 0 0;">'
    +'本部にも同じ一覧が出るようになるのは、サーバ（Railway）が動き、'
    +'園の控えをサーバへ送るようにしてからです。それまでは、園の端末が控えの置き場所です。'
    +'端末が壊れると控えも一緒に無くなるので、園には「バックアップをダウンロード」で'
    +'ときどき書き出して保管してもらってください。'
    +'</div></div>';
}
function bkSnapHTML(){
  var sn=(BK&&BK.snapshots)||[];
  var can=!!(BK&&BK.canRestore);
  var h='<div class="card"><h3>自動保存（控え）</h3>'
    +'<div class="lead" style="margin-bottom:10px;">園の端末で1日1回、そのままの状態が控えとして残ります</div>';
  if(!sn.length){
    h+='<div class="empty">この園の控えは、まだ本部に届いていません。</div></div>';
    return h;
  }
  h+='<div class="tw" style="border:none;"><table style="min-width:520px;"><thead><tr>'
    +'<th>日時</th><th>とった理由</th><th class="r">大きさ</th><th></th></tr></thead><tbody>'
    +sn.map(function(x){
      return '<tr><td class="num" style="white-space:nowrap;">'+esc(x.at)+'</td>'
        +'<td>'+esc(x.reason||'自動')+'</td>'
        +'<td class="r num">'+kb(x.size)+'</td>'
        +'<td style="text-align:right;">'
        +(can
          ? '<button class="btn sm warn" data-bkres="'+esc(x.at)+'">この時点に戻す</button>'
          : '<button class="btn sm" disabled>この時点に戻す</button>')
        +'</td></tr>';
    }).join('')
    +'</tbody></table></div>';
  if(!can){
    /* 押せないボタンを、理由も書かずに置かない */
    h+='<div class="note" style="margin:12px 0 0;">'
      +'《この時点に戻す》は、いまは押せません。'
      +'本部から園の帳簿を書き換える操作なので、サーバ側にその受け口ができるまで止めてあります。'
      +'園の画面（設定 → データのバックアップ・変更ログ）からは、これまでどおり戻せます。</div>';
  }else{
    h+='<div class="note bad" style="margin:12px 0 0;">'
      +'<b>《この時点に戻す》を押すと、その園の帳簿がその時点の内容に入れ替わります。</b>'
      +'その時点よりあとに園で入力されたものは、すべて消えます。押す前に、もう一度お知らせします。</div>';
  }
  return h+'</div>';
}
function bkLogHTML(){
  var lg=(BK&&BK.log)||[];
  var h='<div class="card"><h3>変更ログ（新しい順）</h3>'
    +'<div class="lead" style="margin-bottom:10px;">いつ・誰が・何を保存したかの記録です。中身そのものは本部には届きません</div>';
  if(!lg.length){
    h+='<div class="empty">この園の変更ログは、まだ本部に届いていません。</div></div>';
    return h;
  }
  h+='<div class="tw" style="border:none;"><table style="min-width:520px;"><thead><tr>'
    +'<th>日時</th><th>項目</th><th>保存した人</th><th class="r">回数</th></tr></thead><tbody>'
    +lg.map(function(x){
      return '<tr><td class="num" style="white-space:nowrap;">'+esc(x.at)+'</td>'
        +'<td>'+esc(x.label||x.key||'—')+'</td>'
        +'<td>'+esc(x.by||'—')+'</td>'
        +'<td class="r num">'+((x.n&&x.n>1)?x.n:'—')+'</td></tr>';
    }).join('')
    +'</tbody></table></div></div>';
  return h;
}
function backupHTML(){
  var h='<h2>控えと変更ログ</h2>'
    +'<div class="lead">園ごとに、自動保存（控え）と、いつ誰が何を保存したかの記録を見ます</div>';
  var a=(DATA&&DATA.schools)||[];
  if(!a.length){
    return h+'<div class="card"><div class="empty">この法人には、まだ園が登録されていません。<br>'
      +'運営（BIM JAPAN）にお問い合わせください。</div></div>';
  }
  h+=bkPickerHTML();
  if(bkState==='load')return h+'<div class="card"><div class="empty">読み込んでいます…</div></div>';
  if(bkState==='none')return h+bkNotYetHTML();
  if(bkState==='err')return h+'<div class="note bad">'+esc(bkMsg)+'</div>';
  if(bkState!=='ok')return h+'<div class="card"><div class="empty">園を選んでください。</div></div>';
  /* 届いたとき。いつの時点のものかを必ず書く（古いものを最新と思わせない）。
     つながってはいても、その園からまだ1件も来ていないことがある。
     そのときに「届いています」と書くと嘘になるので、書き分ける。 */
  var n1=((BK&&BK.snapshots)||[]).length, n2=((BK&&BK.log)||[]).length;
  if(!n1&&!n2){
    h+='<div class="note">サーバにはつながっていますが、この園からは控えも変更ログも'
      +'まだ1件も届いていません。園の端末で控えが作られ、それがサーバへ送られたあとに出ます。</div>';
  }else{
    h+='<div class="note ok">この園から本部へ届いている控えです。'
      +(BK&&BK.receivedAt?'最後に届いたのは '+esc(BK.receivedAt)+' です。':'')
      +'</div>';
  }
  return h+bkSnapHTML()+bkLogHTML();
}

/* ── 読み込みと描画 ─────────────────── */
function loadBackups(){
  var a=(DATA&&DATA.schools)||[];
  if(!a.length){bkState='';BK=null;return Promise.resolve();}
  if(!bkTenant||!schoolOf(bkTenant))bkTenant=String(a[0].id);
  bkState='load';BK=null;
  return API.call('GET','/org/backups?tenant='+encodeURIComponent(bkTenant))
    .then(function(j){BK=j;bkState='ok';})
    .catch(function(e){
      BK=null;
      if(e.status===401)throw e;      /* 期限切れは、いつもどおり入り直してもらう */
      /* 404・501 は「サーバにその受け口がまだ無い」。壊れているのではないので、そう書き分ける。 */
      bkState=(e.status===404||e.status===501)?'none':'err';
      bkMsg=e.message;
    });
}
function load(){
  if(view==='home')return Promise.all([API.call('GET','/org/me'),API.call('GET','/org/summary')])
    .then(function(a){ME=a[0];DATA=a[1];});
  if(view==='backup'){
    /* 園の一覧は /org/summary から借りる。控えの画面だけを開いても園を選べるように */
    var pre=DATA?Promise.resolve():API.call('GET','/org/summary').then(function(j){DATA=j;});
    return pre.then(loadBackups);
  }
  return Promise.resolve();
}

function render(){
  var r=$('root');
  if(!API.base()||!API.token()){r.innerHTML=loginHTML();wireLogin();return;}
  var inner={home:homeHTML,backup:backupHTML}[view]||homeHTML;
  r.innerHTML=shell(inner());
  wire();
  load().then(function(){
    r.innerHTML=shell(inner());
    wire();
  }).catch(function(e){
    r.innerHTML=shell('<div class="note bad">'+esc(e.message)+'</div>');
    wire();
    if(!API.token()){r.innerHTML=loginHTML();wireLogin();}
  });
}

function changePassword(){
  var cur=prompt('いまのパスワードを入れてください');
  if(cur==null)return;
  var next=prompt('新しいパスワード（8文字以上）');
  if(next==null)return;
  if(String(next).length<8)return alert('パスワードは8文字以上にしてください');
  if(prompt('もう一度、新しいパスワードを入れてください')!==next)return alert('2回目が一致しませんでした');
  API.call('POST','/org/password',{current:cur,next:next})
    .then(function(){alert('パスワードを変更しました');})
    .catch(function(e){alert(e.message);});
}

/* 控えを戻す。本部から園の帳簿を書き換える、ただ1つの操作。
   押す前に「何が起きるか」をぜんぶ出し、そのうえで園の名前を打ってもらう。
   一覧のとなりのボタンなので、指が当たっただけで進むことがないようにする。 */
function bkRestore(at){
  var s=schoolOf(bkTenant),name=s?s.name:'';
  if(!name){alert('園が選ばれていません。');return;}
  var msg='【押すとどうなるか】\n'
    +'・'+name+' の帳簿を、'+at+' の時点の内容にそっくり入れ替えます。\n'
    +'・その時点よりあとに '+name+' で入力されたものは、すべて消えます。\n'
    +'　（記録・連絡先・請求・シフト・書類など、園のデータのすべてです）\n'
    +'・戻す直前の状態も控えとして残すので、やり直すことはできます。\n'
    +'・園の職員が画面を開いている場合は、次に読み込んだときに入れ替わります。\n'
    +'　入力の途中の方がいると、その入力は消えます。先に園へお知らせください。\n'
    +'・本部の画面から園の帳簿を書き換えるのは、この操作だけです。\n\n'
    +'よろしいですか？';
  if(!confirm(msg))return;
  var typed=prompt('取り違えを防ぐため、園の名前を入れてください。\n「'+name+'」と入れると実行します。');
  if(typed==null)return;
  if(String(typed).trim()!==name){alert('園の名前が違いました。何もしていません。');return;}
  API.call('POST','/org/backups/restore',{tenant:bkTenant,at:at})
    .then(function(){alert(name+' を '+at+' の時点に戻しました。園の画面は、次に読み込んだときに入れ替わります。');render();})
    .catch(function(e){alert('戻せませんでした：'+e.message);});
}

function wire(){
  /* 上の帯 */
  if($('rl'))$('rl').onclick=function(){render();};
  if($('out'))$('out').onclick=function(){API.setToken('');DATA=null;ME=null;BK=null;bkState='';view='home';render();};
  if($('pwbtn'))$('pwbtn').onclick=changePassword;
  /* 画面の切り替え */
  document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){
    view=b.getAttribute('data-v');
    /* 前に開いたときの控えが一瞬だけ見えないように、開き直すたびに空にする。
       別の園の控えを、いま選んでいる園のものと見まちがえないため。 */
    if(view==='backup'){BK=null;bkState='load';}
    render();};});
  /* 控えと変更ログ */
  var sel=$('bkSel');
  if(sel)sel.onchange=function(){bkTenant=sel.value;BK=null;bkState='load';render();};
  document.querySelectorAll('[data-bkres]').forEach(function(b){b.onclick=function(){
    bkRestore(b.getAttribute('data-bkres'));};});
}

render();
</script>
</body>
</html>
